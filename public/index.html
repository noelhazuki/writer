/* ============ 新プロット（plotV2）：データ構造・検証・木の操作 ============
   data.plotV2 = { schemaVersion:1, items:[ツリー], structures:[構成設定] }
   ・items：配列順＝読者に見せる順番。まとまり(group)は children を持ち、出来事(event)は末端。IDは固定（編集・移動で変えない）。
   ・structures：各まとまりごとの構成設定。端点は出来事IDで持ち、範囲は「対象まとまり内の出来事を表示順にたどって」解釈する。
   ・旧 data.plot（旧プロット）とは完全に別。旧データから新プロットへの自動変換・自動紐付けは行わない。
   ・形式が不正／未対応バージョンのデータは空で上書きしない（validatePlotV2 が失敗を返し、呼び出し側が原本を保持する）。 */
const PLOTV2_VERSION = 1;
const PLOTV2_UI_KEY = 'novel-world-builder-plotv2-ui-v1'; // 端末内の表示設定（作品データ・バックアップ・クラウド同期には含めない）
const PLOTV2_MAX_DEPTH = 100;
const PLOTV2_ROLE_COLORS = ['#c8553d','#2f73a3','#8a5fb0','#3b3f5c','#2f8f74','#b07a1f','#a03a6a','#5f7a2f'];
const PLOTV2_SCENE_KEYS = ['goal','obstacle','change','memo'];

function emptyPlotV2(){ return { schemaVersion:PLOTV2_VERSION, items:[], structures:[] }; }

function plotV2Fail(message){ return { ok:false, message }; }
function plotV2Str(o, k, path){
  const v = o[k];
  if(v===undefined || v===null) return '';
  if(typeof v !== 'string') throw new Error(`${path}.${k} が文字列ではありません`);
  return v;
}
function plotV2IdList(o, k, path){
  const v = o[k];
  if(v===undefined || v===null) return [];
  if(!Array.isArray(v)) throw new Error(`${path}.${k} が配列ではありません`);
  v.forEach((x,i)=>{ if(typeof x !== 'string') throw new Error(`${path}.${k}[${i}] が文字列ではありません`); });
  return v.slice();
}
// 検証＋正規化。成功時は { ok:true, value }（ID・並び・入れ子・文章・関連ID・構成端点をそのまま保つ）。失敗時は { ok:false, message }。
function validatePlotV2(raw){
  try{
    if(!raw || typeof raw!=='object' || Array.isArray(raw)) return plotV2Fail('新プロットのデータがオブジェクトではありません。');
    if(raw.schemaVersion !== PLOTV2_VERSION) return plotV2Fail(`未対応のバージョンです（schemaVersion: ${JSON.stringify(raw.schemaVersion)}）。このアプリが扱えるのは ${PLOTV2_VERSION} です。`);
    if(!Array.isArray(raw.items)) return plotV2Fail('items が配列ではありません。');
    if(raw.structures!==undefined && raw.structures!==null && !Array.isArray(raw.structures)) return plotV2Fail('structures が配列ではありません。');
    const ids = new Set();
    const useId = (n, path) => {
      if(typeof n.id !== 'string' || !n.id) throw new Error(`${path} のIDがありません`);
      if(ids.has(n.id)) throw new Error(`${path} のIDが重複しています（${n.id}）`);
      ids.add(n.id);
    };
    const walk = (list, path, depth) => {
      if(depth > PLOTV2_MAX_DEPTH) throw new Error('入れ子が深すぎます');
      return list.map((n, i) => {
        const p = `${path}[${i}]`;
        if(!n || typeof n!=='object' || Array.isArray(n)) throw new Error(`${p} がオブジェクトではありません`);
        useId(n, p);
        if(n.kind === 'group'){
          if(n.children!==undefined && n.children!==null && !Array.isArray(n.children)) throw new Error(`${p}.children が配列ではありません`);
          return { id:n.id, kind:'group', label:plotV2Str(n,'label',p), title:plotV2Str(n,'title',p), summary:plotV2Str(n,'summary',p),
            children: walk(n.children||[], `${p}.children`, depth+1) };
        }
        if(n.kind === 'event'){
          if(Array.isArray(n.children) ? n.children.length>0 : (n.children!==undefined && n.children!==null)) throw new Error(`${p} は出来事ですが子を持っています`);
          const sc = n.scene;
          if(sc!==undefined && sc!==null && (typeof sc!=='object' || Array.isArray(sc))) throw new Error(`${p}.scene がオブジェクトではありません`);
          const scene = {}; PLOTV2_SCENE_KEYS.forEach(k => { scene[k] = plotV2Str(sc||{}, k, `${p}.scene`); });
          return { id:n.id, kind:'event', title:plotV2Str(n,'title',p), summary:plotV2Str(n,'summary',p), detail:plotV2Str(n,'detail',p),
            chars:plotV2IdList(n,'chars',p), places:plotV2IdList(n,'places',p), scene };
        }
        throw new Error(`${p}.kind が group / event のどちらでもありません`);
      });
    };
    const items = walk(raw.items, 'items', 0);
    const stIds = new Set(), roleIds = new Set();
    const structures = (raw.structures||[]).map((s, i) => {
      const p = `structures[${i}]`;
      if(!s || typeof s!=='object' || Array.isArray(s)) throw new Error(`${p} がオブジェクトではありません`);
      if(typeof s.id!=='string' || !s.id) throw new Error(`${p} のIDがありません`);
      if(stIds.has(s.id)) throw new Error(`${p} のIDが重複しています`);
      stIds.add(s.id);
      if(typeof s.groupId!=='string') throw new Error(`${p}.groupId が文字列ではありません`);
      if(s.roles!==undefined && s.roles!==null && !Array.isArray(s.roles)) throw new Error(`${p}.roles が配列ではありません`);
      const roles = (s.roles||[]).map((r, j) => {
        const q = `${p}.roles[${j}]`;
        if(!r || typeof r!=='object' || Array.isArray(r)) throw new Error(`${q} がオブジェクトではありません`);
        if(typeof r.id!=='string' || !r.id) throw new Error(`${q} のIDがありません`);
        if(roleIds.has(r.id)) throw new Error(`${q} のIDが重複しています`);
        roleIds.add(r.id);
        return { id:r.id, name:plotV2Str(r,'name',q), color:plotV2Str(r,'color',q) || PLOTV2_ROLE_COLORS[j % PLOTV2_ROLE_COLORS.length],
          startId:plotV2Str(r,'startId',q), endId:plotV2Str(r,'endId',q) };
      });
      return { id:s.id, groupId:s.groupId, type:plotV2Str(s,'type',p), roles };
    });
    return { ok:true, value:{ schemaVersion:PLOTV2_VERSION, items, structures } };
  }catch(e){
    return plotV2Fail('新プロットのデータの形式が不正です：' + (e && e.message ? e.message : String(e)));
  }
}
// バックアップ／クラウドの取り込み前チェック。plotV2 が無い（旧形式）ならOK（空として扱う）。存在して不正ならエラー文を返す。
function plotV2PayloadError(dataObj){
  if(!dataObj || typeof dataObj!=='object') return null;
  if(dataObj.plotV2===undefined || dataObj.plotV2===null) return null;
  const r = validatePlotV2(dataObj.plotV2);
  return r.ok ? null : r.message;
}
// migrateData から呼ぶ。plotV2 が無ければ空。不正なら空にはせず、原本を plotV2Error.raw に退避してエラーを立てる（保存・書き出し時は原本を書き戻す）。
function migratePlotV2(parsed){
  const raw = parsed.plotV2;
  delete parsed.plotV2Error;
  if(raw===undefined || raw===null){ parsed.plotV2 = emptyPlotV2(); return parsed; }
  const r = validatePlotV2(raw);
  if(r.ok){ parsed.plotV2 = r.value; }
  else { parsed.plotV2 = emptyPlotV2(); parsed.plotV2Error = { message:r.message, raw }; }
  return parsed;
}
// 保存・書き出し用：不正データの原本を持っている間は、空の新プロットではなく原本を書き戻す（破損状態を確定させない）。
function serializableData(d){
  if(d && d.plotV2Error){
    const { plotV2Error, ...rest } = d;
    return { ...rest, plotV2: plotV2Error.raw };
  }
  return d;
}
function plotV2CountAll(plot){
  let n = 0;
  const walk = (list) => (list||[]).forEach(x => { n++; if(x.kind==='group') walk(x.children); });
  walk(plot && plot.items);
  return n;
}

/* ---- 木の基本操作（itemsを明示的に受け取る。移動・並べ替えはitemsを直接書き換える） ---- */
function pvFind(items, id, list, parent, depth){
  list = list || items; parent = parent || null; depth = depth || 0;
  for(let i = 0; i < list.length; i++){
    const n = list[i];
    if(n.id === id) return { node:n, list, index:i, parent, depth };
    if(n.kind === 'group'){ const r = pvFind(items, id, n.children, n, depth + 1); if(r) return r; }
  }
  return null;
}
function pvSelfOrDesc(root, id){
  if(root.id === id) return true;
  return root.kind === 'group' && root.children.some(c => pvSelfOrDesc(c, id));
}
function pvCountAll(n){ return n.kind === 'group' ? n.children.reduce((a,c)=>a + 1 + pvCountAll(c), 0) : 0; }
function pvForEach(items, fn){ items.forEach(n => { fn(n); if(n.kind === 'group') pvForEach(n.children, fn); }); }
function pvListOf(items, parentId){ if(!parentId) return items; const i = pvFind(items, parentId); return i && i.node.kind === 'group' ? i.node.children : null; }
function pvCanMove(items, id, destId){
  if(destId === null) return !!pvFind(items, id);
  const info = pvFind(items, id), d = pvFind(items, destId);
  if(!info || !d || d.node.kind !== 'group') return false;
  return !pvSelfOrDesc(info.node, destId);
}
function pvMove(items, id, destId){ // 移動先の末尾へ
  if(!pvCanMove(items, id, destId)) return false;
  const info = pvFind(items, id); if(!info) return false;
  info.list.splice(info.index, 1);
  pvListOf(items, destId).push(info.node);
  return true;
}
function pvShift(items, id, dir){ // 同じ親の中で一つ入れ替える（所属・階層は変えない）
  const info = pvFind(items, id); if(!info) return false;
  const j = info.index + dir; if(j < 0 || j >= info.list.length) return false;
  const [n] = info.list.splice(info.index, 1); info.list.splice(j, 0, n);
  return true;
}
function pvMakeGroup(label, title, summary){ return { id:uid('pvg'), kind:'group', label:label||'', title:title||'', summary:summary||'', children:[] }; }
function pvMakeEvent(title, summary){
  return { id:uid('pve'), kind:'event', title:title||'', summary:summary||'', detail:'', chars:[], places:[], scene:{ goal:'', obstacle:'', change:'', memo:'' } };
}
function pvPlain(n){ return (n.kind === 'group' ? [n.label, n.title].filter(x=>x&&x.trim()).join(' ') : n.title) || '未定'; }

/* ---- 構成：対象まとまり内の出来事を表示順に並べ、端点IDの位置で範囲を決める ---- */
function pvGroupFlat(items, groupId){
  const g = pvFind(items, groupId), flat = [];
  if(!g || g.node.kind !== 'group') return null; // 対象のまとまりが無い
  const walk = (list, parent) => list.forEach(n => { if(n.kind === 'group') walk(n.children, n); else flat.push({ node:n, parent }); });
  walk(g.node.children, g.node);
  return flat;
}
// 役割の状態：{s:'unset'} | {s:'ok',a,b,count} | {s:'check',reason}。flat が null のときは対象まとまりが削除済み。
function pvRoleStatus(items, r, flat){
  if(!r.startId && !r.endId) return { s:'unset' };
  if(!flat) return { s:'check', reason:'対象のまとまりが削除されています' };
  const endpoint = (id, name) => {
    if(!id) return `${name}が未設定です`;
    if(flat.some(x => x.node.id === id)) return '';
    return pvFind(items, id) ? `${name}の出来事が対象のまとまりの外へ移動しています` : `${name}の出来事が削除されています`;
  };
  const e1 = endpoint(r.startId, '始点'), e2 = endpoint(r.endId, '終点');
  if(e1 || e2) return { s:'check', reason:[e1, e2].filter(Boolean).join('／') };
  const a = flat.findIndex(x => x.node.id === r.startId), b = flat.findIndex(x => x.node.id === r.endId);
  if(a > b) return { s:'check', reason:'始点と終点の順序が逆です' };
  return { s:'ok', a, b, count:b - a + 1 };
}
// 出来事ID → 帯の情報。bandGroupIds に含まれるまとまりの構成だけを対象にする。範囲が重なる場合は先の役割を優先。
function pvBuildStMap(plot, bandGroupIds){
  const map = {};
  plot.structures.forEach(s => {
    if(!bandGroupIds.has(s.groupId)) return;
    const flat = pvGroupFlat(plot.items, s.groupId); if(!flat) return;
    s.roles.forEach(r => {
      const st = pvRoleStatus(plot.items, r, flat); if(st.s !== 'ok') return;
      for(let i = st.a; i <= st.b; i++){
        const id = flat[i].node.id; if(map[id]) continue;
        const prevSame = i > st.a && map[flat[i-1].node.id] && map[flat[i-1].node.id].role === r;
        const chapterChanged = prevSame && flat[i-1].parent !== flat[i].parent;
        map[id] = { role:r, label: !prevSame || chapterChanged, cont: chapterChanged };
      }
    });
  });
  return map;
}
// 要確認の一覧（プロット上部で確認・解除するための材料）。構成設定の自動削除・端点の自動置換はしない。
function pvCheckList(plot){
  const out = [];
  plot.structures.forEach(s => {
    const flat = pvGroupFlat(plot.items, s.groupId);
    if(!flat){ out.push({ st:s, role:null, orphan:true, reason:'対象のまとまりが削除されています' }); return; }
    s.roles.forEach(r => { const x = pvRoleStatus(plot.items, r, flat); if(x.s === 'check') out.push({ st:s, role:r, orphan:false, reason:x.reason }); });
  });
  return out;
}

/* ---- 端末内の表示設定（カード/ライン・通常時の開閉・構成帯の表示）。作品データとは別保存 ---- */
function loadPlotV2Ui(){
  const def = { view:'card', col:{}, ev:{}, sc:{}, st:{} };
  try{
    const o = JSON.parse(localStorage.getItem(PLOTV2_UI_KEY) || 'null');
    if(!o || typeof o!=='object') return def;
    const m = (x) => (x && typeof x==='object' && !Array.isArray(x)) ? x : {};
    return { view:o.view==='line'?'line':'card', col:m(o.col), ev:m(o.ev), sc:m(o.sc), st:m(o.st) };
  }catch(e){ return def; }
}
function savePlotV2Ui(ui, items){
  try{
    const alive = new Set(); pvForEach(items, n => alive.add(n.id));
    const keep = (o) => { const r = {}; Object.keys(o).forEach(k => { if(alive.has(k) && o[k]) r[k] = true; }); return r; };
    localStorage.setItem(PLOTV2_UI_KEY, JSON.stringify({ view:ui.view, col:keep(ui.col), ev:keep(ui.ev), sc:keep(ui.sc), st:keep(ui.st) }));
  }catch(e){}
}

  .pick{ display:flex; align-items:center; gap:10px; width:100%; text-align:left; border:1px solid #bdb6a6; background:#fff; border-radius:10px; padding:6px 10px; margin:4px 0; }

  .pick .ck{ margin-left:auto; font-weight:700; color:var(--purple); }
  .toast{ position:fixed; left:50%; bottom:20px; transform:translateX(-50%); background:rgba(30,28,25,.9); color:#fff; padding:8px 14px; border-radius:999px; font-size:13px; z-index:80; max-width:90vw; }

  /* ===== 本体統合で追加 ===== */

  .rolerow input[type=text]{ flex:1 1 auto; min-width:0; font:inherit; font-size:16px; border:1px solid #bdb6a6; border-radius:8px; padding:4px 8px; }
  .rolerow input[type=color]{ width:40px; height:34px; padding:0; border:1px solid #bdb6a6; border-radius:8px; background:#fff; }
  .rolerow .rr2{ font-size:12px; margin-top:2px; color:var(--ink-soft); }

  .emptyall{ background:#fff; border:1px dashed #bdb6a6; border-radius:12px; padding:14px; margin:8px 0; color:var(--ink-soft); text-align:center; }
  .stwarn{ color:var(--danger); font-size:12px; }

  /* ===== スマホ幅対応・開閉操作・アイコン（新プロットの中だけに適用） ===== */
  .pv{ --P:12px; --G:9px; --CP:8px; }
  .ghead,.ehead{ display:block; position:relative; }
  .grow1{ display:flex; flex-wrap:wrap; align-items:center; gap:0 8px; min-width:0; }
  .grow1 .inl.lb{ flex:1 1 4.6em; width:auto; min-width:4.2em; max-width:100%; margin:0 0 0 -4px; min-height:32px; }
  .grow1 .cnt{ margin-left:0; }
  .grow1 .gact{ margin-left:auto; }
  .grow1 .lbl{ flex:1 1 4.6em; min-width:4.2em; overflow-wrap:anywhere; }
  .lvl{ flex:0 0 auto; font-size:10.5px; color:var(--ink-soft); border:1px solid #cfe4d8; background:#fff; border-radius:8px; padding:0 6px; white-space:nowrap; }
  .inl.t{ text-overflow:clip; white-space:pre-wrap; overflow-wrap:anywhere; }
  .inl.s{ overflow-wrap:anywhere; }
  .tgrow{ display:flex; margin-top:0; }
  .tgl{ min-height:44px; padding:0 6px; font-weight:600; justify-content:flex-start; gap:4px; }
  .tri{ display:inline-block; width:1.1em; font-size:12px; text-align:center; }
  .edetail{ padding-left:2px; }
  .v-line .edetail{ padding-left:2px; }
  .mv .mvtap{ display:block; padding:4px 0; }
  .ghead.sel{ padding:0 6px; }
  .ghead.sel .mvtap{ padding-top:4px; }
  .mvact{ padding-left:2px; }
  .kinddesc{ font-size:12px; color:var(--ink-soft); margin:2px 0 8px; }
  .kinddesc div{ padding:1px 0; }
  .kinddesc .on{ color:var(--ink); }
  .kinddesc .on b{ color:var(--purple); }
  .av{ position:relative; width:28px; height:28px; border-radius:50%; overflow:hidden; display:inline-flex; align-items:center; justify-content:center; flex:0 0 auto; background:var(--paper-dim,#eae4d6); border:1px solid var(--line,#ddd5c3); color:var(--ink-soft); font-size:12px; line-height:1; }
  .av.place{ background:#dfe8e2; color:#3f5a4d; }
  .av.place .avph{ font-size:15px; }
  .av .avimg{ position:absolute; inset:0; width:100%; height:100%; object-fit:cover; display:block; }
  .ppl{ align-items:center; max-width:100%; }
  .pname{ min-width:0; overflow-wrap:anywhere; }
  .pick .av{ width:36px; height:36px; }
  .pick .pname{ flex:1 1 auto; min-width:0; overflow-wrap:anywhere; }
  .pick .ck{ flex:0 0 auto; }

  /* ライン表示：字下げは1階層ごとに小さく、深い階層は上限を設ける（所属は線・点・「N階層」表示で補う） */
  .v-line .trunk{ padding-left:calc(var(--G) + 5px); }
  .v-line .trunk::before{ left:calc(5px - 1px); }
  .v-line .card{ padding:0 var(--CP); }
  .v-line .event{ padding:2px var(--CP); }
  .v-line .list-stack.nest{ padding-left:var(--P); }
  .v-line .list-stack.deep{ --P:6px; }
  .v-line .list-stack.cap{ --P:0px; padding-left:6px; border-left:2px solid #c3e3d5; margin-left:2px; }
  .v-line .list-stack.nest::before{ left:calc(var(--P) - var(--G) - .75px); }
  .v-line .list-stack.nest::after{ left:calc(-1 * var(--G)); width:var(--P); }
  .v-line .list-stack.cap::before,.v-line .list-stack.cap::after{ display:none; }
  .v-line .list-stack.cap .ehead::before,.v-line .list-stack.cap .ghead::before,.v-line .list-stack.cap .addbtn::before{ display:none; }
  .v-line .ehead::before,.v-line .ghead::before{ left:calc(-1 * (var(--CP) + var(--G)) - var(--dw) / 2); top:calc(15px - var(--dw) / 2); }
  .v-line .gbody{ margin:0 calc(-1 * var(--CP)); }
  .v-line .strbar{ padding-left:calc(var(--CP) + var(--P)); }
  .v-line .addbtn::before{ left:calc(-1 * var(--G) - 3px); }
  .v-line .endcap::before{ left:calc(-1 * var(--G) - 5px); }
  .v-line .mode-move .ehead::before{ top:calc(15px - var(--dw) / 2); }

  /* カード表示：入れ子ごとに余白が積み重ならないようにする */
  .v-card .gbody .group.deep2{ padding:3px 5px 6px; }
  .v-card .gbody .group.deep4{ padding:3px 2px 5px; }

  @media (max-width:600px){
    :host{ margin:0 -16px; }
    .pv{ --P:10px; --G:8px; --CP:6px; border-radius:0; }
    .wrap{ padding:8px 8px 80px; }
    .movebar{ margin:0 -8px 6px; padding:6px 8px; }
    .v-card .group{ padding:6px 8px 8px; border-radius:14px; }
    .v-card .gbody .group{ padding:4px 6px 6px; border-radius:12px; }
    .v-card .gbody .group.deep2{ padding:3px 4px 5px; }
    .v-card .gbody .group.deep4{ padding:3px 2px 4px; }
    .v-card .event{ padding:4px 8px 4px; border-radius:10px; }
    .v-card .endcap{ padding:6px 12px; }
    .v-line .list-stack.cap{ padding-left:4px; }
    .modal{ padding:12px; }
  }
`;

/* ============ 新プロット：画面（最新試作の表示・操作を基準にする） ============
   ・表示は試作と同じ見た目・操作を保つため、Shadow DOM（本体CSSと干渉しない）の中に描画する。
   ・入力欄は「入力のたびに作り直さない」方式：入力はモデルへ直接反映し、再描画しない（フォーカス・カーソル・日本語変換が途切れない）。
     本体の保存（data.plotV2）への反映は、変換中を避けて少し遅らせて行い、画面移動・フォーカス離脱・構成操作の時にすぐ反映する。
   ・Reactの再描画で作り直されないよう、この部分はReactが管理しない領域として扱う。 */
const PLOTV2_PALETTE = ['#2f73a3','#e0149f','#e8782a','#6a8a5a','#7a6aa8','#b07a1f','#2f8f74','#a03a6a'];

function createPlotV2View(host, api){
  const root = host.attachShadow({ mode:'open' });
  root.innerHTML = `<style>${PLOTV2_CSS}</style><div class="pv v-card"><div class="wrap"></div><div class="mroot"></div><div class="troot"></div></div>`;
  const pv = root.querySelector('.pv'), wrap = root.querySelector('.wrap'), mroot = root.querySelector('.mroot'), troot = root.querySelector('.troot');

  let model = null, lastCommitted = null, errState = null;
  const mine = new WeakSet(); // 自分が本体へ渡したデータ。React側の反映が遅れて古い自分のデータが戻ってきても、外部変更とは扱わない
  let ctx = { chars:[], places:[] };
  const ui = loadPlotV2Ui();
  let mode = 'normal', mv = { sel:null, col:{} };
  let dirty = false, timer = null, composing = false, destroyed = false;
  let stMap = {}, modalY = null, pendingAdd = null, pendingOk = null;
  const imgCache = new Map(), imgPending = new Set(); // キャラアイコン：画像IDごとの表示用URL（プロットには画像データを保存しない。既存の画像保存から都度取得）

  /* ---------- 保存への受け渡し ---------- */
  const clone = (x) => JSON.parse(JSON.stringify(x));
  function commit(){
    clearTimeout(timer); timer = null;
    if(!dirty || !model) return;
    dirty = false;
    const obj = { schemaVersion:PLOTV2_VERSION, items:clone(model.items), structures:clone(model.structures) };
    lastCommitted = obj; mine.add(obj);
    api.setPlot(obj);
  }
  function touch(){ dirty = true; api.markDirty(); clearTimeout(timer); timer = setTimeout(commit, 250); }
  function changed(){ touch(); commit(); }
  const saveUi = () => { if(model) savePlotV2Ui(ui, model.items); };

  /* ---------- 表示用の小道具 ---------- */
  const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const orUndecided = s => s && s.trim() ? esc(s) : '（未定）';
  const sceneFilled = n => PLOTV2_SCENE_KEYS.some(k => n.scene[k] && n.scene[k].trim());
  const plain = pvPlain;
  const find = (id) => pvFind(model.items, id);
  const fT = (id, f, val, ph, cls) => `<textarea class="inl ag ${cls}" rows="1" data-f="${f}" data-id="${id}" placeholder="${ph}" aria-label="${ph}" autocomplete="off" enterkeyhint="next">${esc(val)}</textarea>`;
  const avatar = (c, cls) => `<span class="av ${cls||''}" data-img="${esc(c.imageId||'')}"><span class="avph">${cls==='place'?esc(c.icon):'?'}</span></span>`;
  // 取得済みの画像を表示へ反映。未取得なら既存の画像保存から読み込む（失敗・未登録は代替表示のまま。表示寸法は固定なのでレイアウトは動かない）
  function paintIcons(){
    root.querySelectorAll('.av[data-img]').forEach(el => {
      const id = el.dataset.img; if(!id) return;
      const u = imgCache.get(id);
      if(u){ if(!el.querySelector('img')){ const im = document.createElement('img'); im.className = 'avimg'; im.alt = ''; im.src = u; el.textContent = ''; el.appendChild(im); } return; }
      if(imgCache.has(id) || imgPending.has(id)) return;
      imgPending.add(id);
      Promise.resolve().then(() => imageStorage.get(id)).then(x => imgCache.set(id, x || null), () => imgCache.set(id, null))
        .then(() => { imgPending.delete(id); if(!destroyed) paintIcons(); });
    });
  }
  root.addEventListener('error', e => {
    const t = e.target; if(!t || !t.classList || !t.classList.contains('avimg')) return;
    const el = t.parentNode; if(el && el.dataset) imgCache.set(el.dataset.img, null);
    if(el){ el.innerHTML = '<span class="avph">?</span>'; }
  }, true);
  const fA = (id, f, val, ph, cls, aria) => `<textarea class="inl ag ${cls}" rows="1" data-f="${f}" data-id="${id}" placeholder="${ph}" aria-label="${aria||ph}">${esc(val)}</textarea>`;
  const SCENE_FIELDS = [['goal','目的','目的を追加'],['obstacle','対立・障害','対立・障害を追加'],['change','場面で起きる変化','変化を追加'],['memo','自由メモ','メモを追加']];
  const colorOf = (id) => { let h = 0; for(const ch of String(id)) h = (h * 31 + ch.charCodeAt(0)) >>> 0; return PLOTV2_PALETTE[h % PLOTV2_PALETTE.length]; };
  const mvName = n => n.label.trim() || n.title.trim() || '未定';
  const bandSet = () => new Set(Object.keys(ui.st).filter(k => ui.st[k]));
  const findRole = (rid) => { for(const s of model.structures){ const r = s.roles.find(x => x.id === rid); if(r) return { s, r }; } return null; };

  /* ---------- 出来事・まとまり（通常表示） ---------- */
  function addBtn(parentId, list){
    const last = list.length ? list[list.length - 1].id : '';
    return `<button class="lnk addbtn" data-act="addDlg" data-parent="${parentId||''}" data-after="${last}">＋ 追加</button>`;
  }
  function relHtml(n){
    const chars = n.chars.map(id => ctx.chars.find(c => c.id === id)).filter(Boolean);
    const places = n.places.map(id => ctx.places.find(p => p.id === id)).filter(Boolean);
    const lostC = n.chars.length - chars.length, lostP = n.places.length - places.length;
    const cs = chars.map(c => `<span class="ppl">${avatar(c)}<span class="pname">${esc(c.name)}</span></span>`).join('');
    const ps = places.map(p => `<span class="ppl">${avatar(p,'place')}<span class="pname">${esc(p.name)}</span></span>`).join('');
    const lc = lostC ? `<span class="none-txt">（登録の無い人物 ${lostC}件）</span>` : '', lp = lostP ? `<span class="none-txt">（登録の無い場所 ${lostP}件）</span>` : '';
    return `<div class="rline">${cs}${lc}${(chars.length||lostC)?'':'<span class="none-txt">キャラ未設定</span>'}<button class="lnk sm" data-act="pickDlg" data-id="${n.id}" data-type="chars" aria-label="キャラクターを追加・解除">＋ キャラ</button></div>
      <div class="rline">${ps}${lp}${(places.length||lostP)?'':'<span class="none-txt">場所未設定</span>'}<button class="lnk sm" data-act="pickDlg" data-id="${n.id}" data-type="places" aria-label="場所を追加・解除">＋ 場所</button></div>`;
  }
  function renderEvent(n){
    const st = stMap[n.id], open = !!ui.ev[n.id], sceneOpen = !!ui.sc[n.id];
    let h = `<div class="card event${st?' st':''}${open?' isopen':''}" data-node="${n.id}"${st?` style="--stc:${esc(st.role.color)}"`:''}>`;
    if(st && st.label) h += `<div class="strow"><button class="stl" style="background:${esc(st.role.color)}" data-act="rangeDlg" data-role="${st.role.id}" aria-label="構成「${esc(st.role.name)}」の範囲を編集">${esc(st.role.name)||'（役割名なし）'}</button>${st.cont?'<span class="stcont">続き</span>':''}</div>`;
    h += `<div class="ehead" data-row="${n.id}">${fT(n.id,'title',n.title,'タイトルを入力','t')}${fA(n.id,'summary',n.summary,'概要を追加','s')}
      <div class="tgrow"><button type="button" class="lnk tgl" data-act="toggleDetail" data-id="${n.id}" aria-expanded="${open}"><span class="tri" aria-hidden="true">${open?'▼':'▶'}</span>${open?'詳細を閉じる':'詳細を開く'}</button></div></div>`;
    if(open){
      h += `<div class="edetail">${fA(n.id,'detail',n.detail,'内容を追加','d')}${relHtml(n)}`;
      if(sceneOpen) h += `<div class="scene">${SCENE_FIELDS.map(([k,l,ph]) => `<div class="sf"><div class="sl">${l}</div>${fA(n.id,'scene.'+k,n.scene[k],ph,'d',l)}</div>`).join('')}</div>`;
      else if(n.scene.change.trim()) h += `<div class="scsum"><b>場面の変化</b>${esc(n.scene.change)}</div>`;
      h += `<div class="erow"><button class="lnk" data-act="toggleScene" data-id="${n.id}" aria-expanded="${sceneOpen}">シーン設計${sceneFilled(n)?'（入力あり）':''} ${sceneOpen?'⌄':'›'}</button></div></div>`;
    }
    return h + `</div>`;
  }
  function strBar(g){
    const sts = model.structures.filter(s => s.groupId === g.id);
    const flat = pvGroupFlat(model.items, g.id);
    if(!sts.length) return `<div class="strbar"><span class="stunset">構成は未設定です<button class="lnk sm" data-act="structDlg" data-id="${g.id}">構成を設定</button></span></div>`;
    return `<div class="strbar">` + sts.map(s => {
      const chips = s.roles.map(r => {
        const x = pvRoleStatus(model.items, r, flat), nm = esc(r.name) || '（役割名なし）';
        if(x.s === 'unset') return `<span class="stunset">${nm}<button class="lnk sm" data-act="rangeDlg" data-role="${r.id}">範囲を設定</button></span>`;
        if(x.s === 'check') return `<button class="stchip warn" data-act="rangeDlg" data-role="${r.id}">⚠ ${nm} 要確認</button>`;
        return `<button class="stchip" style="--stc:${esc(r.color)}" data-act="rangeDlg" data-role="${r.id}">${nm}・${x.count}件</button>`;
      }).join('');
      return chips + `<button class="lnk sm" data-act="structDlg" data-id="${g.id}" data-sid="${s.id}">⚙ 構成の設定${s.type?'（'+esc(s.type)+'）':''}</button>`;
    }).join('') + `</div>`;
  }
  function renderGroup(n, depth){
    const cnt = n.children.length, col = !!ui.col[n.id], showSt = !!ui.st[n.id];
    let h = `<div class="card group ${depth % 2 ? 'odd' : 'even'}${depth >= 2 ? ' deep2' : ''}${depth >= 4 ? ' deep4' : ''}" data-node="${n.id}"><div class="ghead" data-row="${n.id}">
      <div class="grow1">${depth >= 3 ? `<span class="lvl" title="${depth + 1}階層目">${depth + 1}階層</span>` : ''}${fT(n.id,'label',n.label,'区分名','lb')}${cnt?`<span class="cnt">${cnt}件${col?'・閉じています':''}</span>`:''}<button type="button" class="lnk gact" data-act="toggleStruct" data-id="${n.id}" aria-pressed="${showSt}">${showSt?'✓ ':''}構成</button></div>
      ${fT(n.id,'title',n.title,'タイトルを入力','t')}${fA(n.id,'summary',n.summary,'概要を追加','s')}
      <div class="tgrow"><button type="button" class="lnk tgl" data-act="toggle" data-id="${n.id}" aria-expanded="${!col}"><span class="tri" aria-hidden="true">${col?'▶':'▼'}</span>${col?'中身を開く':'中身を閉じる'}</button></div></div>`;
    if(!col) h += `<div class="gbody">${showSt ? strBar(n) : ''}${renderList(n.children, n.id, depth + 1)}</div>`;
    return h + `</div>`;
  }
  const listCls = (parentId, depth) => `list-stack ${parentId ? 'nest' : 'top'}${depth >= 3 ? ' deep' : ''}${depth >= 5 ? ' cap' : ''}`;
  function renderList(list, parentId, depth){
    let h = `<div class="${listCls(parentId, depth)}">`;
    list.forEach(n => { h += n.kind === 'group' ? renderGroup(n, depth) : renderEvent(n); });
    if(!list.length) h += `<div class="emptyg">まだ何もありません。</div>`;
    return h + `<div class="addrow">${addBtn(parentId, list)}</div></div>`;
  }

  /* ---------- 移動モードの表示 ---------- */
  function mvActions(id){
    const info = find(id);
    return `<div class="mvact"><button class="btn" data-act="mvUp" data-id="${id}" ${info.index===0?'disabled':''}>↑ 上へ</button><button class="btn" data-act="mvDown" data-id="${id}" ${info.index===info.list.length-1?'disabled':''}>↓ 下へ</button><button class="btn" data-act="mvDest" data-id="${id}">移動先…</button></div>`;
  }
  function renderMoveEvent(n){
    const sel = mv.sel === n.id;
    return `<div class="card event mv${sel?' sel':''}" data-node="${n.id}"><div class="ehead">
      <div class="mvtap" data-act="mvSel" data-id="${n.id}" role="button" tabindex="0" aria-pressed="${sel}"><div class="ttl${n.title.trim()?'':' empty'}">${orUndecided(n.title)}</div>${n.summary.trim()?`<div class="sum clamp">${esc(n.summary)}</div>`:''}</div></div></div>${sel?mvActions(n.id):''}`;

  function renderMoveGroup(n, depth){
    const sel = mv.sel === n.id, col = !!mv.col[n.id], cnt = n.children.length;
    let h = `<div class="card group mv ${depth % 2 ? 'odd' : 'even'}${depth >= 2 ? ' deep2' : ''}${depth >= 4 ? ' deep4' : ''}" data-node="${n.id}"><div class="ghead${sel?' sel':''}">

        <div class="ttl${n.title.trim()?'':' empty'}">${orUndecided(n.title)}</div>${n.summary.trim()?`<div class="sum clamp">${esc(n.summary)}</div>`:''}</div>

  function autoGrow(el){ el.style.height = 'auto'; el.style.height = el.scrollHeight + 'px'; }

  /* 表示切り替え：見ていた要素の画面内の位置を保つ */
  function captureAnchor(){
    const els = [...root.querySelectorAll('#view [data-node]')], vh = window.innerHeight;
    for(const el of els){ const r = el.getBoundingClientRect(); if(r.top >= 0 && r.top < vh) return { id:el.dataset.node, top:r.top }; }
    let pick = null;
    for(const el of els){ const r = el.getBoundingClientRect(); if(r.top < 0 && r.bottom > 0) pick = { id:el.dataset.node, top:r.top }; }
    return pick;
  }
  function restoreAnchor(a){
    if(!a) return;
    const el = root.querySelector(`#view [data-node="${a.id}"]`); if(!el) return;
    const d = el.getBoundingClientRect().top - a.top;
    if(d) window.scrollBy(0, d);
  }
  function setView(v){
    if(v === ui.view) return;
    const a = captureAnchor();
    ui.view = v; saveUi(); render(); restoreAnchor(a);
  }

  /* ---------- 移動モード ---------- */
  function ensureVisible(){
    const sel = mv.sel; if(!sel) return;
    const el = root.querySelector(`#view [data-node="${sel}"]`); if(!el) return;
    const head = el.querySelector('.ehead, .ghead') || el, act = root.querySelector('#view .mvact');
    const bar = root.getElementById('movebar'), hh = bar ? bar.getBoundingClientRect().bottom : 0;
    const r1 = head.getBoundingClientRect(), r2 = (act || head).getBoundingClientRect();
    if(r1.top < hh + 8) window.scrollBy(0, r1.top - hh - 8);
    else if(r2.bottom > window.innerHeight - 8) window.scrollBy(0, r2.bottom - window.innerHeight + 8);
  }
  function enterMove(){
    if(composing){ toast('文字の変換を確定してから「移動」を押してください'); return; }
    const ae = root.activeElement; if(ae && (ae.tagName === 'INPUT' || ae.tagName === 'TEXTAREA')) ae.blur();
    commit();
    const a = captureAnchor(), col = {};
    pvForEach(model.items, n => { if(n.kind === 'group') col[n.id] = !!ui.col[n.id]; });   // 移動中の開閉は通常表示と分けて持つ（一時状態）
    mode = 'move'; mv = { sel:null, col }; render(); restoreAnchor(a);
  }
  function exitMove(){
    const sel = mv.sel;
    let a = captureAnchor();
    if(sel){
      const el = root.querySelector(`#view [data-node="${sel}"]`); if(el) a = { id:sel, top:el.getBoundingClientRect().top };
      let p = (find(sel) || {}).parent;                       // 選択項目が見えるよう、必要な祖先だけ開く
      while(p){ ui.col[p.id] = false; p = find(p.id).parent; }
      saveUi();
    }
    mode = 'normal'; mv = { sel:null, col:{} }; render(); restoreAnchor(a);
    if(sel){ const el = root.querySelector(`#view [data-node="${sel}"]`); if(el){ const r = el.getBoundingClientRect(); if(r.top < 0 || r.bottom > window.innerHeight) window.scrollBy(0, r.top - window.innerHeight / 3); } }
  }

      <div class="field"><label>始まりの出来事</label><select id="r_start">${opts(r.startId)}</select></div>
      <div class="field"><label>終わりの出来事</label><select id="r_end">${opts(r.endId)}</select></div>
      <div class="hint">章の途中から、複数の章をまたいで指定できます。始まりと終わりが同じ出来事でも設定できます。</div>
      <div class="err" id="r_err"></div>
      <div class="foot"><button class="btn danger" data-act="rangeClearAsk" data-role="${r.id}">範囲を解除</button><button class="btn" data-act="rangeCancel">キャンセル</button><button class="btn primary" data-act="rangeOk" data-role="${r.id}">保存</button></div>`);
  }
  function afterRangeModal(){
    const back = structReturn; structReturn = null;
    if(back){ closeModal(); render(); structDlg(back.groupId, back.sid); } else { closeModal(); render(); }
  }

  /* ---------- 操作の受け口（カード・ラインで共通） ---------- */
  root.addEventListener('click', e => {
    const t = e.target.closest('[data-act]'); if(!t) return;
    const act = t.dataset.act, id = t.dataset.id || null;
    if(act === 'overlay'){ if(e.target === t){ closeModal(); if(model) render(); } return; }
    switch(act){
      case 'close': closeModal(); if(model) render(); break;
      case 'setView': setView(t.dataset.view); break;
      case 'toggle': ui.col[id] = !ui.col[id]; saveUi(); render(); break;
      case 'toggleDetail': ui.ev[id] = !ui.ev[id]; saveUi(); render(); break;
      case 'toggleScene': ui.sc[id] = !ui.sc[id]; saveUi(); render(); break;
      case 'toggleStruct': ui.st[id] = !ui.st[id]; saveUi(); render(); break;
      case 'expandAll': pvForEach(model.items, n => { if(n.kind==='group') ui.col[n.id] = false; else ui.ev[n.id] = true; }); saveUi(); render(); break;
      case 'collapseAll': pvForEach(model.items, n => { if(n.kind==='group') ui.col[n.id] = true; else ui.ev[n.id] = false; }); saveUi(); render(); break;
      case 'addDlg': addDlg(t.dataset.parent, t.dataset.after); break;
      case 'kind': {
        pendingAdd.kind = t.dataset.kind;
        mroot.querySelectorAll('.kindsel button').forEach(b => b.classList.toggle('on', b === t));
        mroot.querySelectorAll('.kinddesc [data-kd]').forEach(d => d.classList.toggle('on', d.dataset.kd === t.dataset.kind));
        root.getElementById('f_label_wrap').style.display = t.dataset.kind === 'group' ? '' : 'none'; break;
      }
      case 'addOk': {
        const p = pendingAdd, title = root.getElementById('f_title').value, sum = root.getElementById('f_sum').value;
        const n = p.kind === 'group' ? pvMakeGroup(root.getElementById('f_label').value, title, sum) : pvMakeEvent(title, sum);
        const list = pvListOf(model.items, p.parentId); if(!list){ toast('その場所へは追加できません'); break; }
        const i = p.afterId ? list.findIndex(x => x.id === p.afterId) : -1;
        list.splice(i + 1, 0, n);
        if(mode === 'move'){ mv.sel = n.id; if(p.parentId) mv.col[p.parentId] = false; }
        else if(p.parentId){ ui.col[p.parentId] = false; saveUi(); }
        changed(); closeModal(); render(); if(mode === 'move') ensureVisible(); break;
      }
      case 'delDlg': delDlg(id); break;
      case 'delOk': { const i = find(id); if(i){ i.list.splice(i.index, 1); changed(); } closeModal(); render(); break; }
      case 'addBefore': case 'addAfter': {
        const info = find(id);
        const afterId = act === 'addAfter' ? id : (info.index > 0 ? info.list[info.index - 1].id : null);
        addDlg(info.parent ? info.parent.id : null, afterId); break;
      }
      case 'enterMove': enterMove(); break;
      case 'exitMove': exitMove(); break;
      case 'mvSel': mv.sel = mv.sel === id ? null : id; render(); ensureVisible(); break;
      case 'mvToggle': mv.col[id] = !mv.col[id]; render(); break;
      case 'mvUp': if(pvShift(model.items, id, -1)) changed(); render(); ensureVisible(); break;
      case 'mvDown': if(pvShift(model.items, id, 1)) changed(); render(); ensureVisible(); break;
      case 'mvOps': if(mv.sel) mvOpsDlg(mv.sel); break;
      case 'mvDest': mvDestDlg(id); break;
      case 'mvPick': mvConfirmDlg(id, t.dataset.dest || null); break;
      case 'mvDo': {
        const dest = t.dataset.dest || null;
        if(!pvMove(model.items, id, dest)){ toast('その場所へは移動できません'); break; }
        changed();
        let g = dest; while(g){ mv.col[g] = false; g = find(g).parent ? find(g).parent.id : null; }   // 移動先の祖先を開く
        closeModal(); render(); ensureVisible(); toast('移動しました'); break;
      }
      case 'pickDlg': pickDlg(id, t.dataset.type); break;
      case 'pickToggle': {
        const n = find(id).node, arr = n[t.dataset.type], c = t.dataset.cid, i = arr.indexOf(c);
        if(i >= 0) arr.splice(i, 1); else arr.push(c);
        changed();
        const sc = mroot.querySelector('.modal').scrollTop; pickDlg(id, t.dataset.type); mroot.querySelector('.modal').scrollTop = sc; break;
      }
      case 'askOk': { const f = pendingOk; pendingOk = null; if(f) f(); break; }
      /* 構成 */
      case 'structDlg': structDlg(id, t.dataset.sid || null); break;
      case 'structClose': closeModal(); render(); break;
      case 'roleAdd': {
        const s = model.structures.find(x => x.id === t.dataset.sid); if(!s) break;
        s.roles.push({ id:uid('pvr'), name:'', color:PLOTV2_ROLE_COLORS[s.roles.length % PLOTV2_ROLE_COLORS.length], startId:'', endId:'' });
        changed(); structDlg(s.groupId, s.id); break;
      }
      case 'presetAdd': {
        const s = model.structures.find(x => x.id === t.dataset.sid); if(!s) break;
        const key = root.getElementById('s_preset').value; if(!key || !PLOT_PRESETS[key]) { toast('追加する型を選んでください'); break; }
        PLOT_PRESETS[key].forEach(nm => s.roles.push({ id:uid('pvr'), name:nm, color:PLOTV2_ROLE_COLORS[s.roles.length % PLOTV2_ROLE_COLORS.length], startId:'', endId:'' }));
        if(!s.type) s.type = key;
        changed(); structDlg(s.groupId, s.id); break;
      }
      case 'roleDelAsk': {
        const f = findRole(t.dataset.role); if(!f) break; const from = t.dataset.from === 'struct';
        askDlg('役割の削除', `<p>役割「${esc(f.r.name)||'（役割名なし）'}」を削除します。この役割の範囲設定も消えます。</p>`, '削除する', () => {
          f.s.roles = f.s.roles.filter(x => x.id !== f.r.id); changed(); if(from){ closeModal(); structDlg(f.s.groupId, f.s.id); } else { closeModal(); render(); }
        }, true); break;
      }
      case 'stDelAsk': {
        const s = model.structures.find(x => x.id === t.dataset.sid); if(!s) break; const from = t.dataset.from === 'struct';
        askDlg('構成設定の削除', `<p>この構成設定（役割${s.roles.length}件）を削除します。出来事そのものは削除されません。</p>`, '削除する', () => {
          model.structures = model.structures.filter(x => x.id !== s.id); changed(); closeModal(); render();
        }, true); break;
      }
      case 'rangeDlg': rangeDlg(t.dataset.role, t.dataset.from === 'struct'); break;
      case 'rangeCancel': afterRangeModal(); break;
      case 'rangeOk': {
        const f = findRole(t.dataset.role); if(!f) break;
        const flat = pvGroupFlat(model.items, f.s.groupId) || [];
        const name = root.getElementById('r_name').value.trim(), s = root.getElementById('r_start').value, en = root.getElementById('r_end').value;
        const err = m => { root.getElementById('r_err').textContent = m; };
        if(!name){ err('役割名を入力してください。'); break; }
        if(!s || !en){ err('始まりと終わりの出来事を選んでください。'); break; }
        if(flat.findIndex(x => x.node.id === s) > flat.findIndex(x => x.node.id === en)){ err('終わりは、始まりと同じか、それより後ろの出来事にしてください。'); break; }
        f.r.name = name; f.r.startId = s; f.r.endId = en;
        changed(); afterRangeModal(); break;
      }
      case 'rangeClearAsk': {
        const f = findRole(t.dataset.role); if(!f) break; const back = structReturn || (t.dataset.from === 'struct' ? { groupId:f.s.groupId, sid:f.s.id } : null);
        askDlg('範囲の解除', `<p>役割「${esc(f.r.name)||'（役割名なし）'}」の始点・終点の設定を解除します（役割そのものは残ります）。</p>`, '解除する', () => {
          f.r.startId = ''; f.r.endId = ''; changed(); structReturn = null; closeModal(); render(); if(back) structDlg(back.groupId, back.sid);
        }); break;
      }
    }
  });

  /* ---------- 直接編集：入力は即座にモデルへ反映（再描画しないのでフォーカス・IME入力は途切れない） ---------- */
  function applyField(t){
    const f = t.dataset && t.dataset.f; if(!f || !model) return false;
    const info = find(t.dataset.id); if(!info) return false;
    const n = info.node;
    if((f === 'title' || f === 'label') && /[\r\n]/.test(t.value)) t.value = t.value.replace(/[\r\n]+/g, ' '); // タイトル・区分名は複数行に折り返して表示するが、改行そのものは入れない
    if(f.startsWith('scene.')){ if(n.kind==='event') n.scene[f.slice(6)] = t.value; } else if(f==='label'||f==='title'||f==='summary'||f==='detail') n[f] = t.value;
    if(t.tagName === 'TEXTAREA') autoGrow(t);
    touch();
    return true;
  }
  function applyStructField(t){
    const sf = t.dataset && t.dataset.sf; if(!sf || !model) return false;
    if(sf === 'type'){ const s = model.structures.find(x => x.id === t.dataset.sid); if(s){ s.type = t.value; touch(); } }
    else { const f = findRole(t.dataset.role); if(f){ if(sf === 'roleName') f.r.name = t.value; else if(sf === 'roleColor') f.r.color = t.value; touch(); } }
    return true;
  }
  root.addEventListener('input', e => {
    if(e.isComposing || composing) return;   // 日本語変換中は確定しない（変換が終わった時にまとめて反映）
    if(!applyField(e.target)) applyStructField(e.target);
  });
  root.addEventListener('compositionstart', () => { composing = true; }, true);
  root.addEventListener('compositionend', e => {
    composing = false;
    if(!applyField(e.target)) applyStructField(e.target);
  }, true);
  root.addEventListener('focusout', () => { if(!composing) commit(); });
  root.addEventListener('keydown', e => {
    const t = e.target; if(!t.dataset || !t.dataset.f || e.isComposing || composing) return;
    if(e.key === 'Escape'){ t.blur(); return; }
    if(e.key === 'Enter' && (t.dataset.f === 'title' || t.dataset.f === 'label')){
      e.preventDefault();
      const box = t.closest('.ghead, .ehead'), next = box.querySelector(t.dataset.f === 'label' ? 'textarea[data-f=title]' : 'textarea[data-f=summary]');
      if(next) next.focus();
    }
  });
  const onHide = () => { if(document.visibilityState === 'hidden' && !composing) commit(); };
  document.addEventListener('visibilitychange', onHide);
  window.addEventListener('pagehide', onHide);

  /* ---------- 外から呼ぶ口 ---------- */
  return {
    sync(plot, err, chars, places){
      const prevSig = JSON.stringify(ctx);
      ctx = {
        chars: (chars||[]).map(c => ({ id:c.id, name:c.name || '（名前なし）', imageId:c.iconImageId || c.image || null })),
        places: (places||[]).map(p => ({ id:p.id, name:p.name || '（名前なし）', icon:'📍' })),
      };
      if(err){ errState = err; model = null; lastCommitted = null; dirty = false; clearTimeout(timer); closeModal(); render(); return; }
      errState = null;
      if(!model || (plot !== lastCommitted && !mine.has(plot))){
        clearTimeout(timer); dirty = false;
        model = clone(plot); lastCommitted = plot;
        mode = 'normal'; mv = { sel:null, col:{} }; mroot.innerHTML = ''; modalY = null;
        render();
      } else if(model && prevSig !== JSON.stringify(ctx) && !composing && !(root.activeElement && /^(INPUT|TEXTAREA)$/.test(root.activeElement.tagName))){
        render(); // キャラ名・アイコンの変更を反映（入力中は触らない）
      }
    },
    destroy(){
      destroyed = true;
      commit();
      window.removeEventListener('resize', onResize);
      document.removeEventListener('visibilitychange', onHide);
      window.removeEventListener('pagehide', onHide);
      clearTimeout(timer);
    },
  };
}

function PlotV2({ data, setData, markDirty }){
  const hostRef = useRef(null), ctlRef = useRef(null);
  const apiRef = useRef({});
  apiRef.current = {
    setPlot: (obj) => setData(d => (d.plotV2Error ? d : { ...d, plotV2: obj })),
    markDirty: () => { if(markDirty) markDirty(); },
  };
  useEffect(()=>{
    const ctl = createPlotV2View(hostRef.current, { setPlot:(o)=>apiRef.current.setPlot(o), markDirty:()=>apiRef.current.markDirty() });
    ctlRef.current = ctl;
    ctl.sync(data.plotV2, data.plotV2Error, data.characters, data.locations);
    return ()=>{ ctl.destroy(); ctlRef.current = null; };
  }, []);
  useEffect(()=>{
    if(ctlRef.current) ctlRef.current.sync(data.plotV2, data.plotV2Error, data.characters, data.locations);
  }, [data.plotV2, data.plotV2Error, data.characters, data.locations]);
  return <div ref={hostRef} />;
}

/* ============ アプリ本体 ============ */

  const [generalScenes, setGeneralScenes] = useState(loadGeneralScenes); // 汎用シーン案（成人向けシーン進行とは別保存）
  const [storyOutlines, setStoryOutlines] = useState(loadStoryOutlines); // 作品→構成ブロック→出来事の全体構成
  const [storyPatterns, setStoryPatterns] = useState(loadStoryPatterns); // 再利用可能な物語構造リファレンス
  const [moreMenuOpen, setMoreMenuOpen] = useState(false); // スマホ下部ナビ「総合」ボトムシート
  const [writingLocInit] = useState(loadWritingLocation); // 執筆画面で最後に開いていた場所（端末内UI設定）
  const [writingTab, setWritingTab] = useState(writingLocInit.tab); // Writing画面のタブ：'draft'（下書き）|'chapters'（本文）|'shelf'（保管棚）|'map'（シーンの地図）
  const [writingOpenId, setWritingOpenId] = useState(writingLocInit.chapterId); // 本文で開いている章（執筆を一度閉じても保持）
  const [writingBlockId, setWritingBlockId] = useState(writingLocInit.blockId); // 本文で選んでいる場面
  const writingBackRef = useRef(null); // Writing画面が「画面内で一つ上へ戻る」処理を登録する場所（戻る操作用）
  const navOriginRef = useRef(null); // 別画面から開いた画面の戻り先（例：下書きの辞典ドロワー→成人向け創作→戻る＝執筆）
  useEffect(()=>{
    try{ localStorage.setItem(WRITING_LOCATION_KEY, JSON.stringify({ tab:writingTab, chapterId:writingOpenId, blockId:writingBlockId })); }catch(e){}
  }, [writingTab, writingOpenId, writingBlockId]);
  const [sceneToolsSignal, setSceneToolsSignal] = useState(0); // 「シーンの地図」→「１話の構成を開く」の合図
  const openSceneTools = () => { navOriginRef.current = screen==='writing' ? {screen:'storyTools', from:'writing'} : null; setScreen('storyTools'); setDetailId(null); setQuery(''); setSceneToolsSignal(s=>s+1); };
  const [adultToolsOpenRequest, setAdultToolsOpenRequest] = useState({tab:null, nonce:0}); // 下書きの辞典ドロワー→「成人向け創作」の該当タブへ
  const openAdultTools = (tab) => { navOriginRef.current = screen==='writing' ? {screen:'adultTools', from:'writing'} : null; setScreen('adultTools'); setDetailId(null); setQuery(''); setAdultToolsOpenRequest({tab, nonce: Date.now()}); };
  const openSceneFlowScreen = () => { navOriginRef.current = screen==='writing' ? {screen:'sceneFlow', from:'writing'} : null; setScreen('sceneFlow'); setDetailId(null); setQuery(''); };

  // 旧・成人向けシーン進行（adultSceneFlow.plans、別ストア）から、共通シーン進行（data.sceneFlowPlans）への取り込み。
  // 起動時だけでなく、バックアップ読込・クラウド同期などで旧プランが入れ替わった時にも実行する（mergeLegacyScenePlansは何度呼んでも安全）。
  // 元のadultSceneFlow.plansは削除しない（既存データ保護）。
  useEffect(()=>{
    const legacyPlans = (adultSceneFlow&&adultSceneFlow.plans)||[];
    setData(d=>mergeLegacyScenePlans(d, legacyPlans));
  },[adultSceneFlow, data.sceneFlowPlansMigratedFromAdult, data.sceneFlowLegacyMigratedIds]);

  // 「下書きへ挿入」を、開いている下書きの外（成人向け創作画面・シーン進行の独立画面など）から押したときの経路。
  // 現在開いている下書きが分からない（＝どの下書きが「開かれている」か画面上で判別できない）ため、
  // 既存の下書きを勝手に選んで上書きすることはせず、必ず「新規下書きを作る」か「挿入先を選ぶ」を挟む。
  // カーソル位置も分からないため、仕様どおり本文の末尾へ追記する。挿入前には必ず直前の内容を履歴へ退避する。
  const [sceneFlowInsertTarget, setSceneFlowInsertTarget] = useState(null); // 挿入先選択モーダルの対象プラン
  const appendPlanToDraft = (plan, draftId) => {
    const text = formatSceneFlowPlanForInsert(plan);
    setData(d=>{
      let drafts = d.drafts||[];
      let target = draftId ? drafts.find(x=>x.id===draftId && !x.deleted) : null;
      if(!target){
        const entry = makeDraftEntry(`「${plan.title}」より`, '', null, null);
        drafts = [...drafts, entry];
        target = entry;
      }
      const needSnapshot = !(target.history[0] && target.history[0].body===target.body);
      const historyEntry = { body: target.body, savedAt: new Date().toISOString() };
      const newBody = target.body ? (target.body + (/\n\n$/.test(target.body)?'':(target.body.endsWith('\n')?'\n':'\n\n')) + text) : text;
      drafts = drafts.map(x=>x.id===target.id ? {
        ...x, body:newBody, updatedAt:new Date().toISOString(),
        history: needSnapshot ? [historyEntry, ...x.history].slice(0,5) : x.history,
      } : x);
      return {...d, drafts, activeDraftId: target.id};

  const requestInsertPlanToDraft = (plan) => { setSceneFlowInsertTarget(plan); };
  const [syncOpen,setSyncOpen]=useState(false);
  const [syncConfig,setSyncConfig]=useState(loadCloudSyncConfig);
  const [syncState,setSyncState]=useState({phase:'idle',message:'同期キーを設定すると端末間で共有できます。'});
  const syncReadyRef=useRef(false);
  const applyingRemoteRef=useRef(false);
  const lastCloudSnapshotRef=useRef('');
  const fileInputRef = useRef();

  const makeCloudSnapshot=useCallback(()=>({
    schemaVersion:1, data:serializableData(data), writingSnippets, expressionDictionary, specialDictionary, mediaDictionary,
    adultDictionary, adultPhraseRemix, adultOnomatopoeia, adultSceneFlow, generalScenes, storyOutlines, storyPatterns
  }),[data,writingSnippets,expressionDictionary,specialDictionary,mediaDictionary,adultDictionary,adultPhraseRemix,adultOnomatopoeia,adultSceneFlow,generalScenes,storyOutlines,storyPatterns]);

  const applyCloudSnapshot=useCallback((payload)=>{
    if(!payload||!payload.data) throw new Error('クラウドデータの形式が不正です');
    const plotErr=plotV2PayloadError(payload.data);
    if(plotErr) throw new Error('クラウドの新プロットのデータを読み込めないため、この端末のデータは変更していません。'+plotErr);
    applyingRemoteRef.current=true;
    setData(migrateData(payload.data)); // 旧シーン進行の取り込みは、adultSceneFlowの更新を受けた下のuseEffectが行う
    if(payload.writingSnippets) setWritingSnippets(normalizeWritingSnippets(payload.writingSnippets));
    if(payload.expressionDictionary) setExpressionDictionary(normalizeExpressionDictionary(payload.expressionDictionary));
    if(payload.specialDictionary) setSpecialDictionary(normalizeSpecialDictionary(payload.specialDictionary));
    if(payload.mediaDictionary) setMediaDictionary(normalizeMediaDictionary(payload.mediaDictionary));
    if(payload.adultDictionary) setAdultDictionary(normalizeAdultDictionary(payload.adultDictionary));
    if(payload.adultPhraseRemix) setAdultPhraseRemix(normalizeAdultPhraseRemix(payload.adultPhraseRemix));
    if(payload.adultOnomatopoeia) setAdultOnomatopoeia(normalizeAdultOnomatopoeia(payload.adultOnomatopoeia));
    if(payload.adultSceneFlow) setAdultSceneFlow(normalizeAdultSceneFlow(payload.adultSceneFlow));

    if(payload.storyOutlines) setStoryOutlines(normalizeStoryOutlines(payload.storyOutlines));
    if(payload.storyPatterns) setStoryPatterns(normalizeStoryPatterns(payload.storyPatterns));
    lastCloudSnapshotRef.current=JSON.stringify(payload);
    setTimeout(()=>{applyingRemoteRef.current=false;},800);
  },[]);

  const syncRequest=useCallback(async(method,key,body)=>{
    const res=await fetch(CLOUD_SYNC_API,{method,headers:{'Content-Type':'application/json','X-Sync-Key':key},body:body?JSON.stringify(body):undefined});
    let result={}; try{result=await res.json();}catch(e){}
    if(!res.ok){const err=new Error(result.error||`通信に失敗しました (${res.status})`);err.status=res.status;err.result=result;throw err;}
    return result;
  },[]);

  const connectCloud=useCallback(async(key)=>{
    setSyncState({phase:'checking',message:''});
    try{
      const remote=await syncRequest('GET',key);
      const next={...syncConfig,enabled:true,key,revision:Number(syncConfig.revision||0)};
      setSyncConfig(next);saveCloudSyncConfig(next);
      if(!remote.exists||Number(remote.revision||0)===next.revision){
        syncReadyRef.current=true;
        setSyncState({phase:'ready',message:remote.exists?'クラウドと更新番号が一致しています。':'クラウドは空です。現在の内容を保存できます。'});
      }else{
        syncReadyRef.current=false;
        setSyncState({phase:'conflict',message:`この端末は更新 ${next.revision}、クラウドは更新 ${remote.revision} です。「クラウドから読み込む」で最新内容を取得してください。`});
      }
    }catch(err){syncReadyRef.current=false;setSyncState({phase:'error',message:err.message});}
  },[syncConfig,syncRequest]);

  const pullCloud=useCallback(async()=>{
    if(!syncConfig.key)return;
    if(!confirm('この端末の本文・設定・辞典・新プロットを、クラウドの内容で置き換えます。クラウドに新プロットが無い場合、この端末の新プロットは空になります。画像は変更しません。よろしいですか？'))return;
    setSyncState({phase:'pulling',message:''});
    try{
      const remote=await syncRequest('GET',syncConfig.key);
      if(!remote.exists||!remote.payload)throw new Error('クラウドに保存データがありません');
      applyCloudSnapshot(remote.payload);
      const next={...syncConfig,enabled:true,revision:Number(remote.revision),lastSyncedAt:remote.updatedAt||new Date().toISOString()};
      setSyncConfig(next);saveCloudSyncConfig(next);syncReadyRef.current=true;
      setSyncState({phase:'ready',message:`クラウドの更新 ${remote.revision} を読み込みました。`});
    }catch(err){syncReadyRef.current=false;setSyncState({phase:'error',message:err.message});}
  },[syncConfig,syncRequest,applyCloudSnapshot]);

  const pushCloud=useCallback(async(silent=false)=>{
    if(!syncConfig.enabled||!syncConfig.key||(!syncReadyRef.current&&!silent))return;
    if(data.plotV2Error){setSyncState({phase:'error',message:'新プロットのデータが読み込めない状態のため、クラウドへの保存を止めています（破損状態を確定させないためです）。'});return;}
    const payload=makeCloudSnapshot();const serialized=JSON.stringify(payload);
    if(silent&&serialized===lastCloudSnapshotRef.current)return;
    if(!silent)setSyncState({phase:'pushing',message:''});
    try{
      const result=await syncRequest('PUT',syncConfig.key,{expectedRevision:Number(syncConfig.revision||0),payload});
      const next={...syncConfig,revision:Number(result.revision),lastSyncedAt:result.updatedAt||new Date().toISOString()};
      setSyncConfig(next);saveCloudSyncConfig(next);lastCloudSnapshotRef.current=serialized;syncReadyRef.current=true;
      setSyncState({phase:'ready',message:`更新 ${result.revision} をクラウドへ保存しました。`});
    }catch(err){
      if(err.status===409){syncReadyRef.current=false;setSyncState({phase:'conflict',message:`別の端末で更新されています（クラウド更新 ${err.result&&err.result.revision}）。クラウドから読み込んでください。`});}

  // 保存

  // 戻れる所が無い（ホーム）ときだけ false を返し、端末／ブラウザ本来の戻る（アプリを閉じる）に任せる。
  const goUp = () => {
    if(moreMenuOpen){ setMoreMenuOpen(false); return true; }

  useEffect(()=>{

    return ()=>window.removeEventListener('popstate', onPop);
  }, []);

  const handleExport = async () => {
    const images = await imageStorage.getAll();

    const blob = new Blob([JSON.stringify(payload)], { type:'application/json' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    const safeTitle = (data.project.title || 'novel-world').replace(/[\\/:*?"<>|]/g,'_');
    a.href = url; a.download = `${safeTitle}_backup_${new Date().toISOString().slice(0,10)}.json`;
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    URL.revokeObjectURL(url);
  };

  const handleImportFile = async (e) => {
    const file = e.target.files[0];
    if(!file) return;
    try{
      const text = await file.text();
      const payload = JSON.parse(text);
      if(!payload.data) throw new Error('形式が不正です');
      const plotErr = plotV2PayloadError(payload.data);
      if(plotErr){ alert('読み込みを中止しました。このバックアップの新プロットのデータが読み込めない形式です。現在のデータは変更していません。\n\n'+plotErr); e.target.value=''; return; }
      const hasPlotV2 = payload.data.plotV2!==undefined && payload.data.plotV2!==null;
      if(!confirm('現在のデータを、読み込んだバックアップで上書きします。新プロットも上書きの対象です。'+(hasPlotV2?'':'\n（このバックアップには新プロットが含まれていないため、新プロットは空になります。）')+'\nよろしいですか？')) { e.target.value=''; return; }
      if(payload.images){
        for(const [id, url] of Object.entries(payload.images)){ await imageStorage.save(id, url); }
      }
      setData(migrateData(payload.data));
      // writingSnippets は新形式バックアップのみに含まれる。無い場合（旧バックアップ）は現在の辞書をそのまま維持する。
      if(payload.writingSnippets && Array.isArray(payload.writingSnippets.categories) && Array.isArray(payload.writingSnippets.snippets)){
        setWritingSnippets(normalizeWritingSnippets(payload.writingSnippets));
      }
      // expressionDictionary は新形式バックアップのみに含まれる。無い場合（旧バックアップ）は現在の辞典をそのまま維持する。
      if(payload.expressionDictionary && Array.isArray(payload.expressionDictionary.entries)){
        setExpressionDictionary(normalizeExpressionDictionary(payload.expressionDictionary));
      }
      // specialDictionary（小説語彙辞典）も同様に新形式バックアップのみに含まれる。無い場合（旧バックアップ）は現在の辞典をそのまま維持する。
      if(payload.specialDictionary && Array.isArray(payload.specialDictionary.entries)){
        setSpecialDictionary(normalizeSpecialDictionary(payload.specialDictionary));
      }
      // mediaDictionary（令和メディア語辞典）も同様に新形式バックアップのみに含まれる。無い場合（旧バックアップ）は現在の辞典をそのまま維持する。
      if(payload.mediaDictionary && Array.isArray(payload.mediaDictionary.entries)){

      if(payload.adultDictionary && Array.isArray(payload.adultDictionary.entries)){

      if(payload.adultPhraseRemix && Array.isArray(payload.adultPhraseRemix.parts)){

      if(payload.adultOnomatopoeia && Array.isArray(payload.adultOnomatopoeia.entries)){

    </div>;
  }

  useEffect(()=>{ setDetailId(null); setWritingFocusMode(false); setMoreMenuOpen(false); setHeightCompareOpen(false); }, [screen]);

  return (
    <div className="app">
      {!writingFocusMode && (
        <nav className="nav">
          <div className="brand">物語の机<small>小説制作・世界設定管理</small></div>
          {NAV_ITEMS.map(n=>(
            <button key={n.key} className={"nav-btn"+(screen===n.key && !query.trim() ?" active":"")} onClick={()=>navigateTo(n.key)}>
              <span>{n.icon}</span><span>{n.label}</span>
            </button>
          ))}
          <div className="spacer" />
          <button onClick={handleExport}>📤 バックアップ書き出し</button>
          <button onClick={()=>fileInputRef.current.click()}>📥 バックアップ読み込み</button>
          <button onClick={()=>setSyncOpen(true)}>☁️ クラウド同期</button>
          <input ref={fileInputRef} type="file" accept="application/json" style={{display:'none'}} onChange={handleImportFile} />
          <div className="nav-footer">ブラウザ内に自動保存されます</div>
        </nav>
      )}

      <div className="main">
        {!writingFocusMode && (
          <div className="topbar">
            <div className="titlebox">
              <input className="proj-title" value={data.project.title} onChange={e=>setData(d=>({...d, project:{...d.project, title:e.target.value}}))} />
            </div>
            <div className="searchbox">
              <input type="text" placeholder="作品内を検索…" value={query} onChange={e=>setQuery(e.target.value)} />
            </div>
            <span className="save-indicator">{saveState==='saving' ? '保存中…' : saveState==='error' ? '保存に失敗しました' : '保存済み'}</span>
          </div>
        )}
        <div className="content" style={writingFocusMode ? {padding:0, maxWidth:'none', margin:0} : undefined}>
          {!writingFocusMode && screen!=='dashboard' && screen!=='writing' && !detailId && !heightCompareOpen && !query.trim() && SCREEN_PARENT[screen] && (
            <div className="up-bar"><button type="button" className="up-bar-btn" onClick={()=>goUp()}>‹ {SCREEN_PARENT_LABEL[(navOriginRef.current&&navOriginRef.current.screen===screen)?navOriginRef.current.from:SCREEN_PARENT[screen]]||'ホーム'}へ戻る</button></div>
          )}
          {body}
        </div>
      </div>

      {!writingFocusMode && (
        <div className="bottom-tabs">
          {MOBILE_TAB_ITEMS.map(t=>{
            const isMore = t.key==='more';
            const active = !query.trim() && (
              isMore ? (isMoreScreen(screen) || moreMenuOpen) :
              t.key==='settingsHub' ? isSettingsScreen(screen) :
              screen===t.key
            );
            return (
              <button key={t.key} className={(active?"active":"")+(t.primary?" bottom-tab-primary":"")}
                onClick={()=>{
                  if(isMore){ setMoreMenuOpen(o=>!o); return; }
                  setMoreMenuOpen(false);
                  navigateTo(t.key);
                }}>
                <span className="bt-icon">{t.icon}</span><span className="bt-label">{t.label}</span>
              </button>
            );
          })}
        </div>
      )}

      {!writingFocusMode && moreMenuOpen && (
        <div className="more-menu-backdrop" onClick={()=>setMoreMenuOpen(false)}>
          <div className="more-menu-sheet" onClick={e=>e.stopPropagation()}>
            <div className="more-menu-head"><span>その他</span><button type="button" className="btn btn-sm btn-ghost" onClick={()=>setMoreMenuOpen(false)}>×</button></div>
            <div className="more-menu-list">
              {MORE_SCREEN_KEYS.map(key=>{
                const item = NAV_ITEMS.find(n=>n.key===key);
                if(!item) return null;
                return (
                  <button key={key} type="button" className="more-menu-item" onClick={()=>{ setMoreMenuOpen(false); navigateTo(key); }}>
                    <span>{item.icon}</span><span>{item.label}</span>
                  </button>
                );
              })}
              <div className="more-menu-sep" />
              <button type="button" className="more-menu-item" onClick={()=>{ setMoreMenuOpen(false); handleExport(); }}>📤 バックアップ書き出し</button>
              <button type="button" className="more-menu-item" onClick={()=>{ setMoreMenuOpen(false); fileInputRef.current.click(); }}>📥 バックアップ読み込み</button>
              <button type="button" className="more-menu-item" onClick={()=>{ setMoreMenuOpen(false); setSyncOpen(true); }}>☁️ クラウド同期</button>
            </div>
          </div>
        </div>
      )}
      {syncOpen&&<CloudSyncModal syncConfig={syncConfig} setSyncConfig={setSyncConfig} syncState={syncState} onConnect={connectCloud} onPull={pullCloud} onPush={()=>pushCloud(false)} onClose={()=>setSyncOpen(false)} />}
      {sceneFlowInsertTarget && (()=>{
        const liveDrafts = (data.drafts||[]).filter(d=>!d.deleted).slice().sort((a,b)=>new Date(b.updatedAt)-new Date(a.updatedAt));
        return (
          <Modal title="下書きへ挿入" onClose={()=>setSceneFlowInsertTarget(null)} wide>
            <p className="adult-tab-desc">「{sceneFlowInsertTarget.title}」をどの下書きへ挿入しますか？ 本文の末尾へ追記します。既存の下書きを上書きすることはありません。</p>
            <button className="btn btn-primary" onClick={()=>appendPlanToDraft(sceneFlowInsertTarget, null)} style={{marginBottom:10}}>＋ 新規下書きを作って挿入</button>
            {liveDrafts.length>0 && <div className="dict-list-head"><span>既存の下書きへ追記する</span></div>}
            {liveDrafts.map(d=>(
              <div className="writing-list-row" key={d.id} style={{cursor:'pointer'}} onClick={()=>appendPlanToDraft(sceneFlowInsertTarget, d.id)}>
                <div><strong>{d.title}</strong><small style={{display:'block'}}>{new Date(d.updatedAt).toLocaleString('ja-JP')}・{d.body.length}文字</small></div>
                <span>この下書きへ追記 →</span>
              </div>
            ))}
            <div className="modal-actions"><button className="btn" onClick={()=>setSceneFlowInsertTarget(null)}>キャンセル</button></div>
          </Modal>
        );
      })()}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
