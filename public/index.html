function StoryPatternLibrary({data,setData}){
  const patterns=data.patterns||[];
  const [query,setQuery]=useState(''),[category,setCategory]=useState('');
  const [selectedId,setSelectedId]=useState(patterns[0]&&patterns[0].id);
  const [draft,setDraft]=useState(null),[importOpen,setImportOpen]=useState(false),[importText,setImportText]=useState(''),[toast,setToast]=useState('');
  const fields=[['steps','基本の流れ'],['strengths','強み'],['pitfalls','注意点'],['examples','参考作品'],['tags','タグ']];
  const lines=a=>(a||[]).join('\n');
  const parseLines=s=>s.split(/\r?\n/).map(x=>x.trim()).filter(Boolean);
  const cats=Array.from(new Set(patterns.map(x=>x.category).filter(Boolean)));
  const q=query.trim().toLowerCase();
  const filtered=patterns.filter(p=>(!category||p.category===category)&&(!q||[p.name,p.core,p.category,...p.tags,...p.examples].join(' ').toLowerCase().includes(q)));
  const selected=filtered.find(x=>x.id===selectedId)||filtered[0];
  const showToast=m=>{setToast(m);setTimeout(()=>setToast(''),1400);};
  const editPattern=p=>setDraft({...p,steps:lines(p.steps),strengths:lines(p.strengths),pitfalls:lines(p.pitfalls),examples:lines(p.examples),tags:lines(p.tags)});
  const savePattern=()=>{
    if(!draft||!draft.name.trim())return;
    const name=draft.name.trim();
    if(patterns.some(p=>p.id!==draft.id&&p.name.trim()===name)){showToast('同じ名前のパターンがあります');return;}
    const updated={...draft,name,category:draft.category.trim()||'未分類',scale:draft.scale.trim(),core:draft.core.trim()};
    fields.forEach(([key])=>updated[key]=parseLines(draft[key]));
    setData(d=>({...d,patterns:d.patterns.some(p=>p.id===updated.id)?d.patterns.map(p=>p.id===updated.id?updated:p):[...d.patterns,updated]}));
    setSelectedId(updated.id);setCategory('');setQuery('');setDraft(null);
  };
  const deletePattern=()=>{
    if(!selected||!confirm(`「${selected.name}」を削除しますか？`))return;
    setData(d=>({...d,patterns:d.patterns.filter(p=>p.id!==selected.id)}));setSelectedId('');
  };
  const copyPattern=async()=>{if(!selected)return;const out=[`【${selected.name}】`,`${selected.category}／${selected.scale}`,selected.core,'','流れ',...selected.steps.map((x,i)=>`${i+1}. ${x}`),'','強み',...selected.strengths.map(x=>`・${x}`),'','注意点',...selected.pitfalls.map(x=>`・${x}`),'','参考作品：'+selected.examples.join('、')].join('\n');showToast(await copyPlainText(out)?'パターンをコピーしました':'コピーに失敗しました');};
  const check=useMemo(()=>{if(!importText.trim())return{error:'',valid:[]};try{const p=JSON.parse(importText);const rows=Array.isArray(p)?p:(p&&Array.isArray(p.patterns)?p.patterns:null);if(!rows)return{error:'配列または {"patterns": [...]} にしてください',valid:[]};const names=new Set(patterns.map(x=>x.name.trim()));const valid=[];rows.forEach(x=>{const name=String(x&&x.name||'').trim();if(name&&!names.has(name)){names.add(name);valid.push(normalizeStoryPatterns({patterns:[{...x,id:uid('pattern'),name}]}).patterns[0]);}});return{error:'',valid};}catch(e){return{error:'JSONの構文を確認してください',valid:[]};}},[importText,patterns]);
  const runImport=()=>{if(!check.valid.length)return;setData(d=>({...d,patterns:[...d.patterns,...check.valid]}));setImportOpen(false);setImportText('');};
  return <div><p className="adult-tab-desc">登場人物の出し方・一話の満足・長期構成を抽象化して眺める資料集です。</p>
    <div className="scene-flow-toolbar"><input value={query} onChange={e=>setQuery(e.target.value)} placeholder="構造・タグ・参考作品を検索"/><select value={category} onChange={e=>setCategory(e.target.value)}><option value="">全カテゴリ</option>{cats.map(x=><option key={x}>{x}</option>)}</select><button className="btn btn-primary" onClick={()=>editPattern(makeStoryPattern(uid('pattern'),'','','','',[],[],[],[],[]))}>＋ 新規</button><button className="btn" onClick={()=>setImportOpen(true)}>JSON追加</button></div>
    <div className="pattern-layout"><div><div className="dict-list-head"><span>パターン</span><span className="dict-list-count">{filtered.length}件</span></div><div className="pattern-grid">{filtered.map(p=><div key={p.id} className={'pattern-card'+(selected&&p.id===selected.id?' active':'')} onClick={()=>setSelectedId(p.id)}><div className="pattern-card-title">{p.name}</div><div className="onomatopoeia-badges"><span className="onomatopoeia-badge">{p.category}</span><span className="onomatopoeia-badge">{p.scale}</span></div><div className="pattern-card-core">{p.core}</div></div>)}</div></div>
    {selected?<div className="pattern-detail"><div className="toolbar"><div><h2 style={{margin:0}}>{selected.name}</h2><div className="adult-tab-desc">{selected.category}／{selected.scale}</div></div><div><button className="btn" onClick={()=>editPattern(selected)}>編集</button> <button className="btn btn-danger" onClick={deletePattern}>削除</button> <button className="btn btn-primary" onClick={copyPattern}>コピー</button></div></div><p style={{lineHeight:1.7}}>{selected.core}</p><h3>基本の流れ</h3><div className="pattern-step-list">{selected.steps.map((x,i)=><div className="pattern-step" key={i}>{x}</div>)}</div><div className="scene-meta-grid" style={{marginTop:14}}><div><h3>強み</h3>{selected.strengths.map((x,i)=><div className="adult-tab-desc" key={i}>・{x}</div>)}</div><div><h3>注意点</h3>{selected.pitfalls.map((x,i)=><div className="adult-tab-desc" key={i}>・{x}</div>)}</div></div><h3>参考作品</h3><div className="onomatopoeia-badges">{selected.examples.map(x=><span className="onomatopoeia-badge" key={x}>{x}</span>)}</div></div>:<div className="empty-hint">該当するパターンがありません。</div>}</div>
    {draft&&<Modal title={patterns.some(p=>p.id===draft.id)?'物語パターンを編集':'物語パターンを追加'} onClose={()=>setDraft(null)} wide><div className="scene-meta-grid"><div className="dict-field-block"><label className="dict-field-label">名前（必須）</label><input value={draft.name} onChange={e=>setDraft(d=>({...d,name:e.target.value}))}/></div><div className="dict-field-block"><label className="dict-field-label">分類</label><input value={draft.category} onChange={e=>setDraft(d=>({...d,category:e.target.value}))}/></div><div className="dict-field-block"><label className="dict-field-label">規模</label><input value={draft.scale} onChange={e=>setDraft(d=>({...d,scale:e.target.value}))}/></div><div className="dict-field-block span-all"><label className="dict-field-label">構造の要約</label><textarea rows="3" value={draft.core} onChange={e=>setDraft(d=>({...d,core:e.target.value}))}/></div>{fields.map(([key,label])=><div className="dict-field-block span-all" key={key}><label className="dict-field-label">{label}（1行に1件）</label><textarea rows={key==='steps'?6:3} value={draft[key]} onChange={e=>setDraft(d=>({...d,[key]:e.target.value}))}/></div>)}</div><div className="modal-actions"><button className="btn" onClick={()=>setDraft(null)}>キャンセル</button><button className="btn btn-primary" disabled={!draft.name.trim()} onClick={savePattern}>保存</button></div></Modal>}
    {importOpen&&<Modal title="物語パターンJSON追加" onClose={()=>setImportOpen(false)} wide><p className="adult-tab-desc">name、category、scale、core、steps、strengths、pitfalls、examples、tags を使えます。同名はスキップします。</p><textarea rows="14" style={{width:'100%',fontFamily:'ui-monospace,monospace'}} value={importText} onChange={e=>setImportText(e.target.value)} placeholder={'{"patterns":[{"name":"新しい型","category":"冒険","scale":"長編","core":"構造の要約","steps":["開始","転換","決着"],"strengths":[],"pitfalls":[],"examples":[],"tags":[]}]}'}/>{check.error&&<div className="empty-hint" style={{color:'var(--danger)'}}>{check.error}</div>}<div className="modal-actions"><button className="btn" onClick={()=>setImportOpen(false)}>キャンセル</button><button className="btn btn-primary" disabled={!!check.error||!check.valid.length} onClick={runImport}>{check.valid.length}件を追加</button></div></Modal>}{toast&&<div className="expr-dict-toast" style={{position:'fixed',bottom:'76px'}}>{toast}</div>}</div>;
}

// ---- 表現辞典タブ：概念一覧（検索・カテゴリフィルタ）→ 概念詳細（＋表現の件数カード）→ 表現詳細、の3階層。
//      新規概念は概念名確定まで、新規表現はテキスト確定まで、それぞれadultDictionaryへは書き込まない。 ----
function AdultExpressionDictionaryTab({ adultDictionary, setAdultDictionary }){
  const entries = adultDictionary.entries || [];
  const [view, setView] = useState('list'); // 'list' | 'concept' | 'expression'
  const [query, setQuery] = useState('');
  const [categoryFilter, setCategoryFilter] = useState('');
  const [editingConceptId, setEditingConceptId] = useState(null);
  const [draftConcept, setDraftConcept] = useState(null);
  const [editingExprId, setEditingExprId] = useState(null);
  const [draftExpr, setDraftExpr] = useState(null);
  const [importOpen, setImportOpen] = useState(false);
  const [lastImportIds, setLastImportIds] = useState(null);

  const categoryOptions = useMemo(()=>{
    const set = new Set();
    entries.forEach(e=>{ if(e.category) set.add(e.category); });
    return Array.from(set);
  }, [entries]);

  const q = query.trim().toLowerCase();
  const matchConcept = (entry) => {
    if(categoryFilter && entry.category!==categoryFilter) return false;
    if(!q) return true;
    if((entry.concept||'').toLowerCase().includes(q)) return true;
    if((entry.category||'').toLowerCase().includes(q)) return true;
    if((entry.aliases||[]).some(a=>(a||'').toLowerCase().includes(q))) return true;
    if((entry.tags||[]).some(t=>(t||'').toLowerCase().includes(q))) return true;
    if((entry.expressions||[]).some(x=>(x.text||'').toLowerCase().includes(q))) return true;
    return false;
  };
  const filteredEntries = entries.filter(matchConcept);

  const isNewConcept = !!draftConcept && !editingConceptId;
  const currentConcept = editingConceptId ? entries.find(e=>e.id===editingConceptId) : draftConcept;

  const updateConcept = (patch) => {
    if(isNewConcept){
      setDraftConcept(d=>({ ...d, ...patch }));
    }else if(editingConceptId){
      setAdultDictionary(ad=>({ ...ad, entries: ad.entries.map(e=>e.id===editingConceptId?{...e,...patch}:e) }));
    }
  };

  const openNewConcept = () => {
    setDraftConcept({ id: uid('adultc'), concept:'', category:'', aliases:[], tags:[], expressions:[] });
    setEditingConceptId(null);
    setView('concept');
  };
  const openConcept = (id) => { setEditingConceptId(id); setDraftConcept(null); setView('concept'); };

  const backToList = () => {
    if(isNewConcept){
      const concept = (draftConcept.concept||'').trim();
      if(concept){
        setAdultDictionary(ad=>({ ...ad, entries: [...ad.entries, { ...draftConcept, concept }] }));
      }
      setDraftConcept(null);
    }
    setEditingConceptId(null);
    setView('list');
  };

  const deleteConcept = (id) => {
    if(!confirm('この概念を削除しますか？登録済みの表現もすべて削除されます。')) return;
    setAdultDictionary(ad=>({ ...ad, entries: ad.entries.filter(e=>e.id!==id) }));
    setEditingConceptId(null);
    setView('list');
  };

  // ---- 表現CRUD：新規はdraftExpr（未保存）、既存は概念（draft or 保存済み）へ直接反映 ----
  const openNewExpr = () => {
    setDraftExpr({ text:'', directness:3, eroticism:3, vulgarity:3, literary:3, perspective:'両方', note:'' });
    setEditingExprId(null);
    setView('expression');
  };
  const openExpr = (id) => { setEditingExprId(id); setDraftExpr(null); setView('expression'); };

  const isNewExpr = !!draftExpr && !editingExprId;
  const currentExpr = isNewExpr ? draftExpr : (editingExprId && currentConcept ? (currentConcept.expressions||[]).find(x=>x.id===editingExprId) : null);

  const updateExprField = (patch) => {
    if(isNewExpr){
      setDraftExpr(x=>({ ...x, ...patch }));
    }else if(editingExprId && editingConceptId){
      setAdultDictionary(ad=>({ ...ad, entries: ad.entries.map(e=>e.id===editingConceptId
        ? { ...e, expressions: (e.expressions||[]).map(x=>x.id===editingExprId?{...x,...patch}:x) } : e) }));
    }else if(editingExprId && isNewConcept){
      setDraftConcept(d=>({ ...d, expressions: (d.expressions||[]).map(x=>x.id===editingExprId?{...x,...patch}:x) }));
    }
  };

  const backToConcept = () => {
    if(isNewExpr){
      const text = (draftExpr.text||'').trim();
      if(text){
        const newExpr = { ...draftExpr, id: uid('adultex'), text };
        if(isNewConcept){
          setDraftConcept(d=>({ ...d, expressions: [...(d.expressions||[]), newExpr] }));
        }else if(editingConceptId){
          setAdultDictionary(ad=>({ ...ad, entries: ad.entries.map(e=>e.id===editingConceptId
            ? { ...e, expressions: [...(e.expressions||[]), newExpr] } : e) }));
        }
      }
      setDraftExpr(null);
    }
    setEditingExprId(null);
    setView('concept');
  };

  const deleteExpr = (id) => {
    if(!confirm('この表現を削除しますか？')) return;
    if(isNewConcept){
      setDraftConcept(d=>({ ...d, expressions: (d.expressions||[]).filter(x=>x.id!==id) }));
    }else if(editingConceptId){
      setAdultDictionary(ad=>({ ...ad, entries: ad.entries.map(e=>e.id===editingConceptId
        ? { ...e, expressions: (e.expressions||[]).filter(x=>x.id!==id) } : e) }));
    }
    setEditingExprId(null);
    setView('concept');
  };

  // 概念が他操作で削除された等で参照が消えていたら一覧へ戻す
  if(view!=='list' && !currentConcept){
    return (
      <div>
        <div className="empty-hint">この概念は削除されました。</div>
        <div className="modal-actions"><button className="btn btn-primary" onClick={()=>{ setView('list'); setEditingConceptId(null); setDraftConcept(null); }}>← 一覧へ戻る</button></div>
      </div>
    );
  }

  if(view==='expression'){
    if(!currentExpr){
      return (
        <div>
          <div className="empty-hint">この表現は削除されました。</div>
          <div className="modal-actions"><button className="btn btn-primary" onClick={backToConcept}>← 戻る</button></div>
        </div>
      );
    }
    return (
      <div>
        <div className="breadcrumb"><button onClick={backToConcept}>← {currentConcept.concept || '概念'}</button></div>
        <div className="dict-detail-title">{isNewExpr ? '表現を追加' : '表現を編集'}</div>
        <div className="dict-field-block">
          <label className="dict-field-label">表現</label>
          <input type="text" value={currentExpr.text} onChange={e=>updateExprField({text:e.target.value})} placeholder="具体的な言い回し" />
        </div>

        <RatingField label="官能度" value={currentExpr.eroticism} onChange={v=>updateExprField({eroticism:v})} />
        <RatingField label="俗度" value={currentExpr.vulgarity} onChange={v=>updateExprField({vulgarity:v})} />

            {ADULT_PERSPECTIVE_VALUES.map(p=>(

          <div className="modal-actions"><button className="btn btn-primary" onClick={backToConcept} disabled={!currentExpr.text.trim()}>追加して戻る</button></div>
        ) : (
          <>
            <div className="dict-danger-zone">
              <button className="btn btn-sm btn-danger" onClick={()=>deleteExpr(currentExpr.id)}>この表現を削除</button>
            </div>
            <div className="modal-actions"><button className="btn btn-primary" onClick={backToConcept}>← 戻る</button></div>
          </>
        )}
      </div>
    );
  }

  if(view==='concept'){
    return (
      <div>
        <div className="breadcrumb"><button onClick={backToList}>← 表現辞典一覧</button></div>
        <div className="dict-detail-title">{currentConcept.concept || '（無題）'}</div>
        <div className="dict-field-block">
          <label className="dict-field-label">概念（何を表現したいか）</label>
          <input type="text" value={currentConcept.concept} onChange={e=>updateConcept({concept:e.target.value})} placeholder="例：絶頂の描写" />
        </div>
        <div className="dict-field-block">
          <label className="dict-field-label">カテゴリ</label>
          <input type="text" list="adult-dict-category-list" value={currentConcept.category} onChange={e=>updateConcept({category:e.target.value})} placeholder="自由入力（例：身体 / 動作 / 反応 / 発声 / 心理）" />
        </div>
        <div className="dict-field-block">
          <label className="dict-field-label">別名</label>
          <ChipListEditor values={currentConcept.aliases} onChange={vals=>updateConcept({aliases:vals})} placeholder="別名を入力してEnter" />
        </div>
        <div className="dict-field-block">
          <label className="dict-field-label">タグ</label>
          <ChipListEditor values={currentConcept.tags} onChange={vals=>updateConcept({tags:vals})} placeholder="タグを入力してEnter" />
        </div>

        <div className="dict-list-head"><span>表現</span><span className="dict-list-count">{(currentConcept.expressions||[]).length}件</span></div>
        {(currentConcept.expressions||[]).length===0 && <div className="empty-hint">まだ表現がありません。</div>}
        <div className="dict-card-list">
          {(currentConcept.expressions||[]).map(x=>(
            <div className="dict-card dict-expr-card" key={x.id} onClick={()=>openExpr(x.id)}>
              <div className="dict-card-body">
                <div className="dict-expr-card-text">{x.text}</div>
                <AdultRatingBadges x={x} />
                {x.note && <div className="dict-expr-card-note">{x.note}</div>}
              </div>
              <span className="dict-card-chevron">＞</span>
            </div>
          ))}
        </div>
        <button type="button" className="btn btn-sm btn-primary dict-add-btn" onClick={openNewExpr}>＋ 表現を追加</button>

        {!isNewConcept && (
          <div className="dict-danger-zone">
            <button className="btn btn-sm btn-danger" onClick={()=>deleteConcept(currentConcept.id)}>この概念を削除</button>
          </div>
        )}
        <div className="modal-actions"><button className="btn btn-primary" onClick={backToList}>← 一覧へ戻る</button></div>

        <datalist id="adult-dict-category-list">
          {ADULT_CATEGORY_SUGGESTIONS.concat(categoryOptions).filter((c,i,arr)=>arr.indexOf(c)===i).map(c=>(<option value={c} key={c} />))}
        </datalist>
      </div>
    );
  }

  // ==== view==='list' ====
  return (
    <div>
      <div className="dict-search-row">
        <input type="text" placeholder="🔎 概念・表現を検索……" value={query} onChange={e=>setQuery(e.target.value)} />
      </div>
      <div className="dict-cat-tabs" style={{marginBottom:10}}>
        <button type="button" className={"dict-cat-tab"+(categoryFilter===''?' active':'')} onClick={()=>setCategoryFilter('')}>すべて</button>
        {categoryOptions.map(c=>(
          <button key={c} type="button" className={"dict-cat-tab"+(categoryFilter===c?' active':'')} onClick={()=>setCategoryFilter(c)}>{c}</button>
        ))}
      </div>
      {entries.length===0 && <div className="empty-hint">まだ概念が登録されていません。「＋ 概念を追加」から追加できます。</div>}
      {entries.length>0 && filteredEntries.length===0 && <div className="empty-hint">一致する概念が見つかりません。</div>}
      <div className="dict-card-list">
        {filteredEntries.map(entry=>(
          <div className="dict-card dict-headword-card" key={entry.id} onClick={()=>openConcept(entry.id)}>
            <div className="dict-card-body">
              <div className="dict-headword-card-top">
                <span className="dict-card-title">{entry.concept || '（無題）'}</span>
                {entry.category && <span className="dict-headword-card-cat">{entry.category}</span>}
              </div>
              {(entry.aliases||[]).length>0 && <div className="dict-headword-card-aliases">{entry.aliases.join('・')}</div>}
              <div className="dict-headword-card-count">表現 {(entry.expressions||[]).length}件</div>

        <div className="dict-undo-row">
          <button type="button" className="btn btn-sm" onClick={()=>{
            setAdultDictionary(ad => normalizeAdultDictionary({ entries: ad.entries.filter(e=>!lastImportIds.includes(e.id)) }));

        <AdultDictionaryImportModal

// ---- 成人向け表現：JSON一括登録モーダル。他辞典と同じ「貼り付け→解析→プレビュー→登録」の2段階フロー。
//      重複判定は概念名（concept）で行う。既存entryは一切書き換えない。 ----
function AdultDictionaryImportModal({ adultDictionary, setAdultDictionary, setLastImportIds, onClose }){
  const [jsonText, setJsonText] = useState('');
  const [step, setStep] = useState('input');
  const [parseError, setParseError] = useState('');
  const [previewItems, setPreviewItems] = useState([]);
  const [copyToast, setCopyToast] = useState('');

  const entries = adultDictionary.entries || [];

  const copyTemplate = async () => {
    const ok = await copyPlainText(ADULT_DICTIONARY_IMPORT_TEMPLATE);
    setCopyToast(ok ? 'コピーしました' : 'コピーに失敗しました');
    setTimeout(()=>setCopyToast(''), 1400);
  };

  const handleCheck = () => {
    setParseError('');
    let parsed;
    try{
      parsed = JSON.parse(jsonText);
    }catch(e){
      setParseError('JSONを解析できませんでした。カンマや括弧を確認してください。');
      return;
    }
    if(!parsed || typeof parsed!=='object' || Array.isArray(parsed) || !Array.isArray(parsed.entries)){
      setParseError('形式が違います。{ "entries": [...] } の形で貼り付けてください。');
      return;
    }
    const existingConcepts = new Set(entries.map(e=>(e.concept||'').trim()).filter(Boolean));
    const seenInBatch = new Set();
    const items = parsed.entries.map((raw, idx) => {
      if(raw===null || typeof raw!=='object' || Array.isArray(raw)){
        return { key:'row-'+idx, kind:'error', message:`${idx+1}件目：項目形式が不正です` };
      }
      const concept = String(raw.concept==null ? '' : raw.concept).trim();
      if(!concept){
        return { key:'row-'+idx, kind:'error', message:`${idx+1}件目：conceptが空です` };
      }
      const normalized = normalizeImportedAdultEntry(raw);
      const isDup = existingConcepts.has(concept) || seenInBatch.has(concept);
      seenInBatch.add(concept);
      return { key:'row-'+idx, kind: isDup ? 'duplicate' : 'new', entry: normalized, checked: !isDup };
    });
    setPreviewItems(items);
    setStep('preview');
  };

  const toggleChecked = (key) => {
    setPreviewItems(items => items.map(it => (it.key===key && it.kind==='new') ? { ...it, checked: !it.checked } : it));
  };

  const newCount = previewItems.filter(i=>i.kind==='new').length;
  const dupCount = previewItems.filter(i=>i.kind==='duplicate').length;
  const errCount = previewItems.filter(i=>i.kind==='error').length;
  const checkedCount = previewItems.filter(i=>i.kind==='new' && i.checked).length;

  const backToInput = () => { setStep('input'); setPreviewItems([]); setParseError(''); };

  const commitImport = () => {
    const toAdd = previewItems
      .filter(i => i.kind==='new' && i.checked)
      .map(i => ({
        ...i.entry,
        id: uid('adultc'),
        expressions: i.entry.expressions.map(x => ({ ...x, id: uid('adultex') })),
      }));
    if(toAdd.length===0) return;
    setAdultDictionary(ad => normalizeAdultDictionary({ entries: [...ad.entries, ...toAdd] }));
    setLastImportIds(toAdd.map(e=>e.id));
    const count = toAdd.length;
    setJsonText('');
    setPreviewItems([]);
    setStep('input');
    onClose();
    alert(`${count}件の概念を登録しました。`);
  };

  return (
    <Modal title="成人向け表現をJSONで一括登録" onClose={onClose} dict>
      <div className="special-import-desc">ChatGPTやClaude等で作成したJSON（概念＋表現）を貼り付けて、一括登録できます。</div>
      {step==='input' && (
        <>
          <div style={{marginBottom:10}}>
            <button type="button" className="btn btn-sm" onClick={copyTemplate}>JSON形式をコピー</button>
            {copyToast && <span className="special-import-copy-toast">{copyToast}</span>}
          </div>
          <textarea className="special-import-textarea" value={jsonText} onChange={e=>setJsonText(e.target.value)}
            placeholder={'{ "entries": [ { "concept": "……", "expressions": [ { "text": "……" } ] } ] }'} />
          {parseError && <div className="special-import-error">{parseError}</div>}
          <div className="modal-actions">
            <button type="button" className="btn btn-primary" onClick={handleCheck} disabled={!jsonText.trim()}>内容を確認</button>
            <button type="button" className="btn" onClick={onClose}>閉じる</button>
          </div>
        </>
      )}
      {step==='preview' && (
        <>
          <div className="special-import-summary">
            <span className="cnt-new">新規 {newCount}件</span>
            <span className="cnt-dup">重複 {dupCount}件</span>
            <span className="cnt-err">エラー {errCount}件</span>
          </div>
          <div className="special-import-preview-list">
            {previewItems.map(item=>{
              if(item.kind==='error'){
                return <div key={item.key} className="special-import-row-error">⚠ {item.message}</div>;
              }
              const isDup = item.kind==='duplicate';
              return (
                <label key={item.key} className={"special-import-row "+item.kind+(isDup?' disabled':'')}>
                  <input type="checkbox" checked={isDup ? false : item.checked} disabled={isDup} onChange={()=>toggleChecked(item.key)} />
                  <div className="special-import-row-body">
                    <div className="special-import-row-title">{item.entry.concept}</div>
                    {item.entry.category && <div className="special-import-row-sub">カテゴリ：{item.entry.category}</div>}
                    <div className="special-import-row-sub">表現 {item.entry.expressions.length}件</div>
                    <div className="special-import-row-status">
                      {item.kind==='new' ? '新規' : '重複：同じ概念名がすでに存在するためスキップ'}
                    </div>
                  </div>
                </label>
              );
            })}
          </div>
          <div className="modal-actions">
            <button type="button" className="btn" onClick={backToInput}>← 貼り付けに戻る</button>
            <button type="button" className="btn btn-primary" onClick={commitImport} disabled={checkedCount===0}>選択した{checkedCount}件を登録</button>
          </div>
        </>
      )}
    </Modal>
  );
}

// ---- トーン検索タブ：直接度／官能度／俗度／文芸度＋視点の条件を指定し、登録済み表現の中から近いものを提示する。
//      AIによる自動生成は今回未実装（一致度＝各ratingとの差の絶対値の合計。小さいほど近い）。 ----
function AdultRemixTab({ adultDictionary }){
  const entries = adultDictionary.entries || [];
  const allExpressions = useMemo(()=>{
    const out = [];
    entries.forEach(e=>{
      (e.expressions||[]).forEach(x=>{
        out.push({ ...x, conceptId:e.id, concept:e.concept, category:e.category });
      });
    });
    return out;
  }, [entries]);

  const [sourceText, setSourceText] = useState('');
  const [directness, setDirectness] = useState(3);
  const [eroticism, setEroticism] = useState(3);
  const [vulgarity, setVulgarity] = useState(3);
  const [literary, setLiterary] = useState(3);
  const [perspectiveFilter, setPerspectiveFilter] = useState('');
  const [toast, setToast] = useState('');
  const toastTimerRef = useRef(null);

  useEffect(()=>()=>{ if(toastTimerRef.current) clearTimeout(toastTimerRef.current); }, []);
  const showToast = (msg) => {
    setToast(msg);
    if(toastTimerRef.current) clearTimeout(toastTimerRef.current);
    toastTimerRef.current = setTimeout(()=>setToast(''), 1400);
  };
  const copyText = async (text) => {
    const ok = await copyPlainText(text);
    showToast(ok ? `「${text}」をコピーしました` : 'コピーに失敗しました');
  };

  const scored = useMemo(()=>{
    return allExpressions
      .filter(x => !perspectiveFilter || x.perspective===perspectiveFilter)
      .map(x => ({ ...x, score:
        Math.abs(x.directness-directness) + Math.abs(x.eroticism-eroticism) +
        Math.abs(x.vulgarity-vulgarity) + Math.abs(x.literary-literary) }))
      .sort((a,b)=>a.score-b.score)
      .slice(0, 30);
  }, [allExpressions, directness, eroticism, vulgarity, literary, perspectiveFilter]);

  return (
    <div className="adult-remix-tab">
      <p className="adult-tab-desc">
        「下品すぎる」と「文芸的すぎる」の間の、ちょうどいい温度の表現を絞り込みます。
        AIによる自動生成は今回未実装のため、「表現辞典」に登録済みの表現の中から条件の近いものを提示します。
      </p>
      <div className="dict-field-block">
        <label className="dict-field-label">元の表現（メモ用。検索には使用しません）</label>
        <input type="text" value={sourceText} onChange={e=>setSourceText(e.target.value)} placeholder="調整したい元の表現があれば入力" />
      </div>
      <RatingField label="直接度" value={directness} onChange={setDirectness} />
      <RatingField label="官能度" value={eroticism} onChange={setEroticism} />
      <RatingField label="俗度" value={vulgarity} onChange={setVulgarity} />
      <RatingField label="文芸度" value={literary} onChange={setLiterary} />
      <div className="dict-field-block">
        <label className="dict-field-label">視点で絞り込み</label>
        <div className="adult-perspective-group">
          <button type="button" className={"rating-btn"+(perspectiveFilter===''?' active':'')} style={{width:'auto', padding:'0 14px'}} onClick={()=>setPerspectiveFilter('')}>すべて</button>
          {ADULT_PERSPECTIVE_VALUES.map(p=>(
            <button key={p} type="button" className={"rating-btn"+(perspectiveFilter===p?' active':'')} style={{width:'auto', padding:'0 14px'}} onClick={()=>setPerspectiveFilter(p)}>{p}</button>
          ))}
        </div>
      </div>

      <div className="dict-list-head"><span>条件に近い表現</span><span className="dict-list-count">{scored.length}件</span></div>
      {allExpressions.length===0 && <div className="empty-hint">まだ「表現辞典」に成人向け表現が登録されていません。先に表現辞典タブから登録してください。</div>}
      {allExpressions.length>0 && scored.length===0 && <div className="empty-hint">条件に一致する表現が見つかりません。</div>}
      <div className="dict-card-list">
        {scored.map(x=>(
          <div className="dict-card dict-expr-card" key={x.id}>
            <div className="dict-card-body">
              <div className="dict-expr-card-text">{x.text}</div>
              <div className="dict-card-sub">{x.concept}{x.category?`（${x.category}）`:''}</div>
              <AdultRatingBadges x={x} />
              {x.note && <div className="dict-expr-card-note">{x.note}</div>}
            </div>
            <button type="button" className="btn btn-sm btn-primary" onClick={()=>copyText(x.text)}>コピー</button>
          </div>
        ))}
      </div>
      {toast && <div className="expr-dict-toast" style={{position:'fixed', bottom:'76px'}}>{toast}</div>}
    </div>
  );
}

// ---- シーン進行：段階別の材料を見ながら「今回の流れ」を組む。 ----
function AdultSceneFlowTab({appData,setAppData,data,setData,onInsertToDraft}){

  // 既存の段階別材料ライブラリ（phases/items/selectedItemIds）はデータ・機能とも削除せず、

  const [view,setView]=useState('plans'); // 'plans'（共通シーン進行・成人向け） | 'library'（既存：段階別材料ライブラリ）

}

// ---- 進行表（採用仕様）：行為カードを自由に追加・並べ替え・繰り返し・削除できる道具。
//      開始・終了の位置は固定しない。カードは名称＋短いメモのみ。心情等はカードごとに必須にしない。
//      シーン全体には任意入力の「行為前の状態」「行為後の状態」だけを置ける。複数保存し、下書きから参照できる。 ----
// ---- シーン進行（共通）：行為カードを自由に追加・並べ替え・繰り返し・削除できる道具。
//      開始・終了の位置は固定しない。カードは短い見出し＋自由記述メモのみ。心情はカードごとに必須にしない。
//      シーン全体には任意入力の「開始前の状態」「終了後の状態」だけを置ける。複数保存し、下書きから参照・挿入できる。
//      全年齢・成人向けはkind('general'|'adult')で区別するだけで、データ構造・操作方法は完全に同じ。
//      data/setDataはアプリ本体のトップレベルdata（sceneFlowPlansを持つ）を受け取る。
function SceneFlowPlansEditor({data,setData,kindFilter,defaultKind,allowKindSwitch,adultLibrary,onInsertToDraft,insertLabel,initialActiveId,onActiveChange}){
  const allPlans = data.sceneFlowPlans||[];
  const plans = kindFilter && kindFilter!=='all' ? allPlans.filter(p=>p.kind===kindFilter) : allPlans;
  const [activeId,setActiveId]=useState((initialActiveId && plans.some(p=>p.id===initialActiveId)) ? initialActiveId : (plans[0]?plans[0].id:''));
  const active = allPlans.find(p=>p.id===activeId) || plans[0] || null;
  useEffect(()=>{ if(onActiveChange && active) onActiveChange(active.id); },[active&&active.id]); // 親（執筆画面）と選択中プランを共有する
  const [cardDraft,setCardDraft]=useState(null); // {cardId, name, memo}
  const [candidateOpen,setCandidateOpen]=useState(false);
  const [candidateQuery,setCandidateQuery]=useState('');
  const [toast,setToast]=useState(''); const toastTimerRef=useRef(null);
  useEffect(()=>()=>{if(toastTimerRef.current)clearTimeout(toastTimerRef.current);},[]);
  const showToast=msg=>{setToast(msg);if(toastTimerRef.current)clearTimeout(toastTimerRef.current);toastTimerRef.current=setTimeout(()=>setToast(''),1400);};

  const setActivePlanId=id=>setActiveId(id);
  const addPlan=()=>{
    const p=makeFlowPlan(`シーン進行${allPlans.length+1}`, defaultKind||'general');
    setData(d=>({...d,sceneFlowPlans:[...(d.sceneFlowPlans||[]),p]}));
    setActiveId(p.id);
  };
  const patchActivePlan=patch=>setData(d=>({...d,sceneFlowPlans:d.sceneFlowPlans.map(p=>p.id===(active&&active.id)?{...p,...patch}:p)}));
  const deletePlan=()=>{
    if(!active||!confirm(`「${active.title||'このシーン進行'}」を削除しますか？`))return;
    setData(d=>({...d,sceneFlowPlans:d.sceneFlowPlans.filter(p=>p.id!==active.id)}));
    setActiveId('');
  };
  const duplicatePlan=()=>{
    if(!active)return;
    const copy={...active,id:uid('flowplan'),title:active.title+'（複製）',cards:active.cards.map(c=>({...c,id:uid('flowcard')}))};
    setData(d=>({...d,sceneFlowPlans:[...d.sceneFlowPlans,copy]}));
    setActiveId(copy.id);
  };

  // カードは追加した時点でそのまま一覧に並ぶ（＝繰り返し追加が自由）。見出し・メモはタップして後から入力できる。
  const addCard=()=>{ if(!active)return; patchActivePlan({cards:[...active.cards,makeFlowCard('','')]}); };
  const openCard=c=>setCardDraft({cardId:c.id,name:c.name,memo:c.memo});
  const saveCard=()=>{
    if(!cardDraft||!active)return;
    patchActivePlan({cards:active.cards.map(c=>c.id===cardDraft.cardId?{...c,name:cardDraft.name,memo:cardDraft.memo}:c)});
    setCardDraft(null);
  };
  const deleteCard=cardId=>{
    if(!active||!confirm('このカードを削除しますか？'))return;
    patchActivePlan({cards:active.cards.filter(c=>c.id!==cardId)});
    if(cardDraft&&cardDraft.cardId===cardId)setCardDraft(null);
  };
  // 「繰り返し」＝同じカードをもう1枚、直後に複製する（何度使ってもよい）
  const duplicateCard=i=>{
    if(!active)return;
    const c=active.cards[i];
    const copy={...c,id:uid('flowcard')};
    const next=[...active.cards];next.splice(i+1,0,copy);
    patchActivePlan({cards:next});
  };
  const moveCard=(i,delta)=>{
    if(!active)return;
    const next=[...active.cards],to=i+delta;
    if(to<0||to>=next.length)return;
    [next[i],next[to]]=[next[to],next[i]];
    patchActivePlan({cards:next});
  };
  const copyPlan=async()=>{
    if(!active)return;
    const ok=await copyPlainText(formatSceneFlowPlanForInsert(active));
    showToast(ok?'シーン進行をコピーしました':'コピーに失敗しました');
  };
  const insertPlan=()=>{
    if(!active||!onInsertToDraft)return;
    onInsertToDraft(active);
  };

  // 成人向け候補（adultSceneFlow.items、既存データ）からカード名・メモへ取り込む。adult系プランのみ。
  const candidateItems = (adultLibrary&&adultLibrary.items)||[];
  const candidatePhaseName = id=>((adultLibrary&&adultLibrary.phases)||[]).find(p=>p.id===id)?.name||'';
  const q=candidateQuery.trim().toLowerCase();
  const filteredCandidates = candidateItems.filter(x=>!q||[x.text,x.note,candidatePhaseName(x.phaseId)].join(' ').toLowerCase().includes(q));
  const pickCandidate=(item)=>{
    setCardDraft(d=>({...d,name:item.text,memo:item.note||d.memo}));
    setCandidateOpen(false);
  };

  return <div>
    <p className="adult-tab-desc">「開始→最中→終了」の決まった順番はありません。行為カードを自由に追加し、好きな順に並べ替え・繰り返し・削除できます。開始・終了を必須にはしません。下書きの「シーン進行」からすぐ開いて、そのまま下書きへ挿入できます。</p>
    <div className="scene-workspace">
      <aside className="scene-list-panel">
        <div className="dict-list-head"><span>シーン進行</span><button type="button" className="btn btn-sm btn-primary" onClick={addPlan}>＋</button></div>
        <div className="scene-list">
          {plans.map(p=>(
            <button key={p.id} type="button" className={'scene-list-item'+(active&&active.id===p.id?' active':'')} onClick={()=>setActivePlanId(p.id)}>
              <div className="scene-list-title">{p.title||'無題のシーン進行'}{p.kind==='adult'&&<span className="expr-dict-tag" style={{marginLeft:6}}>成人向け</span>}</div>
              <div className="scene-list-sub">{p.cards.length}枚</div>
            </button>
          ))}
          {!plans.length && <div className="empty-hint">「＋」から作成できます。</div>}
        </div>
      </aside>
      <section className="scene-editor-panel">
        {!active ? <div className="empty-hint">左の「＋」からシーン進行を作成してください。</div> : <>
          <div className="dict-field-block span-all"><label className="dict-field-label">シーン名</label><input value={active.title} onChange={e=>patchActivePlan({title:e.target.value})}/></div>
          {allowKindSwitch && <div className="dict-field-block span-all">
            <label className="dict-field-label">種類</label>
            <div className="toolbar" style={{gap:6}}>
              <button type="button" className={'btn btn-sm'+(active.kind==='general'?' btn-primary':'')} onClick={()=>patchActivePlan({kind:'general'})}>通常</button>
              <button type="button" className={'btn btn-sm'+(active.kind==='adult'?' btn-primary':'')} onClick={()=>patchActivePlan({kind:'adult'})}>成人向け</button>
            </div>
          </div>}
          <div className="scene-meta-grid">
            <div className="dict-field-block"><label className="dict-field-label">開始前の状態（任意）</label><textarea rows="2" value={active.beforeState} onChange={e=>patchActivePlan({beforeState:e.target.value})} placeholder="必要な場合だけ書く"/></div>
            <div className="dict-field-block"><label className="dict-field-label">終了後の状態（任意）</label><textarea rows="2" value={active.afterState} onChange={e=>patchActivePlan({afterState:e.target.value})} placeholder="必要な場合だけ書く"/></div>
          </div>
          <div className="dict-list-head" style={{marginTop:14}}><span>進行カード</span><span className="dict-list-count">{active.cards.length}枚</span></div>
          <button type="button" className="writing-block-insert" onClick={addCard}>＋ カードを追加</button>
          <div className="scene-flow-plan-list" style={{marginTop:8}}>
            {active.cards.map((c,i)=>(
              <div className="scene-flow-plan-row" key={c.id}>
                <span className="scene-flow-plan-num">{i+1}</span>
                <button type="button" className="scene-flow-plan-main writing-block-select" onClick={()=>openCard(c)}>
                  <strong>{c.name||'（無題のカード）'}</strong>
                  {c.memo && <span>{c.memo}</span>}
                </button>
                <div className="scene-flow-plan-buttons">
                  <button type="button" onClick={()=>moveCard(i,-1)} disabled={i===0} aria-label="上へ移動">↑</button>
                  <button type="button" onClick={()=>moveCard(i,1)} disabled={i===active.cards.length-1} aria-label="下へ移動">↓</button>
                  <button type="button" onClick={()=>duplicateCard(i)} aria-label="このカードを繰り返す">繰り返す</button>
                  <button type="button" onClick={()=>deleteCard(c.id)} aria-label="カードを削除">×</button>
                </div>
              </div>
            ))}
            {!active.cards.length && <div className="empty-hint">まだカードがありません。「＋ カードを追加」から始めます。</div>}
          </div>
          <div className="modal-actions" style={{justifyContent:'space-between',paddingBottom:0,marginTop:10,flexWrap:'wrap',gap:8}}>
            <div><button type="button" className="btn btn-danger" onClick={deletePlan}>削除</button></div>
            <div style={{display:'flex',gap:6,flexWrap:'wrap'}}>
              <button type="button" className="btn" onClick={duplicatePlan}>複製</button>
              <button type="button" className="btn" onClick={copyPlan}>コピー</button>
              {onInsertToDraft && <button type="button" className="btn btn-primary" onClick={insertPlan}>{insertLabel||'下書きへ挿入'}</button>}
            </div>
          </div>
        </>}
      </section>
    </div>
    {cardDraft && <Modal title="進行カード" onClose={()=>setCardDraft(null)}>
      <div className="dict-field-block"><label className="dict-field-label">短い見出し</label><input value={cardDraft.name} onChange={e=>setCardDraft(d=>({...d,name:e.target.value}))} placeholder="例：手をつなぐ" autoFocus/></div>
      <div className="dict-field-block"><label className="dict-field-label">自由記述メモ（任意）</label><textarea rows="4" value={cardDraft.memo} onChange={e=>setCardDraft(d=>({...d,memo:e.target.value}))}/></div>
      {active&&active.kind==='adult'&&adultLibrary&&<button type="button" className="btn btn-sm" onClick={()=>setCandidateOpen(true)}>成人向け候補から選ぶ</button>}
      <div className="modal-actions"><button type="button" className="btn" onClick={()=>setCardDraft(null)}>キャンセル</button><button type="button" className="btn btn-primary" onClick={saveCard}>保存</button></div>
    </Modal>}
    {candidateOpen && <Modal title="成人向け候補から選ぶ" onClose={()=>setCandidateOpen(false)} wide>
      <input type="text" className="expr-dict-search" placeholder="検索" value={candidateQuery} onChange={e=>setCandidateQuery(e.target.value)} style={{marginBottom:10}}/>
      <div className="expr-dict-body" style={{maxHeight:'50vh'}}>
        {!filteredCandidates.length && <div className="empty-hint">候補が見つかりません。</div>}
        {filteredCandidates.map(x=>(
          <div className="expr-dict-entry" key={x.id}>
            <div className="expr-dict-entry-head"><span className="expr-dict-entry-cat">{candidatePhaseName(x.phaseId)}／{x.kind}</span></div>
            <div className="expr-dict-entry-headword">{x.text}</div>
            {x.note && <div className="expr-dict-entry-notes">{x.note}</div>}
            <button type="button" className="btn btn-sm btn-primary" style={{marginTop:6}} onClick={()=>pickCandidate(x)}>このカードに使う</button>
          </div>
        ))}
      </div>
      <div className="modal-actions"><button type="button" className="btn" onClick={()=>setCandidateOpen(false)}>閉じる</button></div>
    </Modal>}
    {toast && <div className="expr-dict-toast" style={{position:'fixed',bottom:'76px'}}>{toast}</div>}
  </div>;
}
// ---- 参考材料ライブラリ（既存機能）：段階別に材料を検索・登録し、「今回の流れ」へ選んで並べる。
//      データ（phases/items/selectedItemIds）・機能とも変更なし。UI上のラベルのみ「進行表」から独立させた。 ----
function SceneFlowLibraryView({data,setData}){
  const phases=data.phases||[]; const items=data.items||[];
  const [phaseId,setPhaseId]=useState(phases[0]?phases[0].id:'');
  const [kind,setKind]=useState(''); const [query,setQuery]=useState('');
  const [draft,setDraft]=useState(null); const [editingId,setEditingId]=useState(null);
  const [importOpen,setImportOpen]=useState(false); const [importText,setImportText]=useState('');
  const [toast,setToast]=useState(''); const toastTimerRef=useRef(null);
  useEffect(()=>()=>{if(toastTimerRef.current)clearTimeout(toastTimerRef.current);},[]);
  const showToast=msg=>{setToast(msg);if(toastTimerRef.current)clearTimeout(toastTimerRef.current);toastTimerRef.current=setTimeout(()=>setToast(''),1400);};
  const activePhase=phases.find(x=>x.id===phaseId)||phases[0]||null;
  const phaseName=id=>(phases.find(x=>x.id===id)||{}).name||'未分類';
  const filtered=items.filter(x=>x.phaseId===(activePhase&&activePhase.id)&&(!kind||x.kind===kind)&&(!query.trim()||[x.text,x.note,...(x.tags||[])].join(' ').toLowerCase().includes(query.trim().toLowerCase())));
  const selectedItems=(data.selectedItemIds||[]).map(id=>items.find(x=>x.id===id)).filter(Boolean);
  const fromCsv=v=>Array.from(new Set(String(v||'').split(/[,、]/).map(x=>x.trim()).filter(Boolean)));
  const blank=()=>({id:uid('flowitem'),phaseId:activePhase?activePhase.id:(phases[0]&&phases[0].id)||'',kind:'動作',text:'',note:'',tags:''});
  const openNew=()=>{setEditingId(null);setDraft(blank());};
  const openEdit=x=>{setEditingId(x.id);setDraft({...x,tags:(x.tags||[]).join(', ')});};
  const save=()=>{
    const text=(draft.text||'').trim(); if(!text){showToast('内容を入力してください');return;}
    const clean={...draft,text,tags:fromCsv(draft.tags)};
    setData(d=>({...d,items:editingId?d.items.map(x=>x.id===editingId?clean:x):[...d.items,clean]}));
    setDraft(null);setEditingId(null);showToast(editingId?'更新しました':'追加しました');
  };
  const remove=()=>{if(!editingId||!confirm(`「${draft.text}」を削除しますか？`))return;setData(d=>({...d,items:d.items.filter(x=>x.id!==editingId),selectedItemIds:(d.selectedItemIds||[]).filter(id=>id!==editingId)}));setDraft(null);setEditingId(null);};
  const addToPlan=id=>{setData(d=>({...d,selectedItemIds:[...(d.selectedItemIds||[]),id]}));showToast('今回の流れへ追加しました');};
  const removeFromPlan=index=>setData(d=>({...d,selectedItemIds:d.selectedItemIds.filter((_,i)=>i!==index)}));
  const movePlan=(index,delta)=>setData(d=>{const a=[...(d.selectedItemIds||[])];const next=index+delta;if(next<0||next>=a.length)return d;[a[index],a[next]]=[a[next],a[index]];return{...d,selectedItemIds:a};});
  const clearPlan=()=>{if((data.selectedItemIds||[]).length&&confirm('今回の流れを空にしますか？'))setData(d=>({...d,selectedItemIds:[]}));};
  const copyPlan=async()=>{const text=selectedItems.map((x,i)=>`${i+1}. [${phaseName(x.phaseId)}／${x.kind}] ${x.text}${x.note?`\n   ${x.note}`:''}`).join('\n');const ok=await copyPlainText(text);showToast(ok?'今回の流れをコピーしました':'コピーに失敗しました');};
  const importCheck=useMemo(()=>{
    if(!importText.trim())return{error:'',valid:[],duplicates:[],invalid:[]};
    try{
      const parsed=JSON.parse(importText);const rows=Array.isArray(parsed)?parsed:(parsed&&Array.isArray(parsed.items)?parsed.items:null);
      if(!rows)return{error:'JSONは配列、または { "items": [...] } の形にしてください',valid:[],duplicates:[],invalid:[]};
      const existing=new Set(items.map(x=>`${x.phaseId}\n${x.kind}\n${(x.text||'').trim()}`));const seen=new Set();const valid=[];const duplicates=[];const invalid=[];
      rows.forEach((raw,i)=>{
        if(!raw||typeof raw!=='object'||Array.isArray(raw)){invalid.push(`${i+1}件目：形式が不正です`);return;}
        const text=String(raw.text==null?'':raw.text).trim();const p=phases.find(x=>x.id===raw.phaseId||x.name===raw.phase);const k=SCENE_FLOW_KINDS.includes(raw.kind)?raw.kind:'';
        if(!text||!p||!k){invalid.push(`${i+1}件目：text・phase・kindを確認してください`);return;}
        const key=`${p.id}\n${k}\n${text}`;if(existing.has(key)||seen.has(key)){duplicates.push(text);return;}seen.add(key);
        valid.push({id:uid('flowitem'),phaseId:p.id,kind:k,text,note:String(raw.note||''),tags:Array.isArray(raw.tags)?raw.tags.map(String):[]});
      });
      return{error:'',valid,duplicates,invalid};
    }catch(e){return{error:'JSONの構文を確認してください：'+e.message,valid:[],duplicates:[],invalid:[]};}
  },[importText,items,phases]);
  const runImport=()=>{if(importCheck.error||!importCheck.valid.length)return;setData(d=>({...d,items:[...d.items,...importCheck.valid]}));const n=importCheck.valid.length;setImportOpen(false);setImportText('');showToast(`${n}件を追加しました`);};
  return <div>
    <p className="adult-tab-desc">場面を順番に見ながら、動作だけでなく反応・心情・関係性などの材料を選びます。順番は目安なので、段階を戻ったり飛ばしたりしてかまいません（既存機能。データはそのまま維持されています）。</p>
    <div className="scene-flow-phases">{phases.map((p,i)=><button type="button" key={p.id} className={'scene-flow-phase'+(activePhase&&activePhase.id===p.id?' active':'')} onClick={()=>setPhaseId(p.id)}><span className="scene-flow-phase-num">{i+1}</span>{p.name}</button>)}</div>
    <div className="scene-flow-layout">
      <div>
        <div className="scene-flow-toolbar"><input value={query} onChange={e=>setQuery(e.target.value)} placeholder={`${activePhase?activePhase.name:''}の材料を検索`} /><button type="button" className="btn" onClick={()=>setImportOpen(true)}>JSON一括登録</button><button type="button" className="btn btn-primary" onClick={openNew}>＋ 材料追加</button></div>
        <div className="scene-flow-kind-tabs"><button type="button" className={'dict-cat-tab'+(kind===''?' active':'')} onClick={()=>setKind('')}>すべて</button>{SCENE_FLOW_KINDS.map(k=><button type="button" key={k} className={'dict-cat-tab'+(kind===k?' active':'')} onClick={()=>setKind(k)}>{k}</button>)}</div>
        <div className="dict-list-head"><span>{activePhase?activePhase.name:'段階'}の材料</span><span className="dict-list-count">{filtered.length}件</span></div>
        <div className="scene-flow-grid">{filtered.map(x=><div className="scene-flow-card" key={x.id}><div className="scene-flow-card-kind">{x.kind}</div><div className="scene-flow-card-text">{x.text}</div>{x.note&&<div className="scene-flow-card-note">{x.note}</div>}<div className="scene-flow-card-actions"><button type="button" className="btn btn-sm btn-primary" onClick={()=>addToPlan(x.id)}>＋ 今回使う</button><button type="button" className="btn btn-sm" onClick={()=>openEdit(x)}>編集</button></div></div>)}</div>
        {!filtered.length&&<div className="empty-hint">この条件の材料はまだありません。</div>}
      </div>
      <aside className="scene-flow-plan"><div className="scene-flow-plan-title"><span>今回の流れ</span><span className="dict-list-count">{selectedItems.length}件</span></div>
        {!selectedItems.length?<div className="empty-hint">左の材料から「今回使う」を押すと、ここへ順番に並びます。</div>:<div className="scene-flow-plan-list">{selectedItems.map((x,i)=><div className="scene-flow-plan-row" key={`${x.id}-${i}`}><span className="scene-flow-plan-num">{i+1}</span><div className="scene-flow-plan-main"><div className="scene-flow-plan-phase">{phaseName(x.phaseId)}／{x.kind}</div><div className="scene-flow-plan-text">{x.text}</div></div><div className="scene-flow-plan-buttons"><button onClick={()=>movePlan(i,-1)} disabled={i===0}>↑</button><button onClick={()=>movePlan(i,1)} disabled={i===selectedItems.length-1}>↓</button><button onClick={()=>removeFromPlan(i)}>×</button></div></div>)}</div>}
        <div className="modal-actions" style={{paddingBottom:0}}><button type="button" className="btn btn-sm" onClick={copyPlan} disabled={!selectedItems.length}>コピー</button><button type="button" className="btn btn-sm btn-danger" onClick={clearPlan} disabled={!selectedItems.length}>クリア</button></div>
      </aside>
    </div>
    {draft&&<Modal title={editingId?'進行材料を編集':'進行材料を追加'} onClose={()=>{setDraft(null);setEditingId(null);}} wide><div className="scene-flow-edit-grid">
      <div className="dict-field-block"><label className="dict-field-label">段階</label><select value={draft.phaseId} onChange={e=>setDraft(d=>({...d,phaseId:e.target.value}))}>{phases.map(p=><option key={p.id} value={p.id}>{p.name}</option>)}</select></div>
      <div className="dict-field-block"><label className="dict-field-label">種類</label><select value={draft.kind} onChange={e=>setDraft(d=>({...d,kind:e.target.value}))}>{SCENE_FLOW_KINDS.map(k=><option key={k}>{k}</option>)}</select></div>
      <div className="dict-field-block span-all"><label className="dict-field-label">内容</label><input value={draft.text} onChange={e=>setDraft(d=>({...d,text:e.target.value}))} placeholder="例：速さ・強さ・深さのうち一つだけ変える" /></div>
      <div className="dict-field-block span-all"><label className="dict-field-label">補足</label><textarea rows="3" value={draft.note} onChange={e=>setDraft(d=>({...d,note:e.target.value}))} /></div>
      <div className="dict-field-block span-all"><label className="dict-field-label">タグ（カンマ区切り）</label><input value={draft.tags} onChange={e=>setDraft(d=>({...d,tags:e.target.value}))} /></div>
    </div><div className="modal-actions" style={{justifyContent:'space-between'}}><div>{editingId&&<button type="button" className="btn btn-danger" onClick={remove}>削除</button>}</div><div><button type="button" className="btn" onClick={()=>{setDraft(null);setEditingId(null);}}>キャンセル</button> <button type="button" className="btn btn-primary" onClick={save}>保存</button></div></div></Modal>}
    {importOpen&&<Modal title="シーン進行JSON一括登録" onClose={()=>setImportOpen(false)} wide><p className="adult-tab-desc">各項目に <code>phase</code>（段階名）、<code>kind</code>（種類）、<code>text</code>を指定します。同じ段階・種類・内容の項目はスキップします。</p><textarea rows="14" value={importText} onChange={e=>setImportText(e.target.value)} style={{width:'100%',fontFamily:'ui-monospace,monospace',fontSize:'12px'}} placeholder={'{\n  "items": [\n    {\n      "phase": "往復",\n      "kind": "身体反応",\n      "text": "呼吸の間隔が短くなる",\n      "note": "前段階との差を示す",\n      "tags": ["呼吸", "変化"]\n    }\n  ]\n}'} />
      {importCheck.error&&<div className="empty-hint" style={{color:'var(--danger)'}}>{importCheck.error}</div>}{!importCheck.error&&importText.trim()&&<div className="onomatopoeia-badges" style={{marginTop:10}}><span className="onomatopoeia-badge">追加可能 {importCheck.valid.length}件</span><span className="onomatopoeia-badge">重複 {importCheck.duplicates.length}件</span><span className="onomatopoeia-badge">不正 {importCheck.invalid.length}件</span></div>}
      {importCheck.invalid.length>0&&<div className="adult-tab-desc" style={{marginTop:8,color:'var(--danger)'}}>{importCheck.invalid.join(' ／ ')}</div>}<div className="modal-actions"><button className="btn" onClick={()=>setImportOpen(false)}>キャンセル</button><button className="btn btn-primary" onClick={runImport} disabled={!!importCheck.error||!importCheck.valid.length}>{importCheck.valid.length}件を登録</button></div></Modal>}
    {toast&&<div className="expr-dict-toast" style={{position:'fixed',bottom:'76px'}}>{toast}</div>}
  </div>;
}
// ---- オノマトペ辞書：対象×現象×性質から、音・様態・発声の候補を探す。 ----
function AdultOnomatopoeiaTab({ data, setData }){
  const entries=data.entries||[];
  const [query,setQuery]=useState('');
  const [category,setCategory]=useState('');
  const [vocality,setVocality]=useState('');
  const [editingId,setEditingId]=useState(null);
  const [draft,setDraft]=useState(null);
  const [importOpen,setImportOpen]=useState(false);
  const [importText,setImportText]=useState('');
  const [toast,setToast]=useState('');
  const toastTimerRef=useRef(null);
  useEffect(()=>()=>{ if(toastTimerRef.current) clearTimeout(toastTimerRef.current); },[]);
  const showToast=msg=>{ setToast(msg); if(toastTimerRef.current) clearTimeout(toastTimerRef.current); toastTimerRef.current=setTimeout(()=>setToast(''),1400); };
  const blankEntry=()=>({ id:uid('onom'),text:'',phenomenon:'',categories:'',sources:'',vocality:0,intentionality:'不問',strength:3,speed:3,length:'短',repetition:'単発',tags:'',note:'' });
  const csv=v=>Array.isArray(v)?v.join(', '):'';
  const fromCsv=v=>Array.from(new Set(String(v||'').split(/[,、]/).map(x=>x.trim()).filter(Boolean)));
  const filtered=entries.filter(x=>{
    const q=query.trim().toLowerCase();
    const hay=[x.text,x.phenomenon,x.note,...(x.categories||[]),...(x.sources||[]),...(x.tags||[])].join(' ').toLowerCase();
    return (!q||hay.includes(q)) && (!category||(x.categories||[]).includes(category)) && (vocality===''||x.vocality===Number(vocality));
  });
  const openNew=()=>{ setEditingId(null); setDraft(blankEntry()); };
  const openEdit=x=>{ setEditingId(x.id); setDraft({...x,categories:csv(x.categories),sources:csv(x.sources),tags:csv(x.tags)}); };
  const patchDraft=patch=>setDraft(d=>({...d,...patch}));
  const save=()=>{
    const text=(draft.text||'').trim();
    if(!text){ showToast('表記を入力してください'); return; }
    const cleaned=normalizeAdultOnomatopoeia({entries:[{...draft,text,categories:fromCsv(draft.categories),sources:fromCsv(draft.sources),tags:fromCsv(draft.tags)}]}).entries[0];
    setData(d=>({ ...d, entries:editingId ? d.entries.map(x=>x.id===editingId?cleaned:x) : [...d.entries,cleaned] }));
    setDraft(null); setEditingId(null); showToast(editingId?'更新しました':'追加しました');
  };
  const remove=()=>{
    if(!editingId||!confirm(`「${draft.text}」を削除しますか？`)) return;
    setData(d=>({...d,entries:d.entries.filter(x=>x.id!==editingId)})); setDraft(null); setEditingId(null);
  };
  const copyEntry=async text=>{ const ok=await copyPlainText(text); showToast(ok?`「${text}」をコピーしました`:'コピーに失敗しました'); };
  const importCheck=useMemo(()=>{
    if(!importText.trim()) return {error:'',valid:[],duplicates:[],invalid:[]};
    try{
      const parsed=JSON.parse(importText);
      const rows=Array.isArray(parsed)?parsed:(parsed&&Array.isArray(parsed.entries)?parsed.entries:null);
      if(!rows) return {error:'JSONは配列、または { "entries": [...] } の形にしてください',valid:[],duplicates:[],invalid:[]};
      const existing=new Set(entries.map(x=>(x.text||'').trim()).filter(Boolean));
      const seen=new Set(); const valid=[]; const duplicates=[]; const invalid=[];
      rows.forEach((raw,i)=>{
        if(!raw||typeof raw!=='object'||Array.isArray(raw)){ invalid.push(`${i+1}件目：データ形式が不正です`); return; }
        const text=String(raw.text==null?'':raw.text).trim();
        if(!text){ invalid.push(`${i+1}件目：textが空です`); return; }
        if(existing.has(text)||seen.has(text)){ duplicates.push(text); return; }
        seen.add(text);
        const normalized=normalizeAdultOnomatopoeia({entries:[{...raw,id:uid('onom'),text}]}).entries[0];
        if(normalized) valid.push(normalized); else invalid.push(`${i+1}件目：登録できません`);
      });
      return {error:'',valid,duplicates,invalid};
    }catch(e){ return {error:'JSONの構文を確認してください：'+e.message,valid:[],duplicates:[],invalid:[]}; }
  },[importText,entries]);
  const runImport=()=>{
    if(importCheck.error||importCheck.valid.length===0) return;
    setData(d=>({...d,entries:[...d.entries,...importCheck.valid]}));
    const count=importCheck.valid.length; setImportOpen(false); setImportText('');
    showToast(`${count}件を追加しました`);
  };
  return (
    <div>
      <p className="adult-tab-desc">音だけでなく、現象を文章上どう表すかを探す辞書です。複数分類に対応し、「チュッ」のような接触音・口音・発声の境界語もそのまま登録できます。</p>
      <div className="onomatopoeia-toolbar">
        <input type="text" value={query} onChange={e=>setQuery(e.target.value)} placeholder="表記・現象・発生源・タグを検索" />
        <select value={category} onChange={e=>setCategory(e.target.value)}><option value="">すべての分類</option>{ONOMATOPOEIA_CATEGORIES.map(x=><option key={x} value={x}>{x}</option>)}</select>
        <select value={vocality} onChange={e=>setVocality(e.target.value)}><option value="">発声性：すべて</option>{ONOMATOPOEIA_VOCALITY_LABELS.map((x,i)=><option key={x} value={i}>{i}：{x}</option>)}</select>
        <button type="button" className="btn" onClick={()=>setImportOpen(true)}>JSON一括登録</button>
        <button type="button" className="btn btn-primary" onClick={openNew}>＋ 追加</button>
      </div>
      <div className="dict-list-head"><span>候補</span><span className="dict-list-count">{filtered.length}件</span></div>
      <div className="onomatopoeia-list">
        {filtered.map(x=><button type="button" className="onomatopoeia-card" key={x.id} onClick={()=>openEdit(x)}>
          <div className="onomatopoeia-card-head"><span className="onomatopoeia-card-text">{x.text}</span><span className="dict-list-count">強{x.strength}・速{x.speed}</span></div>
          <div className="onomatopoeia-card-phenomenon">{x.phenomenon||'現象未設定'}</div>
          <div className="onomatopoeia-badges">
            {(x.categories||[]).map(v=><span className="onomatopoeia-badge" key={v}>{v}</span>)}
            <span className="onomatopoeia-badge onomatopoeia-badge-vocal">発声性{x.vocality}：{ONOMATOPOEIA_VOCALITY_LABELS[x.vocality]}</span>
            {(x.sources||[]).map(v=><span className="onomatopoeia-badge" key={'s'+v}>{v}</span>)}
            <span className="onomatopoeia-badge">{x.repetition}</span><span className="onomatopoeia-badge">{x.length}</span>
          </div>
        </button>)}
      </div>
      {filtered.length===0&&<div className="empty-hint">条件に合う候補がありません。</div>}
      {draft&&<Modal title={editingId?`オノマトペ編集：${draft.text||'無題'}`:'オノマトペを追加'} onClose={()=>{setDraft(null);setEditingId(null);}} wide>
        <div className="onomatopoeia-edit-grid">
          <div className="dict-field-block"><label className="dict-field-label">表記</label><input type="text" value={draft.text} onChange={e=>patchDraft({text:e.target.value})} placeholder="例：チュッ" /></div>
          <div className="dict-field-block"><label className="dict-field-label">現象</label><input type="text" value={draft.phenomenon} onChange={e=>patchDraft({phenomenon:e.target.value})} placeholder="例：唇が触れる、または口で音を作る" /></div>
          <div className="dict-field-block"><label className="dict-field-label">分類（複数・カンマ区切り）</label><input type="text" value={draft.categories} onChange={e=>patchDraft({categories:e.target.value})} placeholder="口音, 身体音, 発声" list="onomatopoeia-category-list" /><datalist id="onomatopoeia-category-list">{ONOMATOPOEIA_CATEGORIES.map(x=><option key={x} value={x} />)}</datalist></div>
          <div className="dict-field-block"><label className="dict-field-label">発生源（複数・カンマ区切り）</label><input type="text" value={draft.sources} onChange={e=>patchDraft({sources:e.target.value})} placeholder="口, 唇" /></div>
          <div className="dict-field-block"><label className="dict-field-label">発声性</label><select value={draft.vocality} onChange={e=>patchDraft({vocality:Number(e.target.value)})}>{ONOMATOPOEIA_VOCALITY_LABELS.map((x,i)=><option key={x} value={i}>{i}：{x}</option>)}</select></div>
          <div className="dict-field-block"><label className="dict-field-label">意図性</label><select value={draft.intentionality} onChange={e=>patchDraft({intentionality:e.target.value})}>{ONOMATOPOEIA_INTENTIONALITY.map(x=><option key={x}>{x}</option>)}</select></div>
          <div className="dict-field-block"><label className="dict-field-label">強さ：{draft.strength}</label><input type="range" min="1" max="5" value={draft.strength} onChange={e=>patchDraft({strength:Number(e.target.value)})} /></div>
          <div className="dict-field-block"><label className="dict-field-label">速さ：{draft.speed}</label><input type="range" min="1" max="5" value={draft.speed} onChange={e=>patchDraft({speed:Number(e.target.value)})} /></div>
          <div className="dict-field-block"><label className="dict-field-label">長さ</label><select value={draft.length} onChange={e=>patchDraft({length:e.target.value})}>{ONOMATOPOEIA_LENGTHS.map(x=><option key={x}>{x}</option>)}</select></div>
          <div className="dict-field-block"><label className="dict-field-label">反復</label><select value={draft.repetition} onChange={e=>patchDraft({repetition:e.target.value})}>{ONOMATOPOEIA_REPETITIONS.map(x=><option key={x}>{x}</option>)}</select></div>
          <div className="dict-field-block span-all"><label className="dict-field-label">検索タグ（カンマ区切り）</label><input type="text" value={draft.tags} onChange={e=>patchDraft({tags:e.target.value})} placeholder="接触, キス, 口音" /></div>
          <div className="dict-field-block span-all"><label className="dict-field-label">メモ</label><textarea rows="3" value={draft.note} onChange={e=>patchDraft({note:e.target.value})} /></div>
        </div>
        <div className="modal-actions" style={{justifyContent:'space-between'}}>
          <div>{editingId&&<><button type="button" className="btn" onClick={()=>copyEntry(draft.text)}>コピー</button> <button type="button" className="btn btn-danger" onClick={remove}>削除</button></>}</div>
          <div><button type="button" className="btn" onClick={()=>{setDraft(null);setEditingId(null);}}>キャンセル</button> <button type="button" className="btn btn-primary" onClick={save}>保存</button></div>
        </div>
      </Modal>}
      {importOpen&&<Modal title="オノマトペJSON一括登録" onClose={()=>setImportOpen(false)} wide>
        <p className="adult-tab-desc">JSON配列、または <code>{'{ "entries": [...] }'}</code> を貼り付けます。同じ表記の既存語と、貼り付け内の重複語はスキップします。</p>
        <textarea rows="14" value={importText} onChange={e=>setImportText(e.target.value)} style={{width:'100%',fontFamily:'ui-monospace,monospace',fontSize:'12px'}} placeholder={'[\n  {\n    "text": "ぬぷっ",\n    "phenomenon": "柔らかい抵抗を伴って出入りする",\n    "categories": ["物理音", "擬態"],\n    "sources": ["接触面"],\n    "vocality": 0,\n    "intentionality": "不問",\n    "strength": 2,\n    "speed": 3,\n    "length": "短",\n    "repetition": "単発",\n    "tags": ["湿潤", "出入り"],\n    "note": ""\n  }\n]'} />
        {importCheck.error&&<div className="empty-hint" style={{color:'var(--danger)'}}>{importCheck.error}</div>}
        {!importCheck.error&&importText.trim()&&<div className="onomatopoeia-badges" style={{marginTop:10}}>
          <span className="onomatopoeia-badge">追加可能 {importCheck.valid.length}件</span>
          <span className="onomatopoeia-badge">重複スキップ {importCheck.duplicates.length}件</span>
          <span className="onomatopoeia-badge">不正 {importCheck.invalid.length}件</span>
        </div>}
        {importCheck.duplicates.length>0&&<div className="adult-tab-desc" style={{marginTop:8}}>重複：{importCheck.duplicates.join('、')}</div>}
        {importCheck.invalid.length>0&&<div className="adult-tab-desc" style={{marginTop:8,color:'var(--danger)'}}>{importCheck.invalid.join(' ／ ')}</div>}
        <div className="modal-actions"><button type="button" className="btn" onClick={()=>setImportOpen(false)}>キャンセル</button><button type="button" className="btn btn-primary" onClick={runImport} disabled={!!importCheck.error||importCheck.valid.length===0}>{importCheck.valid.length}件を登録</button></div>
      </Modal>}
      {toast&&<div className="expr-dict-toast" style={{position:'fixed',bottom:'76px'}}>{toast}</div>}
    </div>
  );
}

// ---- 語句魔改造タブ：単語パーツを構文に差し込み、普通は隣り合わない語彙を衝突させて名詞句を作る。 ----
function AdultPhraseRemixTab({ remixData, setRemixData }){
  const patterns = remixData.patterns || [];
  const parts = remixData.parts || [];
  const [patternId, setPatternId] = useState(patterns[0] ? patterns[0].id : '');
  const [variantId, setVariantId] = useState('');
  const [selected, setSelected] = useState({}); // role -> part id
  const [concepts, setConcepts] = useState({}); // role -> 元概念
  const [locks, setLocks] = useState({});       // role -> boolean
  const [partsOpen, setPartsOpen] = useState(false);
  const [partRole, setPartRole] = useState('function');
  const [newPartText, setNewPartText] = useState('');
  const [newPartConcept, setNewPartConcept] = useState('');
  const [newPartDomains, setNewPartDomains] = useState('');
  const [toast, setToast] = useState('');
  const toastTimerRef = useRef(null);

  useEffect(()=>()=>{ if(toastTimerRef.current) clearTimeout(toastTimerRef.current); }, []);
  const showToast = (msg) => {
    setToast(msg);
    if(toastTimerRef.current) clearTimeout(toastTimerRef.current);
    toastTimerRef.current = setTimeout(()=>setToast(''), 1400);
  };

  const pattern = patterns.find(p=>p.id===patternId) || patterns[0] || null;
  const variants = pattern && Array.isArray(pattern.variants) && pattern.variants.length
    ? pattern.variants
    : (pattern ? [{id:pattern.id+'-default',name:'標準',segments:pattern.segments||[]}] : []);
  const variant = variants.find(v=>v.id===variantId) || variants[0] || null;
  const roles = pattern ? (Array.isArray(pattern.roles) && pattern.roles.length
    ? pattern.roles
    : Array.from(new Set((variant ? variant.segments : []).map(s=>s.role).filter(Boolean)))) : [];

  const partById = useMemo(()=>{
    const m = new Map(); parts.forEach(p=>m.set(p.id,p)); return m;
  }, [parts]);

  const conceptsForRole = (role) => Array.from(new Set(
    parts.filter(p=>p.role===role && (p.text||'').trim()).map(p=>(p.concept||p.text||'').trim()).filter(Boolean)
  ));
  const candidatesForRole = (role, conceptValue) => parts.filter(p=>{
    if(p.role!==role || !(p.text||'').trim()) return false;
    if(!conceptValue) return true;
    return (p.concept||p.text||'').trim()===conceptValue;
  });
  const randomPartId = (role, currentId, conceptValue) => {
    const candidates = candidatesForRole(role, conceptValue);
    if(!candidates.length) return null;
    const pool = candidates.length>1 ? candidates.filter(p=>p.id!==currentId) : candidates;
    return pool[Math.floor(Math.random()*pool.length)].id;
  };

  const phraseFrom = (v, sel) => {
    if(!v) return '';
    return (v.segments||[]).map(seg=>{
      if(seg.literal!==undefined) return seg.literal;
      const part = partById.get(sel[seg.role]);
      const text = part ? part.text : '□';
      return (seg.prefix||'') + text + (seg.suffix||'');
    }).join('');
  };

  // 意味パターンを変えた時は、役割ごとに元概念を維持できるものは維持し、足りない役割だけ初期化する。
  useEffect(()=>{
    if(!pattern) return;
    const nextConcepts = {};
    const nextSelected = {};
    roles.forEach(role=>{
      const roleConcepts = conceptsForRole(role);
      const prevConcept = concepts[role];
      const concept = prevConcept && roleConcepts.includes(prevConcept) ? prevConcept : (roleConcepts[0]||'');
      nextConcepts[role] = concept;
      const prevPart = partById.get(selected[role]);
      if(prevPart && prevPart.role===role && (!concept || (prevPart.concept||prevPart.text)===concept)) nextSelected[role]=prevPart.id;
      else nextSelected[role]=randomPartId(role,null,concept);
    });
    setConcepts(nextConcepts);
    setSelected(nextSelected);
    setLocks({});
    setVariantId(variants[0] ? variants[0].id : '');
  // eslint-disable-next-line react-hooks/exhaustive-deps
  }, [patternId]);

  // 初回だけ語順を標準へ合わせる。
  useEffect(()=>{
    if(!variantId && variants[0]) setVariantId(variants[0].id);
  }, [variantId, variants]);

  // 部品辞書の変更で選択中の部品が消えた時だけ、同じ元概念から補う。
  useEffect(()=>{
    if(!pattern) return;
    setSelected(prev=>{
      let changed=false;
      const next={...prev};
      roles.forEach(role=>{
        const p=partById.get(next[role]);
        const concept=concepts[role]||'';
        if(!p || p.role!==role || (concept && (p.concept||p.text)!==concept)){
          next[role]=randomPartId(role,null,concept); changed=true;
        }
      });
      return changed?next:prev;
    });
  // eslint-disable-next-line react-hooks/exhaustive-deps
  }, [parts.length]);

  const currentPhrase = phraseFrom(variant, selected);
  const allVariantPhrases = variants.map(v=>({ id:v.id, name:v.name, text:phraseFrom(v,selected) }));

  const pushRecent = (text, pid, vid) => {
    if(!text || text.includes('□')) return;
    setRemixData(d=>{
      const sameRemoved = (d.recentPhrases||[]).filter(x=>x.text!==text);
      return { ...d, recentPhrases:[{id:uid('phrase'),text,patternId:pid,variantId:vid||'',createdAt:Date.now()}, ...sameRemoved].slice(0,20) };
    });
  };

  const changeConcept = (role, concept) => {
    setConcepts(prev=>({...prev,[role]:concept}));
    const nextId=randomPartId(role,null,concept);
    setSelected(prev=>({...prev,[role]:nextId}));
  };

  const rerollAll = () => {
    if(!pattern) return;
    const next={...selected};
    roles.forEach(role=>{
      if(locks[role]) return;
      next[role]=randomPartId(role,next[role],concepts[role]);
    });
    setSelected(next);
    pushRecent(phraseFrom(variant,next),pattern.id,variant?variant.id:'');
  };

  const rerollOne = (role) => {
    const next={...selected,[role]:randomPartId(role,selected[role],concepts[role])};
    setSelected(next);
    pushRecent(phraseFrom(variant,next),pattern?pattern.id:'',variant?variant.id:'');
  };

  const randomizeVariant = () => {
    if(!variants.length) return;
    const pool=variants.length>1?variants.filter(v=>v.id!==variantId):variants;
    const next=pool[Math.floor(Math.random()*pool.length)];
    setVariantId(next.id);
    pushRecent(phraseFrom(next,selected),pattern?pattern.id:'',next.id);
  };

  const randomizePattern = () => {
    if(!patterns.length) return;
    const pool=patterns.length>1?patterns.filter(p=>p.id!==patternId):patterns;
    const nextPattern=pool[Math.floor(Math.random()*pool.length)];
    setPatternId(nextPattern.id);
  };

  const copyPhrase = async (text) => {
    const ok = await copyPlainText(text);
    showToast(ok ? `「${text}」をコピーしました` : 'コピーに失敗しました');
  };

  const savePhrase = () => {
    if(!currentPhrase || currentPhrase.includes('□')) return;
    setRemixData(d=>{
      if((d.savedPhrases||[]).some(x=>x.text===currentPhrase)) return d;
      return { ...d, savedPhrases:[{id:uid('phrase'),text:currentPhrase,patternId:pattern?pattern.id:'',variantId:variant?variant.id:'',createdAt:Date.now()}, ...(d.savedPhrases||[])] };
    });
    showToast('保存しました');
  };

  const deleteSaved = (id) => setRemixData(d=>({ ...d, savedPhrases:(d.savedPhrases||[]).filter(x=>x.id!==id) }));

  const addPart = () => {
    const text=newPartText.trim();
    if(!text) return;
    if(parts.some(p=>p.role===partRole && p.text===text)){ showToast('同じ部品がすでにあります'); return; }
    const domains=newPartDomains.split(',').map(x=>x.trim()).filter(Boolean);
    const concept=newPartConcept.trim() || text;
    setRemixData(d=>({ ...d, parts:[...d.parts,makePhrasePart(partRole,text,domains,[],concept)] }));
    setNewPartText(''); setNewPartConcept(''); setNewPartDomains('');
  };
  const removePart = (id) => setRemixData(d=>({ ...d, parts:d.parts.filter(p=>p.id!==id) }));
  const mergeStarterParts = () => {
    const starter=defaultAdultPhraseRemix().parts;
    setRemixData(d=>{
      const seen=new Set(d.parts.map(p=>p.role+'\n'+p.text));
      const add=starter.filter(p=>!seen.has(p.role+'\n'+p.text)).map(p=>({...p,id:uid('phrasepart')}));
      return { ...d, parts:[...d.parts,...add] };
    });
    showToast('不足している初期部品を追加しました');
  };

  const currentRoleParts=parts.filter(p=>p.role===partRole);

  return (
    <div className="adult-phrase-remix">
      <p className="adult-tab-desc">
        まず「性器」「挟む・保持」「胸」のような元概念を決め、その意味を保った候補から語を選びます。
        その後に語順・構文だけを入れ替えられるので、意味を見失わずに複合語を魔改造できます。
      </p>

      <div className="phrase-remix-control-grid">
        <div className="dict-field-block" style={{marginBottom:0}}>
          <label className="dict-field-label">意味パターン</label>
          <select value={pattern?pattern.id:''} onChange={e=>setPatternId(e.target.value)}>
            {patterns.map(p=><option key={p.id} value={p.id}>{p.name}</option>)}
          </select>
        </div>
        <div className="dict-field-block" style={{marginBottom:0}}>
          <label className="dict-field-label">語順・構文</label>
          <select value={variant?variant.id:''} onChange={e=>{
            const v=variants.find(x=>x.id===e.target.value);
            setVariantId(e.target.value);
            if(v) pushRecent(phraseFrom(v,selected),pattern?pattern.id:'',v.id);
          }}>
            {variants.map(v=><option key={v.id} value={v.id}>{v.name}</option>)}
          </select>
        </div>
        <div className="phrase-remix-control-actions">
          <button type="button" className="btn btn-sm" onClick={randomizeVariant}>語順だけ魔改造</button>
          <button type="button" className="btn btn-sm" onClick={randomizePattern}>意味パターン変更</button>
          <button type="button" className="btn btn-sm" onClick={()=>setPartsOpen(true)}>部品辞書</button>
        </div>
      </div>

      <div className="phrase-remix-result">
        <div className="dict-field-label">生成語句</div>
        <div className="phrase-remix-result-text">{currentPhrase || '部品を登録してください'}</div>
        <div className="phrase-remix-result-actions">
          <button type="button" className="btn btn-primary" onClick={rerollAll} disabled={!pattern}>⚗️ 語だけ魔改造</button>

// ---- 語句マップタブ：横＝婉曲←→直接（directness）、縦＝上品←→俗（vulgarity）の2軸に表現を配置し、視覚的に比較する。
//      「どの語が正しいか」を決めるものではなく、温度感を見比べるための資料。タップで詳細表示＋コピー。 ----
function AdultWordMapTab({ adultDictionary }){
  const entries = adultDictionary.entries || [];
  const allExpressions = useMemo(()=>{
    const out = [];
    entries.forEach(e=>{
      (e.expressions||[]).forEach(x=>{
        out.push({ ...x, conceptId:e.id, concept:e.concept, category:e.category });
      });
    });
    return out;
  }, [entries]);

  const [selectedId, setSelectedId] = useState(null);
  const [toast, setToast] = useState('');
  const toastTimerRef = useRef(null);
  useEffect(()=>()=>{ if(toastTimerRef.current) clearTimeout(toastTimerRef.current); }, []);
  const showToast = (msg) => {
    setToast(msg);
    if(toastTimerRef.current) clearTimeout(toastTimerRef.current);
    toastTimerRef.current = setTimeout(()=>setToast(''), 1400);
  };
  const copyText = async (text) => {
    const ok = await copyPlainText(text);
    showToast(ok ? `「${text}」をコピーしました` : 'コピーに失敗しました');
  };

  const selected = selectedId ? allExpressions.find(x=>x.id===selectedId) : null;

  const posOf = (x) => ({
    left: ((clamp(x.directness,1,5)-1) / 4 * 100) + '%',
    top: ((clamp(x.vulgarity,1,5)-1) / 4 * 100) + '%',
  });

  return (
    <div className="adult-map-tab">
      <p className="adult-tab-desc">
        同じ意味の表現でも「どの辺の温度なのか」を見比べるための資料です。どの語が正しいかを決めるものではありません。
      </p>
      {allExpressions.length===0 ? (
        <div className="empty-hint">まだ「表現辞典」に成人向け表現が登録されていません。先に表現辞典タブから登録してください。</div>
      ) : (
        <>
          <div className="adult-map-wrap">
            <div className="adult-map-axis-label adult-map-axis-top">上品</div>
            <div className="adult-map-axis-label adult-map-axis-bottom">俗</div>
            <div className="adult-map-axis-label adult-map-axis-left">婉曲</div>
            <div className="adult-map-axis-label adult-map-axis-right">直接</div>
            <div className="adult-map-plot">
              {allExpressions.map(x=>(
                <button type="button" key={x.id} className={"adult-map-point"+(selectedId===x.id?' active':'')}
                  style={posOf(x)} onClick={()=>setSelectedId(x.id)} title={x.text}>{x.text}</button>
              ))}
            </div>
          </div>
          {selected && (
            <div className="adult-map-detail">
              <div className="dict-expr-card-text">{selected.text}</div>
              <div className="dict-card-sub">{selected.concept}{selected.category?`（${selected.category}）`:''}</div>
              <AdultRatingBadges x={selected} />
              {selected.note && <div className="expr-dict-entry-notes">{selected.note}</div>}
              <button type="button" className="btn btn-sm btn-primary" style={{marginTop:6}} onClick={()=>copyText(selected.text)}>コピー</button>
            </div>
          )}
        </>
      )}
      {toast && <div className="expr-dict-toast" style={{position:'fixed', bottom:'76px'}}>{toast}</div>}
    </div>
  );
}
