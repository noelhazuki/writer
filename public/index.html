// グループ（characterGroups / worldSettingGroups）の追加・名前変更・削除・並び替えを行う共通モーダル
function GroupsManagerModal({ title, groups, onAdd, onRename, onDelete, onMove, onClose, deleteHint }){
  const [newName, setNewName] = useState('');
  return (
    <Modal title={title} onClose={onClose}>
      {groups.length===0 && <div className="empty-hint">まだグループがありません。下から追加できます。</div>}
      {groups.map((g,i)=>(
        <div className="groups-manager-row" key={g.id}>
          <input type="text" value={g.name} onChange={e=>onRename(g.id, e.target.value)} />
          <div className="gm-actions">
            <button onClick={()=>onMove(g.id,-1)} disabled={i===0}>↑</button>
            <button onClick={()=>onMove(g.id,1)} disabled={i===groups.length-1}>↓</button>
            <button style={{color:'#8a3a3a'}} onClick={()=>onDelete(g.id)}>削除</button>
          </div>
        </div>
      ))}
      {deleteHint && <p style={{fontSize:12, color:'var(--ink-soft)', margin:'4px 0 10px'}}>{deleteHint}</p>}
      <div style={{display:'flex', gap:8, marginTop:6}}>
        <input type="text" placeholder="新しいグループ名" value={newName} onChange={e=>setNewName(e.target.value)}
          style={{flex:1, padding:'7px 9px', border:'1px solid var(--line)', borderRadius:6}} />
        <button className="btn btn-sm btn-primary" onClick={()=>{ if(newName.trim()){ onAdd(newName.trim()); setNewName(''); } }}>追加</button>
      </div>
      <div className="modal-actions"><button className="btn btn-primary" onClick={onClose}>閉じる</button></div>
    </Modal>
  );
}

/* ---- キャラクタータグ共通処理 ----
   全キャラクターの tags 配列を正本として、タグ名と使用人数を集計する。
   タグマスターは持たず、常に data.characters から都度導出することで、
   使われなくなったタグは自然に一覧から消える。 */
function collectCharacterTagUsage(characters){
  const counts = new Map();
  (characters||[]).forEach(c=>{
    (c.tags||[]).forEach(raw=>{
      const t = String(raw||'').trim();
      if(!t) return;
      counts.set(t, (counts.get(t)||0)+1);
    });
  });
  return Array.from(counts.entries())
    .map(([tag,count])=>({tag,count}))
    .sort((a,b)=> b.count-a.count || a.tag.localeCompare(b.tag,'ja'));
}

// 既存タグ一覧（折りたたみ）：キャラクター編集画面・一覧の絞り込みで共通利用。
// selected に含まれるタグは選択済みとして色分けし、押すたびに onToggle(tag) を呼ぶ。
function TagUsagePicker({ tagUsage, selected, onToggle, label }){
  const [open, setOpen] = useState(false);
  const selectedSet = new Set(selected||[]);
  if(!tagUsage || tagUsage.length===0) return null;
  return (
    <div className="tagpicker">
      <button type="button" className="tagpicker-toggle" onClick={()=>setOpen(o=>!o)}>
        <span className="chev" style={{display:'inline-block', transform: open?'rotate(90deg)':'none'}}>▶</span>
        {label}（{tagUsage.length}）
      </button>
      {open && (
        <div className="tagpicker-list">
          {tagUsage.map(({tag,count})=>(
            <button type="button" key={tag}
              className={"tagpicker-option"+(selectedSet.has(tag)?" selected":"")}
              onClick={()=>onToggle(tag)}>
              {selectedSet.has(tag) ? '✓ ' : ''}{tag}
              <span className="tagpicker-option-count">{count}人</span>
            </button>
          ))}
        </div>
      )}
    </div>
  );
}

// キャラクター編集画面のタグ欄：チップ表示＋新規追加＋既存タグからの流用をまとめたもの。
// tags は当該キャラクターの ch.tags そのもの（正本）、allCharacters は使用数集計用。
function CharacterTagEditor({ tags, allCharacters, onChange }){
  const [draft, setDraft] = useState('');
  const list = tags || [];
  const tagUsage = collectCharacterTagUsage(allCharacters);

  const addTag = (raw) => {
    const v = String(raw||'').trim();
    if(!v){ setDraft(''); return; }
    if(!list.includes(v)) onChange([...list, v]);
    setDraft('');
  };
  const removeAt = (idx) => onChange(list.filter((_,i)=>i!==idx));
  const toggleExisting = (tag) => {
    if(list.includes(tag)) onChange(list.filter(t=>t!==tag));
    else onChange([...list, tag]);
  };
  const handleKeyDown = (e) => {
    if(e.key==='Enter' || e.key===','){
      e.preventDefault();
      addTag(draft.replace(/,$/,''));
    }
  };

  return (
    <div className="chip-editor">
      {list.length>0 && (
        <div className="chip-editor-chips">
          {list.map((t,i)=>(
            <span className="chip-editor-chip" key={t+'-'+i}>
              {t}
              <button type="button" onClick={()=>removeAt(i)} aria-label={`${t}を解除`}>×</button>
            </span>
          ))}
        </div>
      )}
      <div className="chip-editor-add-row">
        <input type="text" value={draft} placeholder="新しいタグを入力"
          onChange={e=>setDraft(e.target.value)}
          onKeyDown={handleKeyDown} />
        <button type="button" className="btn btn-sm" onClick={()=>addTag(draft)}>追加</button>
      </div>
      <TagUsagePicker tagUsage={tagUsage} selected={list} onToggle={toggleExisting} label="既存タグから選ぶ" />
    </div>
  );
}

/* ---- キャラクター（グループ・タグでの整理） ---- */
function CharacterListView({ data, setData, onOpen, onCreate, onOpenHeightCompare }){
  const [filterTags, setFilterTags] = useState([]);
  const [managingGroups, setManagingGroups] = useState(false);
  const [collapsed, setCollapsed] = useState({});

  const groups = [...data.characterGroups].sort((a,b)=>(a.sortOrder??0)-(b.sortOrder??0));
  const tagUsage = collectCharacterTagUsage(data.characters);

  const visibleChars = filterTags.length===0 ? data.characters : data.characters.filter(c=>(c.tags||[]).some(t=>filterTags.includes(t)));
  const knownGroupIds = new Set(groups.map(g=>g.id));
  const toggleFilterTag = (tag) => setFilterTags(prev => prev.includes(tag) ? prev.filter(t=>t!==tag) : [...prev, tag]);

  const buckets = groups.map(g => ({ group:g, items: visibleChars.filter(c=>c.groupId===g.id) }));
  const unassigned = visibleChars.filter(c => !c.groupId || !knownGroupIds.has(c.groupId));
  buckets.push({ group:{ id:CHAR_UNASSIGNED, name:'未分類' }, items: unassigned });

  const addGroup = (name) => setData(d=>({...d, characterGroups:[...d.characterGroups, {id:uid('cg'), name, sortOrder:d.characterGroups.length}]}));
  const renameGroup = (id, name) => setData(d=>({...d, characterGroups:d.characterGroups.map(g=>g.id===id?{...g,name}:g)}));
  const deleteGroup = (id) => {
    if(!confirm('このグループを削除しますか？中のキャラクターは「未分類」になります。')) return;
    setData(d=>({...d, characterGroups:d.characterGroups.filter(g=>g.id!==id), characters:d.characters.map(c=>c.groupId===id?{...c,groupId:null}:c)}));
  };
  const moveGroup = (id, dir) => {
    const list = [...data.characterGroups].sort((a,b)=>(a.sortOrder??0)-(b.sortOrder??0));
    const idx = list.findIndex(g=>g.id===id); const j = idx+dir;
    if(j<0||j>=list.length) return;
    [list[idx],list[j]]=[list[j],list[idx]];
    setData(d=>({...d, characterGroups: list.map((g,i)=>({...g, sortOrder:i}))}));
  };
  const toggle = (gid) => setCollapsed(c=>({...c, [gid]: !c[gid]}));

  return (
    <div>
      <div className="toolbar">
        <h1>🧑 キャラクター</h1>
        <div className="filler" />
        <button className="btn btn-sm" onClick={onOpenHeightCompare}>身長比較</button>
        <button className="btn btn-sm" onClick={()=>setManagingGroups(true)}>グループを管理</button>
        <button className="btn btn-primary" onClick={onCreate}>＋ 新規追加</button>
      </div>

      {tagUsage.length>0 && (
        <div className="tag-filter-row">
          {filterTags.length>0 && (
            <div className="chip-editor-chips">
              {filterTags.map(t=>(
                <span className="chip-editor-chip selected-chip" key={t}>
                  {t}
                  <button type="button" onClick={()=>toggleFilterTag(t)} aria-label={`${t}の絞り込みを解除`}>×</button>
                </span>
              ))}
              <button type="button" className="btn btn-sm" onClick={()=>setFilterTags([])}>絞り込み解除</button>
            </div>
          )}
          <TagUsagePicker tagUsage={tagUsage} selected={filterTags} onToggle={toggleFilterTag} label="タグで絞り込む" />
        </div>
      )}

      {data.characters.length===0 ? (
        <div className="empty-hint">まだ何も登録されていません。「＋ 新規追加」から、必要になったぶんだけ増やしていけます。</div>
      ) : (
        buckets.map(b => b.items.length===0 ? null : (
          <div className="group-block" key={b.group.id}>
            <div className="group-head" onClick={()=>toggle(b.group.id)}>
              <span className="chev" style={{transform: collapsed[b.group.id]?'none':'rotate(90deg)'}}>▶</span>
              <h3 style={{margin:0}}>{b.group.name}</h3>
              <span className="idea-tag-pill">{b.items.length}</span>
            </div>
            {!collapsed[b.group.id] && (
              <div className="roster-grid">
                {b.items.map(it=>(
                  <button key={it.id} className="roster-card" onClick={()=>onOpen(it.id)}>
                    <IconThumb imageId={it.iconImageId || it.image} size={80} />
                    <div className="roster-body">
                      <div className="roster-name">{it.name || '（名称未設定）'}</div>
                      {it.category && <div className="roster-sub">{it.category}</div>}
                      {(it.tags||[]).length>0 && (
                        <div style={{marginTop:4}}>
                          {it.tags.map(t=><span key={t} className="idea-tag-pill" style={{marginRight:4, marginBottom:4, display:'inline-block'}}>{t}</span>)}
                        </div>
                      )}
                    </div>
                  </button>
                ))}
              </div>
            )}
          </div>
        ))
      )}

      {managingGroups && (
        <GroupsManagerModal title="キャラクターグループを管理" groups={groups}
          onAdd={addGroup} onRename={renameGroup} onDelete={deleteGroup} onMove={moveGroup}
          onClose={()=>setManagingGroups(false)}
          deleteHint="グループを削除しても、中のキャラクター自体は削除されません（未分類になります）。" />
      )}
    </div>
  );
}

/* ---- 人物身長比較表 ----
   身長データの正本は characters[].heightCm のみ。比較表専用のマスターや複製は持たず、
   選択状態・並び順・基準人物は画面内の一時的なUI状態としてこのコンポーネント内に閉じる。 */

// heightCm が「有効な正の数値」として扱えるキャラクターだけを抽出する（0以下・NaN・未設定は除外）。
// __order は元の登録順（data.characters内の並び順）を保持し、「登録順」表示や同身長時の並びに使う。
function collectValidHeightChars(characters){
  return (characters||[])
    .map((c, idx) => ({ c, idx }))
    .filter(({c}) => {
      const n = typeof c.heightCm === 'number' ? c.heightCm : parseFloat(c.heightCm);
      return Number.isFinite(n) && n > 0;
    })
    .map(({c, idx}) => ({ id:c.id, name:c.name, heightCm: Number(c.heightCm), __order: idx }));
}

function sortHeightChars(chars, sortMode){
  const arr = [...chars];
  if(sortMode==='asc') arr.sort((a,b)=> (a.heightCm-b.heightCm) || (a.__order-b.__order));
  else if(sortMode==='desc') arr.sort((a,b)=> (b.heightCm-a.heightCm) || (a.__order-b.__order));
  else arr.sort((a,b)=> a.__order-b.__order);
  return arr;
}

// 基準人物との差分：本人は呼び出し側で「基準」と表示するため、ここでは差分のみを扱う。
function formatHeightDiff(diffCm){
  const sign = diffCm===0 ? '±' : (diffCm>0 ? '＋' : '−');
  return `基準より ${sign}${Math.abs(diffCm)}cm`;
}

// 長い人物名をSVG内で2行までの目安で折り返す。それ以外（短い名前）は改行しない。
// 収まらない場合は2行目の末尾を省略する（正確なピクセル計測はしない簡易実装。文字単位で強制改行はしない＝1行に収まる限りは分割しない）。
function wrapNameForChart(name, maxCharsPerLine){
  const s = (name && String(name).trim()) || '（名称未設定）';
  if(s.length <= maxCharsPerLine) return [s];
  const line1 = s.slice(0, maxCharsPerLine);
  let line2 = s.slice(maxCharsPerLine);
  if(line2.length > maxCharsPerLine){
    line2 = line2.slice(0, Math.max(0, maxCharsPerLine-1)) + '…';
  }
  return [line1, line2];
}

// 落ち着いた色を人物ごとに自動で割り当てる（派手な原色は使わない）。表示順のインデックスで巡回する。
const HEIGHTCMP_PALETTE = [
  '#5b6089', // 紫がかった青
  '#4d6f86', // くすんだ青
  '#8a5049', // くすんだ赤
  '#4f7a72', // 青緑
  '#8a6a45', // 茶
  '#6a6560', // グレー
  '#705a8a', // 紫
  '#5a7a58', // くすんだ緑
];

// ---- シルエットの形（丸みのあるピクトグラム、パーツ別のSVG要素） ----
// 「頭上=0、床=100」のローカル座標に一度だけデザインし、実際の描画では
// <g transform="translate(centerX, headTopY) scale(heightPx/100)"> で縦横同比率に拡大縮小する。
// これにより全キャラクターが完全に同じ形・同じ比率になり、背が高い人物だけ太くなることもない。
// 頭・胴体・左右の腕・左右の脚をそれぞれ別のSVG要素として描き、関節部分は同色のまま少し重ねて
// 継ぎ目が目立たないようにする（尖った肘・膝・手首・足首は作らない）。約6.8頭身。
function mirrorRightHalfToClosedLoop(rightHalfPoints){
  const left = [...rightHalfPoints].slice().reverse().map(([x,y])=>[-x,y]);
  return [...rightHalfPoints, ...left];
}
function smoothClosedPathD(points){
  let d = `M ${points[0][0].toFixed(2)} ${points[0][1].toFixed(2)} `;
  for(let i=0;i<points.length;i++){
    const [x1,y1] = points[i];
    const [x2,y2] = points[(i+1)%points.length];
    const my = y1 + (y2-y1)*0.5;
    d += `C ${x1.toFixed(2)} ${my.toFixed(2)}, ${x2.toFixed(2)} ${my.toFixed(2)}, ${x2.toFixed(2)} ${y2.toFixed(2)} `;
  }
  return d + 'Z';
}
// 手・足・腕など「輪っか状の点列」を素直に閉じるための、区間中間点を制御点にした単純な二次ベジェ。
function limbPathD(points){
  let d = `M ${points[0][0].toFixed(2)} ${points[0][1].toFixed(2)} `;
  for(let i=0;i<points.length;i++){
    const [x1,y1] = points[i];
    const [x2,y2] = points[(i+1)%points.length];
    const mx = x1 + (x2-x1)*0.5, my = y1 + (y2-y1)*0.5;
    d += `Q ${mx.toFixed(2)} ${y1.toFixed(2)}, ${x2.toFixed(2)} ${my.toFixed(2)} `;
  }
  return d + 'Z';
}

// 胴体：首の下から腰までの、角のない丸い台形状の1パーツ。右半分の輪郭だけを上→下で書き、
// 左右対称にミラーして閉じる。上端・下端は頭や脚に少し重なる位置に置き、継ぎ目を隠す。
const HEIGHTCMP_TORSO_RIGHT = [
  [3, 16],    // 首（頭の下、短く細い）
  [9, 20],    // 肩（水平にせず、首からなだらかに下げる）
  [8.7, 28],  // 胸
  [6.8, 38],  // ウエスト（少し細くなる）
  [7.8, 46],  // 腰（脚の付け根、わずかに広がる程度）
  [3, 50],    // 下端（股のあたり、脚に重なって隠れる）
];
const HEIGHTCMP_TORSO_D = smoothClosedPathD(mirrorRightHalfToClosedLoop(HEIGHTCMP_TORSO_RIGHT));

// 腕（右）：肩の付け根は胴体に重ねて接続し、そこから胴体より少し外側へ離れつつ緩やかに細くなり、
// 手首を経て指のない小さな丸い手で終わる。肘・手首はどちらも尖らせない。
const HEIGHTCMP_ARM_R_LOCAL = [
  [10.5, 20],  // 肩の付け根・外側（胴体に重ねて継ぎ目を隠す）
  [13, 32],    // 二の腕外側（胴体から離れる）
  [12.4, 44],  // 前腕外側（手首をキュッとくびれさせず、なだらかに）
  [13.2, 51],  // 手のひら外側（丸み）
  [11.2, 56],  // 手先（指のない丸い先端）
  [9.7, 51],   // 手のひら内側
  [10, 44],    // 前腕内側
  [10.6, 31],  // 二の腕内側
  [10, 21],    // 肩の付け根・内側
];
const HEIGHTCMP_ARM_L_D = limbPathD(HEIGHTCMP_ARM_R_LOCAL.map(([x,y]) => [-x, y]));
const HEIGHTCMP_ARM_R_D = limbPathD(HEIGHTCMP_ARM_R_LOCAL);

// 脚（右）：腰の下（胴体下端に重ねる）から足先まで自然に細くなり、足首は尖らせず、
// 足先だけわずかに幅を持たせて丸く接地する。左右へ大きく張り出させない。
const HEIGHTCMP_LEG_R_LOCAL = [
  [4.8, 47],  // 腰・外側（胴体下端に重ねる）
  [5.8, 62],  // 太もも外側
  [4.9, 80],  // すね外側（膝を丸く通過）
  [4.5, 90],  // 足首外側（キュッとくびれさせず、なだらかに）
  [5.6, 97],  // 足の甲（丸く広がる）
  [4.8, 100], // 足先外側（丸く接地）
  [2.6, 100], // 足先内側
  [2.2, 97],  // 足首内側
  [1.8, 80],  // すね内側
  [2, 62],    // 太もも内側
  [2.2, 47],  // 腰・内側
];
const HEIGHTCMP_LEG_L_D = limbPathD(HEIGHTCMP_LEG_R_LOCAL.map(([x,y]) => [-x, y]));
const HEIGHTCMP_LEG_R_D = limbPathD(HEIGHTCMP_LEG_R_LOCAL);

const HEIGHTCMP_HEAD_R = 7.4;    // 頭の半径（ローカル座標。直径14.8 ≒ 全身の約1/6.8 → 約6.8頭身）
const HEIGHTCMP_HEAD_CY = HEIGHTCMP_HEAD_R; // 頭頂部(y=0)がheadTopYに一致するよう中心を半径ぶん下げる

// 約6.8頭身の、丸みのある無個性なピクトグラム型シルエット。全員が完全に同じ形・同じ比率で、
// heightPxに応じて<g>ごと縦横同比率に拡大縮小する（体格差は付けない、縦だけを伸ばさない）。
// heightPx はその人物の身長（heightCm）に比例した高さで、頭頂部が floorY-heightPx に一致する。
// 描画順は「脚→胴体→腕→頭」。同色で少し重ねて描くことで関節の継ぎ目を目立たなくしている。
function HeightSilhouette({ centerX, floorY, heightPx, color }){
  const headTopY = floorY - heightPx;
  const scale = heightPx/100;
  return (
    <g transform={`translate(${centerX} ${headTopY}) scale(${scale})`}>
      <path d={HEIGHTCMP_LEG_L_D} fill={color} />
      <path d={HEIGHTCMP_LEG_R_D} fill={color} />
      <path d={HEIGHTCMP_TORSO_D} fill={color} />
      <path d={HEIGHTCMP_ARM_L_D} fill={color} />
      <path d={HEIGHTCMP_ARM_R_D} fill={color} />
      <circle cx="0" cy={HEIGHTCMP_HEAD_CY} r={HEIGHTCMP_HEAD_R} fill={color} />
    </g>
  );
}

const HEIGHTCMP_CHART_PX = 300;    // 床から表示上限cmまでの縦ピクセル数（cm範囲に応じて自動縮尺）
const HEIGHTCMP_TOP_PAD = 34;      // 頭上の身長表示ぶんの余白（最上部の人物でも数値が切れない高さ）
const HEIGHTCMP_BOTTOM_PAD = 62;   // 足元の名前（最大2行）＋差分ぶんの余白
const HEIGHTCMP_COL_W = 118;       // 一人あたりの表示幅（丸みのある腕が隣と重ならないよう90〜110pxよりやや広め）
const HEIGHTCMP_AXIS_W = 54;       // 左側の目盛り軸の幅
const HEIGHTCMP_SIDE_PAD = 44;     // 目盛り領域とは別に確保する、先頭・末尾人物の左右余白（40px以上）
const HEIGHTCMP_MAJOR_STEP = 50;   // 数値付きの主要目盛り
const HEIGHTCMP_MINOR_STEP = 10;   // 数値なしの薄い補助目盛り
const HEIGHTCMP_GRID_MAJOR = 'rgba(44,42,40,0.20)';
const HEIGHTCMP_GRID_MINOR = 'rgba(44,42,40,0.10)';
const HEIGHTCMP_FLOOR_COLOR = '#3a362f';
const HEIGHTCMP_TEXT_COLOR = '#2c2a28';
const HEIGHTCMP_SUBTEXT_COLOR = '#6b665d';
const HEIGHTCMP_BASELINE_MARK = '#2c2a28';

function HeightCompareView({ data, onBack }){
  const validChars = useMemo(()=>collectValidHeightChars(data.characters), [data.characters]);
  const validIds = useMemo(()=>new Set(validChars.map(c=>c.id)), [validChars]);

  const [selectedIds, setSelectedIds] = useState(()=>new Set(validChars.map(c=>c.id)));
  const [sortMode, setSortMode] = useState('asc'); // 'registered' | 'asc' | 'desc'
  const [baselineId, setBaselineId] = useState('');
  const initRef = useRef(false);

  // 初回のみ：身長登録済みの人物をすべて選択状態にする
  useEffect(()=>{
    if(!initRef.current && validChars.length>0){
      initRef.current = true;
      setSelectedIds(new Set(validChars.map(c=>c.id)));
    }
  }, [validChars]);

  // 身長が未登録になった・削除されたキャラクターは選択状態から自然に外す
  useEffect(()=>{
    setSelectedIds(prev => {
      const next = new Set([...prev].filter(id=>validIds.has(id)));
      return next.size===prev.size ? prev : next;
    });
  }, [validIds]);

  const toggleSelect = (id) => setSelectedIds(prev => {
    const next = new Set(prev);
    if(next.has(id)) next.delete(id); else next.add(id);
    return next;
  });
  const selectAll = () => setSelectedIds(new Set(validChars.map(c=>c.id)));
  const selectNone = () => setSelectedIds(new Set());

  const displayChars = useMemo(()=>{
    const selected = validChars.filter(c=>selectedIds.has(c.id));
    return sortHeightChars(selected, sortMode);
  }, [validChars, selectedIds, sortMode]);

  const displayIds = useMemo(()=>new Set(displayChars.map(c=>c.id)), [displayChars]);

  // 基準人物が比較対象から外れたら「基準なし」へ戻す
  useEffect(()=>{
    if(baselineId && !displayIds.has(baselineId)) setBaselineId('');
  }, [baselineId, displayIds]);

  const baselineChar = baselineId ? displayChars.find(c=>c.id===baselineId) : null;

  // 表示上限cm：最大身長を50cm単位で切り上げ（+αの余白を含む）、最低200cmは確保する
  const maxH = displayChars.length ? Math.max(...displayChars.map(c=>c.heightCm)) : 0;
  const topCm = Math.max(Math.ceil((maxH + 15) / HEIGHTCMP_MAJOR_STEP) * HEIGHTCMP_MAJOR_STEP, 200);
  const pxPerCm = HEIGHTCMP_CHART_PX / topCm;
  const floorY = HEIGHTCMP_TOP_PAD + HEIGHTCMP_CHART_PX;
  const svgH = floorY + HEIGHTCMP_BOTTOM_PAD;
  const cmToY = (cm) => floorY - cm*pxPerCm;

  const majorTicks = [];
  for(let t=0; t<=topCm; t+=HEIGHTCMP_MAJOR_STEP) majorTicks.push(t);
  const minorTicks = [];
  for(let t=0; t<=topCm; t+=HEIGHTCMP_MINOR_STEP){ if(t % HEIGHTCMP_MAJOR_STEP !== 0) minorTicks.push(t); }

  const figuresW = HEIGHTCMP_SIDE_PAD*2 + HEIGHTCMP_COL_W*Math.max(displayChars.length,1);
  // 1文字あたりの目安幅を余裕を持って見積もり、短い名前は改行させず長い名前だけ2行に折り返す
  const maxCharsPerLine = Math.max(5, Math.floor((HEIGHTCMP_COL_W-14)/12));

  const axisSvgRef = useRef(null);
  const figuresSvgRef = useRef(null);

  const handleSaveSvg = () => {
    if(!axisSvgRef.current || !figuresSvgRef.current || displayChars.length===0) return;
    const axisNode = axisSvgRef.current;
    const figNode = figuresSvgRef.current;
    const axisW = HEIGHTCMP_AXIS_W;
    const figW = figuresW;
    const combined = document.createElementNS('http://www.w3.org/2000/svg','svg');
    combined.setAttribute('xmlns','http://www.w3.org/2000/svg');
    combined.setAttribute('width', String(axisW+figW));
    combined.setAttribute('height', String(svgH));
    combined.setAttribute('viewBox', `0 0 ${axisW+figW} ${svgH}`);
    const bg = document.createElementNS('http://www.w3.org/2000/svg','rect');
    bg.setAttribute('x','0'); bg.setAttribute('y','0');
    bg.setAttribute('width', String(axisW+figW)); bg.setAttribute('height', String(svgH));
    bg.setAttribute('fill', '#fbf9f4');
    combined.appendChild(bg);
    const axisClone = axisNode.cloneNode(true);
    while(axisClone.firstChild){ combined.appendChild(axisClone.firstChild); }
    const figGroup = document.createElementNS('http://www.w3.org/2000/svg','g');
    figGroup.setAttribute('transform', `translate(${axisW},0)`);
    const figClone = figNode.cloneNode(true);
    while(figClone.firstChild){ figGroup.appendChild(figClone.firstChild); }
    combined.appendChild(figGroup);
    let svgStr = new XMLSerializer().serializeToString(combined);
    if(!/^<\?xml/.test(svgStr)) svgStr = '<?xml version="1.0" encoding="UTF-8"?>\n' + svgStr;
    const blob = new Blob([svgStr], { type:'image/svg+xml;charset=utf-8' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url; a.download = 'キャラクター身長比較.svg';
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    URL.revokeObjectURL(url);
  };

  return (
    <div>
      <div className="breadcrumb"><button onClick={onBack}>← キャラクター一覧へ戻る</button></div>
      <div className="toolbar">
        <h1>📏 身長比較</h1>
        <div className="filler" />
        <button className="btn btn-sm" onClick={handleSaveSvg} disabled={displayChars.length===0}>SVGで保存</button>
      </div>

      {validChars.length===0 ? (
        <div className="empty-hint">身長が登録されているキャラクターがいません。キャラクター設定の「外見設定（詳細）」から身長を登録してください。</div>
      ) : (
        <>
          <CollapsibleSection title="比較設定" defaultOpen badge={`${selectedIds.size}人選択中`}>
            <div className="heightcmp-select-head">
              <button type="button" className="btn btn-sm" onClick={selectAll}>すべて選択</button>
              <button type="button" className="btn btn-sm" onClick={selectNone}>すべて解除</button>
              <span className="heightcmp-select-count">選択人数：{selectedIds.size}人 / {validChars.length}人</span>
            </div>
            <div className="tagpicker-list" style={{marginTop:8}}>
              {validChars.map(c=>(
                <button type="button" key={c.id}
                  className={"tagpicker-option"+(selectedIds.has(c.id)?" selected":"")}
                  onClick={()=>toggleSelect(c.id)}>
                  {selectedIds.has(c.id) ? '✓ ' : ''}{c.name || '（名称未設定）'}
                  <span className="tagpicker-option-count">{c.heightCm}cm</span>
                </button>
              ))}
            </div>

            <div className="heightcmp-control-row">
              <span className="heightcmp-control-label">並び順</span>
              <div className="heightcmp-btn-group">
                <button type="button" className={"btn btn-sm"+(sortMode==='registered'?" active":"")} onClick={()=>setSortMode('registered')}>登録順</button>
                <button type="button" className={"btn btn-sm"+(sortMode==='asc'?" active":"")} onClick={()=>setSortMode('asc')}>低い順</button>
                <button type="button" className={"btn btn-sm"+(sortMode==='desc'?" active":"")} onClick={()=>setSortMode('desc')}>高い順</button>
              </div>
            </div>

            <div className="heightcmp-control-row">
              <span className="heightcmp-control-label">基準人物</span>
              <select value={baselineId} onChange={e=>setBaselineId(e.target.value)} style={{maxWidth:220}}>
                <option value="">基準なし</option>
                {displayChars.map(c=>(
                  <option key={c.id} value={c.id}>{c.name || '（名称未設定）'}　{c.heightCm}cm</option>
                ))}
              </select>
            </div>
          </CollapsibleSection>

          {displayChars.length===0 ? (
            <div className="empty-hint">比較する人物が選択されていません。上の一覧からチップを選んでください。</div>
          ) : (
            <div className="card card-pad heightcmp-chart-card">
              {baselineChar && (
                <div className="heightcmp-baseline-label">基準人物：{baselineChar.name || '（名称未設定）'}　{baselineChar.heightCm}cm</div>
              )}
              <div className="heightcmp-chart-wrap">
                <svg ref={axisSvgRef} className="heightcmp-axis-svg" width={HEIGHTCMP_AXIS_W} height={svgH}
                  viewBox={`0 0 ${HEIGHTCMP_AXIS_W} ${svgH}`} style={{writingMode:'horizontal-tb'}}>
                  <text x={HEIGHTCMP_AXIS_W-8} y={HEIGHTCMP_TOP_PAD-18} textAnchor="end" fontSize="10.5" fill={HEIGHTCMP_SUBTEXT_COLOR}>cm</text>
                  {majorTicks.map(t=>(
                    <text key={t} x={HEIGHTCMP_AXIS_W-10} y={cmToY(t)+4} textAnchor="end" fontSize="11" fontWeight="600" fill={HEIGHTCMP_SUBTEXT_COLOR}>{t}</text>
                  ))}
                </svg>
                <div className="heightcmp-scroll">
                  <svg ref={figuresSvgRef} className="heightcmp-figures-svg" width={figuresW} height={svgH}
                    viewBox={`0 0 ${figuresW} ${svgH}`} style={{writingMode:'horizontal-tb'}}>
                    {/* 10cm刻みの薄い補助線（数値なし） */}
                    {minorTicks.map(t=>(
                      <line key={'mi'+t} x1="0" y1={cmToY(t)} x2={figuresW} y2={cmToY(t)} stroke={HEIGHTCMP_GRID_MINOR} strokeWidth="1" strokeDasharray="2,4" />
                    ))}
                    {/* 50cm刻みの主要目盛り線 */}
                    {majorTicks.map(t=>(
                      t===0 ? null : (
                        <line key={'ma'+t} x1="0" y1={cmToY(t)} x2={figuresW} y2={cmToY(t)} stroke={HEIGHTCMP_GRID_MAJOR} strokeWidth="1" />
                      )
                    ))}
                    {baselineChar && (
                      <line x1="0" y1={cmToY(baselineChar.heightCm)} x2={figuresW} y2={cmToY(baselineChar.heightCm)}
                        stroke={HEIGHTCMP_BASELINE_MARK} strokeWidth="1" strokeDasharray="5,4" opacity="0.55" />
                    )}
                    <line x1="0" y1={floorY} x2={figuresW} y2={floorY} stroke={HEIGHTCMP_FLOOR_COLOR} strokeWidth="1.75" />

                    {displayChars.map((c, i)=>{
                      const centerX = HEIGHTCMP_SIDE_PAD + i*HEIGHTCMP_COL_W + HEIGHTCMP_COL_W/2;
                      const isBaseline = c.id===baselineId;
                      const color = HEIGHTCMP_PALETTE[i % HEIGHTCMP_PALETTE.length];
                      const heightPx = c.heightCm*pxPerCm;
                      const headTopY = floorY - heightPx;
                      const nameLines = wrapNameForChart(c.name, maxCharsPerLine);
                      const diff = baselineChar ? (c.heightCm - baselineChar.heightCm) : null;
                      const nameY = floorY + 20;
                      const diffY = nameY + nameLines.length*15 + 4;
                      return (
                        <g key={c.id}>
                          <title>{c.name || '（名称未設定）'}（{c.heightCm}cm）</title>
                          {isBaseline && (
                            <rect x={HEIGHTCMP_SIDE_PAD + i*HEIGHTCMP_COL_W + 4} y={HEIGHTCMP_TOP_PAD-24}
                              width={HEIGHTCMP_COL_W-8} height={svgH-(HEIGHTCMP_TOP_PAD-24)-6}
                              fill="none" stroke={color} strokeWidth="1.25" strokeDasharray="3,3" rx="8" opacity="0.8" />
                          )}
                          {/* 頭上：身長 */}
                          <text x={centerX} y={headTopY-10} textAnchor="middle" fontSize="12" fontWeight="700" fill={HEIGHTCMP_TEXT_COLOR}>{c.heightCm}cm</text>
                          <HeightSilhouette centerX={centerX} floorY={floorY} heightPx={heightPx} color={color} />
                          {/* 足元：人物名 */}
                          {nameLines.map((line, li)=>(
                            <text key={li} x={centerX} y={nameY + li*15} textAnchor="middle" fontSize="11.5" fontWeight={isBaseline?"700":"500"} fill={HEIGHTCMP_TEXT_COLOR}>{line}</text>
                          ))}
                          {/* 足元：基準人物との差分（基準人物本人は「基準」とだけ表示） */}
                          {baselineChar && (
                            <text x={centerX} y={diffY} textAnchor="middle" fontSize="10.5" fontWeight={isBaseline?"700":"400"} fill={isBaseline?color:HEIGHTCMP_SUBTEXT_COLOR}>
                              {isBaseline ? '基準' : formatHeightDiff(diff)}
                            </text>
                          )}
                        </g>
                      );
                    })}
                  </svg>
                </div>
              </div>
            </div>
          )}
        </>
      )}
    </div>
  );
}

/* ---- 場所 / 建物（親子関係のツリー表示） ---- */
function buildLocationChildrenMap(locations){
  const byParent = {};
  locations.forEach(l => {
    const validParent = l.parentLocationId && locations.find(x=>x.id===l.parentLocationId) ? l.parentLocationId : null;
    (byParent[validParent] = byParent[validParent] || []).push(l);
  });
  return byParent;
}

function LocationTreeNode({ loc, byParent, depth, onOpen, collapsed, toggleCollapse }){
  const children = byParent[loc.id] || [];
  const hasChildren = children.length>0;
  const isCollapsed = collapsed[loc.id];
  return (
    <div>
      <div className="loc-tree-row" style={{paddingLeft: depth*18 + 4}}>
        {hasChildren ? (
          <button className="twisty" onClick={()=>toggleCollapse(loc.id)}>{isCollapsed ? '▶' : '▼'}</button>
        ) : <span style={{width:16, display:'inline-block', flexShrink:0}} />}
        <button className="loc-open" onClick={()=>onOpen(loc.id)}>
          <span style={{fontWeight:700}}>{loc.name || '（無名）'}</span>
          {loc.category && <span style={{fontSize:12, color:'var(--ink-soft)', marginLeft:6}}>（{loc.category}）</span>}
          {loc.summary && <div className="ec-summary" style={{margin:'2px 0 0'}}>{loc.summary}</div>}
        </button>
      </div>
      {hasChildren && !isCollapsed && children.map(c=>(
        <LocationTreeNode key={c.id} loc={c} byParent={byParent} depth={depth+1} onOpen={onOpen} collapsed={collapsed} toggleCollapse={toggleCollapse} />
      ))}
    </div>
  );
}

function LocationListView({ data, onOpen, onCreate }){
  const [collapsed, setCollapsed] = useState({});
  const toggleCollapse = (id) => setCollapsed(c=>({...c, [id]:!c[id]}));
  const byParent = buildLocationChildrenMap(data.locations);
  const roots = byParent[null] || [];
  return (
    <div>
      <div className="toolbar">
        <h1>📍 場所 / 建物</h1>
        <div className="filler" />
        <button className="btn btn-primary" onClick={onCreate}>＋ 新規追加</button>
      </div>
      {data.locations.length===0 ? (
        <div className="empty-hint">まだ何も登録されていません。「＋ 新規追加」から、必要になったぶんだけ増やしていけます。</div>
      ) : (
        <div className="card" style={{marginTop:10}}>
          {roots.map(r => (
            <LocationTreeNode key={r.id} loc={r} byParent={byParent} depth={0} onOpen={onOpen} collapsed={collapsed} toggleCollapse={toggleCollapse} />
          ))}
        </div>
      )}
    </div>
  );
}

  { id:'hiddenDesire', label:'本人が自覚していない本当の欲求', hint:'本人は気づいていないが、行動の奥に隠れている欲求を書きます（作者だけが知っていてもよい）', placeholder:'例：本当は誰かに頼りたい／実は復讐よりも安心を求めている' },

// 左右対比を5段階（1〜5、3=どちらでもない、null=未設定）で選ぶ入力。性格・信仰思想の両方で共用する。
function ScaleField({ label, leftLabel, rightLabel, hint, value, onChange }){
  return (
    <div className="scale-field">
      <div className="scale-field-head">
        <span className="scale-field-label">{label}</span>
        {value!=null && <button type="button" className="scale-field-reset" onClick={()=>onChange(null)}>未設定に戻す</button>}
      </div>
      {hint && <p className="scale-field-hint">{hint}</p>}
      <div className="scale-field-row">
        <span className="scale-field-side">{leftLabel}</span>
        <div className="scale-field-dots">
          {[1,2,3,4,5].map(n=>(
            <button key={n} type="button"
              className={"scale-dot"+(value===n?" active":"")+(n===3?" mid":"")}
              title={n===3?'どちらでもない':`${leftLabel}／${rightLabel}のうち${n}`}
              aria-label={`${leftLabel}〜${rightLabel} ${n}段階目`}
              onClick={()=>onChange(n)} />
          ))}
        </div>
        <span className="scale-field-side" style={{textAlign:'right'}}>{rightLabel}</span>
      </div>
    </div>
  );
}

// 好み専用：左右対比＋「どちらも好き」「どちらも苦手」＋未設定を選ぶ入力
function PreferenceField({ label, leftLabel, rightLabel, hint, value, onChange }){
  return (
    <div className="pref-field">
      <div className="pref-field-head">
        <span className="pref-field-label">{label || `${leftLabel} ／ ${rightLabel}`}</span>
        {value!=null && <button type="button" className="scale-field-reset" onClick={()=>onChange(null)}>未設定に戻す</button>}
      </div>
      {hint && <p className="pref-field-hint">{hint}</p>}
      <div className="pref-field-options">
        {PREFERENCE_OPTIONS.map(opt=>(
          <button key={opt.key} type="button"
            className={"pref-btn"+(value===opt.key?" active":"")}
            onClick={()=>onChange(opt.key)}>
            {opt.text(leftLabel, rightLabel)}
          </button>
        ))}
      </div>
    </div>
  );
}

// 数値入力とスライダーを連動させる入力（身長・体重など）。
// 数値欄はmin/maxを持たないため範囲外（人外キャラなど）もそのまま入力できる。
// スライダーは見た目上clamp(min〜max)した位置を表示するだけで、保存されている数値自体は書き換えない。
function SliderNumberField({ label, value, onChange, min, max, step, unit, sliderDefault }){
  const numVal = (value===null || value===undefined || value==='') ? '' : value;
  const sliderVal = (value===null || value===undefined || value==='') ? sliderDefault : clamp(Number(value), min, max);
  return (
    <div className="field-row">
      <label>{label}</label>
      <div className="slider-field">
        <input type="number" inputMode="decimal" className="slider-field-number" value={numVal}
          placeholder="未設定"
          onChange={e=>{ const raw=e.target.value; onChange(raw===''?null:Number(raw)); }} />
        <span className="slider-field-unit">{unit}</span>
        <input type="range" className="slider-field-range" min={min} max={max} step={step}
          value={sliderVal}
          onChange={e=>onChange(Number(e.target.value))} />
        {value!=null && value!=='' && <button type="button" className="slider-field-reset" onClick={()=>onChange(null)}>未設定に戻す</button>}
      </div>
    </div>
  );
}

// 宗教・信仰の有無／神や超常的存在を信じるかなど、単純な左右対比にしにくい項目用：選択肢＋自由記述
function BeliefSelectField({ label, value, onChange, options, detail, onDetailChange, detailPlaceholder }){
  return (

}

const PERSONALITY_RESULT_TEXT = {

const BELIEF_RESULT_TEXT = {

};

function resultBucket(value){ return value<=2 ? 0 : value>=4 ? 2 : 1; }
function answeredScaleEntries(defs, values, textMap){
  return defs.filter(d=>values[d.id]!=null).map(d=>({
    id:d.id, value:values[d.id], text:(textMap[d.id]||[])[resultBucket(values[d.id])] || ''
  }));
}
function makeCharacterAssessment(ch){
  const p = ch.personalityScale||{}, b = ch.beliefScale||{};
  const pEntries = answeredScaleEntries(PERSONALITY_SCALE_DEFS, p, PERSONALITY_RESULT_TEXT);
  const bEntries = answeredScaleEntries(BELIEF_SCALE_DEFS, b, BELIEF_RESULT_TEXT);
  const personalityText = pEntries.length ? `${pEntries.map(x=>x.text).join('。')}。` : '性格の回答がまだありません。';
  const beliefText = bEntries.length ? `${bEntries.map(x=>x.text).join('。')}。` : '思想・価値観の回答がまだありません。';
  const tensions = [];
  if(b.conflict>=4 && b.execution<=2) tensions.push('強硬策を正しいと考える一方、自分で犠牲を決断して実行することにはためらいがあります。誰なら命令できるのか、何が最後の一線を越えさせるのかを決めると人物の核になります。');
  if(b.conflict<=2 && b.execution>=4) tensions.push('対話を優先しますが、必要と判断した場面では自分で実力行使へ移れます。どの条件で交渉を打ち切るのかを決めると一貫します。');
  if(b.benefit>=4 && b.duty<=2) tensions.push('大勢の利益を重視しながら、家族や身近な相手も優先します。その相手だけは例外なのか、最後には全体を選ぶのかが物語上の葛藤になります。');
  if(b.change>=4 && b.lineage<=2) tensions.push('改革を望みながら家柄も守ろうとしています。家そのものではなく、家が本来守るべき理念を残したい人物として両立できます。');
  if(b.order<=2 && b.lineage>=4) tensions.push('秩序を重視する一方で、家の期待より自分の人生を選びます。現在の家や制度を「正しい秩序ではない」と考える理由があると自然です。');
  if(b.forgive>=4 && p.emotion>=4) tensions.push('冷静さと強い報復志向が同居しています。衝動的な復讐ではなく、長期計画として報いを与える人物にも見えます。');
  if(p.coop<=2 && p.risk>=4) tensions.push('周囲との協調を重視しながら大胆に動けます。仲間の合意を得てから大胆策へ進むのか、危機だけは独断するのかを決めると輪郭が出ます。');
  if(p.social<=2 && p.talk>=4) tensions.push('自分から交流を広げる方ではありませんが、親しい相手や得意な話題ではよく話す人物として自然に両立します。');
  if(!tensions.length && pEntries.length+bEntries.length>=4) tensions.push('大きく引っかかる組み合わせは見つかりませんでした。相手や状況による例外を一つ作ると、さらに人物らしくなります。');

  const snapshot = {};
  PERSONALITY_SCALE_DEFS.forEach(d=>{ if(p[d.id]!=null) snapshot[`p:${d.id}`]=p[d.id]; });
  BELIEF_SCALE_DEFS.forEach(d=>{ if(b[d.id]!=null) snapshot[`b:${d.id}`]=b[d.id]; });
  const previous = ch.characterAssessment && ch.characterAssessment.snapshot || {};
  const changes = [];
  [...PERSONALITY_SCALE_DEFS.map(d=>({...d,prefix:'p'})), ...BELIEF_SCALE_DEFS.map(d=>({...d,prefix:'b'}))].forEach(d=>{
    const key=`${d.prefix}:${d.id}`, before=previous[key], after=snapshot[key];
    if(before!=null && after!=null && before!==after){
      const beforeLabel=before<=2?d.left:before>=4?d.right:'中間';
      const afterLabel=after<=2?d.left:after>=4?d.right:'中間';
      changes.push(`${d.left}／${d.right}：${beforeLabel}寄り → ${afterLabel}寄り`);
    }
  });
  return { personalityText, beliefText, tensions, changes, snapshot, generatedAt:Date.now() };
}

/* ---- 組織 / 勢力 / 家系 ---- */
function OrganizationDetail({ data, id, updateItem, deleteItem, onBack, allChars, allLocations, allOrgs, addRelation, updateRelation, deleteRelation }){
  const org = data.organizations.find(o=>o.id===id);
  if(!org) return null;
  const patch = (p) => updateItem('organizations', id, p);
  const charOptions = allChars.map(c=>({id:c.id,label:c.name||'（無名）'}));
  // 所属人物：characters[].affiliationOrgIdsがSingle Source of Truthなので、ここから逆引きする。
  // organizations[].memberIdsはレガシーフィールドとして残すのみで、表示・更新には使わない。
  const memberIds = allChars.filter(c => (c.affiliationOrgIds||[]).includes(id)).map(c=>c.id);
  const setMemberIds = (nextIds) => {
    const before = new Set(memberIds);
    const after = new Set(nextIds);
    allChars.forEach(c=>{
      const was = before.has(c.id), now = after.has(c.id);
      if(was===now) return;
      const current = c.affiliationOrgIds||[];
      const updated = now ? [...current, id] : current.filter(oid=>oid!==id);
      updateItem('characters', c.id, { affiliationOrgIds: updated });
    });
  };
  const locOptions = allLocations.map(l=>({id:l.id,label:l.name||'（無名）'}));
  const relationOtherOptions = allOrgs.filter(o=>o.id!==id).map(o=>({id:o.id,label:o.name||'（無名）'}));

  const orgRelations = (data.entityRelations||[]).filter(r => r.fromId===id || r.toId===id);
  const [relDraft, setRelDraft] = useState(null); // null | {editingId, otherId, selfLabel, otherLabel, note}

  const startNewRelation = () => setRelDraft({ editingId:null, otherId:'', selfLabel:'', otherLabel:'', note:'' });
  const startEditRelation = (rel) => {
    const isFrom = rel.fromId===id;
    setRelDraft({
      editingId: rel.id,
      otherId: isFrom ? rel.toId : rel.fromId,
      selfLabel: isFrom ? (rel.label||'') : (rel.reverseLabel||''),
      otherLabel: isFrom ? (rel.reverseLabel||'') : (rel.label||''),
      note: rel.note || '',
    });
  };
  const saveRelation = () => {
    if(!relDraft || !relDraft.otherId) return;
    if(relDraft.editingId){
      const rel = data.entityRelations.find(r=>r.id===relDraft.editingId);
      if(!rel) { setRelDraft(null); return; }
      const isFrom = rel.fromId===id;
      updateRelation(rel.id, isFrom
        ? { toId: relDraft.otherId, label: relDraft.selfLabel, reverseLabel: relDraft.otherLabel, note: relDraft.note }
        : { fromId: relDraft.otherId, label: relDraft.otherLabel, reverseLabel: relDraft.selfLabel, note: relDraft.note }
      );
    } else {
      addRelation({ fromId:id, toId:relDraft.otherId, label:relDraft.selfLabel, reverseLabel:relDraft.otherLabel, note:relDraft.note, fromType:'organization', toType:'organization' });
    }
    setRelDraft(null);
  };
  const removeRelation = (relId) => { if(confirm('この関係を削除しますか？')) deleteRelation(relId); };

  return (
    <div>
      <div className="breadcrumb"><button onClick={onBack}>← 組織 / 勢力 / 家系一覧</button></div>
      <div className="toolbar">
        <input className="proj-title" style={{fontSize:20, flex:1}} value={org.name} placeholder="名称"
          onChange={e=>patch({name:e.target.value})} />
        <button className="btn btn-danger btn-sm" onClick={()=>{ if(confirm('この組織を削除しますか？')){ deleteItem(id); onBack(); } }}>削除</button>
      </div>
      <CollapsibleSection title="基本情報" defaultOpen preview={firstNonEmpty(org.summary, org.purpose)}>
        <div className="field-row"><label>カテゴリ（探す時の分類）</label><input type="text" value={org.category||''} onChange={e=>patch({category:e.target.value})} placeholder="軍事組織 / 政府 / 企業 / 宗教 / 研究機関 / 犯罪組織 / 家系・一族 / チーム など" /></div>
        <SingleImageField label="画像 / アイコン" imageId={org.image} onChange={img=>patch({image:img})} />
        <div className="field-row"><label>概要</label><FieldAutoTextarea value={org.summary||''} onChange={e=>patch({summary:e.target.value})} minHeight={110} /></div>
        <div className="field-row"><label>目的</label><FieldAutoTextarea value={org.purpose||''} onChange={e=>patch({purpose:e.target.value})} minHeight={130} /></div>
        <div className="field-row"><label>メモ</label><FieldAutoTextarea value={org.memo||''} onChange={e=>patch({memo:e.target.value})} minHeight={140} /></div>
      </CollapsibleSection>
      <CollapsibleSection title="自由項目" badge={(org.customFields||[]).length || null}>
        <CustomFieldsEditor fields={org.customFields} onChange={f=>patch({customFields:f})} />
      </CollapsibleSection>
      <CollapsibleSection title="所属・関連リンク" defaultOpen>
        <LinkPicker label="所属人物" options={charOptions} selectedIds={memberIds} onChange={setMemberIds} />
        <LinkPicker label="関連場所" options={locOptions} selectedIds={org.locationIds} onChange={ids=>patch({locationIds:ids})} />
      </CollapsibleSection>

      <CollapsibleSection title="関連・関係性（他の組織・家系との繋がり）" defaultOpen={orgRelations.length>0} badge={orgRelations.length || null}>
        <p style={{fontSize:12, color:'var(--ink-soft)', marginTop:0}}>「どの分類に入れるか」とは別に、他の組織・家系と具体的にどう繋がっているかをここに記録します。</p>
        {orgRelations.length===0 && <div className="empty-hint">まだ関係が登録されていません。</div>}
        {orgRelations.map(rel=>{
          const isFrom = rel.fromId===id;
          const otherId = isFrom ? rel.toId : rel.fromId;
          const otherOrg = allOrgs.find(o=>o.id===otherId);
          const label = isFrom ? rel.label : rel.reverseLabel;
          return (
            <div className="change-item" key={rel.id}>
              <div style={{display:'flex', justifyContent:'space-between', alignItems:'flex-start', gap:8, flexWrap:'wrap'}}>
                <div>
                  <div className="ci-title">{otherOrg ? (otherOrg.name||'（無名）') : '（削除済みの組織）'}</div>
                  {label && <div style={{fontSize:13, color:'var(--plum)', fontWeight:700}}>{label}</div>}
                  {rel.note && <div className="ci-desc">{rel.note}</div>}
                </div>
                <div style={{display:'flex', gap:6, flexShrink:0}}>
                  <button className="btn btn-sm" onClick={()=>startEditRelation(rel)}>編集</button>
                  <button className="btn btn-sm btn-danger" onClick={()=>removeRelation(rel.id)}>削除</button>
                </div>
              </div>
            </div>
          );
        })}
        <button className="btn btn-ghost btn-sm" onClick={startNewRelation}>＋ 関係を追加</button>
      </CollapsibleSection>

      {relDraft && (
        <Modal title={relDraft.editingId ? "関係を編集" : "関係を追加"} onClose={()=>setRelDraft(null)}>
          <SingleLinkPicker label="相手" options={relationOtherOptions} value={relDraft.otherId||null} onChange={v=>setRelDraft(d=>({...d, otherId:v||''}))} />
          <div className="field-row"><label>こちらから見た関係</label><input type="text" value={relDraft.selfLabel} onChange={e=>setRelDraft(d=>({...d, selfLabel:e.target.value}))} placeholder="慣例的に軍務へ従事 など" /></div>
          <div className="field-row"><label>相手から見た関係</label><input type="text" value={relDraft.otherLabel} onChange={e=>setRelDraft(d=>({...d, otherLabel:e.target.value}))} placeholder="代々人材を輩出 など" /></div>
          <div className="field-row"><label>詳細（任意）</label><FieldAutoTextarea value={relDraft.note} onChange={e=>setRelDraft(d=>({...d, note:e.target.value}))} minHeight={100} /></div>
          <div className="modal-actions">
            <button className="btn" onClick={()=>setRelDraft(null)}>キャンセル</button>
            <button className="btn btn-primary" disabled={!relDraft.otherId} onClick={saveRelation}>保存</button>
          </div>
        </Modal>
      )}
    </div>
  );
}

// locIdを起点に、その場所より下位（子孫）の場所IDの集合を返す（親選択での循環参照防止に使う）
function getDescendantLocationIds(locId, allLocations){
  const ids = new Set();
  const stack = [locId];
  while(stack.length){
    const cur = stack.pop();
    allLocations.forEach(l=>{
      if(l.parentLocationId===cur && !ids.has(l.id)){ ids.add(l.id); stack.push(l.id); }
    });
  }
  return ids;
}

function LocationDetail({ data, id, updateItem, deleteItem, onBack, allChars, allOrgs }){
  const loc = data.locations.find(l=>l.id===id);
  if(!loc) return null;
  const patch = (p) => updateItem('locations', id, p);
  const charOptions = allChars.map(c=>({id:c.id,label:c.name||'（無名）'}));
  const orgOptions = allOrgs.map(o=>({id:o.id,label:o.name||'（無名）'}));
  // 自分自身と、自分の子孫は「上位の場所」の候補から除外する（循環参照防止）
  const descendantIds = getDescendantLocationIds(id, data.locations);
  const parentOptions = data.locations
    .filter(l => l.id!==id && !descendantIds.has(l.id))
    .map(l => ({ id:l.id, label:l.name||'（無名）' }));

  return (
    <div>
      <div className="breadcrumb"><button onClick={onBack}>← 場所 / 建物一覧</button></div>
      <div className="toolbar">
        <input className="proj-title" style={{fontSize:20, flex:1}} value={loc.name} placeholder="名称"
          onChange={e=>patch({name:e.target.value})} />
        <button className="btn btn-danger btn-sm" onClick={()=>{ if(confirm('この場所を削除しますか？')){ deleteItem('locations', id); onBack(); } }}>削除</button>
      </div>
      <CollapsibleSection title="基本情報" defaultOpen preview={firstNonEmpty(loc.summary)}>
        <div className="field-row"><label>カテゴリ</label><input type="text" value={loc.category||''} onChange={e=>patch({category:e.target.value})} placeholder="惑星 / 国家 / 都市 / 建物 / 宇宙船 など" /></div>
        <SingleLinkPicker label="上位の場所（将来の地図・階層表示用）" options={parentOptions} value={loc.parentLocationId} onChange={v=>patch({parentLocationId:v})} />
        <SingleImageField label="画像" imageId={loc.image} onChange={img=>patch({image:img})} />
        <div className="field-row"><label>概要</label><FieldAutoTextarea value={loc.summary||''} onChange={e=>patch({summary:e.target.value})} minHeight={110} /></div>
        <div className="field-row"><label>メモ</label><FieldAutoTextarea value={loc.memo||''} onChange={e=>patch({memo:e.target.value})} minHeight={140} /></div>
      </CollapsibleSection>
      <CollapsibleSection title="自由項目" badge={(loc.customFields||[]).length || null}>
        <CustomFieldsEditor fields={loc.customFields} onChange={f=>patch({customFields:f})} />
      </CollapsibleSection>
      <CollapsibleSection title="所属・関連リンク" defaultOpen>
        <SingleLinkPicker label="所属 / 支配勢力" options={orgOptions} value={loc.controllingOrgId} onChange={v=>patch({controllingOrgId:v})} />
        <LinkPicker label="関連人物" options={charOptions} selectedIds={loc.relatedPersonIds} onChange={ids=>patch({relatedPersonIds:ids})} />
        <LinkPicker label="関連組織" options={orgOptions} selectedIds={loc.relatedOrgIds} onChange={ids=>patch({relatedOrgIds:ids})} />
      </CollapsibleSection>

function WorldSettings({ data, setData }){
  const [openGroupId, setOpenGroupId] = useState(null); // null=トップ画面
  const [showEmpty, setShowEmpty] = useState(false);
  const [addingCat, setAddingCat] = useState(false);
  const [newCatName, setNewCatName] = useState('');
  const [managingGroups, setManagingGroups] = useState(false);

  const patchCategory = (catId, patch) => {
    setData(d => ({...d, worldSettings: d.worldSettings.map(c=>c.id===catId?{...c,...patch}:c)}));
  };
  const addCard = (catId) => {
    setData(d => ({...d, worldSettings: d.worldSettings.map(c=>{
      if(c.id!==catId) return c;
      return {...c, cards:[...c.cards, {id: uid('wsd'), title:'', content:''}]};
    })}));
  };
  const updateCard = (catId, cardId, patch) => {
    setData(d => ({...d, worldSettings: d.worldSettings.map(c=>{
      if(c.id!==catId) return c;
      return {...c, cards: c.cards.map(card=>card.id===cardId?{...card,...patch}:card)};
    })}));
  };
  const removeCard = (catId, cardId) => {
    setData(d => ({...d, worldSettings: d.worldSettings.map(c=>{
      if(c.id!==catId) return c;
      return {...c, cards: c.cards.filter(card=>card.id!==cardId)};
    })}));
  };
  const removeCategory = (catId) => {
    if(!confirm('このカテゴリを削除しますか？中のカードも削除されます。')) return;
    setData(d => ({...d, worldSettings: d.worldSettings.filter(c=>c.id!==catId)}));
  };
  const addCategory = () => {
    if(!newCatName.trim()) return;
    const gid = openGroupId===WS_UNASSIGNED ? null : openGroupId;
    setData(d => ({...d, worldSettings: [...d.worldSettings, {id: uid('wsc'), name:newCatName.trim(), groupId: gid, cards:[]}]}));
    setNewCatName(''); setAddingCat(false);
  };

  const addGroup = (name) => setData(d=>({...d, worldSettingGroups:[...d.worldSettingGroups, {id:uid('wsg'), name, sortOrder:d.worldSettingGroups.length}]}));
  const renameGroup = (id, name) => setData(d=>({...d, worldSettingGroups:d.worldSettingGroups.map(g=>g.id===id?{...g,name}:g)}));
  const deleteGroup = (id) => {
    if(!confirm('この大分類を削除しますか？中のカテゴリは「その他」になります。')) return;
    setData(d=>({...d, worldSettingGroups:d.worldSettingGroups.filter(g=>g.id!==id), worldSettings:d.worldSettings.map(c=>c.groupId===id?{...c,groupId:null}:c)}));
    if(openGroupId===id) setOpenGroupId(null);
  };
  const moveGroup = (id, dir) => {
    const list = [...data.worldSettingGroups].sort((a,b)=>(a.sortOrder??0)-(b.sortOrder??0));
    const idx = list.findIndex(g=>g.id===id); const j = idx+dir;
    if(j<0||j>=list.length) return;
    [list[idx],list[j]]=[list[j],list[idx]];
    setData(d=>({...d, worldSettingGroups: list.map((g,i)=>({...g, sortOrder:i}))}));
  };

  const groups = [...data.worldSettingGroups].sort((a,b)=>(a.sortOrder??0)-(b.sortOrder??0));
  const knownGroupIds = new Set(groups.map(g=>g.id));

  // ---- トップ画面：大分類カードのみ ----
  if(openGroupId===null){
    const groupStats = groups.map(g => {
      const cats = data.worldSettings.filter(c=>c.groupId===g.id);
      return { group:g, catCount:cats.length, cardCount: cats.reduce((s,c)=>s+c.cards.length,0) };
    });
    const unassignedCats = data.worldSettings.filter(c=> !c.groupId || !knownGroupIds.has(c.groupId));
    groupStats.push({ group:{id:WS_UNASSIGNED, name:'その他'}, catCount:unassignedCats.length, cardCount:unassignedCats.reduce((s,c)=>s+c.cards.length,0) });

    return (
      <div>
        <h1>🌍 世界設定</h1>
        <p style={{color:'var(--ink-soft)', fontSize:13, marginTop:-6}}>全項目を埋める必要はありません。書いたぶんだけ表示されます。まずは大分類を選んでください。</p>
        <div className="dash-nav-grid">
          {groupStats.map(gs=>(
            <button key={gs.group.id} className="dash-nav-item ws-group-card" onClick={()=>setOpenGroupId(gs.group.id)}>
              <div className="icon">🗂</div>
              <div className="label">{gs.group.name}</div>
              <span className="count">{gs.catCount}カテゴリ ／ 設定{gs.cardCount}件</span>
            </button>
          ))}
        </div>
        <div style={{marginTop:16}}>
          <button className="btn btn-ghost btn-sm" onClick={()=>setManagingGroups(true)}>大分類を管理</button>
        </div>
        {managingGroups && (
          <GroupsManagerModal title="世界設定の大分類を管理" groups={groups}
            onAdd={addGroup} onRename={renameGroup} onDelete={deleteGroup} onMove={moveGroup}
            onClose={()=>setManagingGroups(false)}
            deleteHint="大分類を削除しても、中の設定カテゴリ自体は削除されません（「その他」になります）。" />
        )}
      </div>
    );
  }

  // ---- 大分類の中身：設定カテゴリ一覧（従来の折りたたみカード） ----
  const currentGroupName = openGroupId===WS_UNASSIGNED ? 'その他' : ((groups.find(g=>g.id===openGroupId)||{}).name || 'その他');
  const catsInGroup = data.worldSettings.filter(c => openGroupId===WS_UNASSIGNED ? (!c.groupId || !knownGroupIds.has(c.groupId)) : c.groupId===openGroupId);
  const filled = catsInGroup.filter(c=>c.cards.length>0);
  const empty = catsInGroup.filter(c=>c.cards.length===0);

  return (
    <div>
      <div className="breadcrumb"><button onClick={()=>setOpenGroupId(null)}>← 世界設定（大分類）</button></div>
      <h1>🗂 {currentGroupName}</h1>
      <p style={{color:'var(--ink-soft)', fontSize:13, marginTop:-6}}>全項目を埋める必要はありません。書いたぶんだけ表示されます。</p>

      {filled.length===0 && !showEmpty && (
        <div className="empty-hint">この大分類にはまだ世界設定がありません。下の「空のカテゴリを表示」から書きたい項目を選ぶか、新規カテゴリを追加してください。</div>
      )}

      {filled.map(cat => <WsCategoryBlock key={cat.id} cat={cat} groups={groups} onAddCard={()=>addCard(cat.id)} onUpdateCard={(cid,p)=>updateCard(cat.id,cid,p)} onRemoveCard={(cid)=>removeCard(cat.id,cid)} onRemoveCategory={()=>removeCategory(cat.id)} onRename={(name)=>patchCategory(cat.id,{name})} onChangeGroup={(gid)=>patchCategory(cat.id,{groupId:gid})} />)}

      <button className="hidden-cats-toggle" onClick={()=>setShowEmpty(s=>!s)}>
        {showEmpty ? '▲ 未使用カテゴリを隠す' : `▼ 未使用カテゴリを表示（${empty.length}）`}
      </button>

      {showEmpty && empty.map(cat => <WsCategoryBlock key={cat.id} cat={cat} groups={groups} onAddCard={()=>addCard(cat.id)} onUpdateCard={(cid,p)=>updateCard(cat.id,cid,p)} onRemoveCard={(cid)=>removeCard(cat.id,cid)} onRemoveCategory={()=>removeCategory(cat.id)} onRename={(name)=>patchCategory(cat.id,{name})} onChangeGroup={(gid)=>patchCategory(cat.id,{groupId:gid})} />)}

      <div style={{marginTop:16}}>
        {addingCat ? (
          <div style={{display:'flex', gap:8}}>
            <input type="text" value={newCatName} placeholder="新しいカテゴリ名" onChange={e=>setNewCatName(e.target.value)}
              style={{padding:'8px 10px', border:'1px solid var(--line)', borderRadius:6}} />
            <button className="btn btn-primary btn-sm" onClick={addCategory}>追加</button>
            <button className="btn btn-sm" onClick={()=>setAddingCat(false)}>取消</button>
          </div>
        ) : (
          <button className="btn btn-ghost btn-sm" onClick={()=>setAddingCat(true)}>＋ 新規カテゴリを追加</button>
        )}
      </div>
    </div>
  );
}

  return (
    <div className="ws-category card">
      <div className="ws-category-head" onClick={()=>setOpen(o=>!o)}>
        <span className="chev" style={{transform: open?'rotate(90deg)':'none', fontSize:11, color:'var(--ink-soft)'}}>▶</span>
        <input type="text" value={cat.name} onClick={e=>e.stopPropagation()} onChange={e=>onRename(e.target.value)}
          style={{border:'none', background:'none', fontFamily:'"Shippori Mincho",serif', fontWeight:700, fontSize:15, flex:1}} />
        <span className="count">{cat.cards.length}</span>
      </div>
      {open && (
        <div style={{padding:'0 14px 14px'}}>
          <div className="field-row" style={{maxWidth:220}}>
            <label>大分類</label>
            <select value={cat.groupId||''} onClick={e=>e.stopPropagation()} onChange={e=>onChangeGroup(e.target.value||null)}>
              <option value="">その他</option>
              {groups.map(g=><option key={g.id} value={g.id}>{g.name}</option>)}
            </select>
          </div>
          {cat.cards.map(card=>(
            <div className="ws-card" key={card.id}>
              <input type="text" placeholder="小見出し（例：通貨の名前）" value={card.title}
                onChange={e=>onUpdateCard(card.id,{title:e.target.value})}
                style={{width:'100%', border:'none', background:'none', fontFamily:'"Shippori Mincho",serif', fontWeight:700, fontSize:15.5, marginBottom:8}} />
              <AutoTextarea placeholder="内容（長文をそのまま貼り付けてもOK。入力に合わせて枠が伸びます）" value={card.content}
                onChange={e=>onUpdateCard(card.id,{content:e.target.value})} minHeight={140} />
              <div style={{textAlign:'right', marginTop:6}}>
                <button className="btn btn-sm btn-danger" onClick={()=>onRemoveCard(card.id)}>削除</button>

          ))}

            <button className="btn btn-ghost btn-sm" onClick={onAddCard}>＋ カードを追加</button>
            <button className="btn btn-sm btn-danger" onClick={onRemoveCategory}>カテゴリごと削除</button>
          </div>
        </div>
      )}
    </div>
  );
}

/* ============ 年表 ============ */
function Timeline({ data, setData, allChars, allOrgs, allLocations, openEntity }){
  const [editing, setEditing] = useState(null); // id or 'new'

  const items = [...data.timeline].sort((a,b)=>(a.sortOrder??0)-(b.sortOrder??0));

  const openNew = () => {
    const ev = { id: uid('tl'), dateLabel:'', title:'', summary:'', detail:'', personIds:[], orgIds:[], locationIds:[], tags:[], sortOrder: items.length };
    setData(d=>({...d, timeline:[...d.timeline, ev]}));
    setEditing(ev.id);
  };
  const update = (id, patch) => setData(d=>({...d, timeline: d.timeline.map(e=>e.id===id?{...e,...patch}:e)}));
  const remove = (id) => { setData(d=>({...d, timeline: d.timeline.filter(e=>e.id!==id)})); setEditing(null); };
  const move = (id, dir) => {
    const idx = items.findIndex(e=>e.id===id);
    const j = idx+dir;
    if(j<0||j>=items.length) return;
    const reordered = [...items];
    [reordered[idx], reordered[j]] = [reordered[j], reordered[idx]];
    const withOrder = reordered.map((e,i)=>({...e, sortOrder:i}));
    setData(d=>({...d, timeline: d.timeline.map(e=> withOrder.find(w=>w.id===e.id) || e)}));
  };

  const editingEv = editing ? data.timeline.find(e=>e.id===editing) : null;
  const charOptions = allChars.map(c=>({id:c.id,label:c.name||'（無名）'}));
  const orgOptions = allOrgs.map(o=>({id:o.id,label:o.name||'（無名）'}));
  const locOptions = allLocations.map(l=>({id:l.id,label:l.name||'（無名）'}));

  return (
    <div>
      <div className="toolbar">
        <h1>📜 年表</h1>
        <div className="filler" />
        <button className="btn btn-primary" onClick={openNew}>＋ イベント追加</button>
      </div>

      {items.length===0 && <div className="empty-hint">まだイベントがありません。日時は自由な表記でOKです（「宇宙暦120年」「主人公18歳」など）。</div>}

      <div className="card" style={{marginTop:10}}>
        {items.map((ev,i)=>(
          <div className="tl-item" key={ev.id}>
            <div className="tl-order-btns">
              <button onClick={()=>move(ev.id,-1)} disabled={i===0}>↑</button>
              <button onClick={()=>move(ev.id,1)} disabled={i===items.length-1}>↓</button>
            </div>
            <div className="tl-date">{ev.dateLabel || '（日時未設定）'}</div>
            <div className="tl-body" onClick={()=>setEditing(ev.id)} style={{cursor:'pointer'}}>
              <div className="tl-title">{ev.title || '（無題のイベント）'}</div>
              {ev.summary && <div className="tl-summary">{ev.summary}</div>}
              {ev.tags && ev.tags.length>0 && <div style={{marginTop:4}}>{ev.tags.map(t=><span className="idea-tag-pill" key={t} style={{marginRight:4}}>{t}</span>)}</div>}
            </div>
          </div>
        ))}
      </div>

      {editingEv && (
        <Modal title="年表イベント" onClose={()=>setEditing(null)} wide>
          <div className="field-grid">
            <div className="field-row"><label>日時 / 年代（自由表記）</label><input type="text" value={editingEv.dateLabel} onChange={e=>update(editingEv.id,{dateLabel:e.target.value})} placeholder="宇宙暦120年 / 10年前 / 主人公18歳 など" /></div>
            <div className="field-row"><label>タイトル</label><input type="text" value={editingEv.title} onChange={e=>update(editingEv.id,{title:e.target.value})} /></div>
          </div>
          <div className="field-row"><label>概要</label><FieldAutoTextarea value={editingEv.summary} onChange={e=>update(editingEv.id,{summary:e.target.value})} minHeight={110} /></div>
          <div className="field-row"><label>詳細</label><FieldAutoTextarea value={editingEv.detail} onChange={e=>update(editingEv.id,{detail:e.target.value})} minHeight={160} /></div>
          <div className="field-row"><label>タグ（カンマ区切り）</label>
            <input type="text" value={(editingEv.tags||[]).join(', ')}
              onChange={e=>update(editingEv.id,{tags:e.target.value.split(',').map(s=>s.trim()).filter(Boolean)})} />
          </div>
          <LinkPicker label="関連人物" options={charOptions} selectedIds={editingEv.personIds} onChange={ids=>update(editingEv.id,{personIds:ids})} />
          <LinkPicker label="関連組織" options={orgOptions} selectedIds={editingEv.orgIds} onChange={ids=>update(editingEv.id,{orgIds:ids})} />
          <LinkPicker label="関連場所" options={locOptions} selectedIds={editingEv.locationIds} onChange={ids=>update(editingEv.id,{locationIds:ids})} />
          <div className="modal-actions">
            <button className="btn btn-danger" onClick={()=>remove(editingEv.id)}>このイベントを削除</button>
            <button className="btn btn-primary" onClick={()=>setEditing(null)}>閉じる</button>
          </div>
        </Modal>
      )}
    </div>
  );
}

/* ============ ネタ箱 ============ */

  const [quickText, setQuickText] = useState('');
  const [quickType, setQuickType] = useState('アイデア');
  const [filterType, setFilterType] = useState('すべて');
  const [filterStatus, setFilterStatus] = useState('すべて');
  const [editing, setEditing] = useState(null);

  const quickAdd = () => {
    if(!quickText.trim()) return;
    const idea = { id: uid('idea'), content: quickText.trim(), type: quickType, tags:[], personIds:[], orgIds:[], locationIds:[], status:'未使用', usedIn:'', createdAt: Date.now() };
    setData(d=>({...d, ideas:[idea, ...d.ideas]}));
    setQuickText('');
  };

  const update = (id, patch) => setData(d=>({...d, ideas: d.ideas.map(i=>i.id===id?{...i,...patch}:i)}));
  const remove = (id) => { setData(d=>({...d, ideas: d.ideas.filter(i=>i.id!==id)})); setEditing(null); };

  const filtered = data.ideas.filter(i =>
    (filterType==='すべて' || i.type===filterType) &&
    (filterStatus==='すべて' || i.status===filterStatus)
  );

  const editingIdea = editing ? data.ideas.find(i=>i.id===editing) : null;
  const charOptions = allChars.map(c=>({id:c.id,label:c.name||'（無名）'}));
  const orgOptions = allOrgs.map(o=>({id:o.id,label:o.name||'（無名）'}));
  const locOptions = allLocations.map(l=>({id:l.id,label:l.name||'（無名）'}));

  return (
    <div>
      <h1>💡 ネタ箱</h1>
      <div className="idea-quickbar">
        <textarea placeholder="思いついたセリフ・シーン・設定などをそのまま書く…" value={quickText}
          onChange={e=>setQuickText(e.target.value)}
          onKeyDown={e=>{ if(e.key==='Enter' && (e.metaKey||e.ctrlKey)) quickAdd(); }} />
        <select value={quickType} onChange={e=>setQuickType(e.target.value)}>

        <button className="btn btn-primary" onClick={quickAdd}>保存</button>

      <div className="toolbar" style={{marginBottom:10}}>
        <select value={filterType} onChange={e=>setFilterType(e.target.value)}>
          <option>すべて</option>
          {IDEA_TYPES.map(t=><option key={t}>{t}</option>)}
        </select>
        <select value={filterStatus} onChange={e=>setFilterStatus(e.target.value)}>
          <option>すべて</option>
          {IDEA_STATUSES.map(s=><option key={s}>{s}</option>)}

        <div className="filler" />
        <span style={{fontSize:12, color:'var(--ink-soft)'}}>{filtered.length} 件</span>

      {filtered.map(idea=>(

          <div className="ic-top">
            <div style={{display:'flex', gap:6, flexWrap:'wrap'}}>
              <span className="idea-tag-pill">{idea.type}</span>
              <span className={"status-pill status-"+idea.status}>{idea.status}</span>

      {editingIdea && (
        <Modal title="ネタの詳細" onClose={()=>setEditing(null)} wide>
          <div className="field-row"><label>内容</label><FieldAutoTextarea value={editingIdea.content} onChange={e=>update(editingIdea.id,{content:e.target.value})} minHeight={140} /></div>
          <div className="field-grid">
            <div className="field-row"><label>種類</label>
              <select value={editingIdea.type} onChange={e=>update(editingIdea.id,{type:e.target.value})}>

              <select value={editingIdea.status} onChange={e=>update(editingIdea.id,{status:e.target.value})}>

              </select>
            </div>
          </div>
          <div className="field-row"><label>使用先（メモ）</label><input type="text" value={editingIdea.usedIn||''} onChange={e=>update(editingIdea.id,{usedIn:e.target.value})} placeholder="第3章 桜井とのシーン など" /></div>
          <div className="field-row"><label>タグ（カンマ区切り）</label>
            <input type="text" value={(editingIdea.tags||[]).join(', ')}
              onChange={e=>update(editingIdea.id,{tags:e.target.value.split(',').map(s=>s.trim()).filter(Boolean)})} />
          </div>
          <LinkPicker label="関連人物" options={charOptions} selectedIds={editingIdea.personIds} onChange={ids=>update(editingIdea.id,{personIds:ids})} />
          <LinkPicker label="関連組織" options={orgOptions} selectedIds={editingIdea.orgIds} onChange={ids=>update(editingIdea.id,{orgIds:ids})} />
          <LinkPicker label="関連場所" options={locOptions} selectedIds={editingIdea.locationIds} onChange={ids=>update(editingIdea.id,{locationIds:ids})} />
          <div className="modal-actions">
            <button className="btn btn-danger" onClick={()=>remove(editingIdea.id)}>削除</button>
            <button className="btn btn-primary" onClick={()=>setEditing(null)}>閉じる</button>
          </div>
        </Modal>
      )}
    </div>
  );
}

/* ============ プロット ============ */
function Plot({ data, setData, allChars, allLocations }){
  const plot = data.plot;
  const setPlot = (p) => setData(d=>({...d, plot: {...d.plot, ...p}}));

  // 構成方式は「章に付けられるラベルの候補」を切り替えるだけ。
  // 既存の章・シーン・各種リンクは一切変更・削除しない。
  const changeStructureType = (presetName) => setPlot({ structureType: presetName });

  const addChapter = () => setPlot({ chapters: [...plot.chapters, { id: uid('ch'), title:'新しい章', stage:'', scenes: [] }] });
  const updateChapter = (id, patch) => setPlot({ chapters: plot.chapters.map(c=>c.id===id?{...c,...patch}:c) });
  const removeChapter = (id) => { if(confirm('この章を削除しますか？中のシーンも削除されます。')) setPlot({ chapters: plot.chapters.filter(c=>c.id!==id) }); };

  const addScene = (chId) => updateChapterScenes(chId, scenes => [...scenes, { id: uid('sc'), summary:'', personIds:[], locationIds:[], ideaIds:[], foreshadowing:[] }]);
  const updateChapterScenes = (chId, fn) => setPlot({ chapters: plot.chapters.map(c=> c.id===chId ? {...c, scenes: fn(c.scenes)} : c) });
  const updateScene = (chId, scId, patch) => updateChapterScenes(chId, scenes => scenes.map(s=>s.id===scId?{...s,...patch}:s));
  const removeScene = (chId, scId) => updateChapterScenes(chId, scenes => scenes.filter(s=>s.id!==scId));
  const moveScene = (chId, scId, dir) => updateChapterScenes(chId, scenes => {
    const idx = scenes.findIndex(s=>s.id===scId); const j = idx+dir;
    if(j<0||j>=scenes.length) return scenes;
    const next=[...scenes]; [next[idx],next[j]]=[next[j],next[idx]]; return next;
  });

  const charOptions = allChars.map(c=>({id:c.id,label:c.name||'（無名）'}));
  const locOptions = allLocations.map(l=>({id:l.id,label:l.name||'（無名）'}));
  const ideaOptions = data.ideas.map(i=>({id:i.id,label:(i.content||'').slice(0,20)||'（無題）'}));
  const stageChoices = PLOT_PRESETS[plot.structureType] || [];

  return (
    <div>
      <h1>🗂 旧プロット</h1>
      <div className="field-row" style={{maxWidth:280}}>
        <label>構成方式（章に付けられるラベルの候補が切り替わります）</label>
        <select value={plot.structureType} onChange={e=>changeStructureType(e.target.value)}>
          {Object.keys(PLOT_PRESETS).map(k=><option key={k}>{k}</option>)}
        </select>
      </div>

      {plot.chapters.length===0 && <div className="empty-hint">章がありません。「＋ 章を追加」から始められます。</div>}

              <div style={{display:'flex', gap:8}}>
                <div className="scene-order-btns">
                  <button className="btn btn-sm" onClick={()=>moveScene(ch.id,sc.id,-1)} disabled={i===0}>↑</button>
                  <button className="btn btn-sm" onClick={()=>moveScene(ch.id,sc.id,1)} disabled={i===ch.scenes.length-1}>↓</button>
                </div>
                <div style={{flex:1}}>
                  <AutoTextarea style={{padding:'6px 8px', border:'1px solid var(--line)', borderRadius:4}} minHeight={100}
                    placeholder="シーン概要" value={sc.summary} onChange={e=>updateScene(ch.id,sc.id,{summary:e.target.value})} />
                </div>
                <button className="btn btn-sm btn-danger" onClick={()=>removeScene(ch.id,sc.id)}>削除</button>
              </div>
              <div style={{marginTop:6}}>
                <LinkPicker label="登場人物" options={charOptions} selectedIds={sc.personIds} onChange={ids=>updateScene(ch.id,sc.id,{personIds:ids})} />
                <LinkPicker label="場所" options={locOptions} selectedIds={sc.locationIds} onChange={ids=>updateScene(ch.id,sc.id,{locationIds:ids})} />
                <LinkPicker label="関連ネタ" options={ideaOptions} selectedIds={sc.ideaIds} onChange={ids=>updateScene(ch.id,sc.id,{ideaIds:ids})} />
                <div className="field-row"><label>伏線メモ（カンマ区切り）</label>
                  <input type="text" value={(sc.foreshadowing||[]).join(', ')}
                    onChange={e=>updateScene(ch.id,sc.id,{foreshadowing:e.target.value.split(',').map(s=>s.trim()).filter(Boolean)})} />
                </div>
              </div>
            </div>
          ))}
          <div style={{padding:'10px 14px'}}>
            <button className="btn btn-ghost btn-sm" onClick={()=>addScene(ch.id)}>＋ シーンを追加</button>
          </div>
        </div>
      ))}
      <button className="btn btn-ghost" onClick={addChapter}>＋ 章を追加</button>
    </div>
  );
}

  useEffect(()=>{

  const addChapter = () => {

  const update = (id, patch) => setData(d=>({...d,writings:d.writings.map(w=>{

    const blocks=(w.blocks||[]).map(b=>b.id===(activeBlockId||w.blocks[0].id)?{...b,body:patch.body}:b);

  const updateBlocks=(id,fn)=>setData(d=>({...d,writings:d.writings.map(w=>{

  // ---- 下書き（複数保存）。activeDraftIdが指し示す1件だけを編集対象にする。

  const trashedDrafts = (data.drafts||[]).filter(d=>d.deleted);
  const activeDraft = liveDrafts.find(d=>d.id===data.activeDraftId) || null;

  const selectedDraftText=()=>{
    const el=textareaRef.current, body=activeDraft?activeDraft.body:'';

  };
  // 直前版の記録。履歴は最新5件まで（古いものから捨てる）。直前と同じ内容なら追加しない。
  const pushDraftHistory=(draftId,body)=>{
    setData(d=>({...d,drafts:(d.drafts||[]).map(x=>{

          <label style={copyDlg.selText.trim()?null:{opacity:.45}}><input type="radio" name="copyrange" disabled={!copyDlg.selText.trim()} checked={copyDlg.useSelection} onChange={()=>setCopyDlg(d=>({...d,useSelection:true}))} /> 選択範囲（{copyDlg.selText.length.toLocaleString()}文字）{!copyDlg.selText.trim() && '※下書きで文字を選ぶと使えます'}</label>

      <div className="field-row"><label>コピー先</label>
        <select value={copyDlg.chapterId} onChange={e=>setCopyDlg(d=>({...d,chapterId:e.target.value,blockId:'',mode:e.target.value==='new'?'newScene':d.mode}))}>
          {(data.writings||[]).map(w=><option key={w.id} value={w.id}>{w.title}</option>)}
