// ---- 辞典編集モーダル：見出し語一覧（検索・カテゴリフィルタ）→ タップした1件の詳細 → 候補表現の詳細、の3階層 ----
function ExpressionDictionaryEditorModal({ expressionDictionary, setExpressionDictionary, onClose }){
  const entries = expressionDictionary.entries || [];
  const [view, setView] = useState('list'); // 'list' | 'entry' | 'expression'
  const [query, setQuery] = useState('');
  const [categoryFilter, setCategoryFilter] = useState('');
  const [editingEntryId, setEditingEntryId] = useState(null);
  const [editingExpr, setEditingExpr] = useState(null); // { mode:'edit', id } | { mode:'new' }
  const [draftExprText, setDraftExprText] = useState('');
  const [draftExprTags, setDraftExprTags] = useState([]);
  const [draftExprNote, setDraftExprNote] = useState('');

  // 実データから動的にカテゴリフィルタ候補を作る（固定リストではない）
  const categoryOptions = useMemo(()=>{
    const set = new Set();
    entries.forEach(e=>{ if(e.category) set.add(e.category); });
    return Array.from(set);
  }, [entries]);

  const q = query.trim().toLowerCase();
  const matchEntry = (entry) => {
    if(categoryFilter && entry.category!==categoryFilter) return false;
    if(!q) return true;
    if((entry.headword||'').toLowerCase().includes(q)) return true;
    if((entry.category||'').toLowerCase().includes(q)) return true;
    if((entry.aliases||[]).some(a=>(a||'').toLowerCase().includes(q))) return true;
    if((entry.expressions||[]).some(x => (x.text||'').toLowerCase().includes(q) || (x.tags||[]).some(t=>(t||'').toLowerCase().includes(q)))) return true;
    return false;
  };
  const filteredEntries = entries.filter(matchEntry);

  // ---- CRUD：見出し語（既存ロジックを維持。データ構造は不変） ----
  const updateEntry = (id, patch) => {
    setExpressionDictionary(ed=>({ ...ed, entries: ed.entries.map(e=>e.id===id?{...e,...patch}:e) }));
  };
  const addEntry = () => {
    const id = uid('expr');
    const e = { id, headword:'新しい見出し語', aliases:[], category:'', notes:'', expressions:[] };
    setExpressionDictionary(ed=>({ ...ed, entries: [...ed.entries, e] }));
    setEditingEntryId(id);
    setView('entry');
  };
  const deleteEntry = (id) => {
    if(!confirm('この見出し語を削除しますか？登録済みの候補表現もすべて削除されます。')) return;
    setExpressionDictionary(ed=>({ ...ed, entries: ed.entries.filter(e=>e.id!==id) }));
    setEditingEntryId(null);
    setView('list');
  };

  // ---- CRUD：候補表現（既存ロジックを維持） ----
  const addExpression = (entryId, text, tags, note) => {
    const exId = uid('exprtx');
    setExpressionDictionary(ed=>({ ...ed, entries: ed.entries.map(e=>e.id===entryId
      ? { ...e, expressions:[...e.expressions, { id: exId, text, tags: tags||[], note: note||'' }] } : e) }));
    return exId;
  };
  const updateExpression = (entryId, exprId, patch) => {
    setExpressionDictionary(ed=>({ ...ed, entries: ed.entries.map(e=>e.id===entryId
      ? { ...e, expressions: e.expressions.map(x=>x.id===exprId?{...x,...patch}:x) } : e) }));
  };
  const deleteExpression = (entryId, exprId) => {
    setExpressionDictionary(ed=>({ ...ed, entries: ed.entries.map(e=>e.id===entryId
      ? { ...e, expressions: e.expressions.filter(x=>x.id!==exprId) } : e) }));
  };

  const openEntry = (id) => { setEditingEntryId(id); setView('entry'); };
  const backToList = () => { setEditingEntryId(null); setView('list'); };
  const openExpressionEdit = (id) => { setEditingExpr({ mode:'edit', id }); setView('expression'); };
  const openExpressionNew = () => { setDraftExprText(''); setDraftExprTags([]); setDraftExprNote(''); setEditingExpr({ mode:'new' }); setView('expression'); };
  const backToEntry = () => { setEditingExpr(null); setView('entry'); };

  const currentEntry = editingEntryId ? entries.find(e=>e.id===editingEntryId) : null;

  // 見出し語が削除された等で参照が消えていたら一覧へ戻す
  if(view!=='list' && !currentEntry){
    return (
      <Modal title="表現辞典を編集" onClose={onClose} dict>
        <div className="empty-hint">この見出し語は削除されました。</div>
        <div className="modal-actions"><button className="btn btn-primary" onClick={()=>{ setView('list'); setEditingEntryId(null); setEditingExpr(null); }}>← 一覧へ戻る</button></div>
      </Modal>
    );
  }

  // ==== 一覧（トップ）：検索＋カテゴリフィルタ＋見出し語カードのみ。inputは並べない ====
  if(view==='list'){
    return (
      <Modal title="表現辞典を編集" onClose={onClose} dict>
        <div className="dict-search-row">
          <input type="text" placeholder="🔎 見出し語を検索……" value={query} onChange={e=>setQuery(e.target.value)} />
        </div>
        <div className="dict-cat-tabs" style={{marginBottom:10}}>
          <button type="button" className={"dict-cat-tab"+(categoryFilter===''?' active':'')} onClick={()=>setCategoryFilter('')}>すべて</button>
          {categoryOptions.map(c=>(
            <button key={c} type="button" className={"dict-cat-tab"+(categoryFilter===c?' active':'')} onClick={()=>setCategoryFilter(c)}>{c}</button>
          ))}
        </div>
        {entries.length===0 && <div className="empty-hint">まだ項目がありません。下から追加してください。</div>}
        {entries.length>0 && filteredEntries.length===0 && <div className="empty-hint">一致する見出し語が見つかりません。</div>}
        <div className="dict-card-list">
          {filteredEntries.map(entry=>(
            <div className="dict-card dict-headword-card" key={entry.id} onClick={()=>openEntry(entry.id)}>
              <div className="dict-card-body">
                <div className="dict-headword-card-top">
                  <span className="dict-card-title">{entry.headword || '（無題）'}</span>
                  {entry.category && <span className="dict-headword-card-cat">{entry.category}</span>}
                </div>
                {(entry.aliases||[]).length>0 && <div className="dict-headword-card-aliases">{entry.aliases.join('・')}</div>}
                <div className="dict-headword-card-count">候補 {(entry.expressions||[]).length}件</div>
              </div>
              <span className="dict-card-chevron">＞</span>
            </div>
          ))}
        </div>
        <button type="button" className="btn btn-sm btn-primary dict-add-btn" onClick={addEntry}>＋ 見出し語を追加</button>
        <div className="modal-actions"><button className="btn btn-primary" onClick={onClose}>閉じる</button></div>
      </Modal>
    );
  }

  // ==== 見出し語：詳細編集（この1件だけ。候補表現は件数カードのみ表示し、タップで個別編集へ） ====
  if(view==='entry'){
    return (
      <Modal title="見出し語を編集" onClose={onClose} dict>
        <button type="button" className="dict-back-link" onClick={backToList}>← 表現辞典を編集</button>
        <div className="dict-detail-title">{currentEntry.headword || '（無題）'}</div>
        <div className="dict-field-block">
          <label className="dict-field-label">見出し語</label>
          <input type="text" value={currentEntry.headword} onChange={e=>updateEntry(currentEntry.id,{headword:e.target.value})} />
        </div>
        <div className="dict-field-block">
          <label className="dict-field-label">カテゴリ</label>
          <input type="text" list="expr-dict-category-list" value={currentEntry.category} onChange={e=>updateEntry(currentEntry.id,{category:e.target.value})} placeholder="例：身体 / 動作 / 視線" />
        </div>
        <div className="dict-field-block">
          <label className="dict-field-label">別名</label>
          <ChipListEditor values={currentEntry.aliases} onChange={vals=>updateEntry(currentEntry.id,{aliases:vals})} placeholder="別名を入力してEnter" />
        </div>
        <div className="dict-field-block">
          <label className="dict-field-label">メモ</label>
          <textarea rows={3} value={currentEntry.notes} onChange={e=>updateEntry(currentEntry.id,{notes:e.target.value})} placeholder="この見出し語についての補足（空可）" />
        </div>

        <div className="dict-list-head"><span>候補表現</span><span className="dict-list-count">{currentEntry.expressions.length}件</span></div>
        {currentEntry.expressions.length===0 && <div className="empty-hint">まだ候補表現がありません。</div>}
        <div className="dict-card-list">
          {currentEntry.expressions.map(x=>(
            <div className="dict-card dict-expr-card" key={x.id} onClick={()=>openExpressionEdit(x.id)}>
              <div className="dict-card-body">
                <div className="dict-expr-card-text">{x.text}</div>
                {(x.tags||[]).length>0 && (
                  <div className="dict-expr-card-tags">{x.tags.map(t=>(<span className="expr-dict-tag" key={t}>{t}</span>))}</div>
                )}
                {x.note && <div className="dict-expr-card-note">{x.note}</div>}
              </div>
              <span className="dict-card-chevron">＞</span>
            </div>
          ))}
        </div>
        <button type="button" className="btn btn-sm btn-primary dict-add-btn" onClick={openExpressionNew}>＋ 候補表現</button>

        <div className="dict-danger-zone">
          <button className="btn btn-sm btn-danger" onClick={()=>deleteEntry(currentEntry.id)}>この見出し語を削除</button>
        </div>
        <div className="modal-actions"><button className="btn btn-primary" onClick={backToList}>← 一覧へ戻る</button></div>

        <datalist id="expr-dict-category-list">
          {EXPRESSION_DICTIONARY_CATEGORY_SUGGESTIONS.map(c=>(<option value={c} key={c} />))}
        </datalist>
      </Modal>
    );
  }

  // ==== 候補表現：詳細編集／新規（この1件だけ。表現は必須、空のまま残らないようにする） ====
  const isNewExpr = editingExpr && editingExpr.mode==='new';
  const currentExpr = editingExpr && editingExpr.mode==='edit' ? currentEntry.expressions.find(x=>x.id===editingExpr.id) : null;
  if(view==='expression' && editingExpr && (isNewExpr || currentExpr)){
    const textVal = isNewExpr ? draftExprText : currentExpr.text;
    const tagsVal = isNewExpr ? draftExprTags : currentExpr.tags;
    const noteVal = isNewExpr ? draftExprNote : currentExpr.note;
    const setTextVal = isNewExpr ? setDraftExprText : (v)=>updateExpression(currentEntry.id, currentExpr.id, {text:v});
    const setTagsVal = isNewExpr ? setDraftExprTags : (vals)=>updateExpression(currentEntry.id, currentExpr.id, {tags:vals});
    const setNoteVal = isNewExpr ? setDraftExprNote : (v)=>updateExpression(currentEntry.id, currentExpr.id, {note:v});

    const submitNewExpr = () => {
      if(!draftExprText.trim()) return;
      addExpression(currentEntry.id, draftExprText.trim(), draftExprTags, draftExprNote);
      backToEntry();
    };

    return (
      <Modal title={isNewExpr ? '候補表現を追加' : '候補表現を編集'} onClose={onClose} dict>
        <button type="button" className="dict-back-link" onClick={backToEntry}>← {currentEntry.headword || '一覧'}</button>
        <div className="dict-detail-title">{isNewExpr ? '候補表現を追加' : '候補表現を編集'}</div>
        <div className="dict-field-block">
          <label className="dict-field-label">表現</label>
          <input type="text" value={textVal} onChange={e=>setTextVal(e.target.value)} placeholder="言い換え・類語" />
        </div>
        <div className="dict-field-block">
          <label className="dict-field-label">タグ</label>
          <ChipListEditor values={tagsVal} onChange={setTagsVal} placeholder="タグを入力してEnter" listId="expr-dict-tag-list" />
        </div>
        <div className="dict-field-block">
          <label className="dict-field-label">ニュアンス／メモ</label>
          <textarea rows={2} value={noteVal} onChange={e=>setNoteVal(e.target.value)} placeholder="空可" />
        </div>
        {isNewExpr ? (
          <div className="modal-actions"><button className="btn btn-primary" onClick={submitNewExpr} disabled={!draftExprText.trim()}>追加</button></div>
        ) : (
          <>
            <div className="dict-danger-zone">
              <button className="btn btn-sm btn-danger" onClick={()=>{ deleteExpression(currentEntry.id, currentExpr.id); backToEntry(); }}>この候補を削除</button>
            </div>
            <div className="modal-actions"><button className="btn btn-primary" onClick={backToEntry}>← 戻る</button></div>
          </>
        )}
        <datalist id="expr-dict-tag-list">
          {EXPRESSION_DICTIONARY_TAG_SUGGESTIONS.map(t=>(<option value={t} key={t} />))}
        </datalist>
      </Modal>
    );
  }

  return null;
}


// ---- 小説語彙辞典：JSON一括登録モーダル。貼り付け→解析→プレビュー確認→登録、の2段階フロー。
//      既存entryは一切書き換えない（重複は自動スキップ、チェックONの新規のみ末尾へ追加）。 ----
function SpecialDictionaryImportModal({ specialDictionary, setSpecialDictionary, setLastSpecialImportIds, onClose }){
  const [jsonText, setJsonText] = useState('');
  const [step, setStep] = useState('input'); // 'input' | 'preview'
  const [parseError, setParseError] = useState('');
  const [previewItems, setPreviewItems] = useState([]);
  const [copyToast, setCopyToast] = useState('');

  const entries = specialDictionary.entries || [];

  const copyTemplate = async () => {
    const ok = await copyPlainText(SPECIAL_DICTIONARY_IMPORT_TEMPLATE);
    setCopyToast(ok ? 'コピーしました' : 'コピーに失敗しました');
    setTimeout(()=>setCopyToast(''), 1400);
  };

  // ---- 解析：JSON parse失敗／{entries:[...]}形式でない場合はここで分かりやすいエラーを表示して止める ----
  const handleCheck = () => {
    setParseError('');
    let parsed;
    try{
      parsed = JSON.parse(jsonText);
    }catch(e){
      setParseError('JSONを解析できませんでした。カンマや括弧を確認してください。');
      return;
    }
    if(!parsed || typeof parsed!=='object' || Array.isArray(parsed) || !Array.isArray(parsed.entries)){
      setParseError('形式が違います。{ "entries": [...] } の形で貼り付けてください。');
      return;
    }

    // 既存entryのheadword（trim済み）集合＋今回のJSON内での出現済みheadword集合の両方と照合する
    const existingHeadwords = new Set(entries.map(e=>(e.headword||'').trim()).filter(Boolean));
    const seenInBatch = new Set();
    const items = parsed.entries.map((raw, idx) => {
      if(raw===null || typeof raw!=='object' || Array.isArray(raw)){
        return { key:'row-'+idx, kind:'error', message:`${idx+1}件目：項目形式が不正です` };
      }
      const headword = String(raw.headword==null ? '' : raw.headword).trim();
      if(!headword){
        return { key:'row-'+idx, kind:'error', message:`${idx+1}件目：headwordが空です` };
      }
      const normalized = normalizeImportedSpecialEntry(raw);
      const isDup = existingHeadwords.has(headword) || seenInBatch.has(headword);
      seenInBatch.add(headword);
      // 重複はチェックボックスをONにできない（checked固定false）。安全側に倒し、登録可否の判定は常にkind==='new'を正とする。
      return { key:'row-'+idx, kind: isDup ? 'duplicate' : 'new', entry: normalized, checked: !isDup };
    });
    setPreviewItems(items);
    setStep('preview');
  };

  // 重複・エラー項目はチェック操作そのものを受け付けない（UI側の防御。disabled属性と二重で守る）
  const toggleChecked = (key) => {
    setPreviewItems(items => items.map(it => (it.key===key && it.kind==='new') ? { ...it, checked: !it.checked } : it));
  };

  const newCount = previewItems.filter(i=>i.kind==='new').length;
  const dupCount = previewItems.filter(i=>i.kind==='duplicate').length;
  const errCount = previewItems.filter(i=>i.kind==='error').length;
  // 登録件数は必ず「新規かつチェックON」のみを数える。重複・エラーは常に対象外（安全側の唯一の判定基準）。
  const checkedCount = previewItems.filter(i=>i.kind==='new' && i.checked).length;

  const backToInput = () => { setStep('input'); setPreviewItems([]); setParseError(''); };

  // ---- 登録：新規（kind==='new'）かつチェックONの項目だけ、末尾へ追加する。
  //      重複はUIでチェック不可にしているが、ここでも必ずkind==='new'で再フィルタし、二重に防御する。
  //      Undoは辞典全体のスナップショットではなく、今回追加したentryのidだけを記録する（後続の手動編集・追加・削除を巻き込まないため）。 ----
  const commitImport = () => {
    const toAdd = previewItems
      .filter(i => i.kind==='new' && i.checked)
      .map(i => ({ ...i.entry, id: uid('special') }));
    if(toAdd.length===0) return;
    setSpecialDictionary(sd => normalizeSpecialDictionary({ entries: [...sd.entries, ...toAdd] }));
    setLastSpecialImportIds(toAdd.map(e=>e.id));
    const count = toAdd.length;
    setJsonText('');
    setPreviewItems([]);
    setStep('input');
    onClose();
    alert(`${count}件の小説語彙を登録しました。`);
  };

  return (
    <Modal title="小説語彙をJSONで一括登録" onClose={onClose} dict>
      <div className="special-import-desc">ChatGPTやClaude等で作成した小説語彙JSONを貼り付けて、一括登録できます。</div>

      {step==='input' && (
        <>
          <div style={{marginBottom:10}}>
            <button type="button" className="btn btn-sm" onClick={copyTemplate}>JSON形式をコピー</button>
            {copyToast && <span className="special-import-copy-toast">{copyToast}</span>}
          </div>
          <textarea className="special-import-textarea" value={jsonText} onChange={e=>setJsonText(e.target.value)}
            placeholder={'{ "entries": [ { "headword": "……", "category": "……", … } ] }'} />
          {parseError && <div className="special-import-error">{parseError}</div>}
          <div className="modal-actions">
            <button type="button" className="btn btn-primary" onClick={handleCheck} disabled={!jsonText.trim()}>内容を確認</button>
            <button type="button" className="btn" onClick={onClose}>閉じる</button>
          </div>
        </>
      )}

      {step==='preview' && (
        <>
          <div className="special-import-summary">
            <span className="cnt-new">新規 {newCount}件</span>
            <span className="cnt-dup">重複 {dupCount}件</span>
            <span className="cnt-err">エラー {errCount}件</span>
          </div>
          <div className="special-import-preview-list">
            {previewItems.map(item=>{
              if(item.kind==='error'){
                return <div key={item.key} className="special-import-row-error">⚠ {item.message}</div>;
              }
              const isDup = item.kind==='duplicate';
              return (
                <label key={item.key} className={"special-import-row "+item.kind+(isDup?' disabled':'')}>
                  <input type="checkbox" checked={isDup ? false : item.checked} disabled={isDup} onChange={()=>toggleChecked(item.key)} />
                  <div className="special-import-row-body">
                    <div className="special-import-row-title">{item.entry.headword}</div>
                    {item.entry.category && <div className="special-import-row-sub">カテゴリ：{item.entry.category}</div>}
                    <div className="special-import-row-status">
                      {item.kind==='new' ? '新規' : '重複：同名の用語がすでに存在するためスキップ'}
                    </div>
                  </div>
                </label>
              );
            })}
          </div>
          <div className="modal-actions">
            <button type="button" className="btn" onClick={backToInput}>← 貼り付けに戻る</button>
            <button type="button" className="btn btn-primary" onClick={commitImport} disabled={checkedCount===0}>選択した{checkedCount}件を登録</button>
          </div>
        </>
      )}
    </Modal>
  );
}

// ---- 小説語彙辞典：編集モーダル。一覧（検索・カテゴリフィルタ）→ タップした1件の詳細、の2階層。
//      「新規追加」は見出し語を入力して一覧へ戻るまで永続保存しない（空のまま戻った場合は破棄）。 ----
function SpecialDictionaryEditorModal({ specialDictionary, setSpecialDictionary, onClose, lastSpecialImportIds, setLastSpecialImportIds }){
  const entries = specialDictionary.entries || [];
  const [view, setView] = useState('list'); // 'list' | 'entry'
  const [query, setQuery] = useState('');
  const [categoryFilter, setCategoryFilter] = useState('');
  const [editingEntryId, setEditingEntryId] = useState(null); // 既存項目を編集中の場合のid
  const [draftEntry, setDraftEntry] = useState(null); // 新規項目：見出し語確定まで specialDictionary へは書き込まない
  const [importOpen, setImportOpen] = useState(false); // JSON一括登録モーダルの開閉

  const categoryOptions = useMemo(()=>{
    const set = new Set();
    entries.forEach(e=>{ if(e.category) set.add(e.category); });
    return Array.from(set);
  }, [entries]);

  const q = query.trim().toLowerCase();
  const matchEntry = (entry) => {
    if(categoryFilter && entry.category!==categoryFilter) return false;
    if(!q) return true;
    if((entry.headword||'').toLowerCase().includes(q)) return true;
    if((entry.aliases||[]).some(a=>(a||'').toLowerCase().includes(q))) return true;
    if((entry.category||'').toLowerCase().includes(q)) return true;
    if((entry.meaning||'').toLowerCase().includes(q)) return true;
    if((entry.tags||[]).some(t=>(t||'').toLowerCase().includes(q))) return true;
    if((entry.structureParts||[]).some(p=>(p||'').toLowerCase().includes(q))) return true;
    if((entry.searchHints||[]).some(h=>(h||'').toLowerCase().includes(q))) return true;
    if((entry.note||'').toLowerCase().includes(q)) return true;
    return false;
  };
  const filteredEntries = entries.filter(matchEntry);

  const isNew = !!draftEntry && !editingEntryId;
  const currentEntry = editingEntryId ? entries.find(e=>e.id===editingEntryId) : draftEntry;

  // ---- CRUD：新規は draftEntry（未保存）を更新し、既存は specialDictionary を直接更新する ----
  const updateEntry = (patch) => {
    if(isNew){
      setDraftEntry(d=>({ ...d, ...patch }));
    }else if(editingEntryId){
      setSpecialDictionary(sd=>({ ...sd, entries: sd.entries.map(e=>e.id===editingEntryId?{...e,...patch}:e) }));
    }
  };

  const openNewEntry = () => {
    setDraftEntry({
      id: uid('special'), headword:'', aliases:[], category:'', meaning:'', tags:[], structureParts:[], searchHints:[],
      directness:3, informality:3, coinedness:3, comicRisk:3, note:'',
    });
    setEditingEntryId(null);
    setView('entry');
  };
  const openEntry = (id) => { setEditingEntryId(id); setDraftEntry(null); setView('entry'); };

  // 見出し語が確定していれば登録、空のままなら破棄して一覧へ戻る
  const backToList = () => {
    if(isNew){
      const headword = (draftEntry.headword||'').trim();
      if(headword){
        setSpecialDictionary(sd=>({ ...sd, entries: [...sd.entries, { ...draftEntry, headword }] }));
      }
      setDraftEntry(null);
    }
    setEditingEntryId(null);
    setView('list');
  };

  const deleteEntry = (id) => {
    if(!confirm('この用語を削除しますか？')) return;
    setSpecialDictionary(sd=>({ ...sd, entries: sd.entries.filter(e=>e.id!==id) }));
    setEditingEntryId(null);
    setView('list');
  };

  // 既存項目が他操作で削除された等で参照が消えていたら一覧へ戻す
  if(view!=='list' && !currentEntry){
    return (
      <Modal title="小説語彙辞典を編集" onClose={onClose} dict>
        <div className="empty-hint">この用語は削除されました。</div>
        <div className="modal-actions"><button className="btn btn-primary" onClick={()=>{ setView('list'); setEditingEntryId(null); setDraftEntry(null); }}>← 一覧へ戻る</button></div>
      </Modal>
    );
  }

  // ==== 一覧（トップ）：検索＋カテゴリフィルタ＋用語カードのみ。inputは並べない ====
  if(view==='list'){
    return (
      <Modal title="小説語彙辞典を編集" onClose={onClose} dict>
        <div className="dict-search-row">
          <input type="text" placeholder="🔎 用語を検索……" value={query} onChange={e=>setQuery(e.target.value)} />
        </div>
        <div className="dict-cat-tabs" style={{marginBottom:10}}>
          <button type="button" className={"dict-cat-tab"+(categoryFilter===''?' active':'')} onClick={()=>setCategoryFilter('')}>すべて</button>
          {categoryOptions.map(c=>(
            <button key={c} type="button" className={"dict-cat-tab"+(categoryFilter===c?' active':'')} onClick={()=>setCategoryFilter(c)}>{c}</button>
          ))}
        </div>
        {entries.length===0 && <div className="empty-hint">まだ項目がありません。下から追加してください。</div>}
        {entries.length>0 && filteredEntries.length===0 && <div className="empty-hint">一致する用語が見つかりません。</div>}
        <div className="dict-card-list">
          {filteredEntries.map(entry=>(
            <div className="dict-card dict-headword-card" key={entry.id} onClick={()=>openEntry(entry.id)}>
              <div className="dict-card-body">
                <div className="dict-headword-card-top">
                  <span className="dict-card-title">{entry.headword || '（無題）'}</span>
                  {entry.category && <span className="dict-headword-card-cat">{entry.category}</span>}
                </div>
                {(entry.structureParts||[]).length>0 && <div className="dict-card-sub">{entry.structureParts.join(' + ')}</div>}
                <div className="dict-headword-card-count">特殊語度 {entry.coinedness||0} / 5</div>
              </div>
              <span className="dict-card-chevron">＞</span>
            </div>
          ))}
        </div>
        <div className="dict-import-btn-row">
          <button type="button" className="btn btn-sm dict-add-btn" onClick={()=>setImportOpen(true)}>JSON一括登録</button>
        </div>
        <button type="button" className="btn btn-sm btn-primary dict-add-btn" onClick={openNewEntry}>＋ 用語を追加</button>
        {lastSpecialImportIds && lastSpecialImportIds.length>0 && (
          <div className="dict-undo-row">
            <button type="button" className="btn btn-sm" onClick={()=>{
              // 辞典全体を巻き戻すのではなく、直前の一括登録で追加したidだけを削除する。
              // これにより一括登録後にユーザーが行った手動編集・追加・削除は保持される。
              setSpecialDictionary(sd => normalizeSpecialDictionary({ entries: sd.entries.filter(e=>!lastSpecialImportIds.includes(e.id)) }));
              setLastSpecialImportIds(null);
            }}>直前の一括登録を元に戻す</button>
          </div>
        )}
        <div className="modal-actions"><button className="btn btn-primary" onClick={onClose}>閉じる</button></div>
        {importOpen && (
          <SpecialDictionaryImportModal
            specialDictionary={specialDictionary}
            setSpecialDictionary={setSpecialDictionary}
            setLastSpecialImportIds={setLastSpecialImportIds}
            onClose={()=>setImportOpen(false)}
          />
        )}
      </Modal>
    );
  }

  // ==== 詳細編集（この1件だけ）。新規（isNew）の場合、削除ボタンは出さない（未確定のため「戻る」で自然に破棄される） ====
  return (
    <Modal title={isNew ? '小説語彙を追加' : '小説語彙を編集'} onClose={onClose} dict>
      <button type="button" className="dict-back-link" onClick={backToList}>← 小説語彙辞典を編集</button>
      <div className="dict-detail-title">{currentEntry.headword || '（無題）'}</div>
      <div className="dict-field-block">
        <label className="dict-field-label">用語</label>
        <input type="text" value={currentEntry.headword} onChange={e=>updateEntry({headword:e.target.value})} placeholder="見出し語" />
      </div>
      <div className="dict-field-block">
        <label className="dict-field-label">カテゴリ</label>
        <input type="text" list="special-dict-category-list" value={currentEntry.category} onChange={e=>updateEntry({category:e.target.value})} placeholder="自由入力（例：俗語 / 業界用語 / 造語）" />
      </div>
      <div className="dict-field-block">
        <label className="dict-field-label">意味</label>
        <textarea rows={3} value={currentEntry.meaning} onChange={e=>updateEntry({meaning:e.target.value})} placeholder="簡単な意味説明" />
      </div>
      <div className="dict-field-block">
        <label className="dict-field-label">別名</label>
        <ChipListEditor values={currentEntry.aliases} onChange={vals=>updateEntry({aliases:vals})} placeholder="別名・別表記を入力してEnter" />
      </div>
      <div className="dict-field-block">
        <label className="dict-field-label">タグ</label>
        <ChipListEditor values={currentEntry.tags} onChange={vals=>updateEntry({tags:vals})} placeholder="タグを入力してEnter" />
      </div>
      <div className="dict-field-block">
        <label className="dict-field-label">構造要素</label>
        <ChipListEditor values={currentEntry.structureParts} onChange={vals=>updateEntry({structureParts:vals})} placeholder="構成要素を入力してEnter" />
      </div>
      <div className="dict-field-block">
        <label className="dict-field-label">逆引きキーワード（この語を知らなくても検索でヒットさせたい言葉）</label>
        <ChipListEditor values={currentEntry.searchHints||[]} onChange={vals=>updateEntry({searchHints:vals})} placeholder="例：頑固／孤高 など、入力してEnter" />
      </div>
      <RatingField label="直接度" value={currentEntry.directness} onChange={v=>updateEntry({directness:v})} />
      <RatingField label="くだけ度" value={currentEntry.informality} onChange={v=>updateEntry({informality:v})} />
      <RatingField label="特殊語度" value={currentEntry.coinedness} onChange={v=>updateEntry({coinedness:v})} />
      <RatingField label="コミカル危険度" value={currentEntry.comicRisk} onChange={v=>updateEntry({comicRisk:v})} />
      <div className="dict-field-block">
        <label className="dict-field-label">メモ</label>
        <textarea rows={2} value={currentEntry.note} onChange={e=>updateEntry({note:e.target.value})} placeholder="空可" />
      </div>

      {!isNew && (
        <div className="dict-danger-zone">
          <button className="btn btn-sm btn-danger" onClick={()=>deleteEntry(currentEntry.id)}>この用語を削除</button>
        </div>
      )}
      <div className="modal-actions"><button className="btn btn-primary" onClick={backToList}>← 一覧へ戻る</button></div>

      <datalist id="special-dict-category-list">
        {categoryOptions.map(c=>(<option value={c} key={c} />))}
      </datalist>
    </Modal>
  );
}

    onClose();
    alert(`${count}件のメディア語を登録しました。`);
  };

  return (
    <Modal title="メディア語をJSONで一括登録" onClose={onClose} dict>
      <div className="special-import-desc">ChatGPTやClaude等で作成したメディア語JSONを貼り付けて、一括登録できます。</div>

      {step==='input' && (
        <>
          <div style={{marginBottom:10}}>
            <button type="button" className="btn btn-sm" onClick={copyTemplate}>JSON形式をコピー</button>
            {copyToast && <span className="special-import-copy-toast">{copyToast}</span>}
          </div>
          <textarea className="special-import-textarea" value={jsonText} onChange={e=>setJsonText(e.target.value)}
            placeholder={'{ "entries": [ { "headword": "……", "category": "……", … } ] }'} />
          {parseError && <div className="special-import-error">{parseError}</div>}
          <div className="modal-actions">
            <button type="button" className="btn btn-primary" onClick={handleCheck} disabled={!jsonText.trim()}>内容を確認</button>
            <button type="button" className="btn" onClick={onClose}>閉じる</button>
          </div>
        </>
      )}

      {step==='preview' && (
        <>
          <div className="special-import-summary">
            <span className="cnt-new">新規 {newCount}件</span>
            <span className="cnt-dup">重複 {dupCount}件</span>
            <span className="cnt-err">エラー {errCount}件</span>
          </div>
          <div className="special-import-preview-list">
            {previewItems.map(item=>{
              if(item.kind==='error'){
                return <div key={item.key} className="special-import-row-error">⚠ {item.message}</div>;
              }
              const isDup = item.kind==='duplicate';
              return (
                <label key={item.key} className={"special-import-row "+item.kind+(isDup?' disabled':'')}>
                  <input type="checkbox" checked={isDup ? false : item.checked} disabled={isDup} onChange={()=>toggleChecked(item.key)} />
                  <div className="special-import-row-body">
                    <div className="special-import-row-title">{item.entry.headword}</div>
                    {item.entry.category && <div className="special-import-row-sub">カテゴリ：{item.entry.category}</div>}
                    <div className="special-import-row-status">
                      {item.kind==='new' ? '新規' : '重複：同名の用語がすでに存在するためスキップ'}
                    </div>
                  </div>
                </label>
              );
            })}
          </div>
          <div className="modal-actions">
            <button type="button" className="btn" onClick={backToInput}>← 貼り付けに戻る</button>
            <button type="button" className="btn btn-primary" onClick={commitImport} disabled={checkedCount===0}>選択した{checkedCount}件を登録</button>
          </div>
        </>
      )}
    </Modal>
  );
}

// ---- 令和メディア語辞典：編集モーダル。一覧（検索・カテゴリフィルタ）→ タップした1件の詳細、の2階層。データはmediaDictionaryとして完全分離。 ----
function MediaDictionaryEditorModal({ mediaDictionary, setMediaDictionary, onClose, lastMediaImportIds, setLastMediaImportIds }){
  const entries = mediaDictionary.entries || [];
  const [view, setView] = useState('list'); // 'list' | 'entry'
  const [query, setQuery] = useState('');
  const [categoryFilter, setCategoryFilter] = useState('');
  const [editingEntryId, setEditingEntryId] = useState(null);
  const [draftEntry, setDraftEntry] = useState(null);
  const [importOpen, setImportOpen] = useState(false);

  const categoryOptions = useMemo(()=>{
    const set = new Set();
    entries.forEach(e=>{ if(e.category) set.add(e.category); });
    return Array.from(set);
  }, [entries]);

  const q = query.trim().toLowerCase();
  const matchEntry = (entry) => {
    if(categoryFilter && entry.category!==categoryFilter) return false;
    if(!q) return true;
    if((entry.headword||'').toLowerCase().includes(q)) return true;
    if((entry.aliases||[]).some(a=>(a||'').toLowerCase().includes(q))) return true;
    if((entry.category||'').toLowerCase().includes(q)) return true;
    if((entry.meaning||'').toLowerCase().includes(q)) return true;
    if((entry.tags||[]).some(t=>(t||'').toLowerCase().includes(q))) return true;
    if((entry.structureParts||[]).some(p=>(p||'').toLowerCase().includes(q))) return true;
    if((entry.note||'').toLowerCase().includes(q)) return true;
    return false;
  };
  const filteredEntries = entries.filter(matchEntry);

  const isNew = !!draftEntry && !editingEntryId;
  const currentEntry = editingEntryId ? entries.find(e=>e.id===editingEntryId) : draftEntry;

  const updateEntry = (patch) => {
    if(isNew){
      setDraftEntry(d=>({ ...d, ...patch }));
    }else if(editingEntryId){
      setMediaDictionary(md=>({ ...md, entries: md.entries.map(e=>e.id===editingEntryId?{...e,...patch}:e) }));
    }
  };

  const openNewEntry = () => {
    setDraftEntry({
      id: uid('media'), headword:'', aliases:[], category:'', meaning:'', tags:[], structureParts:[],
      directness:3, informality:3, coinedness:3, comicRisk:3, note:'',
    });
    setEditingEntryId(null);
    setView('entry');
  };
  const openEntry = (id) => { setEditingEntryId(id); setDraftEntry(null); setView('entry'); };

  const backToList = () => {
    if(isNew){
      const headword = (draftEntry.headword||'').trim();
      if(headword){
        setMediaDictionary(md=>({ ...md, entries: [...md.entries, { ...draftEntry, headword }] }));
      }
      setDraftEntry(null);
    }
    setEditingEntryId(null);
    setView('list');
  };

  const deleteEntry = (id) => {
    if(!confirm('この用語を削除しますか？')) return;
    setMediaDictionary(md=>({ ...md, entries: md.entries.filter(e=>e.id!==id) }));
    setEditingEntryId(null);
    setView('list');
  };

  if(view!=='list' && !currentEntry){
    return (
      <Modal title="メディア語辞典を編集" onClose={onClose} dict>
        <div className="empty-hint">この用語は削除されました。</div>
        <div className="modal-actions"><button className="btn btn-primary" onClick={()=>{ setView('list'); setEditingEntryId(null); setDraftEntry(null); }}>← 一覧へ戻る</button></div>
      </Modal>
    );
  }

  if(view==='list'){
    return (
      <Modal title="メディア語辞典を編集" onClose={onClose} dict>
        <div className="dict-search-row">
          <input type="text" placeholder="🔎 用語を検索……" value={query} onChange={e=>setQuery(e.target.value)} />
        </div>
        <div className="dict-cat-tabs" style={{marginBottom:10}}>
          <button type="button" className={"dict-cat-tab"+(categoryFilter===''?' active':'')} onClick={()=>setCategoryFilter('')}>すべて</button>
          {categoryOptions.map(c=>(
            <button key={c} type="button" className={"dict-cat-tab"+(categoryFilter===c?' active':'')} onClick={()=>setCategoryFilter(c)}>{c}</button>
          ))}
        </div>
        {entries.length===0 && <div className="empty-hint">まだ項目がありません。下から追加してください。</div>}
        {entries.length>0 && filteredEntries.length===0 && <div className="empty-hint">一致する用語が見つかりません。</div>}
        <div className="dict-card-list">
          {filteredEntries.map(entry=>(
            <div className="dict-card dict-headword-card" key={entry.id} onClick={()=>openEntry(entry.id)}>
              <div className="dict-card-body">
                <div className="dict-headword-card-top">
                  <span className="dict-card-title">{entry.headword || '（無題）'}</span>
                  {entry.category && <span className="dict-headword-card-cat">{entry.category}</span>}
                </div>
                {(entry.structureParts||[]).length>0 && <div className="dict-card-sub">{entry.structureParts.join(' + ')}</div>}
                <div className="dict-headword-card-count">特殊語度 {entry.coinedness||0} / 5</div>
              </div>
              <span className="dict-card-chevron">＞</span>
            </div>
          ))}
        </div>
        <div className="dict-import-btn-row">
          <button type="button" className="btn btn-sm dict-add-btn" onClick={()=>setImportOpen(true)}>JSON一括登録</button>
        </div>
        <button type="button" className="btn btn-sm btn-primary dict-add-btn" onClick={openNewEntry}>＋ 用語を追加</button>
        {lastMediaImportIds && lastMediaImportIds.length>0 && (
          <div className="dict-undo-row">
            <button type="button" className="btn btn-sm" onClick={()=>{
              setMediaDictionary(md => normalizeMediaDictionary({ entries: md.entries.filter(e=>!lastMediaImportIds.includes(e.id)) }));
              setLastMediaImportIds(null);
            }}>直前の一括登録を元に戻す</button>
          </div>
        )}
        <div className="modal-actions"><button className="btn btn-primary" onClick={onClose}>閉じる</button></div>
        {importOpen && (
          <MediaDictionaryImportModal
            mediaDictionary={mediaDictionary}
            setMediaDictionary={setMediaDictionary}
            setLastMediaImportIds={setLastMediaImportIds}
            onClose={()=>setImportOpen(false)}
          />
        )}
      </Modal>
    );
  }

  return (
    <Modal title={isNew ? 'メディア語を追加' : 'メディア語を編集'} onClose={onClose} dict>
      <button type="button" className="dict-back-link" onClick={backToList}>← メディア語辞典を編集</button>
      <div className="dict-detail-title">{currentEntry.headword || '（無題）'}</div>
      <div className="dict-field-block">
        <label className="dict-field-label">用語</label>
        <input type="text" value={currentEntry.headword} onChange={e=>updateEntry({headword:e.target.value})} placeholder="見出し語" />
      </div>
      <div className="dict-field-block">
        <label className="dict-field-label">カテゴリ</label>
        <input type="text" list="media-dict-category-list" value={currentEntry.category} onChange={e=>updateEntry({category:e.target.value})} placeholder="自由入力（例：SNS / ネットスラング / オタク文化）" />
      </div>
      <div className="dict-field-block">
        <label className="dict-field-label">意味</label>
        <textarea rows={3} value={currentEntry.meaning} onChange={e=>updateEntry({meaning:e.target.value})} placeholder="簡単な意味説明" />
      </div>
      <div className="dict-field-block">
        <label className="dict-field-label">別名</label>
        <ChipListEditor values={currentEntry.aliases} onChange={vals=>updateEntry({aliases:vals})} placeholder="別名・別表記を入力してEnter" />
      </div>
      <div className="dict-field-block">
        <label className="dict-field-label">タグ</label>
        <ChipListEditor values={currentEntry.tags} onChange={vals=>updateEntry({tags:vals})} placeholder="タグを入力してEnter" />
      </div>
      <div className="dict-field-block">
        <label className="dict-field-label">構造要素</label>
        <ChipListEditor values={currentEntry.structureParts} onChange={vals=>updateEntry({structureParts:vals})} placeholder="構成要素を入力してEnter" />
      </div>
      <RatingField label="直接度" value={currentEntry.directness} onChange={v=>updateEntry({directness:v})} />
      <RatingField label="くだけ度" value={currentEntry.informality} onChange={v=>updateEntry({informality:v})} />
      <RatingField label="特殊語度" value={currentEntry.coinedness} onChange={v=>updateEntry({coinedness:v})} />
      <RatingField label="コミカル危険度" value={currentEntry.comicRisk} onChange={v=>updateEntry({comicRisk:v})} />
      <div className="dict-field-block">
        <label className="dict-field-label">メモ</label>
        <textarea rows={2} value={currentEntry.note} onChange={e=>updateEntry({note:e.target.value})} placeholder="空可" />
      </div>

      {!isNew && (
        <div className="dict-danger-zone">
          <button className="btn btn-sm btn-danger" onClick={()=>deleteEntry(currentEntry.id)}>この用語を削除</button>
        </div>
      )}
      <div className="modal-actions"><button className="btn btn-primary" onClick={backToList}>← 一覧へ戻る</button></div>

      <datalist id="media-dict-category-list">
        {categoryOptions.map(c=>(<option value={c} key={c} />))}
      </datalist>
    </Modal>
  );
}


/* ============ AI設定一括取り込み（画面） ============ */
function ImportChangeRow({ change, onToggle, onResolve }){
  const extraFieldKeys = Object.keys(change.setFields||{}).filter(k=>!['name','fromId','toId','groupIdRef','parentLocationId','groupId','title','content','dateLabel'].includes(k));
  return (
    <div className="change-item" style={{opacity: change.enabled ? 1 : 0.5}}>
      <div style={{display:'flex', gap:8, alignItems:'flex-start'}}>
        <input type="checkbox" checked={change.enabled} disabled={!!change.depBlocked} onChange={onToggle} style={{marginTop:4}} />
        <div style={{flex:1, minWidth:0}}>
          <div className="ci-title">{change.title}</div>
          {change.detail && <div className="ci-desc">{change.detail}</div>}
          {change.depBlocked && (
            <div style={{marginTop:4, fontSize:12.5, color:'#8a3a3a'}}>{change.depBlockedReason}</div>
          )}
          {change.action==='create' && extraFieldKeys.length>0 && (
            <div style={{fontSize:12, color:'var(--ink-soft)', marginTop:2}}>
              {extraFieldKeys.map(k=>IMPORT_FIELD_LABELS[k]||k).join(' / ')}を設定
            </div>
          )}
          {(change.arrayFields||[]).length>0 && (
            <div style={{fontSize:12, color:'var(--ink-soft)', marginTop:2}}>
              {change.arrayFields.map(af=>`＋${IMPORT_FIELD_LABELS[af.field]||af.field} ${af.added.length}件`).join(' / ')}
            </div>
          )}
          {(change.conflicts||[]).map(cf=>(
            <div key={cf.field} style={{marginTop:8, padding:'8px 10px', background:'var(--paper-dim)', borderRadius:6}}>
              <div style={{fontSize:12.5, fontWeight:700, marginBottom:4}}>競合：{IMPORT_FIELD_LABELS[cf.field]||cf.field}</div>
              <div style={{fontSize:12, color:'var(--ink-soft)', whiteSpace:'pre-wrap'}}>既存：{cf.existing}</div>
              <div style={{fontSize:12, color:'var(--ink-soft)', whiteSpace:'pre-wrap', marginTop:2}}>取り込み：{cf.incoming}</div>
              <div style={{display:'flex', gap:6, marginTop:6, flexWrap:'wrap'}}>
                <button className={"btn btn-sm"+(cf.resolution==='keep'?" btn-primary":"")} onClick={()=>onResolve(change.id, cf.field, 'keep')}>既存を残す</button>
                <button className={"btn btn-sm"+(cf.resolution==='replace'?" btn-primary":"")} onClick={()=>onResolve(change.id, cf.field, 'replace')}>取り込み内容へ置換</button>
                <button className={"btn btn-sm"+(cf.resolution==='append'?" btn-primary":"")} onClick={()=>onResolve(change.id, cf.field, 'append')}>追記する</button>
              </div>
            </div>
          ))}
        </div>
      </div>
    </div>
  );
}

function AiImportScreen({ data, setData, lastImportBackup, setLastImportBackup }){
  const [jsonText, setJsonText] = useState('');
  const [parseErrors, setParseErrors] = useState([]);
  const [plan, setPlan] = useState(null);
  const [showTemplate, setShowTemplate] = useState(false);
  const fileRef = useRef();

  const handleFile = async (e) => {
    const file = e.target.files[0];
    e.target.value = '';
    if(!file) return;
    try{
      const text = await file.text();
      setJsonText(text); setPlan(null); setParseErrors([]);
    }catch(err){
      console.error(err);
      setParseErrors(['ファイルの読み込みに失敗しました。']);
    }
  };

  const checkContent = () => {
    let parsed;
    try{ parsed = JSON.parse(jsonText); }
    catch(err){
      setPlan(null);
      setParseErrors(['JSONの形式が正しくありません。貼り付けた内容がJSONとして壊れていないか確認してください。', String((err&&err.message)||'')]);
      return;
    }
    const { errors, changes } = buildImportPlan(parsed, data);
    setParseErrors(errors);
    const initial = changes.map(c=>({ ...c, enabled: c.action==='create' || c.action==='update' }));
    setPlan({ changes: gateDependencies(initial) });
  };

  // 未解決の依存関係を持つ項目を検出し、自動的にOFF（取り込み対象から除外）にした上で、
  // 差分確認画面で分かるよう depBlocked / depBlockedReason を付与する。
  const gateDependencies = (changes) => {
    const blocked = computeDependencyBlocked(changes);
    return changes.map(c=>{
      const missing = blocked.get(c.id);
      if(!missing) return { ...c, depBlocked:false, depBlockedReason:null };
      return { ...c, enabled:false, depBlocked:true,
        depBlockedReason: `⚠ ${missing.join('・')}が作成対象から外れているため、「${c.title}」は取り込めません。` };
    });
  };

  const toggleChange = (id) => setPlan(p=>{
    const changes = p.changes.map(c=>{
      if(c.id!==id) return c;
      if(c.depBlocked) return c; // 未解決依存がある項目はONにできない
      return {...c, enabled:!c.enabled};
    });
    return { ...p, changes: gateDependencies(changes) };
  });
  const setConflictResolution = (changeId, field, resolution) => setPlan(p=>({ ...p, changes: p.changes.map(c=>{
    if(c.id!==changeId) return c;
    return { ...c, conflicts: c.conflicts.map(cf=>cf.field===field?{...cf, resolution}:cf) };
  }) }));

  const execute = () => {
    if(!plan) return;
    setLastImportBackup(JSON.parse(JSON.stringify(data)));
    const next = applyImportPlan(plan, data);
    setData(next);
    setPlan(null);
    setJsonText('');
    setParseErrors([]);
    alert('設定の取り込みが完了しました。問題があれば「直前の一括取り込みを元に戻す」から取り消せます。');
  };

  const copyTemplate = async () => {
    try{
      if(navigator.clipboard && navigator.clipboard.writeText) await navigator.clipboard.writeText(AI_IMPORT_TEMPLATE);
      else alert('お使いの環境ではコピーできませんでした。テンプレートを選択して手動でコピーしてください。');
    }catch(err){
      console.error(err);
      alert('コピーに失敗しました。テンプレートを選択して手動でコピーしてください。');
    }
  };

  const grouped = plan ? {
    create: plan.changes.filter(c=>c.action==='create'),
    update: plan.changes.filter(c=>c.action==='update'),
    unchanged: plan.changes.filter(c=>c.action==='unchanged'),
  } : null;
  const conflictCount = plan ? plan.changes.reduce((s,c)=>s+(c.conflicts?c.conflicts.length:0), 0) : 0;
  const depBlockedCount = plan ? plan.changes.filter(c=>c.depBlocked).length : 0;

  return (
    <div>
      <h1>🤖 設定を一括取り込み</h1>
      <p style={{color:'var(--ink-soft)', fontSize:13, marginTop:-6}}>
        ChatGPTやClaudeと相談して整理した設定JSONを貼り付けると、今のデータを残したまま追加・更新できます。「バックアップ読み込み」とは別の機能で、今のデータが置き換わることはありません。
      </p>

      {lastImportBackup && (
        <div className="card card-pad" style={{marginBottom:14, borderColor:'var(--warn)'}}>
          <div style={{display:'flex', justifyContent:'space-between', alignItems:'center', gap:10, flexWrap:'wrap'}}>
            <span style={{fontSize:13}}>直前の一括取り込みを取り消せます（ブラウザを閉じるまでの一時的な取り消しです）。</span>
            <button className="btn btn-sm" onClick={()=>{ setData(lastImportBackup); setLastImportBackup(null); }}>直前の一括取り込みを元に戻す</button>
          </div>
        </div>
      )}

      <div className="field-row">
        <label>設定JSONを貼り付け</label>
        <AutoTextarea value={jsonText} onChange={e=>{ setJsonText(e.target.value); setPlan(null); setParseErrors([]); }}
          minHeight={200} placeholder="AIが生成したJSONをここに貼り付けてください"
          style={{border:'1px solid var(--line)', borderRadius:6, background:'#fff', padding:'10px 12px', fontFamily:'monospace', fontSize:13}} />
      </div>
      <div className="toolbar" style={{marginBottom:14}}>
        <button className="btn btn-sm" onClick={()=>fileRef.current.click()}>📄 JSONファイルを読込</button>
        <input ref={fileRef} type="file" accept="application/json" style={{display:'none'}} onChange={handleFile} />
        <button className="btn btn-sm" onClick={()=>setShowTemplate(s=>!s)}>{showTemplate ? 'テンプレートを隠す' : 'AI用テンプレートを見る'}</button>
        <div className="filler" />
        <button className="btn btn-primary" onClick={checkContent} disabled={!jsonText.trim()}>内容を確認</button>
      </div>

      {showTemplate && (
        <div className="card card-pad" style={{marginBottom:16}}>
          <p style={{fontSize:12.5, color:'var(--ink-soft)', marginTop:0}}>
            ChatGPTやClaudeに「この形式で、今のところまとまっている設定を出力して」と頼む時のテンプレートです。<b>必要なセクションだけ</b>出力してもらえば十分で、全部埋める必要はありません。
          </p>
          <AutoTextarea value={AI_IMPORT_TEMPLATE} onChange={()=>{}} readOnly minHeight={220}
            style={{border:'1px solid var(--line)', borderRadius:6, background:'#f1efe6', padding:'10px 12px', fontFamily:'monospace', fontSize:12, cursor:'default'}} />
          <div style={{textAlign:'right', marginTop:8}}>
            <button className="btn btn-sm" onClick={copyTemplate}>📋 テンプレートをコピー</button>
          </div>
        </div>
      )}

      {parseErrors.length>0 && (
        <div className="card card-pad" style={{marginBottom:16, borderColor:'#dbb'}}>
          {parseErrors.map((m,i)=> m ? <div key={i} style={{color:'#8a3a3a', fontSize:13}}>・{m}</div> : null)}
        </div>
      )}

      {plan && (
        <div>
          <div className="stat-row">
            <div className="stat-box"><div className="n">{grouped.create.length}</div><div className="l">新規作成</div></div>
            <div className="stat-box"><div className="n">{grouped.update.length}</div><div className="l">更新</div></div>
            <div className="stat-box"><div className="n">{conflictCount}</div><div className="l">競合フィールド</div></div>
            <div className="stat-box"><div className="n">{grouped.unchanged.length}</div><div className="l">変更なし</div></div>
            <div className="stat-box"><div className="n">{parseErrors.length + depBlockedCount}</div><div className="l">エラー / 未解決</div></div>
          </div>

          {grouped.create.length>0 && (
            <CollapsibleSection title={`新規作成（${grouped.create.length}件）`} defaultOpen>
              {grouped.create.map(c=><ImportChangeRow key={c.id} change={c} onToggle={()=>toggleChange(c.id)} onResolve={setConflictResolution} />)}
            </CollapsibleSection>
          )}
          {grouped.update.length>0 && (
            <CollapsibleSection title={`更新（${grouped.update.length}件）`} defaultOpen>
              {grouped.update.map(c=><ImportChangeRow key={c.id} change={c} onToggle={()=>toggleChange(c.id)} onResolve={setConflictResolution} />)}
            </CollapsibleSection>
          )}
          {grouped.unchanged.length>0 && (
            <CollapsibleSection title={`変更なし（${grouped.unchanged.length}件）`}>
              {grouped.unchanged.map(c=><div key={c.id} style={{fontSize:13, color:'var(--ink-soft)', padding:'4px 0'}}>・{c.title}</div>)}
            </CollapsibleSection>
          )}

          <div className="modal-actions" style={{marginTop:16, justifyContent:'flex-start'}}>
            <button className="btn btn-primary" onClick={execute} disabled={grouped.create.length===0 && grouped.update.length===0}>この内容で取り込みを実行</button>
            <button className="btn" onClick={()=>setPlan(null)}>取り消してやり直す</button>
          </div>
        </div>
      )}
    </div>
  );
}

/* ============ 検索 ============ */
function SearchResults({ data, query, navigateTo }){
  const q = query.trim();
  if(!q) return <div className="empty-hint">作品内のキャラクター・組織・場所・世界設定・年表・ネタ・本文を横断検索できます。</div>;

  const hit = (text) => text && text.includes(q);
  const groups = [];

  const chars = data.characters.filter(c => hit(c.name)||hit(c.summary)||hit(c.personality)||hit(c.memo));
  if(chars.length) groups.push({ label:'キャラクター', items: chars.map(c=>({id:c.id,name:c.name||'（無名）',snippet:c.summary,go:()=>navigateTo('characters', c.id)})) });

  const orgs = data.organizations.filter(o => hit(o.name)||hit(o.summary)||hit(o.purpose)||hit(o.memo));
  if(orgs.length) groups.push({ label:'組織 / 勢力 / 家系', items: orgs.map(o=>({id:o.id,name:o.name||'（無名）',snippet:o.summary,go:()=>navigateTo('organizations', o.id)})) });

  const locs = data.locations.filter(l => hit(l.name)||hit(l.summary)||hit(l.memo));
  if(locs.length) groups.push({ label:'場所 / 建物', items: locs.map(l=>({id:l.id,name:l.name||'（無名）',snippet:l.summary,go:()=>navigateTo('locations', l.id)})) });

  const wsHits = [];
  data.worldSettings.forEach(cat => cat.cards.forEach(card => {
    if(hit(card.title)||hit(card.content)) wsHits.push({id:card.id, name:`${cat.name} ／ ${card.title||'（無題）'}`, snippet:card.content, go:()=>navigateTo('worldsettings')});
  }));
  if(wsHits.length) groups.push({ label:'世界設定', items: wsHits });

  const tl = data.timeline.filter(t => hit(t.title)||hit(t.summary)||hit(t.detail));
  if(tl.length) groups.push({ label:'年表', items: tl.map(t=>({id:t.id,name:t.title||'（無題）',snippet:t.summary,go:()=>navigateTo('timeline')})) });

  const ideas = data.ideas.filter(i => hit(i.content));
  if(ideas.length) groups.push({ label:'ネタ箱', items: ideas.map(i=>({id:i.id,name:i.type,snippet:i.content,go:()=>navigateTo('ideas')})) });

  const writings = data.writings.filter(w => hit(w.title)||hit(w.body));
  if(writings.length) groups.push({ label:'本文', items: writings.map(w=>({id:w.id,name:w.title,snippet:w.body.slice(0,60),go:()=>navigateTo('writing', w.id)})) });

  return (
    <div>
      <h1>🔍「{q}」の検索結果</h1>
      {groups.length===0 && <div className="empty-hint">見つかりませんでした。</div>}
      {groups.map(g=>(
        <div className="search-group" key={g.label}>
          <h4>{g.label}（{g.items.length}）</h4>
          {g.items.map(it=>(
            <div className="search-hit" key={it.id} onClick={it.go}>
              <div className="sh-name">{it.name}</div>
              {it.snippet && <div className="sh-snippet">{it.snippet.slice(0,60)}</div>}
            </div>
          ))}
        </div>
      ))}
    </div>
  );
}

function StoryToolsScreen({outlineData,setOutlineData,sceneData,setSceneData,patternData,setPatternData}){
  const [tab,setTab]=useState('outline');

    const scene=newSceneFromTemplate('basic',item.title||'新しいシーン');
    Object.assign(scene,{purpose:item.summary||'',sceneRole:item.type||'本筋',location:item.location||'',pov:item.pov||'',timeRelation:item.timeRelation||'直後',readerInfo:item.readerInfo||'',characterInfo:item.characterInfo||'',returnToMain:!!item.returnToMain,outlineItemId:item.id});
    setSceneData(d=>({...d,scenes:[...d.scenes,scene],activeSceneId:scene.id}));
    setOutlineData(d=>({...d,projects:d.projects.map(p=>p.id!==projectId?p:{...p,blocks:p.blocks.map(b=>b.id!==blockId?b:{...b,items:b.items.map(x=>x.id===item.id?{...x,sceneId:scene.id}:x)})})}));

  </div>;
}

function StoryOutlineBoard({data,setData,scenes,onCreateScene}){

  const duplicateProject=()=>{if(!active)return;const p={...active,id:uid('outline'),title:active.title+'（複製）',blocks:active.blocks.map(b=>({...b,id:uid('outlineblock'),items:b.items.map(it=>({...it,id:uid('outlineitem'),sceneId:'',adult:{...it.adult}}))}))};setData(d=>({...d,projects:[...d.projects,p],activeProjectId:p.id}));};

function GeneralScenePlanner({data,setData}){
  const scenes=data.scenes||[];const active=scenes.find(x=>x.id===data.activeSceneId)||scenes[0];
  const [templateId,setTemplateId]=useState('basic');const [draftBeat,setDraftBeat]=useState(null);const [toast,setToast]=useState('');
  useEffect(()=>{if(active&&active.templateId)setTemplateId(active.templateId);},[active&&active.id]);
  const showToast=m=>{setToast(m);setTimeout(()=>setToast(''),1400);};
  const patchScene=patch=>setData(d=>({...d,scenes:d.scenes.map(s=>s.id===d.activeSceneId?{...s,...patch}:s)}));
  const addScene=()=>{const s=newSceneFromTemplate('basic',`シーン案${scenes.length+1}`);setData(d=>({...d,scenes:[...d.scenes,s],activeSceneId:s.id}));};
  const duplicateScene=()=>{if(!active)return;const s={...active,id:uid('scene'),title:active.title+'（複製）',beats:active.beats.map(b=>({...b,id:uid('beat')})),createdAt:Date.now()};setData(d=>({...d,scenes:[...d.scenes,s],activeSceneId:s.id}));};
  const deleteScene=()=>{if(!active||!confirm(`「${active.title}」を削除しますか？`))return;setData(d=>{const rest=d.scenes.filter(s=>s.id!==active.id);if(!rest.length){const n=newSceneFromTemplate();return{...d,scenes:[n],activeSceneId:n.id};}return{...d,scenes:rest,activeSceneId:rest[0].id};});};
  const applyTemplate=()=>{const t=SCENE_TEMPLATES.find(x=>x.id===templateId);if(!t||!active)return;if(active.beats.length&&!confirm(`現在の工程を「${t.name}」で置き換えますか？`))return;patchScene({templateId:t.id,beats:t.beats.map(x=>({id:uid('beat'),stage:x[0],prompt:x[1],note:'',done:false}))});showToast('テンプレートを反映しました');};
  const updateBeat=(id,patch)=>patchScene({beats:active.beats.map(b=>b.id===id?{...b,...patch}:b)});
  const saveBeat=()=>{if(!draftBeat||!draftBeat.prompt.trim())return;const exists=active.beats.some(b=>b.id===draftBeat.id);patchScene({beats:exists?active.beats.map(b=>b.id===draftBeat.id?draftBeat:b):[...active.beats,draftBeat]});setDraftBeat(null);};
  const moveBeat=(i,d)=>{const a=[...active.beats],n=i+d;if(n<0||n>=a.length)return;[a[i],a[n]]=[a[n],a[i]];patchScene({beats:a});};
  const copyScene=async()=>{if(!active)return;const ref=scenes.find(s=>s.id===active.referenceSceneId);const out=[`【${active.title}】`,`役割：${active.sceneRole}`,`開始方法：${active.startMode}`,active.location&&`場所：${active.location}`,active.pov&&`視点：${active.pov}`,active.timeRelation&&`時間関係：${active.timeRelation}${ref?`（基準：${ref.title}）`:''}`,active.purpose&&`目的：${active.purpose}`,active.readerInfo&&`読者だけが知る情報：${active.readerInfo}`,active.characterInfo&&`作中人物も知る情報：${active.characterInfo}`,active.startState&&`開始状態：${active.startState}`,...active.beats.map((b,i)=>`${i+1}. ${b.stage}：${b.prompt}${b.note?`\n   ${b.note}`:''}`),active.endState&&`終了状態：${active.endState}`,active.returnToMain&&'このあと元の本筋・視点へ戻る'].filter(Boolean).join('\n');showToast(await copyPlainText(out)?'シーン設計をコピーしました':'コピーに失敗しました');};
  if(!active)return null;
  return <div>
    <p className="adult-tab-desc">一場面の「開始時と終了時で何が変わるか」を軸に、必要な工程だけ並べます。物語の途中や行為の最中から始める場合は、開始方法を切り替えてください。</p>
    <div className="scene-workspace">
      <aside className="scene-list-panel"><div className="dict-list-head"><span>シーン案</span><button className="btn btn-sm btn-primary" onClick={addScene}>＋</button></div><div className="scene-list">{scenes.map(s=><button key={s.id} className={'scene-list-item'+(s.id===active.id?' active':'')} onClick={()=>setData(d=>({...d,activeSceneId:s.id}))}><div className="scene-list-title">{s.title}</div><div className="scene-list-sub">{(SCENE_TEMPLATES.find(t=>t.id===s.templateId)||{}).name||'自由設計'}／{s.beats.length}工程</div></button>)}</div></aside>
      <section className="scene-editor-panel">
        <div className="scene-meta-grid">
          <div className="dict-field-block span-all"><label className="dict-field-label">シーン名</label><input value={active.title} onChange={e=>patchScene({title:e.target.value})}/></div>

          <div className="dict-field-block"><label className="dict-field-label">テンプレート</label><div style={{display:'flex',gap:5}}><select value={templateId} onChange={e=>setTemplateId(e.target.value)}>{SCENE_TEMPLATES.map(t=><option key={t.id} value={t.id}>{t.name}</option>)}</select><button className="btn" onClick={applyTemplate}>展開</button></div></div>
          <div className="dict-field-block"><label className="dict-field-label">シーンの役割</label><select value={active.sceneRole} onChange={e=>patchScene({sceneRole:e.target.value})}>{['本筋','別視点','一方その頃','回想','幕間','敵側','官能','その他'].map(x=><option key={x}>{x}</option>)}</select></div>
          <div className="dict-field-block"><label className="dict-field-label">時間関係</label><select value={active.timeRelation} onChange={e=>patchScene({timeRelation:e.target.value})}>{OUTLINE_TIME_RELATIONS.map(x=><option key={x}>{x}</option>)}</select></div>
          <div className="dict-field-block"><label className="dict-field-label">場所</label><input value={active.location} onChange={e=>patchScene({location:e.target.value})}/></div>
          <div className="dict-field-block"><label className="dict-field-label">視点人物・陣営</label><input value={active.pov} onChange={e=>patchScene({pov:e.target.value})}/></div>
          <div className="dict-field-block span-all"><label className="dict-field-label">基準となるシーン</label><select value={active.referenceSceneId} onChange={e=>patchScene({referenceSceneId:e.target.value})}><option value="">指定なし</option>{scenes.filter(s=>s.id!==active.id).map(s=><option key={s.id} value={s.id}>{s.title}</option>)}</select></div>
          <div className="dict-field-block span-all"><label className="dict-field-label">この場面の目的</label><input value={active.purpose} onChange={e=>patchScene({purpose:e.target.value})} placeholder="読者に何を伝え、人物や状況をどう動かすか"/></div>
          <div className="dict-field-block"><label className="dict-field-label">読者だけが知る情報</label><textarea rows="3" value={active.readerInfo} onChange={e=>patchScene({readerInfo:e.target.value})}/></div>
          <div className="dict-field-block"><label className="dict-field-label">作中人物も知る情報</label><textarea rows="3" value={active.characterInfo} onChange={e=>patchScene({characterInfo:e.target.value})}/></div>
          <div className="dict-field-block"><label className="dict-field-label">開始状態</label><textarea rows="3" value={active.startState} onChange={e=>patchScene({startState:e.target.value})} placeholder="場面が始まる時点の状況・感情・関係"/></div>
          <div className="dict-field-block"><label className="dict-field-label">終了状態</label><textarea rows="3" value={active.endState} onChange={e=>patchScene({endState:e.target.value})} placeholder="場面の終わりに何が変わっているか"/></div>
          <label className="check-row span-all"><input type="checkbox" checked={active.returnToMain} onChange={e=>patchScene({returnToMain:e.target.checked})}/>このあと元の本筋・視点へ戻る</label>
        </div>
        <div className="dict-list-head" style={{marginTop:14}}><span>工程</span><button className="btn btn-sm btn-primary" onClick={()=>setDraftBeat({id:uid('beat'),stage:'新しい工程',prompt:'',note:'',done:false})}>＋ 工程追加</button></div>
        <div className="scene-beat-list">{active.beats.map((b,i)=><div key={b.id} className={'scene-beat'+(b.done?' done':'')}><input type="checkbox" checked={b.done} onChange={e=>updateBeat(b.id,{done:e.target.checked})}/><div onClick={()=>setDraftBeat({...b})} style={{cursor:'pointer'}}><div className="scene-beat-stage">{b.stage}</div><div className="scene-beat-prompt">{b.prompt}</div>{b.note&&<div className="scene-beat-note">{b.note}</div>}</div><div className="scene-beat-actions"><button className="btn btn-sm" onClick={()=>moveBeat(i,-1)} disabled={i===0}>↑</button><button className="btn btn-sm" onClick={()=>moveBeat(i,1)} disabled={i===active.beats.length-1}>↓</button><button className="btn btn-sm" onClick={()=>patchScene({beats:active.beats.filter(x=>x.id!==b.id)})}>×</button></div></div>)}</div>
        <div className="modal-actions" style={{justifyContent:'space-between',paddingBottom:0}}><div><button className="btn btn-danger" onClick={deleteScene}>削除</button></div><div><button className="btn" onClick={duplicateScene}>複製</button> <button className="btn btn-primary" onClick={copyScene}>コピー</button></div></div>
      </section>
    </div>
    {draftBeat&&<Modal title="工程を編集" onClose={()=>setDraftBeat(null)}><div className="dict-field-block"><label className="dict-field-label">工程名</label><input value={draftBeat.stage} onChange={e=>setDraftBeat(d=>({...d,stage:e.target.value}))}/></div><div className="dict-field-block"><label className="dict-field-label">確認すること</label><textarea rows="3" value={draftBeat.prompt} onChange={e=>setDraftBeat(d=>({...d,prompt:e.target.value}))}/></div><div className="dict-field-block"><label className="dict-field-label">今回の内容・メモ</label><textarea rows="5" value={draftBeat.note} onChange={e=>setDraftBeat(d=>({...d,note:e.target.value}))}/></div><div className="modal-actions"><button className="btn" onClick={()=>setDraftBeat(null)}>キャンセル</button><button className="btn btn-primary" onClick={saveBeat}>保存</button></div></Modal>}
    {toast&&<div className="expr-dict-toast" style={{position:'fixed',bottom:'76px'}}>{toast}</div>}

function StoryPatternLibrary({data,setData}){
  const patterns=data.patterns||[];
  const [query,setQuery]=useState(''),[category,setCategory]=useState('');
  const [selectedId,setSelectedId]=useState(patterns[0]&&patterns[0].id);
  const [draft,setDraft]=useState(null),[importOpen,setImportOpen]=useState(false),[importText,setImportText]=useState(''),[toast,setToast]=useState('');
  const fields=[['steps','基本の流れ'],['strengths','強み'],['pitfalls','注意点'],['examples','参考作品'],['tags','タグ']];
  const lines=a=>(a||[]).join('\n');
  const parseLines=s=>s.split(/\r?\n/).map(x=>x.trim()).filter(Boolean);
  const cats=Array.from(new Set(patterns.map(x=>x.category).filter(Boolean)));
  const q=query.trim().toLowerCase();
  const filtered=patterns.filter(p=>(!category||p.category===category)&&(!q||[p.name,p.core,p.category,...p.tags,...p.examples].join(' ').toLowerCase().includes(q)));
  const selected=filtered.find(x=>x.id===selectedId)||filtered[0];
  const showToast=m=>{setToast(m);setTimeout(()=>setToast(''),1400);};
  const editPattern=p=>setDraft({...p,steps:lines(p.steps),strengths:lines(p.strengths),pitfalls:lines(p.pitfalls),examples:lines(p.examples),tags:lines(p.tags)});
  const savePattern=()=>{
    if(!draft||!draft.name.trim())return;
    const name=draft.name.trim();
    if(patterns.some(p=>p.id!==draft.id&&p.name.trim()===name)){showToast('同じ名前のパターンがあります');return;}
    const updated={...draft,name,category:draft.category.trim()||'未分類',scale:draft.scale.trim(),core:draft.core.trim()};
    fields.forEach(([key])=>updated[key]=parseLines(draft[key]));
    setData(d=>({...d,patterns:d.patterns.some(p=>p.id===updated.id)?d.patterns.map(p=>p.id===updated.id?updated:p):[...d.patterns,updated]}));
    setSelectedId(updated.id);setCategory('');setQuery('');setDraft(null);
  };
  const deletePattern=()=>{
    if(!selected||!confirm(`「${selected.name}」を削除しますか？`))return;
    setData(d=>({...d,patterns:d.patterns.filter(p=>p.id!==selected.id)}));setSelectedId('');
  };
  const copyPattern=async()=>{if(!selected)return;const out=[`【${selected.name}】`,`${selected.category}／${selected.scale}`,selected.core,'','流れ',...selected.steps.map((x,i)=>`${i+1}. ${x}`),'','強み',...selected.strengths.map(x=>`・${x}`),'','注意点',...selected.pitfalls.map(x=>`・${x}`),'','参考作品：'+selected.examples.join('、')].join('\n');showToast(await copyPlainText(out)?'パターンをコピーしました':'コピーに失敗しました');};
  const check=useMemo(()=>{if(!importText.trim())return{error:'',valid:[]};try{const p=JSON.parse(importText);const rows=Array.isArray(p)?p:(p&&Array.isArray(p.patterns)?p.patterns:null);if(!rows)return{error:'配列または {"patterns": [...]} にしてください',valid:[]};const names=new Set(patterns.map(x=>x.name.trim()));const valid=[];rows.forEach(x=>{const name=String(x&&x.name||'').trim();if(name&&!names.has(name)){names.add(name);valid.push(normalizeStoryPatterns({patterns:[{...x,id:uid('pattern'),name}]}).patterns[0]);}});return{error:'',valid};}catch(e){return{error:'JSONの構文を確認してください',valid:[]};}},[importText,patterns]);
  const runImport=()=>{if(!check.valid.length)return;setData(d=>({...d,patterns:[...d.patterns,...check.valid]}));setImportOpen(false);setImportText('');};
  return <div><p className="adult-tab-desc">登場人物の出し方・一話の満足・長期構成を抽象化して眺める資料集です。</p>
    <div className="scene-flow-toolbar"><input value={query} onChange={e=>setQuery(e.target.value)} placeholder="構造・タグ・参考作品を検索"/><select value={category} onChange={e=>setCategory(e.target.value)}><option value="">全カテゴリ</option>{cats.map(x=><option key={x}>{x}</option>)}</select><button className="btn btn-primary" onClick={()=>editPattern(makeStoryPattern(uid('pattern'),'','','','',[],[],[],[],[]))}>＋ 新規</button><button className="btn" onClick={()=>setImportOpen(true)}>JSON追加</button></div>
    <div className="pattern-layout"><div><div className="dict-list-head"><span>パターン</span><span className="dict-list-count">{filtered.length}件</span></div><div className="pattern-grid">{filtered.map(p=><div key={p.id} className={'pattern-card'+(selected&&p.id===selected.id?' active':'')} onClick={()=>setSelectedId(p.id)}><div className="pattern-card-title">{p.name}</div><div className="onomatopoeia-badges"><span className="onomatopoeia-badge">{p.category}</span><span className="onomatopoeia-badge">{p.scale}</span></div><div className="pattern-card-core">{p.core}</div></div>)}</div></div>
    {selected?<div className="pattern-detail"><div className="toolbar"><div><h2 style={{margin:0}}>{selected.name}</h2><div className="adult-tab-desc">{selected.category}／{selected.scale}</div></div><div><button className="btn" onClick={()=>editPattern(selected)}>編集</button> <button className="btn btn-danger" onClick={deletePattern}>削除</button> <button className="btn btn-primary" onClick={copyPattern}>コピー</button></div></div><p style={{lineHeight:1.7}}>{selected.core}</p><h3>基本の流れ</h3><div className="pattern-step-list">{selected.steps.map((x,i)=><div className="pattern-step" key={i}>{x}</div>)}</div><div className="scene-meta-grid" style={{marginTop:14}}><div><h3>強み</h3>{selected.strengths.map((x,i)=><div className="adult-tab-desc" key={i}>・{x}</div>)}</div><div><h3>注意点</h3>{selected.pitfalls.map((x,i)=><div className="adult-tab-desc" key={i}>・{x}</div>)}</div></div><h3>参考作品</h3><div className="onomatopoeia-badges">{selected.examples.map(x=><span className="onomatopoeia-badge" key={x}>{x}</span>)}</div></div>:<div className="empty-hint">該当するパターンがありません。</div>}</div>
    {draft&&<Modal title={patterns.some(p=>p.id===draft.id)?'物語パターンを編集':'物語パターンを追加'} onClose={()=>setDraft(null)} wide><div className="scene-meta-grid"><div className="dict-field-block"><label className="dict-field-label">名前（必須）</label><input value={draft.name} onChange={e=>setDraft(d=>({...d,name:e.target.value}))}/></div><div className="dict-field-block"><label className="dict-field-label">分類</label><input value={draft.category} onChange={e=>setDraft(d=>({...d,category:e.target.value}))}/></div><div className="dict-field-block"><label className="dict-field-label">規模</label><input value={draft.scale} onChange={e=>setDraft(d=>({...d,scale:e.target.value}))}/></div><div className="dict-field-block span-all"><label className="dict-field-label">構造の要約</label><textarea rows="3" value={draft.core} onChange={e=>setDraft(d=>({...d,core:e.target.value}))}/></div>{fields.map(([key,label])=><div className="dict-field-block span-all" key={key}><label className="dict-field-label">{label}（1行に1件）</label><textarea rows={key==='steps'?6:3} value={draft[key]} onChange={e=>setDraft(d=>({...d,[key]:e.target.value}))}/></div>)}</div><div className="modal-actions"><button className="btn" onClick={()=>setDraft(null)}>キャンセル</button><button className="btn btn-primary" disabled={!draft.name.trim()} onClick={savePattern}>保存</button></div></Modal>}
    {importOpen&&<Modal title="物語パターンJSON追加" onClose={()=>setImportOpen(false)} wide><p className="adult-tab-desc">name、category、scale、core、steps、strengths、pitfalls、examples、tags を使えます。同名はスキップします。</p><textarea rows="14" style={{width:'100%',fontFamily:'ui-monospace,monospace'}} value={importText} onChange={e=>setImportText(e.target.value)} placeholder={'{"patterns":[{"name":"新しい型","category":"冒険","scale":"長編","core":"構造の要約","steps":["開始","転換","決着"],"strengths":[],"pitfalls":[],"examples":[],"tags":[]}]}'}/>{check.error&&<div className="empty-hint" style={{color:'var(--danger)'}}>{check.error}</div>}<div className="modal-actions"><button className="btn" onClick={()=>setImportOpen(false)}>キャンセル</button><button className="btn btn-primary" disabled={!!check.error||!check.valid.length} onClick={runImport}>{check.valid.length}件を追加</button></div></Modal>}{toast&&<div className="expr-dict-toast" style={{position:'fixed',bottom:'76px'}}>{toast}</div>}</div>;
}
