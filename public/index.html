function indexByName(list){
  const m = new Map();
  (list||[]).forEach(item => { if(item && item.name) m.set(String(item.name).trim(), item); });
  return m;
}

// 1つのテキスト項目について、既存値と取り込み値からどう扱うべきかを判定する
function textFieldDiff(existing, incoming){
  const e = (existing||'').toString().trim();
  const i = (incoming===undefined || incoming===null) ? '' : incoming.toString().trim();
  if(!i) return null; // 取り込み側に値が無いなら何もしない
  if(!e) return { kind:'fill', value:i };
  if(e===i) return { kind:'same' };
  return { kind:'conflict', existing:e, incoming:i };
}

// 配列フィールドの重複除去つきマージ（既存は絶対に消さない・削らない）
function arrayUnionDiff(existingArr, incomingArr){
  const existing = Array.isArray(existingArr) ? existingArr : [];
  const seen = new Set(existing);
  const added = [];
  (incomingArr||[]).forEach(v=>{
    if(v===undefined || v===null || v==='') return;
    if(seen.has(v)) return;
    seen.add(v); added.push(v);
  });
  return { added };
}

// 取り込みJSON（人間・AIが書く簡潔形式）と現在のdataから、差分プラン（プレビュー用）を作る。
// このプランはdataを一切変更しない。名前で解決できない参照先は "__new__:種別:名前" というプレースホルダーで表す。
function buildImportPlan(aiData, data){
  const errors = [];
  const changes = [];
  if(!aiData || typeof aiData !== 'object' || Array.isArray(aiData)){
    errors.push('JSON全体が、{ "characters": [...] } のようなオブジェクトになっている必要があります。');
    return { errors, changes };
  }
  ['characters','organizations','relations','locations','worldSettings','timeline','ideas'].forEach(key=>{
    if(aiData[key]!==undefined && !Array.isArray(aiData[key])) errors.push(`「${key}」は配列で指定してください（この項目は無視されます）。`);
  });
  const arr = (key) => Array.isArray(aiData[key]) ? aiData[key] : [];

  // ---- 1) characterGroups（characters[].groupから収集） ----
  const existingGroupByName = indexByName(data.characterGroups);
  const seenGroupNames = new Set();
  arr('characters').forEach(c=>{
    if(c && c.group){
      const gname = String(c.group).trim();
      if(gname && !existingGroupByName.has(gname) && !seenGroupNames.has(gname)){
        seenGroupNames.add(gname);
        changes.push({ id:'cg:'+gname, section:'characterGroups', action:'create', title:'グループ「'+gname+'」', detail:null,
          targetId:null, placeholderId:'__new__:cg:'+gname, setFields:{name:gname}, arrayFields:[], conflicts:[], refs:{} });
      }
    }
  });

  // ---- 2) organizations（明示指定 ＋ characters/relationsから間接的に必要な名前も含む） ----
  const existingOrgByName = indexByName(data.organizations);
  const explicitOrgByName = indexByName(arr('organizations'));
  const orgNamesNeeded = new Set();
  arr('organizations').forEach(o=>{ if(o && o.name) orgNamesNeeded.add(String(o.name).trim()); });
  arr('characters').forEach(c=>{ (Array.isArray(c && c.organizations) ? c.organizations : []).forEach(n=>{ if(n) orgNamesNeeded.add(String(n).trim()); }); });
  arr('relations').forEach(r=>{ if(r){ if(r.from) orgNamesNeeded.add(String(r.from).trim()); if(r.to) orgNamesNeeded.add(String(r.to).trim()); } });

  orgNamesNeeded.forEach(name=>{
    if(!name) return;
    const existing = existingOrgByName.get(name);
    const incoming = explicitOrgByName.get(name) || {};
    if(!existing){
      changes.push({ id:'org:new:'+name, section:'organizations', action:'create', title:name, detail:null,
        targetId:null, placeholderId:'__new__:org:'+name,
        setFields:{ name, category:incoming.category||'', summary:incoming.summary||'', purpose:incoming.purpose||'', memo:incoming.memo||'' },
        arrayFields:[], conflicts:[], refs:{} });
    } else {
      const setFields = {}; const conflicts = []; let anyChange=false;
      ['category','summary','purpose','memo'].forEach(f=>{
        if(incoming[f]===undefined) return;
        const d = textFieldDiff(existing[f], incoming[f]);
        if(!d) return;
        if(d.kind==='fill'){ setFields[f]=d.value; anyChange=true; }
        else if(d.kind==='conflict'){ conflicts.push({field:f, existing:d.existing, incoming:d.incoming, resolution:'keep'}); anyChange=true; }
      });
      changes.push({ id:'org:'+(anyChange?'upd':'same')+':'+existing.id, section:'organizations', action: anyChange?'update':'unchanged',
        title:name, detail:null, targetId:existing.id, placeholderId:null, setFields, arrayFields:[], conflicts, refs:{} });
    }
  });

  // ---- 3) relations（組織同士） ----
  const orgTokenByName = (name) => {
    const ex = existingOrgByName.get(name);
    return ex ? ex.id : '__new__:org:'+name;
  };
  arr('relations').forEach((r,idx)=>{
    if(!r || !r.from || !r.to){ errors.push('relationsの各要素には from と to が必要です（1件スキップ）。'); return; }
    const fromName = String(r.from).trim(), toName = String(r.to).trim();
    const fromToken = orgTokenByName(fromName), toToken = orgTokenByName(toName);
    const label = r.label || '';
    const dupExisting = !fromToken.startsWith('__new__:') && !toToken.startsWith('__new__:')
      ? (data.entityRelations||[]).find(rel => rel.fromId===fromToken && rel.toId===toToken && (rel.label||'')===label)
      : null;
    if(dupExisting){
      changes.push({ id:'rel:same:'+dupExisting.id, section:'relations', action:'unchanged', title:fromName+' → '+toName, detail:label||null,
        targetId:dupExisting.id, placeholderId:null, setFields:{}, arrayFields:[], conflicts:[], refs:{} });
    } else {
      const relDeps = [fromToken, toToken].filter(t=>t && t.indexOf('__new__:')===0);
      changes.push({ id:'rel:new:'+idx+':'+fromName+':'+toName, section:'relations', action:'create', title:fromName+' → '+toName, detail:label||null,
        targetId:null, placeholderId:null,
        setFields:{ fromId:fromToken, toId:toToken, label:r.label||'', reverseLabel:r.reverseLabel||'', note:r.note||'' },
        arrayFields:[], conflicts:[], refs:{ dependsOn: relDeps } });
    }
  });

  // ---- 4) characters ----
  const existingCharByName = indexByName(data.characters);
  const charTextFields = ['realName','age','category','summary','appearance','personality','values','goal','memo'];
  arr('characters').forEach(c=>{
    if(!c || !c.name){ errors.push('charactersの各要素には name が必要です（1件スキップ）。'); return; }
    const name = String(c.name).trim();
    const existing = existingCharByName.get(name);
    const groupToken = c.group ? (existingGroupByName.has(String(c.group).trim()) ? existingGroupByName.get(String(c.group).trim()).id : '__new__:cg:'+String(c.group).trim()) : undefined;
    const orgTokens = (Array.isArray(c.organizations) ? c.organizations : []).map(n=>orgTokenByName(String(n).trim())).filter(Boolean);
    const tagList = Array.isArray(c.tags) ? c.tags.map(t=>String(t).trim()).filter(Boolean) : [];

    if(!existing){
      const setFields = { name };
      charTextFields.forEach(f=>{ if(c[f]!==undefined && String(c[f]).trim()) setFields[f]=c[f]; });
      if(groupToken!==undefined) setFields.groupId = groupToken;
      const arrayFields = [];
      if(tagList.length) arrayFields.push({ field:'tags', added:tagList });
      if(orgTokens.length) arrayFields.push({ field:'affiliationOrgIds', added:orgTokens });
      const charDeps = [ ...(groupToken!==undefined ? [groupToken] : []), ...orgTokens ].filter(t=>t && t.indexOf('__new__:')===0);
      changes.push({ id:'char:new:'+name, section:'characters', action:'create', title:name, detail:null,
        targetId:null, placeholderId:'__new__:char:'+name, setFields, arrayFields, conflicts:[], refs:{ dependsOn: charDeps } });
    } else {
      const setFields = {}; const conflicts = []; let anyChange=false;
      charTextFields.forEach(f=>{
        if(c[f]===undefined) return;
        const d = textFieldDiff(existing[f], c[f]);
        if(!d) return;
        if(d.kind==='fill'){ setFields[f]=d.value; anyChange=true; }
        else if(d.kind==='conflict'){ conflicts.push({field:f, existing:d.existing, incoming:d.incoming, resolution:'keep'}); anyChange=true; }
      });
      if(groupToken!==undefined && !existing.groupId){ setFields.groupId = groupToken; anyChange=true; }
      const arrayFields=[];
      if(tagList.length){ const {added}=arrayUnionDiff(existing.tags, tagList); if(added.length){ arrayFields.push({field:'tags', added}); anyChange=true; } }
      if(orgTokens.length){ const {added}=arrayUnionDiff(existing.affiliationOrgIds, orgTokens); if(added.length){ arrayFields.push({field:'affiliationOrgIds', added}); anyChange=true; } }
      const charUpdDeps = [];
      if(setFields.groupId && setFields.groupId.indexOf('__new__:')===0) charUpdDeps.push(setFields.groupId);
      arrayFields.forEach(af=>{ af.added.forEach(t=>{ if(t && t.indexOf('__new__:')===0) charUpdDeps.push(t); }); });
      changes.push({ id:'char:'+(anyChange?'upd':'same')+':'+existing.id, section:'characters', action: anyChange?'update':'unchanged',
        title:name, detail:null, targetId:existing.id, placeholderId:null, setFields, arrayFields, conflicts, refs:{ dependsOn: charUpdDeps } });
    }
  });

  // ---- 5) locations（親子関係は全件解決してから2パス目で反映） ----
  const existingLocByName = indexByName(data.locations);
  const locNameToToken = new Map();
  const locChanges = [];
  arr('locations').forEach(l=>{
    if(!l || !l.name){ errors.push('locationsの各要素には name が必要です（1件スキップ）。'); return; }
    const name = String(l.name).trim();
    const existing = existingLocByName.get(name);
    if(!existing){
      const token = '__new__:loc:'+name;
      locNameToToken.set(name, token);
      const setFields = { name };
      if(l.category && String(l.category).trim()) setFields.category = l.category;
      if(l.summary && String(l.summary).trim()) setFields.summary = l.summary;
      if(l.memo && String(l.memo).trim()) setFields.memo = l.memo;
      const ch = { id:'loc:new:'+name, section:'locations', action:'create', title:name, detail:null,
        targetId:null, placeholderId:token, setFields, arrayFields:[], conflicts:[], refs:{ parentName: l.parent ? String(l.parent).trim() : null } };
      changes.push(ch); locChanges.push(ch);
    } else {
      locNameToToken.set(name, existing.id);
      const setFields = {}; const conflicts = []; let anyChange=false;
      ['category','summary','memo'].forEach(f=>{
        if(l[f]===undefined) return;
        const d = textFieldDiff(existing[f], l[f]);
        if(!d) return;
        if(d.kind==='fill'){ setFields[f]=d.value; anyChange=true; }
        else if(d.kind==='conflict'){ conflicts.push({field:f, existing:d.existing, incoming:d.incoming, resolution:'keep'}); anyChange=true; }
      });
      const ch = { id:'loc:upd:'+existing.id, section:'locations', action: anyChange?'update':'unchanged', title:name, detail:null,
        targetId:existing.id, placeholderId:null, setFields, arrayFields:[], conflicts, refs:{ parentName: (l.parent!==undefined) ? (l.parent?String(l.parent).trim():'') : undefined } };
      changes.push(ch); locChanges.push(ch);
    }
  });
  locChanges.forEach(ch=>{
    const parentName = ch.refs.parentName;
    if(!parentName) return;
    let parentToken = locNameToToken.get(parentName);
    if(!parentToken){
      const exLoc = existingLocByName.get(parentName);
      if(exLoc) parentToken = exLoc.id;
    }
    if(!parentToken){
      errors.push(`場所「${ch.title}」の親「${parentName}」が見つかりませんでした（親の設定は反映されません）。`);
      return;
    }
    if(parentToken===ch.placeholderId || (ch.targetId && parentToken===ch.targetId)){
      errors.push(`場所「${ch.title}」は自分自身を親にできないため、親の設定は反映されません。`);
      return;
    }
    ch.setFields.parentLocationId = parentToken;
    if(parentToken.indexOf('__new__:')===0) ch.refs.dependsOn = [ ...(ch.refs.dependsOn||[]), parentToken ];
    if(ch.action==='unchanged') ch.action = 'update';
  });

  // ---- 6) worldSettings（大分類 → カテゴリ → カード） ----
  const existingWsGroupByName = indexByName(data.worldSettingGroups);
  const wsGroupTokenByName = new Map();
  const wsCatTokenByKey = new Map();
  arr('worldSettings').forEach(w=>{
    if(!w || !w.title || !String(w.title).trim()){ errors.push('worldSettingsの各要素には title が必要です（1件スキップ）。'); return; }
    const groupName = w.group ? String(w.group).trim() : '';
    const catName = w.category ? String(w.category).trim() : 'その他';

    let groupToken = null;
    if(groupName){
      if(wsGroupTokenByName.has(groupName)) groupToken = wsGroupTokenByName.get(groupName);
      else {
        const exG = existingWsGroupByName.get(groupName);
        if(exG) groupToken = exG.id;
        else {
          groupToken = '__new__:wsg:'+groupName;
          changes.push({ id:'wsg:'+groupName, section:'worldSettings', action:'create', title:'大分類「'+groupName+'」', detail:null,
            targetId:null, placeholderId:groupToken, setFields:{name:groupName}, arrayFields:[], conflicts:[], refs:{kind:'group'} });
        }
        wsGroupTokenByName.set(groupName, groupToken);
      }
    }

    const catKey = (groupToken||'__none__')+'::'+catName;
    let catToken;
    if(wsCatTokenByKey.has(catKey)) catToken = wsCatTokenByKey.get(catKey);
    else {
      let existingCat = null;
      if(groupToken && !groupToken.startsWith('__new__:')){
        existingCat = data.worldSettings.find(cat => cat.name===catName && (cat.groupId||null)===groupToken);
      } else if(!groupToken){
        existingCat = data.worldSettings.find(cat => cat.name===catName && (!cat.groupId || !data.worldSettingGroups.find(g=>g.id===cat.groupId)));
      }
      if(existingCat) catToken = existingCat.id;
      else {
        catToken = '__new__:wsc:'+catKey;
        const catDeps = (groupToken && groupToken.indexOf('__new__:')===0) ? [groupToken] : [];
        changes.push({ id:'wsc:'+catKey, section:'worldSettings', action:'create',
          title:'カテゴリ「'+catName+'」'+(groupName?`（${groupName}）`:''), detail:null,
          targetId:null, placeholderId:catToken, setFields:{name:catName, groupIdRef:groupToken}, arrayFields:[], conflicts:[], refs:{kind:'category', dependsOn:catDeps} });
      }
      wsCatTokenByKey.set(catKey, catToken);
    }

    const title = String(w.title).trim();
    let existingCard = null;
    if(!catToken.startsWith('__new__:')){
      const cat = data.worldSettings.find(c=>c.id===catToken);
      existingCard = cat ? (cat.cards||[]).find(cd=>cd.title===title) : null;
    }
    const cardLabel = title+'（'+catName+'）';
    if(!existingCard){
      const cardDeps = catToken.indexOf('__new__:')===0 ? [catToken] : [];
      changes.push({ id:'wsd:new:'+catKey+':'+title, section:'worldSettings', action:'create', title:cardLabel, detail:null,
        targetId:null, placeholderId:null, setFields:{ title, content:w.content||'' }, arrayFields:[], conflicts:[], refs:{kind:'card', catToken, dependsOn:cardDeps} });
    } else {
      const d = textFieldDiff(existingCard.content, w.content);
      if(!d || d.kind==='same'){
        changes.push({ id:'wsd:same:'+existingCard.id, section:'worldSettings', action:'unchanged', title:cardLabel, detail:null,
          targetId:existingCard.id, placeholderId:null, setFields:{}, arrayFields:[], conflicts:[], refs:{kind:'card', catToken, cardId:existingCard.id} });
      } else if(d.kind==='fill'){
        changes.push({ id:'wsd:upd:'+existingCard.id, section:'worldSettings', action:'update', title:cardLabel, detail:null,
          targetId:existingCard.id, placeholderId:null, setFields:{content:d.value}, arrayFields:[], conflicts:[], refs:{kind:'card', catToken, cardId:existingCard.id} });
      } else {
        changes.push({ id:'wsd:conf:'+existingCard.id, section:'worldSettings', action:'update', title:cardLabel, detail:null,
          targetId:existingCard.id, placeholderId:null, setFields:{}, arrayFields:[],
          conflicts:[{field:'content', existing:d.existing, incoming:d.incoming, resolution:'keep'}], refs:{kind:'card', catToken, cardId:existingCard.id} });
      }
    }
  });

  // ---- 7) timeline（dateLabel + titleの組で同一判定） ----
  arr('timeline').forEach((t,idx)=>{
    if(!t || !t.title || !String(t.title).trim()){ errors.push('timelineの各要素には title が必要です（1件スキップ）。'); return; }
    const title = String(t.title).trim();
    const dateLabel = t.dateLabel!==undefined ? String(t.dateLabel).trim() : '';
    const existing = data.timeline.find(e=> (e.title||'').trim()===title && (e.dateLabel||'').trim()===dateLabel);
    const displayTitle = title+(dateLabel?`（${dateLabel}）`:'');
    const tagList = Array.isArray(t.tags) ? t.tags.map(x=>String(x).trim()).filter(Boolean) : [];
    if(!existing){
      const setFields = { title, dateLabel };
      if(t.summary && String(t.summary).trim()) setFields.summary = t.summary;
      if(t.detail && String(t.detail).trim()) setFields.detail = t.detail;
      const arrayFields = [];
      if(tagList.length) arrayFields.push({field:'tags', added:tagList});
      changes.push({ id:'tl:new:'+idx+':'+title, section:'timeline', action:'create', title:displayTitle, detail:null,
        targetId:null, placeholderId:null, setFields, arrayFields, conflicts:[], refs:{} });
    } else {
      const setFields = {}; const conflicts = []; let anyChange=false;
      ['summary','detail'].forEach(f=>{
        if(t[f]===undefined) return;
        const d = textFieldDiff(existing[f], t[f]);
        if(!d) return;
        if(d.kind==='fill'){ setFields[f]=d.value; anyChange=true; }
        else if(d.kind==='conflict'){ conflicts.push({field:f, existing:d.existing, incoming:d.incoming, resolution:'keep'}); anyChange=true; }
      });
      const arrayFields = [];
      if(tagList.length){ const {added}=arrayUnionDiff(existing.tags, tagList); if(added.length){ arrayFields.push({field:'tags', added}); anyChange=true; } }
      changes.push({ id:'tl:'+(anyChange?'upd':'same')+':'+existing.id, section:'timeline', action: anyChange?'update':'unchanged',
        title:displayTitle, detail:null, targetId:existing.id, placeholderId:null, setFields, arrayFields, conflicts, refs:{} });
    }
  });

  // ---- 8) ideas（contentの完全一致で重複判定） ----
  arr('ideas').forEach((idea,idx)=>{
    if(!idea || !idea.content || !String(idea.content).trim()){ errors.push('ideasの各要素には content が必要です（1件スキップ）。'); return; }
    const content = String(idea.content).trim();
    const dup = data.ideas.find(i=> (i.content||'').trim()===content);
    const shortLabel = content.length>26 ? content.slice(0,26)+'…' : content;
    if(dup){
      changes.push({ id:'idea:same:'+dup.id, section:'ideas', action:'unchanged', title:shortLabel, detail:null,
        targetId:dup.id, placeholderId:null, setFields:{}, arrayFields:[], conflicts:[], refs:{} });
    } else {
      const tagList = Array.isArray(idea.tags) ? idea.tags.map(x=>String(x).trim()).filter(Boolean) : [];
      const arrayFields = [];
      if(tagList.length) arrayFields.push({field:'tags', added:tagList});
      changes.push({ id:'idea:new:'+idx, section:'ideas', action:'create', title:shortLabel, detail:null,
        targetId:null, placeholderId:null, setFields:{ content, type:idea.type||'アイデア', status:idea.status||'未使用' }, arrayFields, conflicts:[], refs:{} });
    }
  });

  return { errors, changes };
}

// 一括取り込みの依存関係チェック（未解決参照の検出）。
// changes配列（enabledフラグ付き）を受け取り、"new:..."参照が解決できない変更項目のidをSetで返す。
// 参照先が新規作成対象でも、それがOFF/エラー/存在しない場合は未解決として連鎖的に検出する（固定点まで反復）。
function computeDependencyBlocked(changes){
  const byPlaceholder = new Map();
  changes.forEach(c=>{ if(c.placeholderId) byPlaceholder.set(c.placeholderId, c); });
  const blocked = new Map(); // id -> [missing title, ...]
  let changedFlag = true;
  while(changedFlag){
    changedFlag = false;
    changes.forEach(c=>{
      if(blocked.has(c.id)) return;
      const deps = (c.refs && c.refs.dependsOn) || [];
      const missing = [];
      deps.forEach(token=>{
        if(!token || token.indexOf('__new__:')!==0) return;
        const depChange = byPlaceholder.get(token);
        const depOk = depChange && depChange.enabled!==false && depChange.action==='create' && !blocked.has(depChange.id);
        if(!depOk) missing.push(depChange ? depChange.title : token);
      });
      if(missing.length){ blocked.set(c.id, missing); changedFlag = true; }
    });
  }
  return blocked;
}

// プランを実際にdataへ適用する。画像関連フィールド（image/iconImageId/images）は一切書き換えない。
function applyImportPlan(plan, data){
  let next = { ...data };
  const idMap = {}; // "__new__:種別:名前" → 実際に発行したuid
  const resolve = (token) => {
    if(token===undefined || token===null) return token;
    if(typeof token==='string' && token.indexOf('__new__:')===0) return idMap[token]!==undefined ? idMap[token] : null;
    return token;
  };
  // UI側の検証に依存しない最終防御：未解決の依存関係を持つ項目は、チェックがONでも取り込まない。
  const dependencyBlocked = computeDependencyBlocked(plan.changes);
  const isOn = (c) => c.enabled!==false && c.action!=='unchanged' && c.action!=='error' && !dependencyBlocked.has(c.id);
  // setFields（name / parentLocationId / groupIdRefは個別に扱うため除外）＋ conflictsの選択結果をまとめたpatchを作る
  const buildPatch = (c) => {
    const patch = {};
    Object.keys(c.setFields||{}).forEach(k=>{
      if(k==='name' || k==='parentLocationId' || k==='groupIdRef') return;
      patch[k] = resolve(c.setFields[k]);
    });
    (c.conflicts||[]).forEach(cf=>{
      if(cf.resolution==='replace') patch[cf.field] = cf.incoming;
      else if(cf.resolution==='append') patch[cf.field] = cf.existing ? (cf.existing+'\n'+cf.incoming) : cf.incoming;
      // 'keep' の場合は何もしない（既存を維持）
    });
    return patch;
  };

  // 1) characterGroups
  let characterGroups = [...(next.characterGroups||[])];
  plan.changes.filter(c=>c.section==='characterGroups' && c.action==='create').forEach(c=>{
    if(!isOn(c)) return;
    const gid = uid('cg');
    idMap[c.placeholderId] = gid;
    characterGroups = [...characterGroups, { id:gid, name:c.setFields.name, sortOrder:characterGroups.length }];
  });
  next = { ...next, characterGroups };

  // 2) organizations（画像フィールドには触れない）
  let organizations = [...next.organizations];
  plan.changes.filter(c=>c.section==='organizations').forEach(c=>{
    if(!isOn(c)) return;
    if(c.action==='create'){
      const oid = uid('org');
      idMap[c.placeholderId] = oid;
      organizations = [...organizations, { id:oid, name:c.setFields.name, image:null, category:c.setFields.category||'',
        summary:c.setFields.summary||'', purpose:c.setFields.purpose||'', memberIds:[], locationIds:[], memo:c.setFields.memo||'', customFields:[] }];
    } else if(c.action==='update'){
      const patch = buildPatch(c);
      organizations = organizations.map(o=> o.id===c.targetId ? { ...o, ...patch } : o);
    }
  });
  next = { ...next, organizations };

  // 3) relations
  let entityRelations = [...(next.entityRelations||[])];
  plan.changes.filter(c=>c.section==='relations' && c.action==='create').forEach(c=>{
    if(!isOn(c)) return;
    const fromReal = resolve(c.setFields.fromId), toReal = resolve(c.setFields.toId);
    // 最終防御：fromId / toIdのどちらかが解決できない場合、relationを作成しない（nullを保存しない）。
    if(!fromReal || !toReal) return;
    entityRelations = [...entityRelations, { id:uid('rel'),
      fromId:fromReal, toId:toReal,
      label:c.setFields.label||'', reverseLabel:c.setFields.reverseLabel||'', note:c.setFields.note||'',
      fromType:'organization', toType:'organization' }];
  });
  next = { ...next, entityRelations };

  // 4) characters（画像フィールドには触れない）
  let characters = [...next.characters];
  plan.changes.filter(c=>c.section==='characters').forEach(c=>{
    if(!isOn(c)) return;
    if(c.action==='create'){
      const cid = uid('char');
      const base = { id:cid, name:c.setFields.name, realName:'', calledNames:[], kana:'', image:null, iconImageId:null,
        affiliationOrgIds:[], category:'', groupId:null, tags:[], age:'', summary:'', appearance:'', personality:'', values:'', goal:'', memo:'',
        customFields:[], images:[], relatedLocationIds:[], changes:[] };
      let obj = { ...base, ...buildPatch(c) };
      (c.arrayFields||[]).forEach(af=>{
        const added = af.added.map(resolve).filter(v=>v!==null && v!==undefined);
        obj = { ...obj, [af.field]: [ ...(obj[af.field]||[]), ...added ] };
      });
      characters = [...characters, obj];
    } else if(c.action==='update'){
      characters = characters.map(ch=>{
        if(ch.id!==c.targetId) return ch;
        let obj = { ...ch, ...buildPatch(c) };
        (c.arrayFields||[]).forEach(af=>{
          const added = af.added.map(resolve).filter(v=>v!==null && v!==undefined);
          const merged = [...(obj[af.field]||[])];
          added.forEach(v=>{ if(!merged.includes(v)) merged.push(v); });
          obj = { ...obj, [af.field]: merged };
        });
        return obj;
      });
    }
  });
  next = { ...next, characters };

  // 5) locations（1パス目で本体を作成・更新、2パス目で親子関係だけ反映）
  let locations = [...next.locations];
  const locRealIdByChangeId = {};
  plan.changes.filter(c=>c.section==='locations').forEach(c=>{
    if(!isOn(c)) return;
    if(c.action==='create'){
      const lid = uid('loc');
      if(c.placeholderId) idMap[c.placeholderId] = lid;
      locRealIdByChangeId[c.id] = lid;
      const sf = c.setFields;
      locations = [...locations, { id:lid, name:sf.name, image:null, category:sf.category||'', summary:sf.summary||'',
        controllingOrgId:null, relatedPersonIds:[], relatedOrgIds:[], memo:sf.memo||'', customFields:[],
        parentLocationId:null, mapId:null, mapX:null, mapY:null }];
    } else if(c.action==='update'){
      locRealIdByChangeId[c.id] = c.targetId;
      const patch = buildPatch(c);
      locations = locations.map(l=> l.id===c.targetId ? { ...l, ...patch } : l);
    }
  });
  plan.changes.filter(c=>c.section==='locations' && isOn(c) && c.setFields && c.setFields.parentLocationId!==undefined).forEach(c=>{
    const selfId = locRealIdByChangeId[c.id];
    if(!selfId) return;
    const parentReal = resolve(c.setFields.parentLocationId);
    if(!parentReal || parentReal===selfId) return;
    let cursor = parentReal, hops = 0, cyclic = false;
    while(cursor && hops<50){
      if(cursor===selfId){ cyclic=true; break; }
      const node = locations.find(l=>l.id===cursor);
      cursor = node ? node.parentLocationId : null;
      hops++;
    }
    if(cyclic) return;
    locations = locations.map(l=> l.id===selfId ? { ...l, parentLocationId:parentReal } : l);
  });
  next = { ...next, locations };

  // 6) worldSettings（大分類 → カテゴリ → カードの順で作成）
  let worldSettingGroups = [...next.worldSettingGroups];
  plan.changes.filter(c=>c.section==='worldSettings' && c.refs.kind==='group').forEach(c=>{
    if(!isOn(c)) return;
    const gid = uid('wsg');
    idMap[c.placeholderId] = gid;
    worldSettingGroups = [...worldSettingGroups, { id:gid, name:c.setFields.name, sortOrder:worldSettingGroups.length }];
  });
  next = { ...next, worldSettingGroups };

  let worldSettings = [...next.worldSettings];
  plan.changes.filter(c=>c.section==='worldSettings' && c.refs.kind==='category').forEach(c=>{
    if(!isOn(c)) return;
    const cid = uid('wsc');
    idMap[c.placeholderId] = cid;
    worldSettings = [...worldSettings, { id:cid, name:c.setFields.name, groupId:resolve(c.setFields.groupIdRef)||null, cards:[] }];
  });
  plan.changes.filter(c=>c.section==='worldSettings' && c.refs.kind==='card').forEach(c=>{
    if(!isOn(c)) return;
    const catId = resolve(c.refs.catToken);
    if(!catId) return;
    if(c.action==='create'){
      worldSettings = worldSettings.map(cat=> cat.id===catId ? { ...cat, cards:[...cat.cards, { id:uid('wsd'), title:c.setFields.title, content:c.setFields.content||'' }] } : cat);
    } else if(c.action==='update'){
      const patch = buildPatch(c);
      worldSettings = worldSettings.map(cat=> cat.id!==catId ? cat : { ...cat, cards: cat.cards.map(cd=> cd.id===c.refs.cardId ? { ...cd, ...patch } : cd) });
    }
  });
  next = { ...next, worldSettings };

  // 7) timeline
  let timeline = [...next.timeline];
  plan.changes.filter(c=>c.section==='timeline').forEach(c=>{
    if(!isOn(c)) return;
    if(c.action==='create'){
      const ev = { id:uid('tl'), dateLabel:c.setFields.dateLabel||'', title:c.setFields.title||'', summary:c.setFields.summary||'',
        detail:c.setFields.detail||'', personIds:[], orgIds:[], locationIds:[], tags:[], sortOrder:timeline.length };
      (c.arrayFields||[]).forEach(af=>{ ev[af.field] = [ ...(ev[af.field]||[]), ...af.added ]; });
      timeline = [...timeline, ev];
    } else if(c.action==='update'){
      const patch = buildPatch(c);
      timeline = timeline.map(ev=>{
        if(ev.id!==c.targetId) return ev;
        let obj = { ...ev, ...patch };
        (c.arrayFields||[]).forEach(af=>{
          const merged = [...(obj[af.field]||[])];
          af.added.forEach(v=>{ if(!merged.includes(v)) merged.push(v); });
          obj = { ...obj, [af.field]: merged };
        });
        return obj;
      });
    }
  });
  next = { ...next, timeline };

  // 8) ideas
  let ideas = [...next.ideas];
  plan.changes.filter(c=>c.section==='ideas' && c.action==='create').forEach(c=>{
    if(!isOn(c)) return;
    const idea = { id:uid('idea'), content:c.setFields.content, type:c.setFields.type||'アイデア', tags:[],
      personIds:[], orgIds:[], locationIds:[], status:c.setFields.status||'未使用', usedIn:'', createdAt:Date.now() };
    (c.arrayFields||[]).forEach(af=>{ idea[af.field] = [ ...(idea[af.field]||[]), ...af.added ]; });
    ideas = [...ideas, idea];
  });
  next = { ...next, ideas };

  return next;
}

/* ============ IndexedDB（画像保存） ============ */
const IDB_NAME = 'novel-world-builder-images';
const IDB_STORE = 'images';

// DB接続はPromiseとしてキャッシュし、呼び出しのたびにopenし直さない。
// 接続失敗・切断時はキャッシュを解除して再試行できるようにする。
let imageDbPromise = null;
function openImageDB(){
  if(imageDbPromise) return imageDbPromise;
  imageDbPromise = new Promise((resolve, reject)=>{
    try{
      const req = indexedDB.open(IDB_NAME, 1);
      req.onupgradeneeded = () => { req.result.createObjectStore(IDB_STORE); };
      req.onsuccess = () => {
        const db = req.result;
        db.onclose = () => { imageDbPromise = null; };
        db.onversionchange = () => { db.close(); imageDbPromise = null; };
        resolve(db);
      };
      req.onerror = () => { imageDbPromise = null; reject(req.error || new Error('画像データベースを開けませんでした')); };
    }catch(err){
      imageDbPromise = null;
      reject(err);
    }
  });
  return imageDbPromise;
}
async function idbPut(id, dataUrl){
  const db = await openImageDB();
  return new Promise((resolve,reject)=>{
    const tx = db.transaction(IDB_STORE,'readwrite');
    tx.objectStore(IDB_STORE).put(dataUrl, id);
    tx.oncomplete = () => resolve();
    tx.onerror = () => reject(tx.error);
    tx.onabort = () => reject(tx.error || new Error('保存が中断されました'));
  });
}
async function idbGet(id){
  if(!id) return null;
  const db = await openImageDB();
  return new Promise((resolve,reject)=>{
    const tx = db.transaction(IDB_STORE,'readonly');
    const r = tx.objectStore(IDB_STORE).get(id);
    r.onsuccess = () => resolve(r.result || null);
    r.onerror = () => reject(r.error);
  });
}
async function idbDelete(id){
  if(!id) return;
  const db = await openImageDB();
  return new Promise((resolve,reject)=>{
    const tx = db.transaction(IDB_STORE,'readwrite');
    tx.objectStore(IDB_STORE).delete(id);
    tx.oncomplete = () => resolve();
    tx.onerror = () => reject(tx.error);
  });
}
async function idbGetAll(){
  const db = await openImageDB();
  return new Promise((resolve,reject)=>{
    const tx = db.transaction(IDB_STORE,'readonly');
    const store = tx.objectStore(IDB_STORE);
    const out = {};
    const req = store.openCursor();
    req.onsuccess = (e) => {
      const cur = e.target.result;
      if(cur){ out[cur.key] = cur.value; cur.continue(); }
      else resolve(out);
    };
    req.onerror = () => reject(req.error);
  });
}

// UIコンポーネントはIndexedDBを直接叩かず、この薄いラッパーだけを使う。
// 将来Cloudflare R2などへ移行する場合は、この4つの中身だけ差し替えればよい。
const imageStorage = {
  save: (id, dataUrl) => idbPut(id, dataUrl),
  get: (id) => idbGet(id),
  remove: (id) => {
    if(!id) return Promise.resolve();
    return idbDelete(id).catch(err => { console.error('画像の削除に失敗しました（無視して続行）', err); });
  },
  getAll: () => idbGetAll(),
};

// 画像1枚をJPEGのdata URLへ変換（共通処理）
function drawToJpegDataUrl(source, srcW, srcH, maxW, quality){
  let width = srcW, height = srcH;
  if(width > maxW){ height = Math.round(height * (maxW/width)); width = maxW; }
  const canvas = document.createElement('canvas');
  canvas.width = width; canvas.height = height;
  const ctx = canvas.getContext('2d');
  ctx.drawImage(source, 0, 0, width, height);
  const dataUrl = canvas.toDataURL('image/jpeg', quality);
  // 使用済みcanvasのメモリを解放
  canvas.width = 0; canvas.height = 0;
  return dataUrl;
}

// スマホの高解像度写真でも重くなりにくいよう、可能ならcreateImageBitmapを優先し、
// 使えない環境ではFileReader方式へフォールバックする。
async function compressImageFile(file, maxW=1000, quality=0.82){
  if(!file) throw new Error('ファイルが選択されていません');

  if(window.createImageBitmap){
    let bitmap = null;
    try{
      bitmap = await createImageBitmap(file);
      return drawToJpegDataUrl(bitmap, bitmap.width, bitmap.height, maxW, quality);
    }catch(err){
      console.error('createImageBitmapでの読み込みに失敗、従来方式へフォールバックします', err);
    }finally{
      if(bitmap && bitmap.close) bitmap.close();
    }
  }

  return new Promise((resolve, reject)=>{
    const reader = new FileReader();
    reader.onload = (e) => {
      const img = new Image();
      img.onload = () => {
        try{
          resolve(drawToJpegDataUrl(img, img.naturalWidth, img.naturalHeight, maxW, quality));
        }catch(err){ reject(err); }
      };
      img.onerror = () => reject(new Error('画像を読み込めませんでした'));
      img.src = e.target.result;
    };
    reader.onerror = () => reject(new Error('ファイルを読み込めませんでした'));
    reader.readAsDataURL(file);
  });
}

// options: [{id, label, sub}]
function LinkPicker({ label, options, selectedIds, onChange, placeholder }){
  const [query, setQuery] = useState('');
  const [focused, setFocused] = useState(false);
  const selected = (selectedIds||[]).map(id => options.find(o=>o.id===id)).filter(Boolean);
  const remaining = options.filter(o => !(selectedIds||[]).includes(o.id) && (!query || o.label.includes(query)));
  return (
    <div className="field-row linkpicker">
      {label && <label>{label}</label>}
      <div className="chips">
        {selected.map(o => (
          <Chip key={o.id} onRemove={()=>onChange((selectedIds||[]).filter(id=>id!==o.id))}>{o.label}</Chip>
        ))}
      </div>
      <input
        type="text" value={query} placeholder={placeholder || '入力して検索・選択'}
        onChange={e=>setQuery(e.target.value)}
        onFocus={()=>setFocused(true)}
        onBlur={()=>setTimeout(()=>setFocused(false), 150)}
      />
      {focused && (
        <div className="dropdown">
          {remaining.length===0 && <div className="none">候補なし</div>}
          {remaining.slice(0,30).map(o=>(
            <div key={o.id} onMouseDown={()=>{ onChange([...(selectedIds||[]), o.id]); setQuery(''); }}>
              {o.label}{o.sub && <span style={{color:'var(--ink-soft)', fontSize:11}}> ・{o.sub}</span>}
            </div>
          ))}
        </div>
      )}
    </div>
  );
}

function CustomFieldsEditor({ fields, onChange }){
  const list = fields || [];
  const update = (i, patch) => {
    const next = list.map((f,idx)=> idx===i ? {...f, ...patch} : f);
    onChange(next);
  };
  const remove = (i) => onChange(list.filter((_,idx)=>idx!==i));
  const move = (i, dir) => {
    const j = i+dir;
    if(j<0 || j>=list.length) return;
    const next = [...list];
    [next[i], next[j]] = [next[j], next[i]];
    onChange(next);
  };
  const add = () => onChange([...list, { id: uid('cf'), label:'', value:'' }]);
  return (
    <div>
      {list.map((f,i)=>(
        <div className="customfield-row" key={f.id}>
          <input className="cf-label" type="text" placeholder="項目名（例：搭乗機）" value={f.label}
            onChange={e=>update(i,{label:e.target.value})}/>
          <AutoTextarea className="cf-value" placeholder="内容" value={f.value} minHeight={90}
            onChange={e=>update(i,{value:e.target.value})}
            style={{border:'1px solid var(--line)', borderRadius:6, padding:'8px 10px'}} />
          <div className="cf-actions">
            <button onClick={()=>move(i,-1)} disabled={i===0}>↑</button>
            <button onClick={()=>move(i,1)} disabled={i===list.length-1}>↓</button>
            <button onClick={()=>remove(i)} style={{color:'#8a3a3a'}}>削除</button>
          </div>
        </div>
      ))}
      <button className="btn btn-ghost btn-sm" onClick={add}>＋ 自由項目を追加</button>
    </div>
  );
}

// 単一画像（組織・場所のアイコン用）
function SingleImageField({ label, imageId, onChange, variant }){
  const [url, setUrl] = useState(null);
  const [processing, setProcessing] = useState(false);
  const [error, setError] = useState('');
  const inputRef = useRef();
  const aliveRef = useRef(true);
  useEffect(()=>{ aliveRef.current = true; return ()=>{ aliveRef.current = false; }; }, []);

  useEffect(()=>{
    let alive = true;
    setError('');
    imageStorage.get(imageId)
      .then(u=>{ if(alive) setUrl(u); })
      .catch(err=>{ console.error('画像の読み込みに失敗しました', err); if(alive) setUrl(null); });
    return ()=>{ alive=false; };
  }, [imageId]);

  const handleFile = async (e) => {
    const file = e.target.files[0];
    e.target.value = '';
    if(!file || processing) return;
    setProcessing(true);
    setError('');
    try{
      const dataUrl = await compressImageFile(file);
      const newId = uid('img'); // 変更のたびに必ず新しいIDを発行する（同じIDへの上書きはしない）
      await imageStorage.save(newId, dataUrl);
      const oldId = imageId;
      onChange(newId);
      if(oldId && oldId !== newId) imageStorage.remove(oldId); // 新画像の保存成功後に旧画像を削除
    }catch(err){
      console.error('画像の保存に失敗しました', err);
      if(aliveRef.current) setError('画像の保存に失敗しました。別の画像を試してください。');
    }finally{
      if(aliveRef.current) setProcessing(false);
    }
  };
  const handleRemove = async () => {
    if(processing) return;
    setProcessing(true);
    setError('');
    try{
      const oldId = imageId;
      onChange(null);
      if(oldId) await imageStorage.remove(oldId);
    }catch(err){
      console.error('画像の削除に失敗しました', err);
      if(aliveRef.current) setError('画像の削除に失敗しました。');
    }finally{
      if(aliveRef.current) setProcessing(false);
    }
  };
  return (
    <div className="field-row">
      <label>{label}</label>
      <div className={"single-img-upload"+(variant==='portrait'?" portrait":"")}>
        {url ? <img className={variant==='portrait'?"ph-portrait":"ph"} src={url} /> : <div className={variant==='portrait'?"ph-portrait":"ph"} style={{display:'flex',alignItems:'center',justifyContent:'center',color:'var(--ink-soft)'}}>画像</div>}
        <div>
          <button className="btn btn-sm" disabled={processing} onClick={()=>inputRef.current.click()}>{processing ? '処理中…' : (url?'変更':'アップロード')}</button>
          {url && <button className="btn btn-sm btn-danger" disabled={processing} style={{marginLeft:6}} onClick={handleRemove}>削除</button>}
          <input ref={inputRef} type="file" accept="image/*" style={{display:'none'}} onChange={handleFile} disabled={processing} />
          {error && <div style={{color:'#8a3a3a', fontSize:12, marginTop:4}}>{error}</div>}
        </div>
      </div>
    </div>
  );
}

// 複数画像（キャラクター用、ラベル付き）
function MultiImageField({ images, onChange }){
  const list = images || [];
  const inputRef = useRef();
  const [urls, setUrls] = useState({});
  const [processing, setProcessing] = useState(false);
  const [error, setError] = useState('');
  const [previewId, setPreviewId] = useState(null);
  const aliveRef = useRef(true);
  useEffect(()=>{ aliveRef.current = true; return ()=>{ aliveRef.current = false; }; }, []);

  useEffect(()=>{
    let alive = true;
    (async ()=>{
      const next = {};
      for(const im of list){
        try{ next[im.id] = await imageStorage.get(im.id); }
        catch(err){ console.error('画像の読み込みに失敗しました', err); next[im.id] = null; }
      }
      if(alive) setUrls(next);
    })();
    return ()=>{ alive=false; };
  }, [list.map(i=>i.id).join(',')]);

  const handleAdd = async (e) => {
    const file = e.target.files[0];
    e.target.value = '';
    if(!file || processing) return;
    setProcessing(true);
    setError('');
    try{
      const dataUrl = await compressImageFile(file);
      const id = uid('img');
      await imageStorage.save(id, dataUrl);
      onChange([...list, { id, label:'' }]);
    }catch(err){
      console.error('画像の保存に失敗しました', err);
      if(aliveRef.current) setError('画像の保存に失敗しました。別の画像を試してください。');
    }finally{
      if(aliveRef.current) setProcessing(false);
    }
  };
  const updateLabel = (id, label) => onChange(list.map(im => im.id===id ? {...im, label} : im));
  const remove = async (id) => {
    if(processing) return;
    setProcessing(true);
    setError('');
    try{
      onChange(list.filter(im=>im.id!==id));
      await imageStorage.remove(id);
    }catch(err){
      console.error('画像の削除に失敗しました', err);
      if(aliveRef.current) setError('画像の削除に失敗しました。');
    }finally{
      if(aliveRef.current) setProcessing(false);
    }
  };

  return (
    <div className="field-row">
      <label>画像（複数登録可・ラベル任意・クリックで拡大表示）</label>
      <div className="imgrid">
        {list.map(im=>(
          <div className="img-item" key={im.id}>
            {urls[im.id] ? <img className="ph" src={urls[im.id]} onClick={()=>setPreviewId(im.id)} /> : <div className="ph" />}
            <input type="text" placeholder="立ち絵 / 私服 など" value={im.label} onChange={e=>updateLabel(im.id, e.target.value)} />
            <button className="rm" disabled={processing} onClick={()=>remove(im.id)}>削除</button>
          </div>
        ))}
        <button className="add-img" disabled={processing} onClick={()=>inputRef.current.click()}>{processing ? '…' : '＋'}</button>
        <input ref={inputRef} type="file" accept="image/*" style={{display:'none'}} onChange={handleAdd} disabled={processing} />
      </div>
      {error && <div style={{color:'#8a3a3a', fontSize:12, marginTop:4}}>{error}</div>}
      {previewId && urls[previewId] && (
        <div className="modal-backdrop" onMouseDown={(e)=>{ if(e.target===e.currentTarget) setPreviewId(null); }}>
          <div className="image-preview-overlay">
            <button className="btn btn-sm" onClick={()=>setPreviewId(null)}>閉じる</button>
            <img src={urls[previewId]} />
          </div>
        </div>
      )}
    </div>
  );
}

// 長文を流し込んでも読みやすいよう、内容に合わせて自動で高さが伸びるテキストエリア
function AutoTextarea({ value, onChange, placeholder, minHeight, style, className, readOnly }){
  const ref = useRef();
  const mh = minHeight || 130;
  useEffect(()=>{
    const el = ref.current;
    if(el){ el.style.height = 'auto'; el.style.height = Math.max(mh, el.scrollHeight) + 'px'; }
  }, [value]);
  return (
    <textarea
      ref={ref} value={value} placeholder={placeholder} onChange={onChange} className={className} readOnly={readOnly}
      style={{ width:'100%', border:'none', background:'none', minHeight:mh, lineHeight:1.9, fontSize:14.5, color:'var(--ink)', resize:'vertical', ...style }}
    />
  );
}

// 相関図用アイコンの切り抜きモーダル（登録済み画像から丸く切り抜いて保存）
// アイコン切り抜き：円は中央固定、ユーザーは背後の画像をドラッグ・拡大縮小して位置を合わせる（スマホのプロフィール画像設定に近い操作）
const ICON_CROP_MAX_SCALE = 4.5;
const ICON_CROP_CIRCLE_RATIO = 0.86; // コンテナに対する円の直径の割合

function IconCropModal({ candidates, currentIconId, onSave, onClose }){
  const [sourceId, setSourceId] = useState(candidates[0] ? candidates[0].id : null);
  const [srcUrl, setSrcUrl] = useState(null);
  const [naturalSize, setNaturalSize] = useState({w:0,h:0});
  const [containerSize, setContainerSize] = useState({w:0,h:0});
  const [scale, setScale] = useState(1);
  const [offset, setOffset] = useState({x:0,y:0});
  const [processing, setProcessing] = useState(false);
  const [error, setError] = useState('');
  const containerRef = useRef();
  const imgRef = useRef();

  // ドラッグ・ピンチ処理はrefで最新値を参照する（リスナーの張り直しを避けるため）
  const stateRef = useRef({ scale, offset, containerSize, naturalSize });
  useEffect(()=>{ stateRef.current = { scale, offset, containerSize, naturalSize }; }, [scale, offset, containerSize, naturalSize]);

  // 円の直径に対して、画像が常に円を覆っていられる範囲にoffsetを収める
  function clampOffset(off, sc, cSize, nSize){
    if(!cSize.w || !cSize.h || !nSize.w || !nSize.h) return off;
    const diam = Math.min(cSize.w, cSize.h) * ICON_CROP_CIRCLE_RATIO;
    const baseScale = diam / Math.min(nSize.w, nSize.h);
    const dispW = nSize.w * baseScale * sc;
    const dispH = nSize.h * baseScale * sc;
    const maxX = Math.max(0, (dispW - diam)/2);
    const maxY = Math.max(0, (dispH - diam)/2);
    return { x: clamp(off.x, -maxX, maxX), y: clamp(off.y, -maxY, maxY) };
  }

  const dragStateRef = useRef(null);
  const pinchStateRef = useRef(null);

  const handleMove = useCallback((e) => {
    if(pinchStateRef.current){
      if(!e.touches || e.touches.length<2) return;
      e.preventDefault();
      const [t1,t2] = e.touches;
      const dist = Math.hypot(t2.clientX-t1.clientX, t2.clientY-t1.clientY);
      const ratio = dist / (pinchStateRef.current.startDist || 1);
      const nextScale = clamp(pinchStateRef.current.startScale * ratio, 1, ICON_CROP_MAX_SCALE);
      setScale(nextScale);
      setOffset(o => clampOffset(o, nextScale, stateRef.current.containerSize, stateRef.current.naturalSize));
      return;
    }
    if(!dragStateRef.current) return;
    e.preventDefault();
    const point = e.touches ? e.touches[0] : e;
    const dx = point.clientX - dragStateRef.current.startX;
    const dy = point.clientY - dragStateRef.current.startY;
    setOffset(clampOffset(
      { x: dragStateRef.current.origX+dx, y: dragStateRef.current.origY+dy },
      stateRef.current.scale, stateRef.current.containerSize, stateRef.current.naturalSize
    ));
  }, []);

  const handleUp = useCallback((e) => {
    // 2本指ピンチ中に1本指だけ離した場合は、残った指でドラッグを継続する
    if(e && e.touches && e.touches.length===1 && pinchStateRef.current){
      pinchStateRef.current = null;
      dragStateRef.current = { startX: e.touches[0].clientX, startY: e.touches[0].clientY, origX: stateRef.current.offset.x, origY: stateRef.current.offset.y };
      return;
    }
    dragStateRef.current = null;
    pinchStateRef.current = null;
    window.removeEventListener('mousemove', handleMove);
    window.removeEventListener('mouseup', handleUp);
    window.removeEventListener('touchmove', handleMove);
    window.removeEventListener('touchend', handleUp);
  }, [handleMove]);

  // コンポーネントが消える時は、操作途中であっても必ずリスナーを解除する
  useEffect(()=>{
    return () => {
      window.removeEventListener('mousemove', handleMove);
      window.removeEventListener('mouseup', handleUp);
      window.removeEventListener('touchmove', handleMove);
      window.removeEventListener('touchend', handleUp);
    };
  }, [handleMove, handleUp]);

  useEffect(()=>{
    let alive = true;
    setSrcUrl(null);
    setError('');
    setNaturalSize({w:0,h:0});
    setScale(1);
    setOffset({x:0,y:0});
    if(sourceId){
      imageStorage.get(sourceId)
        .then(u=>{ if(alive) setSrcUrl(u); })
        .catch(err=>{ console.error('画像の読み込みに失敗しました', err); if(alive) setError('画像を読み込めませんでした。別の画像を試してください。'); });
    }
    return ()=>{ alive=false; };
  }, [sourceId]);

  // 実際に画面へ表示されているコンテナのサイズ（getBoundingClientRect）を基準に円・画像の座標を計算する
  const recalcContainerSize = useCallback(() => {
    const el = containerRef.current;
    if(!el) return;
    const rect = el.getBoundingClientRect();
    if(!rect.width || !rect.height) return;
    const cSize = { w: rect.width, h: rect.height };
    setContainerSize(cSize);
    setOffset(o => clampOffset(o, stateRef.current.scale, cSize, stateRef.current.naturalSize));
  }, []);

  const onImgLoad = () => {
    const img = imgRef.current;
    if(!img.naturalWidth || !img.naturalHeight){
      setError('画像を読み込めませんでした。別の画像を試してください。');
      return;
    }
    setNaturalSize({ w: img.naturalWidth, h: img.naturalHeight });
    setScale(1);
    setOffset({x:0,y:0});
    recalcContainerSize();
  };
  const onImgError = () => setError('画像を読み込めませんでした。別の画像を試してください。');

  // ウィンドウサイズ変更・スマホ回転時に再計算する
  useEffect(()=>{
    recalcContainerSize();
    window.addEventListener('resize', recalcContainerSize);
    window.addEventListener('orientationchange', recalcContainerSize);
    return ()=>{
      window.removeEventListener('resize', recalcContainerSize);
      window.removeEventListener('orientationchange', recalcContainerSize);
    };
  }, [recalcContainerSize]);

  const startDrag = (e) => {
    if(processing || !naturalSize.w) return;
    if(e.touches && e.touches.length>=2){
      e.preventDefault();
      const [t1,t2] = e.touches;
      pinchStateRef.current = { startDist: Math.hypot(t2.clientX-t1.clientX, t2.clientY-t1.clientY), startScale: stateRef.current.scale };
      dragStateRef.current = null;
      window.addEventListener('touchmove', handleMove, {passive:false});
      window.addEventListener('touchend', handleUp);
      return;
    }
    e.preventDefault();
    const point = e.touches ? e.touches[0] : e;
    dragStateRef.current = { startX: point.clientX, startY: point.clientY, origX: stateRef.current.offset.x, origY: stateRef.current.offset.y };
    window.addEventListener('mousemove', handleMove);
    window.addEventListener('mouseup', handleUp);
    window.addEventListener('touchmove', handleMove, {passive:false});
    window.addEventListener('touchend', handleUp);
  };

  const handleScaleChange = (val) => {
    const next = clamp(val, 1, ICON_CROP_MAX_SCALE);
    setScale(next);
    setOffset(o => clampOffset(o, next, stateRef.current.containerSize, stateRef.current.naturalSize));
  };

  // PCではマウスホイールでも拡大縮小できるようにする
  const handleWheel = (e) => {
    if(processing || !naturalSize.w) return;
    e.preventDefault();
    handleScaleChange(stateRef.current.scale + (e.deltaY > 0 ? -0.08 : 0.08));
  };

  const doCrop = async () => {
    if(processing) return;
    if(!srcUrl || !naturalSize.w || !naturalSize.h || !containerSize.w || !containerSize.h){
      setError('画像の準備ができていません。少し待ってからもう一度試してください。');
      return;
    }
    setProcessing(true);
    setError('');
    try{
      // 表示上（円の中に見えている部分）と実際に保存される画像が一致するよう、
      // offset・scaleから元画像のピクセル座標へ正確に変換する
      const diam = Math.min(containerSize.w, containerSize.h) * ICON_CROP_CIRCLE_RATIO;
      const baseScale = diam / Math.min(naturalSize.w, naturalSize.h);
      const dispW = naturalSize.w * baseScale * scale;
      const dispH = naturalSize.h * baseScale * scale;
      const relX = dispW/2 - diam/2 - offset.x;
      const relY = dispH/2 - diam/2 - offset.y;
      const sx = relX / (baseScale*scale);
      const sy = relY / (baseScale*scale);
      const ssize = diam / (baseScale*scale);
      const canvas = document.createElement('canvas');
      canvas.width = 400; canvas.height = 400;
      const ctx = canvas.getContext('2d');
      const tmpImg = new Image();
      await new Promise((res, rej)=>{
        tmpImg.onload = res;
        tmpImg.onerror = () => rej(new Error('画像を読み込めませんでした'));
        tmpImg.src = srcUrl;
      });
      ctx.drawImage(tmpImg, sx, sy, ssize, ssize, 0, 0, 400, 400);
      const dataUrl = canvas.toDataURL('image/jpeg', 0.88);
      canvas.width = 0; canvas.height = 0;
      const newId = uid('icon'); // 切り抜くたびに必ず新しいIDを発行する
      await imageStorage.save(newId, dataUrl);
      const oldId = currentIconId;
      onSave(newId);
      if(oldId && oldId !== newId) imageStorage.remove(oldId); // 新アイコン保存成功後に旧アイコンを削除（元画像は削除しない）
      onClose();
    }catch(err){
      console.error('アイコンの保存に失敗しました', err);
      setError('アイコンの保存に失敗しました。もう一度試してください。');
      setProcessing(false);
    }
  };

  const circleDiameter = containerSize.w ? Math.min(containerSize.w, containerSize.h) * ICON_CROP_CIRCLE_RATIO : 0;
  const baseScale = (containerSize.w && naturalSize.w) ? circleDiameter / Math.min(naturalSize.w, naturalSize.h) : 0;
  const dispW = naturalSize.w * baseScale * scale;
  const dispH = naturalSize.h * baseScale * scale;
  const ready = containerSize.w>0 && naturalSize.w>0;

  return (
    <Modal title="アイコンを切り抜く" onClose={onClose} wide>
      {candidates.length===0 && <div className="empty-hint">先に画像を登録してください。</div>}
      {candidates.length>1 && (
        <div style={{display:'flex', gap:8, marginBottom:10, flexWrap:'wrap'}}>
          {candidates.map(c=>(
            <button key={c.id} className={"btn btn-sm"+(sourceId===c.id?" btn-primary":"")} disabled={processing} onClick={()=>setSourceId(c.id)}>{c.label}</button>
          ))}
        </div>
      )}
      {sourceId && (
        srcUrl ? (
          <div
            ref={containerRef}
            onMouseDown={startDrag} onTouchStart={startDrag} onWheel={handleWheel}
            style={{
              position:'relative', width:'100%', maxWidth:560, aspectRatio:'1 / 1', margin:'0 auto',
              overflow:'hidden', background:'#111', touchAction:'none', borderRadius:6,
              cursor: processing ? 'default' : (ready ? 'move' : 'default')
            }}
          >
            <img
              ref={imgRef} src={srcUrl} onLoad={onImgLoad} onError={onImgError} draggable={false}
              style={{
                position:'absolute', left:'50%', top:'50%',
                width: dispW || 'auto', height: dispH || 'auto',
                maxWidth: dispW ? 'none' : '100%',
                transform:`translate(-50%, -50%) translate(${offset.x}px, ${offset.y}px)`,
                pointerEvents:'none'
              }}
            />
            {circleDiameter>0 && (
              <div style={{
                position:'absolute', left:'50%', top:'50%', width:circleDiameter, height:circleDiameter,
                transform:'translate(-50%, -50%)', border:'2px solid #fff',
                boxShadow:'0 0 0 2000px rgba(0,0,0,0.45)', borderRadius:'50%', pointerEvents:'none'
              }} />
            )}
          </div>
        ) : (!error ? <div style={{padding:20, textAlign:'center', color:'var(--ink-soft)'}}>画像を読み込み中…</div> : null)
      )}
      {error && <div style={{color:'#8a3a3a', fontSize:13, marginTop:10}}>{error}</div>}
      {ready && (
        <div className="field-row" style={{marginTop:14}}>
          <label>拡大・縮小</label>
          <div style={{display:'flex', alignItems:'center', gap:10}}>
            <span style={{fontSize:12, color:'var(--ink-soft)'}}>縮小</span>
            <input type="range" min={1} max={ICON_CROP_MAX_SCALE} step={0.01} value={scale} disabled={processing}
              onChange={e=>handleScaleChange(Number(e.target.value))} style={{flex:1}} />
            <span style={{fontSize:12, color:'var(--ink-soft)'}}>拡大</span>
          </div>
        </div>
      )}
      <p style={{fontSize:12, color:'var(--ink-soft)'}}>円の中の画像をドラッグすると位置を調整できます。マウスホイールやピンチ操作でも拡大・縮小できます。</p>
      <div className="modal-actions">
        <button className="btn" onClick={onClose} disabled={processing}>キャンセル</button>
        <button className="btn btn-primary" onClick={doCrop} disabled={!srcUrl || processing}>{processing ? '処理中…' : 'この範囲でアイコンを保存'}</button>
      </div>
    </Modal>
  );
}

/* ---- キャラクター（グループ・タグでの整理） ---- */
function CharacterListView({ data, setData, onOpen, onCreate }){
  const [filterTag, setFilterTag] = useState('すべて');
  const [managingGroups, setManagingGroups] = useState(false);
  const [collapsed, setCollapsed] = useState({});

  const groups = [...data.characterGroups].sort((a,b)=>(a.sortOrder??0)-(b.sortOrder??0));
  const allTags = Array.from(new Set(data.characters.flatMap(c=>c.tags||[]))).sort();

  const visibleChars = filterTag==='すべて' ? data.characters : data.characters.filter(c=>(c.tags||[]).includes(filterTag));
  const knownGroupIds = new Set(groups.map(g=>g.id));

  const buckets = groups.map(g => ({ group:g, items: visibleChars.filter(c=>c.groupId===g.id) }));
  const unassigned = visibleChars.filter(c => !c.groupId || !knownGroupIds.has(c.groupId));
  buckets.push({ group:{ id:CHAR_UNASSIGNED, name:'未分類' }, items: unassigned });

  const addGroup = (name) => setData(d=>({...d, characterGroups:[...d.characterGroups, {id:uid('cg'), name, sortOrder:d.characterGroups.length}]}));
  const renameGroup = (id, name) => setData(d=>({...d, characterGroups:d.characterGroups.map(g=>g.id===id?{...g,name}:g)}));
  const deleteGroup = (id) => {
    if(!confirm('このグループを削除しますか？中のキャラクターは「未分類」になります。')) return;
    setData(d=>({...d, characterGroups:d.characterGroups.filter(g=>g.id!==id), characters:d.characters.map(c=>c.groupId===id?{...c,groupId:null}:c)}));
  };
  const moveGroup = (id, dir) => {
    const list = [...data.characterGroups].sort((a,b)=>(a.sortOrder??0)-(b.sortOrder??0));
    const idx = list.findIndex(g=>g.id===id); const j = idx+dir;
    if(j<0||j>=list.length) return;
    [list[idx],list[j]]=[list[j],list[idx]];
    setData(d=>({...d, characterGroups: list.map((g,i)=>({...g, sortOrder:i}))}));
  };
  const toggle = (gid) => setCollapsed(c=>({...c, [gid]: !c[gid]}));

  return (
    <div>
      <div className="toolbar">
        <h1>🧑 キャラクター</h1>
        <div className="filler" />
        <button className="btn btn-sm" onClick={()=>setManagingGroups(true)}>グループを管理</button>
        <button className="btn btn-primary" onClick={onCreate}>＋ 新規追加</button>
      </div>

      {allTags.length>0 && (
        <div className="tag-filter-row">
          <button className={"btn btn-sm"+(filterTag==='すべて'?" btn-primary":"")} onClick={()=>setFilterTag('すべて')}>すべて</button>
          {allTags.map(t=>(
            <button key={t} className={"btn btn-sm"+(filterTag===t?" btn-primary":"")} onClick={()=>setFilterTag(t)}>{t}</button>
          ))}
        </div>
      )}

      {data.characters.length===0 ? (
        <div className="empty-hint">まだ何も登録されていません。「＋ 新規追加」から、必要になったぶんだけ増やしていけます。</div>
      ) : (
        buckets.map(b => b.items.length===0 ? null : (
          <div className="group-block" key={b.group.id}>
            <div className="group-head" onClick={()=>toggle(b.group.id)}>
              <span className="chev" style={{transform: collapsed[b.group.id]?'none':'rotate(90deg)'}}>▶</span>
              <h3 style={{margin:0}}>{b.group.name}</h3>
              <span className="idea-tag-pill">{b.items.length}</span>
            </div>
            {!collapsed[b.group.id] && (
              <div className="roster-grid">
                {b.items.map(it=>(
                  <button key={it.id} className="roster-card" onClick={()=>onOpen(it.id)}>
                    <IconThumb imageId={it.iconImageId || it.image} size={80} />
                    <div className="roster-body">
                      <div className="roster-name">{it.name || '（名称未設定）'}</div>
                      {it.category && <div className="roster-sub">{it.category}</div>}
                      {(it.tags||[]).length>0 && (
                        <div style={{marginTop:4}}>
                          {it.tags.map(t=><span key={t} className="idea-tag-pill" style={{marginRight:4, marginBottom:4, display:'inline-block'}}>{t}</span>)}
                        </div>
                      )}
                    </div>
                  </button>
                ))}
              </div>
            )}
          </div>
        ))
      )}

      {managingGroups && (
        <GroupsManagerModal title="キャラクターグループを管理" groups={groups}
          onAdd={addGroup} onRename={renameGroup} onDelete={deleteGroup} onMove={moveGroup}
          onClose={()=>setManagingGroups(false)}
          deleteHint="グループを削除しても、中のキャラクター自体は削除されません（未分類になります）。" />
      )}
    </div>
  );
}

/* ---- 場所 / 建物（親子関係のツリー表示） ---- */
function buildLocationChildrenMap(locations){
  const byParent = {};
  locations.forEach(l => {
    const validParent = l.parentLocationId && locations.find(x=>x.id===l.parentLocationId) ? l.parentLocationId : null;
    (byParent[validParent] = byParent[validParent] || []).push(l);
  });
  return byParent;
}

function LocationTreeNode({ loc, byParent, depth, onOpen, collapsed, toggleCollapse }){
  const children = byParent[loc.id] || [];
  const hasChildren = children.length>0;
  const isCollapsed = collapsed[loc.id];
  return (
    <div>
      <div className="loc-tree-row" style={{paddingLeft: depth*18 + 4}}>
        {hasChildren ? (
          <button className="twisty" onClick={()=>toggleCollapse(loc.id)}>{isCollapsed ? '▶' : '▼'}</button>
        ) : <span style={{width:16, display:'inline-block', flexShrink:0}} />}
        <button className="loc-open" onClick={()=>onOpen(loc.id)}>
          <span style={{fontWeight:700}}>{loc.name || '（無名）'}</span>
          {loc.category && <span style={{fontSize:12, color:'var(--ink-soft)', marginLeft:6}}>（{loc.category}）</span>}
          {loc.summary && <div className="ec-summary" style={{margin:'2px 0 0'}}>{loc.summary}</div>}
        </button>
      </div>
      {hasChildren && !isCollapsed && children.map(c=>(
        <LocationTreeNode key={c.id} loc={c} byParent={byParent} depth={depth+1} onOpen={onOpen} collapsed={collapsed} toggleCollapse={toggleCollapse} />
      ))}
    </div>
  );
}

function LocationListView({ data, onOpen, onCreate }){
  const [collapsed, setCollapsed] = useState({});
  const toggleCollapse = (id) => setCollapsed(c=>({...c, [id]:!c[id]}));
  const byParent = buildLocationChildrenMap(data.locations);
  const roots = byParent[null] || [];
  return (
    <div>
      <div className="toolbar">
        <h1>📍 場所 / 建物</h1>
        <div className="filler" />
        <button className="btn btn-primary" onClick={onCreate}>＋ 新規追加</button>
      </div>
      {data.locations.length===0 ? (
        <div className="empty-hint">まだ何も登録されていません。「＋ 新規追加」から、必要になったぶんだけ増やしていけます。</div>
      ) : (
        <div className="card" style={{marginTop:10}}>
          {roots.map(r => (
            <LocationTreeNode key={r.id} loc={r} byParent={byParent} depth={0} onOpen={onOpen} collapsed={collapsed} toggleCollapse={toggleCollapse} />
          ))}
        </div>
      )}
    </div>
  );
}

  const addChange = () => patch({ changes: [...(ch.changes||[]), { id: uid('chg'), timeLabel:'', title:'', description:'', timelineEventId:null }] });
  const updateChange = (cid, p) => patch({ changes: (ch.changes||[]).map(c=>c.id===cid?{...c,...p}:c) });
  const removeChange = (cid) => patch({ changes: (ch.changes||[]).filter(c=>c.id!==cid) });

  return (

      <div className="toolbar">

function OrganizationDetail({ data, id, updateItem, deleteItem, onBack, allChars, allLocations, allOrgs, addRelation, updateRelation, deleteRelation }){
  const org = data.organizations.find(o=>o.id===id);
  if(!org) return null;
  const patch = (p) => updateItem('organizations', id, p);
  const charOptions = allChars.map(c=>({id:c.id,label:c.name||'（無名）'}));
  // 所属人物：characters[].affiliationOrgIdsがSingle Source of Truthなので、ここから逆引きする。
  // organizations[].memberIdsはレガシーフィールドとして残すのみで、表示・更新には使わない。
  const memberIds = allChars.filter(c => (c.affiliationOrgIds||[]).includes(id)).map(c=>c.id);
  const setMemberIds = (nextIds) => {
    const before = new Set(memberIds);
    const after = new Set(nextIds);
    allChars.forEach(c=>{
      const was = before.has(c.id), now = after.has(c.id);
      if(was===now) return;
      const current = c.affiliationOrgIds||[];
      const updated = now ? [...current, id] : current.filter(oid=>oid!==id);
      updateItem('characters', c.id, { affiliationOrgIds: updated });
    });
  };
  const locOptions = allLocations.map(l=>({id:l.id,label:l.name||'（無名）'}));
  const relationOtherOptions = allOrgs.filter(o=>o.id!==id).map(o=>({id:o.id,label:o.name||'（無名）'}));

  const orgRelations = (data.entityRelations||[]).filter(r => r.fromId===id || r.toId===id);
  const [relDraft, setRelDraft] = useState(null); // null | {editingId, otherId, selfLabel, otherLabel, note}

  const startNewRelation = () => setRelDraft({ editingId:null, otherId:'', selfLabel:'', otherLabel:'', note:'' });
  const startEditRelation = (rel) => {
    const isFrom = rel.fromId===id;
    setRelDraft({
      editingId: rel.id,
      otherId: isFrom ? rel.toId : rel.fromId,
      selfLabel: isFrom ? (rel.label||'') : (rel.reverseLabel||''),
      otherLabel: isFrom ? (rel.reverseLabel||'') : (rel.label||''),
      note: rel.note || '',
    });
  };
  const saveRelation = () => {
    if(!relDraft || !relDraft.otherId) return;
    if(relDraft.editingId){
      const rel = data.entityRelations.find(r=>r.id===relDraft.editingId);
      if(!rel) { setRelDraft(null); return; }
      const isFrom = rel.fromId===id;
      updateRelation(rel.id, isFrom
        ? { toId: relDraft.otherId, label: relDraft.selfLabel, reverseLabel: relDraft.otherLabel, note: relDraft.note }
        : { fromId: relDraft.otherId, label: relDraft.otherLabel, reverseLabel: relDraft.selfLabel, note: relDraft.note }
      );
    } else {
      addRelation({ fromId:id, toId:relDraft.otherId, label:relDraft.selfLabel, reverseLabel:relDraft.otherLabel, note:relDraft.note, fromType:'organization', toType:'organization' });
    }
    setRelDraft(null);
  };
  const removeRelation = (relId) => { if(confirm('この関係を削除しますか？')) deleteRelation(relId); };

  return (
    <div>
      <div className="breadcrumb"><button onClick={onBack}>← 組織 / 勢力 / 家系一覧</button></div>
      <div className="toolbar">
        <input className="proj-title" style={{fontSize:20, flex:1}} value={org.name} placeholder="名称"
          onChange={e=>patch({name:e.target.value})} />
        <button className="btn btn-danger btn-sm" onClick={()=>{ if(confirm('この組織を削除しますか？')){ deleteItem(id); onBack(); } }}>削除</button>
      </div>
      <CollapsibleSection title="基本情報" defaultOpen preview={firstNonEmpty(org.summary, org.purpose)}>
        <div className="field-row"><label>カテゴリ（探す時の分類）</label><input type="text" value={org.category||''} onChange={e=>patch({category:e.target.value})} placeholder="軍事組織 / 政府 / 企業 / 宗教 / 研究機関 / 犯罪組織 / 家系・一族 / チーム など" /></div>
        <SingleImageField label="画像 / アイコン" imageId={org.image} onChange={img=>patch({image:img})} />
        <div className="field-row"><label>概要</label><FieldAutoTextarea value={org.summary||''} onChange={e=>patch({summary:e.target.value})} minHeight={110} /></div>
        <div className="field-row"><label>目的</label><FieldAutoTextarea value={org.purpose||''} onChange={e=>patch({purpose:e.target.value})} minHeight={130} /></div>
        <div className="field-row"><label>メモ</label><FieldAutoTextarea value={org.memo||''} onChange={e=>patch({memo:e.target.value})} minHeight={140} /></div>
      </CollapsibleSection>
      <CollapsibleSection title="自由項目" badge={(org.customFields||[]).length || null}>
        <CustomFieldsEditor fields={org.customFields} onChange={f=>patch({customFields:f})} />
      </CollapsibleSection>
      <CollapsibleSection title="所属・関連リンク" defaultOpen>
        <LinkPicker label="所属人物" options={charOptions} selectedIds={memberIds} onChange={setMemberIds} />
        <LinkPicker label="関連場所" options={locOptions} selectedIds={org.locationIds} onChange={ids=>patch({locationIds:ids})} />
      </CollapsibleSection>

      <CollapsibleSection title="関連・関係性（他の組織・家系との繋がり）" defaultOpen={orgRelations.length>0} badge={orgRelations.length || null}>
        <p style={{fontSize:12, color:'var(--ink-soft)', marginTop:0}}>「どの分類に入れるか」とは別に、他の組織・家系と具体的にどう繋がっているかをここに記録します。</p>
        {orgRelations.length===0 && <div className="empty-hint">まだ関係が登録されていません。</div>}
        {orgRelations.map(rel=>{
          const isFrom = rel.fromId===id;
          const otherId = isFrom ? rel.toId : rel.fromId;
          const otherOrg = allOrgs.find(o=>o.id===otherId);
          const label = isFrom ? rel.label : rel.reverseLabel;
          return (
            <div className="change-item" key={rel.id}>
              <div style={{display:'flex', justifyContent:'space-between', alignItems:'flex-start', gap:8, flexWrap:'wrap'}}>
                <div>
                  <div className="ci-title">{otherOrg ? (otherOrg.name||'（無名）') : '（削除済みの組織）'}</div>
                  {label && <div style={{fontSize:13, color:'var(--plum)', fontWeight:700}}>{label}</div>}
                  {rel.note && <div className="ci-desc">{rel.note}</div>}
                </div>
                <div style={{display:'flex', gap:6, flexShrink:0}}>
                  <button className="btn btn-sm" onClick={()=>startEditRelation(rel)}>編集</button>
                  <button className="btn btn-sm btn-danger" onClick={()=>removeRelation(rel.id)}>削除</button>
                </div>
              </div>
            </div>
          );
        })}
        <button className="btn btn-ghost btn-sm" onClick={startNewRelation}>＋ 関係を追加</button>
      </CollapsibleSection>

      {relDraft && (
        <Modal title={relDraft.editingId ? "関係を編集" : "関係を追加"} onClose={()=>setRelDraft(null)}>
          <SingleLinkPicker label="相手" options={relationOtherOptions} value={relDraft.otherId||null} onChange={v=>setRelDraft(d=>({...d, otherId:v||''}))} />
          <div className="field-row"><label>こちらから見た関係</label><input type="text" value={relDraft.selfLabel} onChange={e=>setRelDraft(d=>({...d, selfLabel:e.target.value}))} placeholder="慣例的に軍務へ従事 など" /></div>
          <div className="field-row"><label>相手から見た関係</label><input type="text" value={relDraft.otherLabel} onChange={e=>setRelDraft(d=>({...d, otherLabel:e.target.value}))} placeholder="代々人材を輩出 など" /></div>
          <div className="field-row"><label>詳細（任意）</label><FieldAutoTextarea value={relDraft.note} onChange={e=>setRelDraft(d=>({...d, note:e.target.value}))} minHeight={100} /></div>
          <div className="modal-actions">
            <button className="btn" onClick={()=>setRelDraft(null)}>キャンセル</button>
            <button className="btn btn-primary" disabled={!relDraft.otherId} onClick={saveRelation}>保存</button>
          </div>
        </Modal>
      )}
    </div>
  );
}

// locIdを起点に、その場所より下位（子孫）の場所IDの集合を返す（親選択での循環参照防止に使う）
function getDescendantLocationIds(locId, allLocations){
  const ids = new Set();
  const stack = [locId];
  while(stack.length){
    const cur = stack.pop();
    allLocations.forEach(l=>{
      if(l.parentLocationId===cur && !ids.has(l.id)){ ids.add(l.id); stack.push(l.id); }
    });
  }
  return ids;
}

function LocationDetail({ data, id, updateItem, deleteItem, onBack, allChars, allOrgs }){
  const loc = data.locations.find(l=>l.id===id);
  if(!loc) return null;
  const patch = (p) => updateItem('locations', id, p);
  const charOptions = allChars.map(c=>({id:c.id,label:c.name||'（無名）'}));
  const orgOptions = allOrgs.map(o=>({id:o.id,label:o.name||'（無名）'}));
  // 自分自身と、自分の子孫は「上位の場所」の候補から除外する（循環参照防止）
  const descendantIds = getDescendantLocationIds(id, data.locations);
  const parentOptions = data.locations
    .filter(l => l.id!==id && !descendantIds.has(l.id))
    .map(l => ({ id:l.id, label:l.name||'（無名）' }));

  return (
    <div>
      <div className="breadcrumb"><button onClick={onBack}>← 場所 / 建物一覧</button></div>
      <div className="toolbar">
        <input className="proj-title" style={{fontSize:20, flex:1}} value={loc.name} placeholder="名称"

        <SingleImageField label="画像" imageId={loc.image} onChange={img=>patch({image:img})} />
        <div className="field-row"><label>概要</label><FieldAutoTextarea value={loc.summary||''} onChange={e=>patch({summary:e.target.value})} minHeight={110} /></div>

/* ============ 世界設定 ============ */
// 世界設定：大分類 → 設定カテゴリ → カード の3階層。トップは大分類カードのみを表示し、
// 開くとその中のカテゴリ一覧（従来の折りたたみカード表示）が出る。
function WorldSettings({ data, setData }){
  const [openGroupId, setOpenGroupId] = useState(null); // null=トップ画面
  const [showEmpty, setShowEmpty] = useState(false);
  const [addingCat, setAddingCat] = useState(false);
  const [newCatName, setNewCatName] = useState('');
  const [managingGroups, setManagingGroups] = useState(false);

  const patchCategory = (catId, patch) => {
    setData(d => ({...d, worldSettings: d.worldSettings.map(c=>c.id===catId?{...c,...patch}:c)}));
  };
  const addCard = (catId) => {
    setData(d => ({...d, worldSettings: d.worldSettings.map(c=>{
      if(c.id!==catId) return c;
      return {...c, cards:[...c.cards, {id: uid('wsd'), title:'', content:''}]};
    })}));
  };
  const updateCard = (catId, cardId, patch) => {
    setData(d => ({...d, worldSettings: d.worldSettings.map(c=>{
      if(c.id!==catId) return c;
      return {...c, cards: c.cards.map(card=>card.id===cardId?{...card,...patch}:card)};
    })}));
  };
  const removeCard = (catId, cardId) => {
    setData(d => ({...d, worldSettings: d.worldSettings.map(c=>{
      if(c.id!==catId) return c;
      return {...c, cards: c.cards.filter(card=>card.id!==cardId)};
    })}));
  };
  const removeCategory = (catId) => {
    if(!confirm('このカテゴリを削除しますか？中のカードも削除されます。')) return;
    setData(d => ({...d, worldSettings: d.worldSettings.filter(c=>c.id!==catId)}));
  };
  const addCategory = () => {
    if(!newCatName.trim()) return;
    const gid = openGroupId===WS_UNASSIGNED ? null : openGroupId;
    setData(d => ({...d, worldSettings: [...d.worldSettings, {id: uid('wsc'), name:newCatName.trim(), groupId: gid, cards:[]}]}));
    setNewCatName(''); setAddingCat(false);
  };

  const addGroup = (name) => setData(d=>({...d, worldSettingGroups:[...d.worldSettingGroups, {id:uid('wsg'), name, sortOrder:d.worldSettingGroups.length}]}));
  const renameGroup = (id, name) => setData(d=>({...d, worldSettingGroups:d.worldSettingGroups.map(g=>g.id===id?{...g,name}:g)}));
  const deleteGroup = (id) => {
    if(!confirm('この大分類を削除しますか？中のカテゴリは「その他」になります。')) return;
    setData(d=>({...d, worldSettingGroups:d.worldSettingGroups.filter(g=>g.id!==id), worldSettings:d.worldSettings.map(c=>c.groupId===id?{...c,groupId:null}:c)}));
    if(openGroupId===id) setOpenGroupId(null);
  };
  const moveGroup = (id, dir) => {
    const list = [...data.worldSettingGroups].sort((a,b)=>(a.sortOrder??0)-(b.sortOrder??0));
    const idx = list.findIndex(g=>g.id===id); const j = idx+dir;
    if(j<0||j>=list.length) return;
    [list[idx],list[j]]=[list[j],list[idx]];
    setData(d=>({...d, worldSettingGroups: list.map((g,i)=>({...g, sortOrder:i}))}));
  };

  const groups = [...data.worldSettingGroups].sort((a,b)=>(a.sortOrder??0)-(b.sortOrder??0));
  const knownGroupIds = new Set(groups.map(g=>g.id));

  // ---- トップ画面：大分類カードのみ ----
  if(openGroupId===null){
    const groupStats = groups.map(g => {
      const cats = data.worldSettings.filter(c=>c.groupId===g.id);
      return { group:g, catCount:cats.length, cardCount: cats.reduce((s,c)=>s+c.cards.length,0) };
    });
    const unassignedCats = data.worldSettings.filter(c=> !c.groupId || !knownGroupIds.has(c.groupId));
    groupStats.push({ group:{id:WS_UNASSIGNED, name:'その他'}, catCount:unassignedCats.length, cardCount:unassignedCats.reduce((s,c)=>s+c.cards.length,0) });

    return (
      <div>
        <h1>🌍 世界設定</h1>
        <p style={{color:'var(--ink-soft)', fontSize:13, marginTop:-6}}>全項目を埋める必要はありません。書いたぶんだけ表示されます。まずは大分類を選んでください。</p>
        <div className="dash-nav-grid">
          {groupStats.map(gs=>(
            <button key={gs.group.id} className="dash-nav-item ws-group-card" onClick={()=>setOpenGroupId(gs.group.id)}>
              <div className="icon">🗂</div>

            onClose={()=>setManagingGroups(false)}
            deleteHint="大分類を削除しても、中の設定カテゴリ自体は削除されません（「その他」になります）。" />
        )}
      </div>
    );
  }

  // ---- 大分類の中身：設定カテゴリ一覧（従来の折りたたみカード） ----
  const currentGroupName = openGroupId===WS_UNASSIGNED ? 'その他' : ((groups.find(g=>g.id===openGroupId)||{}).name || 'その他');
  const catsInGroup = data.worldSettings.filter(c => openGroupId===WS_UNASSIGNED ? (!c.groupId || !knownGroupIds.has(c.groupId)) : c.groupId===openGroupId);
  const filled = catsInGroup.filter(c=>c.cards.length>0);

  return (

      <button className="hidden-cats-toggle" onClick={()=>setShowEmpty(s=>!s)}>
        {showEmpty ? '▲ 未使用カテゴリを隠す' : `▼ 未使用カテゴリを表示（${empty.length}）`}

      {showEmpty && empty.map(cat => <WsCategoryBlock key={cat.id} cat={cat} groups={groups} onAddCard={()=>addCard(cat.id)} onUpdateCard={(cid,p)=>updateCard(cat.id,cid,p)} onRemoveCard={(cid)=>removeCard(cat.id,cid)} onRemoveCategory={()=>removeCategory(cat.id)} onRename={(name)=>patchCategory(cat.id,{name})} onChangeGroup={(gid)=>patchCategory(cat.id,{groupId:gid})} />)}

      <div style={{marginTop:16}}>
        {addingCat ? (

}
