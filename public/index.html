/* ============ 年表 ============ */
function Timeline({ data, setData, allChars, allOrgs, allLocations, openEntity }){
  const [editing, setEditing] = useState(null); // id or 'new'

  const items = [...data.timeline].sort((a,b)=>(a.sortOrder??0)-(b.sortOrder??0));

  const openNew = () => {
    const ev = { id: uid('tl'), dateLabel:'', title:'', summary:'', detail:'', personIds:[], orgIds:[], locationIds:[], tags:[], sortOrder: items.length };
    setData(d=>({...d, timeline:[...d.timeline, ev]}));
    setEditing(ev.id);
  };
  const update = (id, patch) => setData(d=>({...d, timeline: d.timeline.map(e=>e.id===id?{...e,...patch}:e)}));
  const remove = (id) => { setData(d=>({...d, timeline: d.timeline.filter(e=>e.id!==id)})); setEditing(null); };
  const move = (id, dir) => {
    const idx = items.findIndex(e=>e.id===id);
    const j = idx+dir;
    if(j<0||j>=items.length) return;
    const reordered = [...items];
    [reordered[idx], reordered[j]] = [reordered[j], reordered[idx]];
    const withOrder = reordered.map((e,i)=>({...e, sortOrder:i}));
    setData(d=>({...d, timeline: d.timeline.map(e=> withOrder.find(w=>w.id===e.id) || e)}));
  };

  const editingEv = editing ? data.timeline.find(e=>e.id===editing) : null;
  const charOptions = allChars.map(c=>({id:c.id,label:c.name||'（無名）'}));
  const orgOptions = allOrgs.map(o=>({id:o.id,label:o.name||'（無名）'}));
  const locOptions = allLocations.map(l=>({id:l.id,label:l.name||'（無名）'}));

  return (
    <div>
      <div className="toolbar">
        <h1>📜 年表</h1>
        <div className="filler" />
        <button className="btn btn-primary" onClick={openNew}>＋ イベント追加</button>
      </div>

      {items.length===0 && <div className="empty-hint">まだイベントがありません。日時は自由な表記でOKです（「宇宙暦120年」「主人公18歳」など）。</div>}

      <div className="card" style={{marginTop:10}}>
        {items.map((ev,i)=>(
          <div className="tl-item" key={ev.id}>
            <div className="tl-order-btns">
              <button onClick={()=>move(ev.id,-1)} disabled={i===0}>↑</button>
              <button onClick={()=>move(ev.id,1)} disabled={i===items.length-1}>↓</button>
            </div>
            <div className="tl-date">{ev.dateLabel || '（日時未設定）'}</div>
            <div className="tl-body" onClick={()=>setEditing(ev.id)} style={{cursor:'pointer'}}>
              <div className="tl-title">{ev.title || '（無題のイベント）'}</div>
              {ev.summary && <div className="tl-summary">{ev.summary}</div>}
              {ev.tags && ev.tags.length>0 && <div style={{marginTop:4}}>{ev.tags.map(t=><span className="idea-tag-pill" key={t} style={{marginRight:4}}>{t}</span>)}</div>}
            </div>
          </div>
        ))}
      </div>

      {editingEv && (
        <Modal title="年表イベント" onClose={()=>setEditing(null)} wide>
          <div className="field-grid">
            <div className="field-row"><label>日時 / 年代（自由表記）</label><input type="text" value={editingEv.dateLabel} onChange={e=>update(editingEv.id,{dateLabel:e.target.value})} placeholder="宇宙暦120年 / 10年前 / 主人公18歳 など" /></div>
            <div className="field-row"><label>タイトル</label><input type="text" value={editingEv.title} onChange={e=>update(editingEv.id,{title:e.target.value})} /></div>
          </div>
          <div className="field-row"><label>概要</label><FieldAutoTextarea value={editingEv.summary} onChange={e=>update(editingEv.id,{summary:e.target.value})} minHeight={110} /></div>
          <div className="field-row"><label>詳細</label><FieldAutoTextarea value={editingEv.detail} onChange={e=>update(editingEv.id,{detail:e.target.value})} minHeight={160} /></div>
          <div className="field-row"><label>タグ（カンマ区切り）</label>
            <input type="text" value={(editingEv.tags||[]).join(', ')}
              onChange={e=>update(editingEv.id,{tags:e.target.value.split(',').map(s=>s.trim()).filter(Boolean)})} />
          </div>
          <LinkPicker label="関連人物" options={charOptions} selectedIds={editingEv.personIds} onChange={ids=>update(editingEv.id,{personIds:ids})} />
          <LinkPicker label="関連組織" options={orgOptions} selectedIds={editingEv.orgIds} onChange={ids=>update(editingEv.id,{orgIds:ids})} />
          <LinkPicker label="関連場所" options={locOptions} selectedIds={editingEv.locationIds} onChange={ids=>update(editingEv.id,{locationIds:ids})} />
          <div className="modal-actions">
            <button className="btn btn-danger" onClick={()=>remove(editingEv.id)}>このイベントを削除</button>
            <button className="btn btn-primary" onClick={()=>setEditing(null)}>閉じる</button>
          </div>
        </Modal>
      )}
    </div>
  );
}

/* ============ プロット ============ */
function Plot({ data, setData, allChars, allLocations }){
  const plot = data.plot;
  const setPlot = (p) => setData(d=>({...d, plot: {...d.plot, ...p}}));

  // 構成方式は「章に付けられるラベルの候補」を切り替えるだけ。
  // 既存の章・シーン・各種リンクは一切変更・削除しない。
  const changeStructureType = (presetName) => setPlot({ structureType: presetName });

  const addChapter = () => setPlot({ chapters: [...plot.chapters, { id: uid('ch'), title:'新しい章', stage:'', scenes: [] }] });
  const updateChapter = (id, patch) => setPlot({ chapters: plot.chapters.map(c=>c.id===id?{...c,...patch}:c) });
  const removeChapter = (id) => { if(confirm('この章を削除しますか？中のシーンも削除されます。')) setPlot({ chapters: plot.chapters.filter(c=>c.id!==id) }); };

  const addScene = (chId) => updateChapterScenes(chId, scenes => [...scenes, { id: uid('sc'), summary:'', personIds:[], locationIds:[], ideaIds:[], foreshadowing:[] }]);
  const updateChapterScenes = (chId, fn) => setPlot({ chapters: plot.chapters.map(c=> c.id===chId ? {...c, scenes: fn(c.scenes)} : c) });
  const updateScene = (chId, scId, patch) => updateChapterScenes(chId, scenes => scenes.map(s=>s.id===scId?{...s,...patch}:s));
  const removeScene = (chId, scId) => updateChapterScenes(chId, scenes => scenes.filter(s=>s.id!==scId));
  const moveScene = (chId, scId, dir) => updateChapterScenes(chId, scenes => {
    const idx = scenes.findIndex(s=>s.id===scId); const j = idx+dir;
    if(j<0||j>=scenes.length) return scenes;
    const next=[...scenes]; [next[idx],next[j]]=[next[j],next[idx]]; return next;
  });

  const charOptions = allChars.map(c=>({id:c.id,label:c.name||'（無名）'}));
  const locOptions = allLocations.map(l=>({id:l.id,label:l.name||'（無名）'}));
  const ideaOptions = data.ideas.map(i=>({id:i.id,label:(i.content||'').slice(0,20)||'（無題）'}));
  const stageChoices = PLOT_PRESETS[plot.structureType] || [];

  return (
    <div>
      <h1>🧩 プロット</h1>
      <div className="field-row" style={{maxWidth:280}}>
        <label>構成方式（章に付けられるラベルの候補が切り替わります）</label>
        <select value={plot.structureType} onChange={e=>changeStructureType(e.target.value)}>
          {Object.keys(PLOT_PRESETS).map(k=><option key={k}>{k}</option>)}
        </select>
      </div>

      {plot.chapters.length===0 && <div className="empty-hint">章がありません。「＋ 章を追加」から始められます。</div>}

      {plot.chapters.map(ch=>(
        <div className="plot-chapter" key={ch.id}>
          <div className="plot-chapter-head">
            <input value={ch.title} onChange={e=>updateChapter(ch.id,{title:e.target.value})} />
            <select value={ch.stage || ''} onChange={e=>updateChapter(ch.id,{stage:e.target.value})}
              style={{padding:'6px 8px', border:'1px solid var(--line)', borderRadius:4, fontSize:13, background:'#fff'}}>
              <option value="">未設定</option>
              {stageChoices.map(s => <option key={s} value={s}>{s}</option>)}
            </select>
            <button className="btn btn-sm btn-danger" onClick={()=>removeChapter(ch.id)}>章を削除</button>
          </div>
          {ch.scenes.map((sc,i)=>(
            <div className="plot-scene" key={sc.id}>
              <div style={{display:'flex', gap:8}}>
                <div className="scene-order-btns">
                  <button className="btn btn-sm" onClick={()=>moveScene(ch.id,sc.id,-1)} disabled={i===0}>↑</button>
                  <button className="btn btn-sm" onClick={()=>moveScene(ch.id,sc.id,1)} disabled={i===ch.scenes.length-1}>↓</button>
                </div>
                <div style={{flex:1}}>
                  <AutoTextarea style={{padding:'6px 8px', border:'1px solid var(--line)', borderRadius:4}} minHeight={100}
                    placeholder="シーン概要" value={sc.summary} onChange={e=>updateScene(ch.id,sc.id,{summary:e.target.value})} />
                </div>
                <button className="btn btn-sm btn-danger" onClick={()=>removeScene(ch.id,sc.id)}>削除</button>
              </div>
              <div style={{marginTop:6}}>
                <LinkPicker label="登場人物" options={charOptions} selectedIds={sc.personIds} onChange={ids=>updateScene(ch.id,sc.id,{personIds:ids})} />
                <LinkPicker label="場所" options={locOptions} selectedIds={sc.locationIds} onChange={ids=>updateScene(ch.id,sc.id,{locationIds:ids})} />
                <LinkPicker label="関連ネタ" options={ideaOptions} selectedIds={sc.ideaIds} onChange={ids=>updateScene(ch.id,sc.id,{ideaIds:ids})} />
                <div className="field-row"><label>伏線メモ（カンマ区切り）</label>
                  <input type="text" value={(sc.foreshadowing||[]).join(', ')}
                    onChange={e=>updateScene(ch.id,sc.id,{foreshadowing:e.target.value.split(',').map(s=>s.trim()).filter(Boolean)})} />
                </div>
              </div>
            </div>
          ))}
          <div style={{padding:'10px 14px'}}>
            <button className="btn btn-ghost btn-sm" onClick={()=>addScene(ch.id)}>＋ シーンを追加</button>
          </div>
        </div>
      ))}
      <button className="btn btn-ghost" onClick={addChapter}>＋ 章を追加</button>
    </div>
  );
}

function Writing({ data, setData, allChars, allLocations, focusMode, setFocusMode, writingSnippets, setWritingSnippets, expressionDictionary, setExpressionDictionary, specialDictionary, setSpecialDictionary, lastSpecialImportIds, setLastSpecialImportIds, mediaDictionary, setMediaDictionary, lastMediaImportIds, setLastMediaImportIds }){

  const [mediaDictEditorOpen, setMediaDictEditorOpen] = useState(false);
  const [writingMoreOpen, setWritingMoreOpen] = useState(false); // スマホ「⋯」：文字サイズ／メモへ移動／章削除
  const [memoOpenSignal, setMemoOpenSignal] = useState(0); // 「⋯」→メモ・関連情報を開く、の合図（値が変わるたびにCollapsibleSectionを開く）
  const memoSectionRef = useRef(null);
  const textareaRef = useRef(null);
  const savedSelectionRef = useRef({ start:0, end:0 });
  const savedScrollRef = useRef({ textareaScrollTop:0, windowScrollY:0, focusWrapScrollTop:0 });
  const focusBodyWrapRef = useRef(null);
  const quickbarWrapRef = useRef(null);

  // ---- 表現パレット（固定ドロワー）の下端位置を実測して決める ----
  // 通常モード：bottom-tabsの実高さの上へ。集中モード：クイック表現バーの実高さの上へ。
  // どちらもソフトウェアキーボード表示中はvisualViewportで隠れた分だけさらに押し上げる。
  const bottomTabsHeight = useSelectorHeight('.bottom-tabs', !focusMode);
  const quickbarHeight = useMeasuredHeight(quickbarWrapRef, [focusMode, openId]);
  const keyboardInset = useKeyboardInset();
  const paletteBottomOffset = (focusMode ? quickbarHeight : bottomTabsHeight) + keyboardInset;

  const setWritingFontSize = (px) => {
    const clamped = clamp(px, WRITING_FONT_SIZE_MIN, WRITING_FONT_SIZE_MAX);
    setWritingFontSizeState(clamped);
    try{ localStorage.setItem(WRITING_FONT_SIZE_KEY, String(clamped)); }catch(e){}
  };

  const addChapter = () => {
    const w = { id: uid('wr'), title: `第${data.writings.length+1}章`, body:'', memo:'', personIds:[], locationIds:[], ideaIds:[] };
    setData(d=>({...d, writings:[...d.writings, w]}));
    setOpenId(w.id);
  };
  const update = (id, patch) => setData(d=>({...d, writings: d.writings.map(w=>w.id===id?{...w,...patch}:w)}));
  const remove = (id) => { if(confirm('この章を削除しますか？')){ setData(d=>({...d, writings: d.writings.filter(w=>w.id!==id)})); setOpenId(null); setFocusMode(false); setPaletteOpen(false); setExprDictOpen(false); setWritingMoreOpen(false); } };
  const backToList = () => { setOpenId(null); setFocusMode(false); setPaletteOpen(false); setExprDictOpen(false); setWritingMoreOpen(false); };

  const open = openId ? data.writings.find(w=>w.id===openId) : null;
  const charOptions = allChars.map(c=>({id:c.id,label:c.name||'（無名）'}));
  const locOptions = allLocations.map(l=>({id:l.id,label:l.name||'（無名）'}));
  const ideaOptions = data.ideas.map(i=>({id:i.id,label:(i.content||'').slice(0,20)||'（無題）'}));

  // ---- 表現パレット：カーソル位置とスクロール位置を保ったまま本文へ挿入するためのヘルパー ----
  // savedSelectionRef / savedScrollRef を「本文上で最後に確定していた状態」のSingle Source of Truthとして扱う。
  // textarea操作（onSelect/onClick/onKeyUp/onBlur）と、パレット系ボタンのpointerdown（preventFocusSteal）の
  // 両方でここへ常時同期し、挿入処理はDOMの現在値ではなく必ずこのrefを参照する。
  const rememberEditorState = () => {
    const el = textareaRef.current;
    if(el && typeof el.selectionStart === 'number'){
      savedSelectionRef.current = { start: el.selectionStart, end: el.selectionEnd };
    }
    if(el){
      savedScrollRef.current.textareaScrollTop = el.scrollTop;
    }
    if(focusMode){
      const wrap = focusBodyWrapRef.current;
      if(wrap) savedScrollRef.current.focusWrapScrollTop = wrap.scrollTop;
    } else if(typeof window !== 'undefined'){
      savedScrollRef.current.windowScrollY = window.scrollY;
    }
  };

  const preventFocusSteal = (e) => {
    e.preventDefault();
    // ボタンタップでフォーカスが奪われる直前＝本文が最後に確定していた状態をここで確定させる
    rememberEditorState();
  };

  const getSelection = (bodyLen) => {
    // DOM上の現在値ではなく、savedSelectionRef（最後に本文上で確定していたカーソル位置）を基準にする
    let { start, end } = savedSelectionRef.current;
    start = Math.max(0, Math.min(start ?? bodyLen, bodyLen));
    end = Math.max(0, Math.min(end ?? start, bodyLen));
    if(end < start){ const t=start; start=end; end=t; }
    return { start, end };
  };

  const restoreFocusAndSelection = (pos) => {
    // 挿入直前に保存しておいたスクロール位置のスナップショット（この後の非同期処理中に上書きされないようここで固定）
    const scroll = { ...savedScrollRef.current };
    requestAnimationFrame(()=>{
      const el = textareaRef.current;
      if(!el) return;
      // 1. フォーカス（ブラウザ自身のスクロールは起こさない）
      try{ el.focus({ preventScroll:true }); }catch(e){ el.focus(); }
      // 2. カーソル位置（ここでブラウザがキャレット追従スクロールを行うことがある）
      try{ el.setSelectionRange(pos, pos); }catch(e){}
      // 3. textarea自身のスクロール位置を復元（ブラウザの自動スクロールを打ち消す）
      el.scrollTop = scroll.textareaScrollTop;
      // 4. 外側のスクロール位置を復元
      if(focusMode){
        const wrap = focusBodyWrapRef.current;
        if(wrap) wrap.scrollTop = scroll.focusWrapScrollTop;
      } else if(typeof window !== 'undefined'){
        window.scrollTo({ top: scroll.windowScrollY, left: (window.scrollX||0), behavior:'auto' });
      }
    });
  };

  const insertIntoBody = (text) => {
    if(!open || !text) return;
    const body = open.body || '';
    const { start, end } = getSelection(body.length);
    const newBody = body.slice(0, start) + text + body.slice(end);
    const newPos = start + text.length;
    update(open.id, { body: newBody });
    savedSelectionRef.current = { start:newPos, end:newPos };
    restoreFocusAndSelection(newPos);
  };

  const openDictEditor = () => { rememberEditorState(); setDictEditorOpen(true); };
  const closeDictEditor = () => {
    setDictEditorOpen(false);
    restoreFocusAndSelection(savedSelectionRef.current.start);
  };

  // ---- 表現辞典：開閉・挿入は表現パレットと同じ savedSelectionRef / insertIntoBody を再利用する ----
  const openExprDict = () => { rememberEditorState(); setExprDictOpen(true); };
  const closeExprDict = () => {
    setExprDictOpen(false);
    restoreFocusAndSelection(savedSelectionRef.current.start);
  };
  const openExprDictEditor = () => { rememberEditorState(); setExprDictEditorOpen(true); };
  const closeExprDictEditor = () => {
    setExprDictEditorOpen(false);
    restoreFocusAndSelection(savedSelectionRef.current.start);
  };
  const openSpecialDictEditor = () => { rememberEditorState(); setSpecialDictEditorOpen(true); };
  const closeSpecialDictEditor = () => {
    setSpecialDictEditorOpen(false);
    restoreFocusAndSelection(savedSelectionRef.current.start);
  };
  const openMediaDictEditor = () => { rememberEditorState(); setMediaDictEditorOpen(true); };
  const closeMediaDictEditor = () => {
    setMediaDictEditorOpen(false);
    restoreFocusAndSelection(savedSelectionRef.current.start);
  };

  const paletteBlock = open && paletteOpen ? (
    <SnippetPalette
      categories={writingSnippets.categories}
      snippets={writingSnippets.snippets}
      onInsert={insertIntoBody}
      onOpenEditor={openDictEditor}
      onClose={()=>setPaletteOpen(false)}
      preventFocusSteal={preventFocusSteal}
      style={{ bottom: paletteBottomOffset + 'px' }}
    />
  ) : null;

  const dictEditorBlock = dictEditorOpen ? (
    <WritingSnippetDictionaryModal writingSnippets={writingSnippets} setWritingSnippets={setWritingSnippets} onClose={closeDictEditor} />
  ) : null;

  // ---- 辞典ドロワー（参照パネル）。[表現辞典][小説語彙][メディア語]をdictTabで切り替える。いずれも候補は本文へ挿入せず、コピー中心 ----
  const exprDictBlock = open && exprDictOpen ? (
    dictTab==='special' ? (
      <SpecialDictionaryPanel
        dictionary={specialDictionary}
        onOpenEditor={openSpecialDictEditor}
        onClose={closeExprDict}
        preventFocusSteal={preventFocusSteal}
        style={{ bottom: paletteBottomOffset + 'px' }}
        dictTab={dictTab}
        onDictTabChange={setDictTab}
      />
    ) : dictTab==='media' ? (
      <MediaDictionaryPanel
        dictionary={mediaDictionary}
        onOpenEditor={openMediaDictEditor}
        onClose={closeExprDict}
        preventFocusSteal={preventFocusSteal}
        style={{ bottom: paletteBottomOffset + 'px' }}
        dictTab={dictTab}
        onDictTabChange={setDictTab}
      />
    ) : (
      <ExpressionDictionaryPanel
        dictionary={expressionDictionary}
        onOpenEditor={openExprDictEditor}
        onClose={closeExprDict}
        preventFocusSteal={preventFocusSteal}
        style={{ bottom: paletteBottomOffset + 'px' }}
        dictTab={dictTab}
        onDictTabChange={setDictTab}
      />
    )
  ) : null;

  const exprDictEditorBlock = exprDictEditorOpen ? (
    <ExpressionDictionaryEditorModal expressionDictionary={expressionDictionary} setExpressionDictionary={setExpressionDictionary} onClose={closeExprDictEditor} />
  ) : null;

  const specialDictEditorBlock = specialDictEditorOpen ? (
    <SpecialDictionaryEditorModal specialDictionary={specialDictionary} setSpecialDictionary={setSpecialDictionary} onClose={closeSpecialDictEditor} lastSpecialImportIds={lastSpecialImportIds} setLastSpecialImportIds={setLastSpecialImportIds} />
  ) : null;

  const mediaDictEditorBlock = mediaDictEditorOpen ? (
    <MediaDictionaryEditorModal mediaDictionary={mediaDictionary} setMediaDictionary={setMediaDictionary} onClose={closeMediaDictEditor} lastMediaImportIds={lastMediaImportIds} setLastMediaImportIds={setLastMediaImportIds} />
  ) : null;

  // 表現パレットと表現辞典は同じ下部ドロワー枠を使うため、同時に開かないようにする
  const togglePalette = () => { setPaletteOpen(o=>{ const next=!o; if(next){ setExprDictOpen(false); setWritingMoreOpen(false); } return next; }); };
  const toggleExprDict = () => { setExprDictOpen(o=>{ const next=!o; if(next){ setPaletteOpen(false); setWritingMoreOpen(false); } return next; }); };
  const toggleWritingMore = () => { setWritingMoreOpen(o=>{ const next=!o; if(next){ setPaletteOpen(false); setExprDictOpen(false); } return next; }); };

  // ---- 「⋯」→メモ・関連情報を開く：集中モード中なら先に集中モードを終了してからスクロールする ----
  const openMemoSection = () => {
    setWritingMoreOpen(false);
    if(focusMode) setFocusMode(false);
    setMemoOpenSignal(s=>s+1);
  };
  useEffect(()=>{
    if(!memoOpenSignal || focusMode) return;
    const t = setTimeout(()=>{
      if(memoSectionRef.current) memoSectionRef.current.scrollIntoView({ behavior:'smooth', block:'start' });
    }, 80);
    return ()=>clearTimeout(t);
    // eslint-disable-next-line react-hooks/exhaustive-deps
  }, [memoOpenSignal, focusMode]);

  // ---- スマホ「⋯」：文字サイズ／メモ・関連情報を開く／章を削除（低頻度操作をここへ集約） ----
  const writingMoreBlock = open && writingMoreOpen ? (
    <div className="wmore-backdrop" onClick={()=>setWritingMoreOpen(false)}>
      <div className="wmore-sheet" onClick={e=>e.stopPropagation()}>
        <div className="wmore-head"><span>本文の操作</span><button type="button" className="btn btn-sm btn-ghost" onClick={()=>setWritingMoreOpen(false)}>×</button></div>
        <div className="wmore-fontsize-row">
          <span className="wmore-fontsize-label">文字サイズ</span>
          <FontSizeControl value={writingFontSize} onChange={setWritingFontSize} />
        </div>
        <div className="wmore-sep" />
        <button type="button" className="wmore-item" onClick={openMemoSection}>メモ・関連情報を開く</button>
        <div className="wmore-sep" />
        <button type="button" className="wmore-item wmore-danger" onClick={()=>{ setWritingMoreOpen(false); remove(open.id); }}>章を削除</button>
      </div>
    </div>
  ) : null;


  // ---- クイック表現バー：辞書に★（pinned）登録された語だけを、開閉なしで常時1タップ挿入 ----
  const pinnedSnippets = writingSnippets.snippets.filter(s=>s.pinned).sort((a,b)=>(a.sortOrder??0)-(b.sortOrder??0));
  const quickbarBlock = open ? (
    <div ref={quickbarWrapRef}>
      <QuickExpressionBar
        snippets={pinnedSnippets}
        collapsed={quickbarCollapsed}
        onToggleCollapse={()=>setQuickbarCollapsed(c=>!c)}
        onInsert={insertIntoBody}
        onOpenPalette={()=>{ setExprDictOpen(false); setWritingMoreOpen(false); setPaletteOpen(true); }}
        preventFocusSteal={preventFocusSteal}
        variant={focusMode ? 'focus' : 'inline'}
      />
    </div>
  ) : null;

  if(open && focusMode){
    return (
      <div className="writing-focus">
        <div className="writing-focus-header">
          <div className="writing-header-row1">
            <button type="button" className="writing-back-btn" onClick={()=>setFocusMode(false)} title="集中モードを終了" aria-label="集中モードを終了">
              <span className="wh-back-full">← 集中終了</span><span className="wh-back-short">←</span>
            </button>
            <input className="writing-focus-title" value={open.title} onChange={e=>update(open.id,{title:e.target.value})} placeholder="章タイトル" />
            <span className="wordcount">{open.body.length.toLocaleString()} 文字</span>
          </div>
          <div className="writing-header-row2">
            <button type="button" className={"btn btn-sm"+(paletteOpen?" active":"")} onMouseDown={preventFocusSteal} onPointerDown={preventFocusSteal} onClick={togglePalette}>
              <span className="wh-label-full">表現パレット</span><span className="wh-label-short">表現</span>
            </button>
            <button type="button" className={"btn btn-sm"+(exprDictOpen?" active":"")} onMouseDown={preventFocusSteal} onPointerDown={preventFocusSteal} onClick={toggleExprDict}>
              <span className="wh-label-full">表現辞典</span><span className="wh-label-short">辞典</span>
            </button>
            <span className="writing-only-desktop"><FontSizeControl value={writingFontSize} onChange={setWritingFontSize} /></span>
            <button type="button" className="btn btn-sm writing-more-btn writing-only-mobile" onMouseDown={preventFocusSteal} onPointerDown={preventFocusSteal} onClick={toggleWritingMore} aria-label="その他の操作" title="その他の操作">⋯</button>
          </div>
        </div>
        <div className="writing-focus-body-wrap" ref={focusBodyWrapRef}>
          <textarea ref={textareaRef} className="writing-body-area writing-body-area-focus" style={{fontSize:writingFontSize}} value={open.body}
            onChange={e=>{ update(open.id,{body:e.target.value}); rememberEditorState(); }}
            onSelect={rememberEditorState} onClick={rememberEditorState} onKeyUp={rememberEditorState} onBlur={rememberEditorState}
            placeholder="本文を書く…" autoFocus />
        </div>
        {!paletteOpen && !exprDictOpen && quickbarBlock}
        {paletteBlock}
        {exprDictBlock}
        {dictEditorBlock}
        {exprDictEditorBlock}
        {specialDictEditorBlock}
        {mediaDictEditorBlock}
        {writingMoreBlock}
      </div>
    );
  }

  if(open){
    return (
      <div>
        <div className="writing-header">
          <div className="writing-header-row1">
            <button type="button" className="writing-back-btn" onClick={backToList} title="本文一覧に戻る" aria-label="本文一覧に戻る">
              <span className="wh-back-full">← 本文一覧</span><span className="wh-back-short">←</span>
            </button>
            <input className="writing-title-input" value={open.title} onChange={e=>update(open.id,{title:e.target.value})} placeholder="章タイトル" />
            <span className="wordcount">{open.body.length.toLocaleString()} 文字</span>
          </div>
          <div className="writing-header-row2">
            <button className="btn btn-sm" onClick={()=>setFocusMode(true)}>
              <span className="wh-label-full">集中モード</span><span className="wh-label-short">集中</span>
            </button>
            <button type="button" className={"btn btn-sm"+(paletteOpen?" active":"")} onMouseDown={preventFocusSteal} onPointerDown={preventFocusSteal} onClick={togglePalette}>
              <span className="wh-label-full">表現パレット</span><span className="wh-label-short">表現</span>
            </button>
            <button type="button" className={"btn btn-sm"+(exprDictOpen?" active":"")} onMouseDown={preventFocusSteal} onPointerDown={preventFocusSteal} onClick={toggleExprDict}>
              <span className="wh-label-full">表現辞典</span><span className="wh-label-short">辞典</span>
            </button>
            <span className="writing-only-desktop"><FontSizeControl value={writingFontSize} onChange={setWritingFontSize} /></span>
            <button className="btn btn-danger btn-sm writing-only-desktop" onClick={()=>remove(open.id)}>削除</button>
            <button type="button" className="btn btn-sm writing-more-btn writing-only-mobile" onMouseDown={preventFocusSteal} onPointerDown={preventFocusSteal} onClick={toggleWritingMore} aria-label="その他の操作" title="その他の操作">⋯</button>
          </div>
        </div>
        <div className="writing-toolbar-gap" />
        <textarea ref={textareaRef} className="writing-body-area" style={{fontSize:writingFontSize}} value={open.body}
          onChange={e=>{ update(open.id,{body:e.target.value}); rememberEditorState(); }}
          onSelect={rememberEditorState} onClick={rememberEditorState} onKeyUp={rememberEditorState} onBlur={rememberEditorState}
          placeholder="本文を書く…" />
        {!paletteOpen && !exprDictOpen && quickbarBlock}
        {paletteBlock}
        {exprDictBlock}
        {dictEditorBlock}
        {exprDictEditorBlock}
        {specialDictEditorBlock}
        {mediaDictEditorBlock}
        {writingMoreBlock}
        <div style={{marginTop:14}} ref={memoSectionRef}>
          <CollapsibleSection title="メモ・関連情報" defaultOpen={false} openSignal={memoOpenSignal}>
            <div className="field-row"><label>メモ</label><FieldAutoTextarea value={open.memo} onChange={e=>update(open.id,{memo:e.target.value})} minHeight={120} /></div>
            <LinkPicker label="登場人物" options={charOptions} selectedIds={open.personIds} onChange={ids=>update(open.id,{personIds:ids})} />
            <LinkPicker label="場所" options={locOptions} selectedIds={open.locationIds} onChange={ids=>update(open.id,{locationIds:ids})} />
            <LinkPicker label="関連ネタ" options={ideaOptions} selectedIds={open.ideaIds} onChange={ids=>update(open.id,{ideaIds:ids})} />
          </CollapsibleSection>
        </div>
      </div>
    );
  }

  return (
    <div>
      <div className="toolbar">
        <h1>✍️ 本文</h1>
        <div className="filler" />
        <button className="btn btn-primary" onClick={addChapter}>＋ 章を追加</button>
      </div>
      {data.writings.length===0 && <div className="empty-hint">まだ本文がありません。「＋ 章を追加」から書き始められます。</div>}
      {data.writings.map(w=>(
        <div className="writing-list-row" key={w.id} onClick={()=>setOpenId(w.id)} style={{cursor:'pointer'}}>
          <div>
            <div style={{fontWeight:700}}>{w.title}</div>
            <div style={{fontSize:12, color:'var(--ink-soft)'}}>{w.body.length} 文字</div>
          </div>
          <span>開く →</span>
        </div>
      ))}
    </div>
  );
}

// ---- クイック表現バー：★固定した登録語だけを、パレットを開かずに常時1タップ挿入 ----
// 挿入処理はSnippetPaletteと同じ onInsert（Writing側のinsertIntoBody）を共通利用する。
function QuickExpressionBar({ snippets, collapsed, onToggleCollapse, onInsert, onOpenPalette, preventFocusSteal, variant }){
  const wrapCls = "quickbar" + (variant==='inline' ? ' quickbar-inline' : '') + (collapsed ? ' collapsed' : '');

  if(collapsed){
    return (
      <div className={wrapCls}>
        <button type="button" className="quickbar-collapsed-btn" onMouseDown={preventFocusSteal} onPointerDown={preventFocusSteal} onClick={onToggleCollapse}>表現 ▲</button>
      </div>
    );
  }

  // ボタン表示：挿入されるtextが短ければtextそのまま、長い場合のみlabelを優先表示
  const displayOf = (sn) => {
    const t = sn.text || '';
    if(t && t.length<=6) return t;
    return sn.label ? sn.label : t;
  };

  return (
    <div className={wrapCls}>
      {snippets.length===0 ? (
        <span className="quickbar-empty">辞書から★を付けるとここに表示されます</span>
      ) : (
        <div className="quickbar-scroll">
          {snippets.map(sn=>(
            <button key={sn.id} type="button" className="quickbar-btn"
              onMouseDown={preventFocusSteal} onPointerDown={preventFocusSteal}
              onClick={()=>onInsert(sn.text)}>
              {displayOf(sn)}
            </button>
          ))}
        </div>
      )}
      <button type="button" className="quickbar-list-btn" onMouseDown={preventFocusSteal} onPointerDown={preventFocusSteal} onClick={onOpenPalette}>一覧</button>
      <button type="button" className="quickbar-collapse-btn" onMouseDown={preventFocusSteal} onPointerDown={preventFocusSteal} onClick={onToggleCollapse}>∨</button>
    </div>
  );
}

// ---- 表現パレット本体（本文へ即挿入するボタン群） ----
// ヘッダー行＝カテゴリタブ＋編集/閉じる、本体行＝登録語（横スクロール1段）の2段構成。
// スマホでは「表現パレット」の大見出しとテキスト長いボタンラベルをCSSで省略する。
function SnippetPalette({ categories, snippets, onInsert, onOpenEditor, onClose, preventFocusSteal, style }){
  const sortedCats = [...categories].sort((a,b)=>(a.sortOrder??0)-(b.sortOrder??0));
  const snippetsOf = (catId) => snippets.filter(s=>s.categoryId===catId).sort((a,b)=>(a.sortOrder??0)-(b.sortOrder??0));
  const catsWithItems = sortedCats.filter(cat=>snippetsOf(cat.id).length>0);
  const [activeCatId, setActiveCatId] = useState(null);
  const activeCat = catsWithItems.find(c=>c.id===activeCatId) || catsWithItems[0] || null;
  const hasAny = catsWithItems.length>0;

  return (
    <div className="snippet-palette" style={style}>
      <div className="snippet-palette-head">
        <span className="snippet-palette-title">表現パレット</span>
        {hasAny && (
          <div className="snippet-palette-cat-tabs">
            {catsWithItems.map(cat=>(
              <button key={cat.id} type="button"
                className={"snippet-cat-tab"+(activeCat && activeCat.id===cat.id ? " active" : "")}
                onMouseDown={preventFocusSteal} onPointerDown={preventFocusSteal}
                onClick={()=>setActiveCatId(cat.id)}>{cat.name}</button>
            ))}
          </div>
        )}
        <div className="snippet-palette-head-actions">
          <button type="button" className="btn btn-sm" onMouseDown={preventFocusSteal} onPointerDown={preventFocusSteal} onClick={onOpenEditor}>
            <span className="label-full">辞書を編集</span><span className="label-short">編集</span>
          </button>
          <button type="button" className="btn btn-sm btn-ghost" onMouseDown={preventFocusSteal} onPointerDown={preventFocusSteal} onClick={onClose}>
            <span className="label-full">閉じる</span><span className="label-short">×</span>
          </button>
        </div>
      </div>
      {!hasAny && <div className="snippet-palette-body"><div className="empty-hint">登録された表現がありません。「辞書を編集」から追加できます。</div></div>}
      {hasAny && activeCat && (
        <div className="snippet-palette-body">
          <div className="snippet-palette-buttons">
            {snippetsOf(activeCat.id).map(sn=>(
              <button key={sn.id} type="button" className="snippet-btn"
                onMouseDown={preventFocusSteal} onPointerDown={preventFocusSteal}
                onClick={()=>onInsert(sn.text)}>
                {sn.label ? sn.label : sn.text}
              </button>
            ))}
          </div>
        </div>
      )}
    </div>
  );
}

// ---- 汎用チップ入力：配列(aliases / tags)を「[値 ×] ＋追加」の形で編集する ----
function ChipListEditor({ values, onChange, placeholder, listId }){
  const [draft, setDraft] = useState('');
  const list = values || [];
  const commit = () => {
    const v = draft.trim();
    if(v && !list.includes(v)){ onChange([...list, v]); }
    setDraft('');
  };
  const removeAt = (idx) => { onChange(list.filter((_,i)=>i!==idx)); };
  return (
    <div className="chip-editor">
      {list.length>0 && (
        <div className="chip-editor-chips">
          {list.map((v,i)=>(
            <span className="chip-editor-chip" key={v+'-'+i}>
              {v}
              <button type="button" onClick={()=>removeAt(i)} aria-label={`${v}を削除`}>×</button>
            </span>
          ))}
        </div>
      )}
      <div className="chip-editor-add-row">
        <input type="text" list={listId} value={draft} placeholder={placeholder}
          onChange={e=>setDraft(e.target.value)}
          onKeyDown={e=>{ if(e.key==='Enter'){ e.preventDefault(); commit(); } }} />
        <button type="button" className="btn btn-sm" onClick={commit}>追加</button>
      </div>
    </div>
  );
}

// ---- コピー処理（表現辞典・小説語彙辞典で共通利用）：Clipboard API→失敗時fallback。成否だけ返し、toast表示は呼び出し側に任せる ----
async function copyPlainText(text){
  try{
    if(navigator.clipboard && navigator.clipboard.writeText){
      await navigator.clipboard.writeText(text);
      return true;
    }
  }catch(e){}
  try{
    const ta = document.createElement('textarea');
    ta.value = text;
    ta.setAttribute('readonly', '');
    ta.style.position = 'fixed';
    ta.style.top = '-1000px';
    ta.style.opacity = '0';
    document.body.appendChild(ta);
    ta.focus();
    ta.select();
    const ok = document.execCommand('copy');
    document.body.removeChild(ta);
    return ok;
  }catch(e){ return false; }
}

// ---- 辞典ドロワー：[表現辞典][小説語彙][メディア語]の切替タブ（表現辞典パネル・小説語彙パネルで共通表示） ----

        onMouseDown={preventFocusSteal} onPointerDown={preventFocusSteal} onClick={()=>onChange('special')}>小説語彙</button>
      <button type="button" className={"dict-tab-btn"+(active==='media'?' active':'')}
        onMouseDown={preventFocusSteal} onPointerDown={preventFocusSteal} onClick={()=>onChange('media')}>メディア語</button>
    </div>
  );
}

// ---- 小説語彙辞典：1〜5段階評価の●○表示（閲覧用） ----
function RatingDots({ value }){
  const v = clamp(Number.isFinite(Number(value)) ? Math.round(Number(value)) : 0, 0, 5);
  return <span className="rating-dots">{'●'.repeat(v)}{'○'.repeat(5-v)}</span>;
}

// ---- 小説語彙辞典：1〜5段階評価の編集（[1][2][3][4][5]ボタン） ----
function RatingField({ label, value, onChange }){
  return (
    <div className="dict-field-block">
      <label className="dict-field-label">{label}</label>
      <div className="rating-btn-group">
        {[1,2,3,4,5].map(n=>(
          <button key={n} type="button" className={"rating-btn"+(value===n?' active':'')} onClick={()=>onChange(n)}>{n}</button>
        ))}
      </div>
    </div>
  );
}

// ---- 表現パレット辞書：一覧（カテゴリタブ＋登録語カード）→ タップした1件だけを編集、という階層UI ----
// 「カテゴリ管理」「登録語の詳細編集／新規」はそれぞれ別画面へ分離し、全項目を同時展開しない。
function WritingSnippetDictionaryModal({ writingSnippets, setWritingSnippets, onClose }){
  const { categories, snippets } = writingSnippets;
  const sortedCats = [...categories].sort((a,b)=>(a.sortOrder??0)-(b.sortOrder??0));
  const snippetsOf = (catId) => snippets.filter(s=>s.categoryId===catId).sort((a,b)=>(a.sortOrder??0)-(b.sortOrder??0));

  const [view, setView] = useState('list'); // 'list' | 'categories' | 'snippet'
  const [activeCatId, setActiveCatId] = useState(sortedCats[0] ? sortedCats[0].id : null);
  const [editingSnippet, setEditingSnippet] = useState(null); // { mode:'edit', id, categoryId } | { mode:'new', categoryId }
  const [renamingCatId, setRenamingCatId] = useState(null);
  const [newCatName, setNewCatName] = useState('');
  const [draftLabel, setDraftLabel] = useState('');
  const [draftText, setDraftText] = useState('');
  const [draftPinned, setDraftPinned] = useState(false);

  const activeCat = sortedCats.find(c=>c.id===activeCatId) || sortedCats[0] || null;

  // ---- カテゴリCRUD（既存ロジックを維持） ----
  const addCategory = (name) => {
    setWritingSnippets(sd=>{
      const maxOrder = sd.categories.reduce((m,c)=>Math.max(m, c.sortOrder??0), -1);
      return { ...sd, categories: [...sd.categories, { id: uid('snippet-cat'), name, sortOrder: maxOrder+1 }] };
    });
  };
  const renameCategory = (id, name) => {
    setWritingSnippets(sd=>({ ...sd, categories: sd.categories.map(c=>c.id===id?{...c,name}:c) }));
  };
  const moveCategory = (id, dir) => {
    setWritingSnippets(sd=>{
      const cats = [...sd.categories].sort((a,b)=>(a.sortOrder??0)-(b.sortOrder??0));
      const idx = cats.findIndex(c=>c.id===id);
      const swapIdx = idx+dir;
      if(idx<0 || swapIdx<0 || swapIdx>=cats.length) return sd;
      const a = cats[idx], b = cats[swapIdx];
      const aOrder=a.sortOrder, bOrder=b.sortOrder;
      return { ...sd, categories: sd.categories.map(c=>{
        if(c.id===a.id) return {...c, sortOrder:bOrder};
        if(c.id===b.id) return {...c, sortOrder:aOrder};
        return c;
      })};
    });
  };
  const deleteCategory = (id) => {
    const count = snippets.filter(s=>s.categoryId===id).length;
    const msg = count>0 ? `このカテゴリを削除すると、中の登録語${count}件も一緒に削除されます。よろしいですか？` : 'このカテゴリを削除しますか？';
    if(!confirm(msg)) return;
    setWritingSnippets(sd=>({
      categories: sd.categories.filter(c=>c.id!==id),
      snippets: sd.snippets.filter(s=>s.categoryId!==id),
    }));
    if(activeCatId===id) setActiveCatId(null);
  };

  // ---- 登録語CRUD（既存ロジック＋新規作成時にpinnedも一緒に指定できるよう拡張。データ構造は不変） ----
  const addSnippet = (catId, label, text, pinned) => {
    const newId = uid('snippet');
    setWritingSnippets(sd=>{
      const inCat = sd.snippets.filter(s=>s.categoryId===catId);
      const maxOrder = inCat.reduce((m,s)=>Math.max(m, s.sortOrder??0), -1);
      return { ...sd, snippets: [...sd.snippets, { id:newId, categoryId:catId, label, text, sortOrder:maxOrder+1, pinned: !!pinned }] };
    });
    return newId;
  };
  const updateSnippet = (id, patch) => {
    setWritingSnippets(sd=>({ ...sd, snippets: sd.snippets.map(s=>s.id===id?{...s,...patch}:s) }));
  };
  const deleteSnippet = (id) => {
    setWritingSnippets(sd=>({ ...sd, snippets: sd.snippets.filter(s=>s.id!==id) }));
  };
  const moveSnippet = (id, dir) => {
    setWritingSnippets(sd=>{
      const s = sd.snippets.find(x=>x.id===id);
      if(!s) return sd;
      const siblings = sd.snippets.filter(x=>x.categoryId===s.categoryId).sort((a,b)=>(a.sortOrder??0)-(b.sortOrder??0));
      const idx = siblings.findIndex(x=>x.id===id);
      const swapIdx = idx+dir;
      if(swapIdx<0 || swapIdx>=siblings.length) return sd;
      const a = siblings[idx], b = siblings[swapIdx];
      const aOrder=a.sortOrder, bOrder=b.sortOrder;
      return { ...sd, snippets: sd.snippets.map(x=>{
        if(x.id===a.id) return {...x, sortOrder:bOrder};
        if(x.id===b.id) return {...x, sortOrder:aOrder};
        return x;
      })};
    });
  };

  const openSnippetEdit = (catId, id) => { setEditingSnippet({ mode:'edit', id, categoryId:catId }); setView('snippet'); };
  const openSnippetNew = (catId) => { setDraftLabel(''); setDraftText(''); setDraftPinned(false); setEditingSnippet({ mode:'new', categoryId:catId }); setView('snippet'); };
  const backFromSnippet = () => { setEditingSnippet(null); setView('list'); };

  // ==== 一覧（トップ）：カテゴリタブ＋選択中カテゴリの登録語カードのみ ====
  if(view==='list'){
    return (
      <Modal title="表現パレットを編集" onClose={onClose} dict>
        <p style={{fontSize:12, color:'var(--ink-soft)', margin:'0 0 10px'}}>登録した表現は本文画面の「表現パレット」から挿入できます。★はクイック表現バーにも表示されます。</p>
        <div className="dict-toolbar">
          <div className="dict-cat-tabs">
            {sortedCats.map(cat=>(
              <button key={cat.id} type="button" className={"dict-cat-tab"+(activeCat && activeCat.id===cat.id ? " active":"")} onClick={()=>setActiveCatId(cat.id)}>{cat.name}</button>
            ))}
          </div>
          <button type="button" className="btn btn-sm" onClick={()=>setView('categories')}>カテゴリ管理</button>
        </div>
        {sortedCats.length===0 && <div className="empty-hint">まだカテゴリがありません。「カテゴリ管理」から追加してください。</div>}
        {sortedCats.length>0 && !activeCat && <div className="empty-hint">カテゴリを選んでください。</div>}
        {activeCat && (
          <div className="dict-list-section">
            <div className="dict-list-head"><span>{activeCat.name}</span><span className="dict-list-count">{snippetsOf(activeCat.id).length}件</span></div>
            {snippetsOf(activeCat.id).length===0 && <div className="empty-hint">まだ登録語がありません。</div>}
            <div className="dict-card-list">
              {snippetsOf(activeCat.id).map(sn=>(
                <div className="dict-card" key={sn.id} onClick={()=>openSnippetEdit(activeCat.id, sn.id)}>
                  <button type="button" className={"dict-pin-btn"+(sn.pinned?" pinned":"")}
                    onClick={e=>{ e.stopPropagation(); updateSnippet(sn.id,{pinned: !sn.pinned}); }}
                    title={sn.pinned ? 'クイックバーから外す' : 'クイックバーに固定'}>{sn.pinned ? '★' : '☆'}</button>
                  <div className="dict-card-body">
                    <div className="dict-card-title">{sn.label ? sn.label : sn.text}</div>
                    <div className="dict-card-sub">挿入：{sn.text}</div>
                  </div>
                  <span className="dict-card-chevron">＞</span>
                </div>
              ))}
            </div>
            <button type="button" className="btn btn-sm btn-primary dict-add-btn" onClick={()=>openSnippetNew(activeCat.id)}>＋ 登録語</button>
          </div>
        )}
        <div className="modal-actions"><button className="btn btn-primary" onClick={onClose}>閉じる</button></div>
      </Modal>
    );
  }

  // ==== カテゴリ管理（別画面） ====
  if(view==='categories'){
    return (
      <Modal title="カテゴリ管理" onClose={onClose} dict>
        <button type="button" className="dict-back-link" onClick={()=>setView('list')}>← 表現パレットを編集</button>
        {sortedCats.length===0 && <div className="empty-hint">まだカテゴリがありません。下から追加してください。</div>}
        <div className="dict-cat-manage-list">
          {sortedCats.map((cat,ci)=>(
            <div className="dict-cat-manage-row" key={cat.id}>
              {renamingCatId===cat.id ? (
                <input type="text" autoFocus value={cat.name}
                  onChange={e=>renameCategory(cat.id, e.target.value)}
                  onKeyDown={e=>{ if(e.key==='Enter') setRenamingCatId(null); }} />
              ) : (
                <span className="dict-cat-manage-name">{cat.name}</span>
              )}
              <div className="gm-actions">
                <button onClick={()=>moveCategory(cat.id,-1)} disabled={ci===0}>↑</button>
                <button onClick={()=>moveCategory(cat.id,1)} disabled={ci===sortedCats.length-1}>↓</button>
                {renamingCatId===cat.id ? (
                  <button onClick={()=>setRenamingCatId(null)}>完了</button>
                ) : (
                  <button onClick={()=>setRenamingCatId(cat.id)}>編集</button>
                )}
                <button style={{color:'#8a3a3a'}} onClick={()=>deleteCategory(cat.id)}>削除</button>
              </div>
            </div>
          ))}
        </div>
        <div style={{display:'flex', gap:8, marginTop:14, paddingTop:14, borderTop:'1px solid var(--line)'}}>
          <input type="text" placeholder="新しいカテゴリ名" value={newCatName} onChange={e=>setNewCatName(e.target.value)}
            style={{flex:1, padding:'7px 9px', border:'1px solid var(--line)', borderRadius:6}} />
          <button className="btn btn-sm btn-primary" onClick={()=>{ if(newCatName.trim()){ addCategory(newCatName.trim()); setNewCatName(''); } }}>＋ カテゴリを追加</button>
        </div>
        <div className="modal-actions"><button className="btn btn-primary" onClick={()=>setView('list')}>← 一覧へ戻る</button></div>
      </Modal>
    );
  }

  // ==== 登録語：詳細編集／新規（この1件だけを編集する） ====
  if(view==='snippet' && editingSnippet){
    const isNew = editingSnippet.mode==='new';
    const snippet = isNew ? null : snippets.find(s=>s.id===editingSnippet.id);
    if(!isNew && !snippet){
      return (
        <Modal title="表現パレットを編集" onClose={onClose} dict>
          <div className="empty-hint">この登録語は削除されました。</div>
          <div className="modal-actions"><button className="btn btn-primary" onClick={backFromSnippet}>← 一覧へ戻る</button></div>
        </Modal>
      );
    }
    const catName = (sortedCats.find(c=>c.id===editingSnippet.categoryId)||{}).name || '一覧';
    const siblings = snippetsOf(editingSnippet.categoryId);
    const idx = isNew ? -1 : siblings.findIndex(s=>s.id===editingSnippet.id);

    const labelVal = isNew ? draftLabel : snippet.label;
    const textVal = isNew ? draftText : snippet.text;
    const pinnedVal = isNew ? draftPinned : snippet.pinned;
    const setLabelVal = isNew ? setDraftLabel : (v)=>updateSnippet(snippet.id,{label:v});
    const setTextVal = isNew ? setDraftText : (v)=>updateSnippet(snippet.id,{text:v});
    const togglePinned = isNew ? (()=>setDraftPinned(p=>!p)) : (()=>updateSnippet(snippet.id,{pinned: !snippet.pinned}));

    const submitNew = () => {
      if(!draftText.trim()) return;
      addSnippet(editingSnippet.categoryId, draftLabel.trim(), draftText, draftPinned);
      backFromSnippet();
    };

    return (
      <Modal title={isNew ? '登録語を追加' : '登録語を編集'} onClose={onClose} dict>
        <button type="button" className="dict-back-link" onClick={backFromSnippet}>← {catName}</button>
        <div className="dict-detail-title">{isNew ? '登録語を追加' : '登録語を編集'}</div>
        <div className="dict-field-block">
          <label className="dict-field-label">表示名</label>
          <input type="text" value={labelVal} onChange={e=>setLabelVal(e.target.value)} placeholder="空可（未入力なら挿入文字列がそのままボタンに表示）" />
        </div>
        <div className="dict-field-block">
          <label className="dict-field-label">挿入する文字列</label>
          <input type="text" value={textVal} onChange={e=>setTextVal(e.target.value)} placeholder="本文へ挿入される文字列" />
        </div>
        <div className="dict-field-block dict-field-row-inline">
          <label className="dict-field-label">クイックバーに表示</label>
          <button type="button" className={"dict-pin-toggle"+(pinnedVal?" pinned":"")} onClick={togglePinned}>{pinnedVal ? '★ ON' : '☆ OFF'}</button>
        </div>
        {isNew ? (
          <div className="modal-actions"><button className="btn btn-primary" onClick={submitNew} disabled={!draftText.trim()}>追加</button></div>
        ) : (
          <>
            <div className="dict-move-row">
              <button className="btn btn-sm" onClick={()=>moveSnippet(snippet.id,-1)} disabled={idx<=0}>↑ 上へ</button>
              <button className="btn btn-sm" onClick={()=>moveSnippet(snippet.id,1)} disabled={idx<0 || idx>=siblings.length-1}>↓ 下へ</button>
            </div>
            <div className="dict-danger-zone">
              <button className="btn btn-sm btn-danger" onClick={()=>{ deleteSnippet(snippet.id); backFromSnippet(); }}>この登録語を削除</button>
            </div>
            <div className="modal-actions"><button className="btn btn-primary" onClick={backFromSnippet}>← 一覧へ戻る</button></div>
          </>
        )}
      </Modal>
    );
  }

  return null;
}

/* ============ 表現辞典（本文執筆中に言い換え・類語を参照するための辞典） ============
   表現パレット（本文へ即挿入する「入力補助」）とはデータも役割も別。
   表現辞典は候補を見比べて言葉を選ぶ「参考資料」のため、候補操作は挿入ではなく[コピー]中心にする。 */

// ---- 参照パネル：検索が中心。候補語を眺めて、必要な語だけ[コピー]する（本文は書き換えない） ----
function ExpressionDictionaryPanel({ dictionary, onOpenEditor, onClose, preventFocusSteal, style, dictTab, onDictTabChange }){
  const [query, setQuery] = useState('');
  const [toast, setToast] = useState('');
  const toastTimerRef = useRef(null);
  const entries = dictionary.entries || [];
  const q = query.trim().toLowerCase();

  const matchEntry = (entry) => {
    if(!q) return true;
    if((entry.headword||'').toLowerCase().includes(q)) return true;
    if((entry.category||'').toLowerCase().includes(q)) return true;
    if((entry.aliases||[]).some(a=>(a||'').toLowerCase().includes(q))) return true;
    if((entry.expressions||[]).some(x =>
      (x.text||'').toLowerCase().includes(q) || (x.tags||[]).some(t=>(t||'').toLowerCase().includes(q))
    )) return true;
    return false;
  };
  const filtered = entries.filter(matchEntry);

  useEffect(()=>()=>{ if(toastTimerRef.current) clearTimeout(toastTimerRef.current); }, []);

  const showToast = (msg) => {
    setToast(msg);
    if(toastTimerRef.current) clearTimeout(toastTimerRef.current);
    toastTimerRef.current = setTimeout(()=>setToast(''), 1400);
  };

  // Clipboard APIを第一候補に、使えない環境（ローカルHTML等）はtextarea+execCommandへfallback。
  // どちらも本文のbody・selection・scroll位置には一切触れない＝カーソル移動や本文末尾ジャンプは発生しない。
  const copyText = async (text) => {
    let ok = false;
    try{
      if(navigator.clipboard && navigator.clipboard.writeText){
        await navigator.clipboard.writeText(text);
        ok = true;
      }
    }catch(e){ ok = false; }
    if(!ok){
      try{
        const ta = document.createElement('textarea');
        ta.value = text;
        ta.setAttribute('readonly', '');
        ta.style.position = 'fixed';
        ta.style.top = '-1000px';
        ta.style.opacity = '0';
        document.body.appendChild(ta);
        ta.focus();
        ta.select();
        ok = document.execCommand('copy');
        document.body.removeChild(ta);
      }catch(e){ ok = false; }
    }
    showToast(ok ? `「${text}」をコピーしました` : 'コピーに失敗しました');
  };

  return (
    <div className="expr-dict-panel" style={style}>
      <DictTabSwitch active={dictTab} onChange={onDictTabChange} preventFocusSteal={preventFocusSteal} />
      <div className="expr-dict-head">
        <input type="text" className="expr-dict-search" placeholder="検索（見出し語・別名・候補語・タグ）"
          value={query} onChange={e=>setQuery(e.target.value)}
          onMouseDown={preventFocusSteal} onFocus={preventFocusSteal} />
        <button type="button" className="btn btn-sm" onMouseDown={preventFocusSteal} onPointerDown={preventFocusSteal} onClick={onOpenEditor}>
          <span className="label-full">辞典を編集</span><span className="label-short">編集</span>
        </button>
        <button type="button" className="btn btn-sm btn-ghost" onMouseDown={preventFocusSteal} onPointerDown={preventFocusSteal} onClick={onClose}>
          <span className="label-full">閉じる</span><span className="label-short">×</span>
        </button>
      </div>
      <div className="expr-dict-body">
        {entries.length===0 && <div className="empty-hint">まだ辞典項目がありません。「辞典を編集」から追加できます。</div>}
        {entries.length>0 && filtered.length===0 && <div className="empty-hint">「{query}」に一致する項目が見つかりません。</div>}
        {filtered.map(entry=>(
          <div className="expr-dict-entry" key={entry.id}>
            <div className="expr-dict-entry-head">
              {entry.category && <span className="expr-dict-entry-cat">{entry.category}</span>}
              <span className="expr-dict-entry-headword">{entry.headword || '（無題）'}</span>
              {(entry.aliases||[]).length>0 && <span className="expr-dict-entry-aliases">（{entry.aliases.join(' / ')}）</span>}
            </div>
            {entry.notes && <div className="expr-dict-entry-notes">{entry.notes}</div>}
            <div className="expr-dict-expr-list">
              {(entry.expressions||[]).length===0 && <div className="empty-hint" style={{padding:'4px 0'}}>候補表現がまだありません。</div>}
              {(entry.expressions||[]).map(x=>(
                <div className="expr-dict-expr-row" key={x.id}>
                  <div className="expr-dict-expr-main">
                    <span className="expr-dict-expr-text">{x.text}</span>
                    {(x.tags||[]).map(t=>(<span className="expr-dict-tag" key={t}>{t}</span>))}
                  </div>
                  {x.note && <div className="expr-dict-expr-note">{x.note}</div>}
                  <button type="button" className="btn btn-sm btn-primary expr-dict-insert-btn"
                    onMouseDown={preventFocusSteal} onPointerDown={preventFocusSteal}
                    onClick={()=>copyText(x.text)}>コピー</button>
                </div>
              ))}
            </div>
          </div>
        ))}
      </div>
      {toast && <div className="expr-dict-toast">{toast}</div>}
    </div>
  );
}
